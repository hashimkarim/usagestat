name: Publish package repositories

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      channel:
        type: string
        default: stable
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: false
      HOMEBREW_SSH_PRIVATE_KEY:
        required: false
      COPR_CONFIG:
        required: false
      PPA_GPG_PRIVATE_KEY:
        required: false
      PPA_GPG_PASSPHRASE:
        required: false
      WINDOWS_SCOOP_TOKEN:
        required: false
      WINDOWS_WINGET_TOKEN:
        required: false
      WINDOWS_CHOCO_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release matching the selected channel
        required: true
        type: string
      channel:
        description: Separate stable or alpha repositories
        type: choice
        default: stable
        options: [stable, alpha]
      platform:
        description: Repository to publish or retry
        type: choice
        default: all
        options: [all, aur, homebrew, copr, ppa, scoop, winget, chocolatey]
      dry_run:
        description: Validate packages without publishing or using credentials
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.platforms.outputs.value }}
      windows: ${{ steps.platforms.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check release channel and choose repositories
        id: platforms
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PLATFORM: ${{ inputs.platform || 'all' }}
          PACKAGE_CHANNEL: ${{ inputs.channel || 'stable' }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'tools/publish/scripts')
          from release_channel import check
          tag = os.environ['RELEASE_TAG']
          check(tag, os.environ['PACKAGE_CHANNEL'])
          platforms = ['aur', 'homebrew', 'copr', 'ppa']
          windows = ['scoop', 'winget', 'chocolatey'] if os.environ['PACKAGE_CHANNEL'] == 'alpha' else []
          selected = os.environ['PLATFORM']
          assert selected == 'all' or selected in platforms + windows
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('value=' + json.dumps(platforms if selected == 'all' else [p for p in platforms if p == selected]) + '\n')
              output.write('windows=' + json.dumps(windows if selected == 'all' else [p for p in windows if p == selected]) + '\n')
          PY

  publish:
    name: ${{ matrix.platform }}
    needs: validate
    if: needs.validate.outputs.platforms != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.validate.outputs.platforms) }}
    concurrency:
      group: package-${{ inputs.channel || 'stable' }}-${{ matrix.platform }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      PACKAGE_CHANNEL: ${{ inputs.channel || 'stable' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check publishing credentials
        if: env.DRY_RUN != 'true'
        env:
          PLATFORM: ${{ matrix.platform }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_SSH_KNOWN_HOSTS: ${{ vars.AUR_SSH_KNOWN_HOSTS }}
          HOMEBREW_SSH_PRIVATE_KEY: ${{ secrets.HOMEBREW_SSH_PRIVATE_KEY }}
          HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          PPA_GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
          PPA_GPG_FINGERPRINT: ${{ vars.PPA_GPG_FINGERPRINT }}
        run: |
          python3 - <<'PY'
          import os
          required = {
              'aur': ['AUR_SSH_PRIVATE_KEY', 'AUR_SSH_KNOWN_HOSTS'],
              'homebrew': ['HOMEBREW_SSH_PRIVATE_KEY', 'HOMEBREW_TAP_REPOSITORY'],
              'copr': ['COPR_CONFIG'],
              'ppa': ['PPA_GPG_PRIVATE_KEY', 'PPA_GPG_FINGERPRINT'],
          }[os.environ['PLATFORM']]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing publishing configuration: ' + ', '.join(missing) + '. See docs/distribution.md.')
          PY
      - name: Download and validate release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$PACKAGE_CHANNEL" == alpha ]]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir assets
            python3 tools/publish/scripts/release_guard.py assets --require-existing --tag "$RELEASE_TAG"
            python3 tools/publish/scripts/prepare-packages.py "$RELEASE_TAG" assets prepared --channel alpha
            exit 0
          fi
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern '*.tar.gz' --pattern '*.tar.gz.sha256'
          python3 - <<'PY'
          import json, os, subprocess
          repo, tag = os.environ['GITHUB_REPOSITORY'], os.environ['RELEASE_TAG']
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', tag, '--repo', repo, '--json', 'assets']))
          names = {asset['name'] for asset in release['assets']}
          if 'usagestat-artifacts.json' in names:
              subprocess.run(['gh', 'release', 'download', tag, '--repo', repo, '--dir', 'assets',
                              '--pattern', 'usagestat-artifacts.json*', '--pattern', '*.manifest.json*'], check=True)
          PY
          python3 tools/publish/scripts/prepare-packages.py "$RELEASE_TAG" assets prepared
      - name: Install Homebrew recipe tools
        if: matrix.platform == 'homebrew'
        run: sudo apt-get update && sudo apt-get install -y ruby
      - name: Install COPR tools
        if: matrix.platform == 'copr'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          pipx install copr-cli
      - name: Install Debian packaging tools
        if: matrix.platform == 'ppa'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts dput gnupg
      - name: Validate and publish AUR
        if: matrix.platform == 'aur'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_SSH_KNOWN_HOSTS: ${{ vars.AUR_SSH_KNOWN_HOSTS }}
        run: tools/publish/scripts/publish-platform.sh aur prepared
      - name: Validate and publish Homebrew
        if: matrix.platform == 'homebrew'
        env:
          HOMEBREW_SSH_PRIVATE_KEY: ${{ secrets.HOMEBREW_SSH_PRIVATE_KEY }}
          HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
        run: tools/publish/scripts/publish-platform.sh homebrew prepared
      - name: Validate and publish COPR
        if: matrix.platform == 'copr'
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: tools/publish/scripts/publish-platform.sh copr prepared
      - name: Validate and publish Ubuntu PPA
        if: matrix.platform == 'ppa'
        env:
          PPA_GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
          PPA_GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
          PPA_GPG_FINGERPRINT: ${{ vars.PPA_GPG_FINGERPRINT }}
        run: tools/publish/scripts/publish-platform.sh ppa prepared
      - name: Save package recipes and Debian source package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}-${{ inputs.tag }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            prepared/PKGBUILD
            prepared/aur/.SRCINFO
            prepared/usagestat.rb
            prepared/usagestat.spec
            prepared/*.dsc
            prepared/*.changes
            prepared/*.buildinfo
            prepared/*.orig.tar.gz
            prepared/*.debian.tar.xz
            prepared/*.deb

  homebrew-install:
    name: Public alpha Homebrew on ${{ matrix.runner }}
    needs: [validate, publish]
    if: inputs.channel == 'alpha' && inputs.dry_run != true && contains(fromJSON(needs.validate.outputs.platforms), 'homebrew')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify existing release and install the public formula
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          python3 tools/publish/scripts/release_guard.py assets --require-existing --tag "$RELEASE_TAG"
          python3 tools/publish/scripts/test_homebrew_alpha.py --artifacts assets --report target/homebrew-alpha-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-alpha-${{ matrix.runner }}
          path: target/homebrew-alpha-result.json

  windows:
    name: Windows alpha ${{ matrix.channel }}
    needs: validate
    if: needs.validate.outputs.windows != '[]'
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.validate.outputs.windows) }}
    concurrency:
      group: package-alpha-${{ matrix.channel }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      FEED_CHANNEL: ${{ matrix.channel }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify existing release and prepare Windows feed recipes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir assets
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          python tools/publish/scripts/release_guard.py assets --require-existing --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Release verification failed' }
          python tools/publish/scripts/windows_alpha.py --artifacts assets --tag $env:RELEASE_TAG --channel $env:FEED_CHANNEL --output "prepared/$env:FEED_CHANNEL"
          if ($LASTEXITCODE -ne 0) { throw 'Recipe preparation failed' }
      - name: Install and remove the real Windows package
        run: |
          ./tools/publish/scripts/test-windows-feed.ps1 -Channel $env:FEED_CHANNEL -RecipeDirectory "prepared/$env:FEED_CHANNEL" -UpstreamVersion ($env:RELEASE_TAG.Substring(1))
      - name: Publish tested Scoop or submit tested WinGet manifests
        if: inputs.dry_run != true && matrix.channel != 'chocolatey'
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_SCOOP_TOKEN: ${{ secrets.WINDOWS_SCOOP_TOKEN }}
          WINDOWS_WINGET_TOKEN: ${{ secrets.WINDOWS_WINGET_TOKEN }}
        run: |
          python tools/publish/scripts/windows_alpha.py --artifacts assets --tag $env:RELEASE_TAG --channel $env:FEED_CHANNEL --output "prepared/$env:FEED_CHANNEL" --publish
          if ($LASTEXITCODE -ne 0) { throw 'Windows feed publication failed' }
      - name: Submit tested Chocolatey package
        if: inputs.dry_run != true && matrix.channel == 'chocolatey'
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_CHOCO_API_KEY: ${{ secrets.WINDOWS_CHOCO_API_KEY }}
        run: |
          if (-not $env:WINDOWS_CHOCO_API_KEY) { throw 'Chocolatey publishing key is not configured' }
          $package = Get-ChildItem prepared/chocolatey/packed/*.nupkg | Select-Object -First 1
          python tools/publish/scripts/windows_alpha.py --artifacts assets --tag $env:RELEASE_TAG --channel chocolatey --output prepared/chocolatey --check-chocolatey-package $package.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey publication preflight failed' }
          choco push $package.FullName --source https://push.chocolatey.org/ --api-key $env:WINDOWS_CHOCO_API_KEY --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey submission failed; inspect feed/moderation before retrying' }
      - name: Save Windows recipes and installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-alpha-${{ matrix.channel }}-${{ github.run_attempt }}
          path: prepared
          if-no-files-found: warn
