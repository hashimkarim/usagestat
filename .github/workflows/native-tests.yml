name: Native backend foundation

on:
  push:
    branches: [main, feat/native-backend-implementation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: never
      PYTHONUTF8: '1'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select the native Rust toolchain
        run: rustup default 1.89.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/${{ matrix.target }}/debug
          key: native-${{ matrix.runner }}-${{ matrix.target }}-rust-1.89.0-${{ hashFiles('Cargo.lock') }}
      - name: Verify Windows PowerShell 5.1 payload guards
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tools/publish/tests -p test_windows_installer.py
      - name: Build, test, and exercise installed binaries
        run: python tools/portability/native_checks.py --target ${{ matrix.target }}
      - name: Verify transactional native Windows installation
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: python tools/portability/windows_installer.py --binary-dir target/${{ matrix.target }}/debug --report target/native-results/windows-installer.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-results-${{ matrix.target }}
          path: target/native-results
          if-no-files-found: warn

  verify-evidence:
    name: Verify complete native evidence
    needs: native
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/tests -p test_native_reports.py
      - uses: actions/download-artifact@v4
        with:
          pattern: native-results-*
          path: target/native-evidence
      - name: Require every target, fixture and service result at this commit
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: python tools/portability/verify_native_reports.py --reports target/native-evidence --source-commit "$EXPECTED_SOURCE_COMMIT"
