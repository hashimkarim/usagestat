name: Test dashboard history

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/dashboard-tests.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/dashboard-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select qualified Rust toolchain
        run: rustup default 1.89.0
      - name: Build daemon for HTTP integration tests
        run: cargo build --locked -p usagestat-daemon
      - run: node --test crates/ai-usage-daemon/tests/*.test.cjs
