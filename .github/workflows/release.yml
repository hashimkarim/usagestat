name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  PYTHONUTF8: '1'

jobs:
  test:
    name: Test workspace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches the package version
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['workspace']['package']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Release tag must match Cargo.toml'
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup default 1.89.0
      - run: cargo test --locked --workspace
      - run: python -m unittest discover -s tools/publish/tests
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test npm/launcher.test.cjs

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs: test
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: usagestat-linux-x86_64
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            artifact: usagestat-linux-aarch64
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            artifact: usagestat-macos-aarch64
            runner: macos-15
          - target: x86_64-apple-darwin
            artifact: usagestat-macos-x86_64
            runner: macos-15-intel
          - target: x86_64-pc-windows-msvc
            artifact: usagestat-windows-x86_64
            runner: windows-2025
            rustflags: '-C target-feature=+crt-static'

    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      RUSTFLAGS: ${{ matrix.rustflags || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select qualified Rust toolchain
        run: rustup default 1.89.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db/
            target/${{ matrix.target }}/release
          key: release-${{ matrix.runner }}-${{ matrix.target }}-rust-1.89.0-static-crt-${{ hashFiles('Cargo.lock') }}

      - name: Test the native workspace
        run: cargo test --locked --workspace --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --workspace --target ${{ matrix.target }}

      - name: Package
        run: python tools/publish/scripts/native_artifacts.py --target ${{ matrix.target }} --binary-dir target/${{ matrix.target }}/release --output dist

      - name: Verify the extracted native archive
        run: python tools/publish/scripts/native_artifacts.py --verify dist/${{ matrix.artifact }}.manifest.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}*
          if-no-files-found: error

  aggregate:
    name: Verify complete release inputs
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: python tools/publish/scripts/native_artifacts.py --merge dist
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Stage npm packages from the same verified native inputs
        env:
          NPM_RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && 'rehearsal' || (contains(github.ref_name, '-') && 'prerelease' || 'stable') }}
        run: |
          python tools/publish/scripts/npm_packages.py --artifacts dist --output target/npm-packages --channel "$NPM_RELEASE_CHANNEL"
          python tools/publish/scripts/npm_packages.py --pack target/npm-packages/npm-packages.json
      - uses: actions/upload-artifact@v4
        with:
          name: usagestat-npm-packages
          path: |
            target/npm-packages/npm-packed.json
            target/npm-packages/tarballs
          if-no-files-found: error
      - name: Verify existing Linux package consumers
        run: |
          python - <<'PY'
          import subprocess, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          # Production repositories only accept stable versions; archive tests
          # still run for every prerelease above.
          if '-' not in version:
              subprocess.run(['python', 'tools/publish/scripts/prepare-packages.py', 'v' + version, 'dist', 'target/package-rehearsal'], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: usagestat-complete-release-inputs
          path: dist
          if-no-files-found: error

  homebrew-test:
    name: Rehearse Homebrew on ${{ matrix.runner }}
    needs: aggregate
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: usagestat-complete-release-inputs
          path: dist
      - name: Install, upgrade and remove a disposable native formula
        run: python tools/publish/scripts/homebrew_rehearsal.py --artifacts dist --report target/homebrew-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homebrew-rehearsal-${{ matrix.runner }}
          path: target/homebrew-result.json
          if-no-files-found: warn

  windows-installer-test:
    name: Rehearse Windows per-user installer
    needs: aggregate
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: usagestat-complete-release-inputs
          path: dist
      - name: Validate installer payload guards and actual release installation
        run: |
          python -m unittest discover -s tools/publish/tests -p test_windows_installer.py
          python tools/portability/windows_installer.py --manifest dist/usagestat-windows-x86_64.manifest.json --installer dist/Install-Usagestat.ps1 --report target/windows-installer-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-rehearsal
          path: target/windows-installer-result.json
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [aggregate, npm-test, homebrew-test, windows-installer-test]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
    env:
      RELEASE_CHANNEL: ${{ contains(github.ref_name, '-') && 'prerelease' || 'stable' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: usagestat-complete-release-inputs
          path: dist

      - name: Select artifacts qualified for the release channel
        run: python tools/publish/scripts/native_artifacts.py --prepare-publication dist --channel "$RELEASE_CHANNEL" --output target/publish-assets

      - name: Check live tag and preserve any existing release
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish/scripts/release_guard.py target/publish-assets

      - name: Select reviewed release notes
        id: release-notes
        run: |
          if test -f "docs/releases/$GITHUB_REF_NAME.md"; then
            echo "path=docs/releases/$GITHUB_REF_NAME.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.release-state.outputs.create == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: target/publish-assets/*
          fail_on_unmatched_files: true
          overwrite_files: false
          body_path: ${{ steps.release-notes.outputs.path }}
          generate_release_notes: ${{ steps.release-notes.outputs.path == '' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}

      - name: Verify live release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish/scripts/release_guard.py target/publish-assets --require-existing

  npm-test:
    name: Install npm on ${{ matrix.runner }}
    needs: aggregate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: usagestat-npm-packages
          path: target/npm-packages
      - name: Rehearse scripts-disabled installation and native commands
        run: python tools/portability/npm_install.py target/npm-packages/npm-packed.json

  npm-publish:
    name: Publish npm platform packages before the main package
    needs: [release, npm-test]
    if: github.event_name == 'push' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: usagestat-npm-packages
          path: target/npm-packages
      - run: python tools/publish/scripts/npm_publish.py target/npm-packages/npm-packed.json --publish

  packages:
    name: Publish package repositories
    needs: release
    if: ${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/publish-packages.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
