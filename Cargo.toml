[workspace]
resolver = "2"
members = [
    "crates/ai-usage-core",
    "crates/ai-usage-plugins",
    "crates/ai-usage-cli",
    "crates/ai-usage-daemon",
    "crates/ai-usage-service",
]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1.3"
dirs = "6"
env_logger = "0.11"
getrandom = "0.2"
hmac = "0.12"
log = "0.4"
pbkdf2 = "0.12"
process-wrap = { version = "10", default-features = false, features = ["std", "process-group", "job-object", "creation-flags"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider", "socks"] }
rquickjs = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
signal-hook = "0.3"
tabled = { version = "0.17", features = ["std"] }
thiserror = "2"
toml = "0.8"
