[package]
name = "usagestat-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "usagestat_core"
path = "src/lib.rs"

[dependencies]
chrono.workspace = true
dirs.workspace = true
process-wrap.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
tempfile = "3.27"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Console", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_System_WindowsProgramming", "Win32_Storage_FileSystem"] }
