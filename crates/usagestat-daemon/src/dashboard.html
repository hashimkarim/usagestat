<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>usagestat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3.5' fill='%231e2130'/%3E%3Cg fill='%237289da'%3E%3Crect x='3' y='9' width='2.5' height='4' rx='.8'/%3E%3Crect x='6.75' y='6' width='2.5' height='7' rx='.8'/%3E%3Crect x='10.5' y='3' width='2.5' height='10' rx='.8'/%3E%3C/g%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#23283d; --s0:#1e2233; --s1:#191f2e; --s2:#101320; --s3:#32364a;
  --bd:#e4e4e410; --bd2:#23283d60; --bd3:#10132060;
  --tx:#dadada; --hi:#ffffff; --mu:#b9bbbe; --su:#8e9297;
  --blue:#7289da; --green:#43b581; --ltgreen:#1ed760;
  --teal:#6e84d1; --yellow:#eaca8b; --orange:#ce8670; --red:#d25050;
  --purple:#b48ead; --magenta:#da97cd; --deep:#4f5d92; --bright:#859bee;
  --mono:ui-monospace,'Cascadia Code','Source Code Pro',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --r:8px;
}

html{background:#101320}
body{min-height:100vh;color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.5}
body{--page-bg:radial-gradient(ellipse 70% 45% at 50% -8%,rgba(114,137,218,.12),transparent 62%),linear-gradient(180deg,#23283d 0%,#1e2233 42%,#101320 100%)}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--page-bg)}
/* Masks the gap above the floating sticky header so scrolled content never
   shows through it or the header's rounded corners. Painted with the same viewport-sized page background. */
.shell::before{content:'';position:fixed;top:0;left:0;right:0;height:20px;z-index:49;pointer-events:none;
  background:var(--page-bg);background-size:100% 100vh;background-repeat:no-repeat}
:focus-visible{outline:2px solid var(--bright);outline-offset:2px}
.tab:focus-visible{outline-offset:-3px;border-radius:6px}

/* ── layout ── */
.shell{max-width:1480px;margin:0 auto;padding:16px 20px 60px}

/* ── header ── */
header{
  display:flex;align-items:center;gap:0;
  background:var(--s0);border:1px solid var(--bd);
  border-radius:var(--r);
  margin-bottom:0;position:sticky;top:10px;z-index:50;
  overflow:hidden;
}
.hstart{display:flex;align-items:center;gap:10px;padding:11px 16px;flex-shrink:0}
.mark{
  width:28px;height:28px;border-radius:5px;border:1px solid color-mix(in srgb,var(--blue) 70%,transparent);
  display:flex;align-items:center;justify-content:center;
  font:700 10px/1 var(--mono);color:var(--bright);letter-spacing:-.5px;flex-shrink:0;
  background:color-mix(in srgb,var(--deep) 22%,transparent);
}
.mark svg{width:16px;height:16px;fill:var(--blue)}
.appname{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--tx);white-space:nowrap}

/* ── tab bar (inside header) ── */
.tab-bar{
  display:flex;align-items:stretch;flex:1;
  overflow-x:auto;scrollbar-width:none;border-left:1px solid var(--bd);
}
.tab-bar::-webkit-scrollbar{display:none}
.tab{
  display:flex;align-items:center;gap:7px;padding:0 16px;
  background:transparent;border:none;cursor:pointer;
  font:13px var(--sans);color:var(--mu);white-space:nowrap;
  position:relative;transition:color .15s;min-height:50px;flex-shrink:0;
}
.tab:hover{color:var(--tx)}
.tab[hidden]{display:none}
.tab.active{color:var(--tx)}
.tab.active::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:var(--blue);border-radius:2px 2px 0 0;
}
.tab-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;opacity:.8}

.hend{display:flex;align-items:center;gap:10px;padding:11px 14px;flex-shrink:0;border-left:1px solid var(--bd)}
.conn{
  display:flex;align-items:center;gap:5px;padding:3px 9px;
  border:1px solid var(--bd);border-radius:100px;
  font:11px var(--mono);color:var(--mu);transition:border-color .3s,color .3s;
}
.conn.online{border-color:rgba(63,185,80,.4);color:var(--green)}
.conn.offline{border-color:rgba(248,81,73,.4);color:var(--red)}
.cdot{width:5px;height:5px;border-radius:50%;background:var(--su);flex-shrink:0;transition:background .3s,box-shadow .3s}
.conn.online .cdot{background:var(--green);box-shadow:0 0 5px var(--green)}
.conn.offline .cdot{background:var(--red);box-shadow:0 0 5px var(--red)}
.ago{font:11px var(--mono);color:var(--mu)}
.rbtn{
  position:relative;width:32px;height:32px;border-radius:50%;
  background:var(--s1);border:1px solid var(--bd2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .2s,background .2s;flex-shrink:0;
}
.rbtn:hover{border-color:var(--blue);background:var(--s3)}
.rbtn svg{position:relative;z-index:1;width:13px;height:13px;stroke:var(--mu);transition:stroke .2s}
.rbtn:hover svg{stroke:var(--bright)}
.rbtn.spin svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rbtn .ring-svg{position:absolute;inset:2px;z-index:0;width:calc(100% - 4px);height:calc(100% - 4px)}
.ring-t{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;opacity:.38;
  transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 1s linear}
@media(max-width:640px){
  .shell{padding:12px 12px 44px}
  .shell::before{height:16px}
  header{flex-wrap:wrap;top:6px}
  .hstart{flex:1 1 auto;padding:9px 12px;min-width:0}
  .hend{border-left:0;margin-left:auto;padding:9px 10px;gap:8px}
  .tab-bar{order:3;flex-basis:100%;border-left:0;border-top:1px solid var(--bd);
    -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
  .tab{min-height:42px;padding:0 13px}
  .quota-display{max-width:112px}
}
@media(max-width:440px){
  .ago{display:none}
  .appname{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .quota-display{max-width:100px;padding:0 4px}
}

/* ── panels ── */
.panels{margin-top:16px}
.panel{display:none}
.panel.active{display:block}

/* ── offline banner ── */
.offline-wrap{display:none;text-align:center;padding:64px 24px;
  background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:16px}
.offline-wrap.show{display:block}
.oicon{font-size:32px;margin-bottom:12px}
.otitle{font-size:16px;font-weight:600;margin-bottom:6px}
.osub{color:var(--mu);font-size:13px;margin-bottom:12px}
.ocmd{display:inline-block;padding:4px 12px;background:var(--s1);border:1px solid var(--bd2);
  border-radius:5px;font:12px var(--mono);color:var(--bright)}

/* ── overview grid ── */
.overview-summary{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr) minmax(0,.92fr);gap:16px;margin-bottom:16px;align-items:stretch}
@media(max-width:1180px) and (min-width:761px){.overview-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.overview-summary>:last-child{grid-column:1/-1}.overview-summary>:last-child .rollup-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.overview-summary{grid-template-columns:minmax(0,1fr)}}
.overview-panel{
  background:linear-gradient(180deg,color-mix(in srgb,var(--s0) 92%,var(--blue) 8%),var(--s0));
  border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;min-width:0;
}
.overview-title{font-size:18px;font-weight:700;color:var(--hi);margin-bottom:4px}
.overview-sub{font:12px var(--mono);color:var(--mu);margin-bottom:14px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:760px){.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:color-mix(in srgb,var(--s1) 76%,transparent);border:1px solid var(--bd);border-radius:7px;padding:11px 12px}
.kpi-value{font:700 21px/1 var(--mono);color:var(--hi);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-label{font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.alert-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.alert-row{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;background:color-mix(in srgb,var(--s1) 78%,transparent);border:1px solid var(--bd);border-left:3px solid var(--alert,var(--blue));border-radius:7px}
.alert-mark{font:700 10px/1 var(--mono);color:var(--alert,var(--blue));text-transform:uppercase;min-width:42px;padding-top:2px}
.alert-text{font:12px/1.35 var(--sans);color:var(--tx);min-width:0}
.alert-sub{display:block;font:11px var(--mono);color:var(--mu);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pressure-list{display:flex;flex-direction:column;gap:9px}
.pressure-row{display:grid;grid-template-columns:minmax(90px,1fr) 70px 1.8fr;gap:10px;align-items:center}
.pressure-name{font:12px var(--mono);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pressure-value{font:12px var(--mono);color:var(--mu);text-align:right}
.pressure-track{height:5px;background:var(--s2);border-radius:999px;overflow:hidden}
.pressure-fill{height:100%;border-radius:999px;background:var(--blue)}
.overview-controls{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);
  padding:10px 12px;margin-bottom:16px;
}
.ctrl-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctrl-group:first-child{flex:1 1 520px;min-width:0}
.ctrl-group:first-child .ctrl-input{flex:1 1 180px;max-width:280px}
.ctrl-input,.ctrl-select{
  height:32px;border:1px solid var(--bd2);border-radius:6px;background:var(--s1);
  color:var(--tx);font:12px var(--mono);outline:none;
}
.ctrl-input{width:min(280px,100%);padding:0 10px}
.ctrl-sep{width:1px;height:20px;background:var(--bd);margin:0 2px}
.prefs-notice{font:11px var(--mono);color:var(--mu);margin:-8px 2px 12px}
.prefs-notice:empty{display:none}
.ctrl-select{padding:0 30px 0 9px}
.ctrl-input:focus,.ctrl-select:focus{border-color:var(--blue);box-shadow:0 0 0 2px color-mix(in srgb,var(--blue) 18%,transparent)}
.action-btn{
  height:32px;display:inline-flex;align-items:center;gap:7px;padding:0 10px;
  border:1px solid var(--bd2);border-radius:6px;background:var(--s1);
  color:var(--mu);font:11px var(--mono);cursor:pointer;transition:border-color .2s,color .2s,background .2s;
}
.action-btn:hover{border-color:var(--blue);color:var(--hi);background:var(--s3)}
.action-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.result-count{font:11px var(--mono);color:var(--mu)}
@media(max-width:640px){
  .overview-controls{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:10px}
  .ctrl-group,.ctrl-group:first-child{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;flex:none}
  .ctrl-group:first-child .ctrl-input{grid-column:1/-1;max-width:none;width:100%}
  .ctrl-select{width:100%;min-width:0;padding:0 22px 0 8px}
  .ctrl-group .action-btn{justify-content:center;min-width:0}
  .ctrl-group:last-child{grid-template-columns:repeat(3,minmax(0,1fr));padding-top:10px;border-top:1px solid var(--bd)}
  .ctrl-sep{display:none}
  .result-count{align-self:center}
}
.rollup-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.rollup-card{background:color-mix(in srgb,var(--s1) 76%,transparent);border:1px solid var(--bd);border-radius:7px;padding:11px 12px;min-width:0}
.rollup-value{font:700 19px/1.1 var(--mono);color:var(--hi);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rollup-label{font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.delta{font:10px var(--mono);margin-left:4px;color:var(--mu)}
.delta.up{color:var(--orange)}.delta.down{color:var(--green)}.delta.flat{color:var(--mu)}
@media(max-width:440px){
  .rollup-card{padding:10px}
  .rollup-value{font-size:17px;white-space:normal;overflow:visible;text-overflow:clip;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
  .delta{margin-left:0;font-size:9px}
}
.overview-trend{margin-top:12px}
.trend-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}
.trend-title{font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.trend-readout{font:11px var(--mono);color:var(--tx);text-align:right}
.trend-bars{display:flex;align-items:flex-end;gap:3px;height:48px;padding:6px 0 3px;border-bottom:1px solid var(--bd)}
.trend-bar{flex:1;min-width:4px;border-radius:3px 3px 0 0;background:var(--blue);opacity:.82}
.contrib-list{display:flex;flex-direction:column;gap:8px;margin-top:11px}
.contrib-row{display:grid;grid-template-columns:minmax(84px,1fr) 82px 1.4fr;gap:9px;align-items:center}
.contrib-name{font:12px var(--mono);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contrib-value{font:12px var(--mono);color:var(--mu);text-align:right}
.empty-state{padding:36px 16px;text-align:center;background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);color:var(--mu);font:13px var(--mono)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px}
.sk-card{height:240px;background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);
  position:relative;overflow:hidden}
.sk-card::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);
  animation:shim 1.5s infinite}
/* Skeletons mirror the section they stand in for so data swaps in without a
   layout jump. Shapes are faint fills with the same shimmer as .sk-card. */
.loading-skeleton{color:var(--mu)}
.sk-shape{display:block;position:relative;overflow:hidden;height:10px;border-radius:4px;
  background:color-mix(in srgb,var(--s3) 55%,transparent)}
.sk-shape::after{content:'';position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);animation:shim 1.6s ease-in-out infinite}
.sk-line{width:42%;margin-bottom:12px}.sk-line.short{width:22%}.sk-line.wide{width:78%}
.sk-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:2px 0 16px}
.sk-pill{height:26px;width:62px;border-radius:6px}
.sk-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.sk-head .sk-row{margin:0}.sk-head .sk-pill{width:44px}
.sk-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:18px 22px;margin:4px 0 20px}
.sk-metrics.boxed{padding-bottom:16px;border-bottom:1px solid var(--bd)}
.sk-metric{display:flex;flex-direction:column;gap:8px}
.sk-metric .sk-shape:first-child{width:58%;height:9px}.sk-metric .sk-shape:last-child{width:76%;height:20px}
.sk-chart{height:200px;display:flex;align-items:flex-end;gap:5px;padding:0 4px 0 44px;border-bottom:1px solid var(--bd);
  background:repeating-linear-gradient(to top,transparent 0 44px,var(--bd) 44px 45px)}
.sk-chart .sk-shape{flex:1;min-width:0;height:auto;border-radius:3px 3px 0 0}
.sk-chart .sk-area{height:72%;border-radius:0;clip-path:polygon(0 100%,0 97%,10% 74%,22% 80%,34% 56%,46% 64%,58% 40%,70% 50%,82% 30%,100% 36%,100% 100%,0 100%)}
.sk-ring{width:44px;height:44px;border-radius:50%;flex:none}
.sk-kv{display:flex;justify-content:space-between;gap:16px}.sk-kv .sk-shape:first-child{width:34%}.sk-kv .sk-shape:last-child{width:28%}
.sk-axis{display:flex;justify-content:space-between;padding:8px 4px 0 44px}.sk-axis .sk-shape{width:38px;height:8px}
.sk-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
.sk-block{height:150px;border-radius:6px}
.sk-mix{display:grid;grid-template-columns:28% minmax(0,1fr) 16%;gap:12px;align-items:center;margin-bottom:16px}
.sk-rows{display:flex;flex-direction:column}
.sk-rows .sk-line{width:100%;height:12px;margin:0;padding:0}
.sk-rows>div{padding:11px 0;border-bottom:1px solid var(--bd)}
.overview-summary .sk-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:760px){.overview-summary .sk-metrics{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
/* Reserve the toolbar's height until providers arrive so cards don't jump. */
.overview-controls:empty{min-height:54px}
.sk-card{display:flex;flex-direction:column;gap:12px}.sk-card .sk-shape::after{display:none}
@media(max-width:760px){.sk-split{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){.sk-shape::after,.sk-card::after{animation:none}}
@keyframes shim{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* ── overview card ── */
.card{
  background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column;position:relative;
  transition:border-color .2s,box-shadow .2s;
}
.card:hover{
  border-color:color-mix(in srgb,var(--accent,var(--su)) 40%,var(--bd));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--accent,var(--su)) 12%,transparent);
}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--accent,var(--su));transition:background .4s}
.card.is-error{border-color:rgba(248,81,73,.25)}
.card.is-error::before{background:var(--red)}

.card-head{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 14px 10px 17px;gap:10px}
.card-meta{flex:1;min-width:0}
.card-name{font-size:14px;font-weight:600;color:var(--tx);margin-bottom:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-tags{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.card-tags:empty{display:none}
.card-name:has(>[data-card-component="logo"]:not([hidden]) .provider-icon)+.card-tags{padding-left:38px}

/* badges */
.badge{font:600 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:100px;border:1px solid;white-space:nowrap}
.b-oauth{color:var(--purple);border-color:color-mix(in srgb,var(--purple) 45%,transparent);background:color-mix(in srgb,var(--purple) 10%,transparent)}
.b-web  {color:var(--bright); border-color:color-mix(in srgb,var(--bright) 45%,transparent);background:color-mix(in srgb,var(--bright) 10%,transparent)}
.b-api  {color:var(--teal); border-color:color-mix(in srgb,var(--teal) 45%,transparent);background:color-mix(in srgb,var(--teal) 10%,transparent)}
.b-cli  {color:var(--yellow);border-color:color-mix(in srgb,var(--yellow) 45%,transparent);background:color-mix(in srgb,var(--yellow) 10%,transparent)}
.b-local{color:var(--mu);   border-color:color-mix(in srgb,var(--mu) 30%,transparent);background:transparent}
.b-error{color:var(--red);  border-color:rgba(248,81,73,.4); background:rgba(248,81,73,.08)}
.b-incident{text-decoration:none}
.b-incident-minor{color:var(--yellow);border-color:color-mix(in srgb,var(--yellow) 45%,transparent);background:color-mix(in srgb,var(--yellow) 10%,transparent)}
.b-incident-major{color:var(--orange);border-color:color-mix(in srgb,var(--orange) 45%,transparent);background:color-mix(in srgb,var(--orange) 10%,transparent)}
.b-incident-critical{color:var(--red);border-color:rgba(248,81,73,.5);background:rgba(248,81,73,.12)}
.b-incident-maintenance{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 45%,transparent);background:color-mix(in srgb,var(--teal) 10%,transparent)}
.plan-tag{font:11px var(--mono);color:var(--mu);padding:2px 6px;border:1px solid var(--bd);border-radius:4px}

/* arc */
.arc{position:relative;width:48px;height:48px;flex-shrink:0}
.arc svg{width:48px;height:48px}
.arc-bg{fill:none;stroke:var(--s2);stroke-width:5}
.arc-fill{fill:none;stroke-width:5;stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:center}
.arc-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font:700 11px/1 var(--mono);color:var(--tx)}

/* card body */
.card-body{padding:0 14px 4px 17px;flex:1}
.metric{margin-bottom:12px}
.mlabel{font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin-bottom:3px}
.prog-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.prog-val{font:12px var(--mono);color:var(--tx)}
.metric-detail{font:11px var(--mono);color:var(--mu);margin:0 0 5px;word-break:break-word}
.track{height:3px;background:var(--s2);border-radius:2px;overflow:hidden}
.bar{height:100%;border-radius:2px;width:0;transition:width .85s cubic-bezier(.4,0,.2,1)}
.resets{font:11px var(--mono);color:var(--mu);margin-top:3px}
.runout{font:11px var(--mono);color:var(--orange);margin-top:3px}
.kv{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kv>.mlabel{flex-shrink:0}
.kv .pill{white-space:normal;text-align:right;border-radius:8px;min-width:0;overflow-wrap:anywhere}
.kv-val{font:12px var(--mono);color:var(--tx);text-align:right}
.pill{font:11px var(--mono);padding:2px 7px;border-radius:100px;border:1px solid var(--bd2);color:var(--tx)}
.pill-green{border-color:rgba(63,185,80,.5);color:var(--green);background:rgba(63,185,80,.08)}
.pill-red  {border-color:rgba(248,81,73,.5);color:var(--red);  background:rgba(248,81,73,.08)}
.pill-blue {border-color:rgba(88,166,255,.5);color:var(--blue); background:rgba(88,166,255,.08)}
.pill-yellow{border-color:rgba(227,179,65,.5);color:var(--yellow);background:rgba(227,179,65,.08)}
.pill-orange{border-color:rgba(240,136,62,.5);color:var(--orange);background:rgba(240,136,62,.08)}
.spark{margin-top:4px}
.spark-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:2px 10px;margin-bottom:6px}
.spark-title{white-space:nowrap;font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.spark-readout{font:11px var(--mono);color:var(--tx);text-align:right;margin-left:auto}
.spark-bars{display:flex;align-items:flex-end;gap:2px;height:42px;padding:6px 0 3px;border-bottom:1px solid var(--bd)}
.spark-bar{flex:1;min-width:2px;max-width:12px;border-radius:2px 2px 0 0;background:var(--spark,var(--blue));opacity:.78}
.spark-note{font:10px var(--mono);color:var(--mu);margin-top:4px}

/* card pace */
.card-pace{margin:10px 0 4px;padding:9px 11px;background:var(--s1);border:1px solid var(--bd);border-radius:7px}
.pace-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.pace-lbl{font:10px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--mu)}
.pace-stage{font:700 10px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;
  padding:2px 8px;border-radius:100px;border:1px solid currentColor}
.pace-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.ps-lbl{font:10px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--mu);margin-bottom:1px}
.ps-val{font:12px var(--mono);color:var(--tx)}
.ps-val.pos{color:var(--green)}.ps-val.neg{color:var(--orange)}.ps-val.ok{color:var(--green)}.ps-val.no{color:var(--red)}

/* card footer */
.card-foot{display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px 10px 17px;border-top:1px solid var(--bd);margin-top:auto}
.foot-ts{font:11px var(--mono);color:var(--su)}
.slink{display:flex;align-items:center;gap:4px;font:11px var(--mono);color:var(--mu);text-decoration:none;transition:color .15s}
.slink:hover{color:var(--teal)}
.slink svg{width:10px;height:10px}

/* ── PROVIDER DETAIL ── */
.detail{max-width:none}

.detail-header{
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:20px 22px;background:var(--s0);border:1px solid var(--bd);
  border-radius:var(--r);margin-bottom:16px;
}
.dh-left{flex:1;min-width:0}
.dh-name{font-size:22px;font-weight:700;color:var(--tx);margin-bottom:8px}
.dh-tags{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.dh-right{text-align:right;flex-shrink:0;margin-left:20px}
.dh-pct{font:700 40px/1 var(--mono);color:var(--tx)}
.dh-pct-lbl{font:11px var(--mono);color:var(--mu);margin-top:4px;text-transform:uppercase;letter-spacing:.08em}

/* two-col split */
.detail-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:16px;align-items:start}
@media(max-width:700px){.detail-cols{grid-template-columns:1fr}}
.detail-cols.solo{grid-template-columns:minmax(0,1fr)}
.detail-cols.solo .dm-list{column-count:2;column-gap:44px}
.dm-list>*{break-inside:avoid}
@media(max-width:900px){.detail-cols.solo .dm-list{column-count:1}}

.detail-box{background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);padding:18px 20px}
.box-title{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;
  color:var(--mu);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.box-title::after{content:'';flex:1;height:1px;background:var(--bd)}

/* detail metrics */
.dmetric{margin-bottom:16px}
.dmetric:last-child{margin-bottom:0}
.dm-label{font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin-bottom:5px}
.dm-val{font:13px var(--mono);color:var(--tx);margin-bottom:6px}
.dm-detail{font:12px var(--mono);color:var(--mu);margin:0 0 6px;word-break:break-word}
.dm-track{height:5px;background:var(--s2);border-radius:3px;overflow:hidden;margin-bottom:4px}
.dm-bar{height:100%;border-radius:3px;width:0;transition:width .9s cubic-bezier(.4,0,.2,1)}
.dm-row{display:flex;align-items:center;justify-content:space-between}
.dm-pct{font:11px var(--mono);color:var(--mu)}
.dm-reset{font:11px var(--mono);color:var(--mu)}

/* pace detail */
.compare-bars{margin-bottom:14px}
.compare-row{display:grid;grid-template-columns:70px 1fr 44px;align-items:center;gap:8px;margin-bottom:6px}
.compare-lbl{font:11px var(--mono);color:var(--mu);text-align:right}
.compare-track{height:6px;background:var(--s2);border-radius:3px;overflow:hidden}
.compare-fill{height:100%;border-radius:3px;transition:width .9s cubic-bezier(.4,0,.2,1)}
.compare-pct{font:11px var(--mono);color:var(--tx)}

.pace-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--bd)}
.pstat{background:var(--s1);border-radius:7px;padding:10px 12px}
.pstat-label{font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin-bottom:4px}
.pstat-value{font:14px var(--mono);color:var(--tx)}
.pstat-value.pos{color:var(--green)}.pstat-value.neg{color:var(--orange)}
.pstat-value.ok{color:var(--green)}.pstat-value.no{color:var(--red)}
.pstat-value.big{font-size:20px}
.pace-stage-big{
  font:700 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;
  padding:4px 12px;border-radius:100px;border:1px solid currentColor;
  display:inline-block;margin-bottom:14px;
}

/* ── cost section ── */
.cost-box{background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);padding:20px;margin-bottom:16px}
.cost-stats{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--bd)}
.cstat{flex:1;min-width:120px}
.cstat-val{font:700 22px/1 var(--mono);color:var(--tx);margin-bottom:4px}
.cstat-lbl{font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}

/* chart */
.chart-wrap{position:relative;margin-bottom:20px}
.chart-svg{display:block;width:100%;overflow:visible}
.chart-loading{padding:32px;text-align:center;font:13px var(--mono);color:var(--mu)}
.chart-legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 10px 52px}
.legend-item{display:flex;align-items:center;gap:6px;font:11px var(--mono);color:var(--mu)}
.legend-dot{width:8px;height:8px;border-radius:3px;box-shadow:0 0 0 1px #ffffff12 inset}
.legend-val{font-weight:500;color:var(--tx);margin-left:2px}
.tl-chart,.cost-chart{font-family:var(--sans);font-variant-numeric:tabular-nums}
.tl-chart{cursor:crosshair}
.cost-col.hover rect:not(:first-child){filter:brightness(1.18)}

/* tooltip */
#tip{
  position:fixed;display:none;z-index:200;pointer-events:auto;box-sizing:border-box;
  width:max-content;min-width:200px;max-width:min(360px,calc(100vw - 16px));max-height:calc(100vh - 16px);
  overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--s3) transparent;
  background:var(--s2);color:var(--tx);border:1px solid var(--s3);border-radius:10px;
  padding:12px 14px 10px;font:13px/1.45 var(--sans);font-variant-numeric:tabular-nums;text-align:left;
  box-shadow:0 10px 32px rgba(0,0,0,.45);
}
#tip[data-pinned="true"]{border-color:var(--bright)}
#tip:focus{outline:none}#tip:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tt-head{margin-bottom:8px}
.tt-date{font:600 13px/1.3 var(--sans);color:var(--hi)}
.tt-hero{display:flex;align-items:baseline;gap:8px;margin-top:6px;flex-wrap:wrap}
.tt-hero b{font:650 20px/1.15 var(--sans);color:var(--hi);letter-spacing:-.01em}
.tt-hero span{font-size:12px;color:var(--mu)}
.tt-sub{font-size:12.5px;color:var(--mu);margin-top:2px}
.tt-sec{border-top:1px solid var(--s3);padding-top:8px;margin-top:8px}
.tt-sec-h{font:600 11px/1.3 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--su);margin-bottom:5px}
.tt-sec-h i{font-style:normal;text-transform:none;letter-spacing:0;color:var(--yellow)}
.tt-parts{display:grid;grid-template-columns:8px minmax(0,1fr) auto auto;column-gap:12px;row-gap:4px;align-items:center}
.tt-part{display:contents}
.tt-part-l{color:var(--tx);min-width:0;overflow-wrap:anywhere}
.tt-part-s{color:var(--su);font-size:12px;text-align:right}
.tt-part b,.tt-row b{font-weight:600;color:var(--hi);text-align:right;white-space:nowrap}
.tt-row{display:flex;gap:16px;justify-content:space-between;align-items:baseline;margin:3px 0;font-size:13px}
.tt-row span{color:var(--mu);min-width:0}
.tt-row b{white-space:normal;overflow-wrap:anywhere;max-width:62%}
.tt-prov{margin-top:8px;font-size:12px;line-height:1.4;color:var(--mu);overflow-wrap:anywhere;font-variant-numeric:normal}
.tt-prov>span[aria-hidden]{color:var(--su)}
.tt-meta{margin:4px 0 0;font-size:12px;line-height:1.4;color:var(--su)}
.tt-exact{margin-top:8px;border-top:1px solid var(--s3);padding-top:6px}
.tt-exact summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--bright);padding:4px 0;border-radius:4px}
.tt-exact summary span{font-weight:500;color:var(--su)}
.tt-exact summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tt-grp{margin-top:6px;padding:4px 10px;background:var(--s1);border-radius:7px}
.tt-grp-h{font:600 10.5px/1.3 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--mu);padding:5px 0 6px}
.tt-exact .tt-row{display:grid;grid-template-columns:minmax(6.5em,1fr) minmax(0,max-content);column-gap:16px;row-gap:1px;margin:0;padding:3px 0;font-size:12.5px;line-height:1.4;border-top:1px solid color-mix(in srgb,var(--s3) 85%,transparent)}
.tt-exact .tt-grp-h+.tt-row{border-top:0}
.tt-exact .tt-row b{max-width:none;text-align:right;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tt-exact .tt-row.tt-total span{color:var(--tx);font-weight:600}.tt-exact .tt-row.tt-total b{font-weight:700}
.tt-exact .tt-total{padding-bottom:5px}.tt-exact .tt-total+.tt-row{border-top-color:var(--mu)}
.tt-exact .tt-row.tt-text b{font-variant-numeric:normal}
.tt-exact .tt-row.tt-long{grid-template-columns:minmax(0,1fr)}
.tt-exact .tt-row.tt-long b{text-align:left;color:var(--tx)}
.tt-prov-i{display:inline-block;max-width:100%;overflow-wrap:anywhere}
.tt-part .u-dot{box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.tt-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding-top:6px;border-top:1px solid var(--s3);font-size:11.5px;color:var(--su)}
#tip:not([data-pinned="true"]) .tt-exact{display:none}
.tt-close{font:600 12px var(--sans);color:var(--tx);background:var(--s3);border:1px solid var(--s3);border-radius:6px;padding:3px 10px;cursor:pointer;min-height:26px}
.tt-close:hover{color:var(--hi)}.tt-close:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* model table */
.model-table{width:100%;border-collapse:collapse;margin-top:4px}
.model-table th{font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu);
  padding:0 8px 8px;text-align:left;border-bottom:1px solid var(--bd)}
.model-table th:not(:first-child){text-align:right}
.model-table td{padding:8px;border-bottom:1px solid var(--bd);vertical-align:middle}
.model-table tr:last-child td{border-bottom:none}
.model-name{font:13px var(--mono);color:var(--tx)}
.model-cost{font:13px var(--mono);color:var(--tx);text-align:right}
.model-toks{font:12px var(--mono);color:var(--mu);text-align:right}
.share-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.share-bar{width:70px;height:4px;background:var(--s2);border-radius:2px;overflow:hidden;flex-shrink:0}
.share-bar div{height:100%;border-radius:2px;background:var(--blue)}
.share-pct{font:11px var(--mono);color:var(--mu);width:36px;text-align:right;flex-shrink:0}

.cost-models{margin-top:22px}
.cost-unavail{padding:40px;text-align:center;color:var(--mu);font:13px var(--mono)}
.cost-unavail strong{display:block;color:var(--tx);margin-bottom:6px;font-size:14px}

/* history */
.history-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-bottom:16px}
@media(max-width:900px){.history-grid{grid-template-columns:1fr}}
.history-box{background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);padding:20px;margin-bottom:16px}
.history-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.history-controls{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.history-controls .history-tabs{margin-bottom:0}
.history-tab{
  border:1px solid var(--bd2);background:var(--s1);color:var(--mu);
  border-radius:6px;padding:5px 9px;font:11px var(--mono);cursor:pointer
}
.history-tab:disabled{opacity:.4;cursor:not-allowed}
.history-tab.active{color:var(--hi);border-color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,transparent)}
.history-chart{min-height:230px}
.cost-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cost-head .box-title{margin-bottom:0;flex:1;min-width:180px}
.cost-range{display:flex;gap:6px;flex-wrap:wrap}
.cost-controls{display:flex;gap:12px;flex-wrap:wrap}
.cost-tab{border:1px solid var(--bd2);background:var(--s1);color:var(--mu);border-radius:6px;padding:5px 9px;font:11px var(--mono);cursor:pointer}
.cost-tab.active{color:var(--hi);border-color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,transparent)}
.series-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.series-row:last-child{border-bottom:none}
.series-left{display:flex;align-items:center;gap:8px;min-width:0}
.series-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.series-name{font:12px var(--mono);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.series-value{font:12px var(--mono);color:var(--mu);text-align:right}
.insight-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.insight{background:var(--s1);border:1px solid var(--bd);border-radius:7px;padding:11px 12px;min-width:0}
.insight-value{font:700 18px/1.1 var(--mono);color:var(--tx);margin-bottom:5px;overflow:hidden;text-overflow:ellipsis}
.insight-label{font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.stats-box{background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);padding:20px;margin-bottom:16px;overflow-x:auto}
.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media(max-width:1000px){.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.stats-grid{grid-template-columns:1fr}}
.stat-card{background:var(--s1);border:1px solid var(--bd);border-radius:7px;padding:11px 12px;min-width:0}
.stat-value{font:700 17px/1.1 var(--mono);color:var(--tx);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-label{font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.metric-table{width:100%;border-collapse:collapse}
.metric-table th{font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu);
  padding:0 8px 8px;text-align:left;border-bottom:1px solid var(--bd)}
.metric-table th:not(:first-child){text-align:right}
.metric-table td{padding:8px;border-bottom:1px solid var(--bd);font:12px var(--mono);color:var(--tx)}
.metric-table td:not(:first-child){text-align:right;color:var(--mu)}
.metric-table tr:last-child td{border-bottom:none}
.usage-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 14px}
.usage-tab{border:1px solid var(--bd2);background:var(--s1);color:var(--mu);border-radius:6px;padding:5px 9px;font:11px var(--mono);cursor:pointer}
.usage-tab.active{color:var(--hi);border-color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,transparent)}
.usage-panel{display:none}
/* Wide report tables scroll inside their panel so the section title and
   report tabs stay put on narrow screens. */
.usage-panel.active{display:block;min-width:0;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin}
.usage-split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px}
/* Spans beyond six months need the full row to keep cells legible. */
.usage-split>div:has(>.heatmap-section.wide){grid-column:1/-1}
@media(max-width:900px){.usage-split{grid-template-columns:minmax(0,1fr)}}
.usage-table{width:100%;border-collapse:collapse;min-width:760px}
.usage-table th{font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu);padding:0 8px 8px;text-align:left;border-bottom:1px solid var(--bd)}
.usage-table th:not(:first-child){text-align:right}
.usage-table td{padding:8px;border-bottom:1px solid var(--bd);font:12px var(--mono);color:var(--tx);vertical-align:middle}
.usage-table td:not(:first-child){text-align:right;color:var(--mu)}
.usage-table tr:last-child td{border-bottom:none}
.cal{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:8px;row-gap:4px;font:10.5px var(--sans);color:var(--su)}
.cal-scroll{overflow-x:auto;scrollbar-width:thin;overscroll-behavior-x:contain}
.cal-scroll>.cal{min-width:calc(var(--weeks)*10px + 30px);max-width:calc(var(--weeks)*18px + 30px)}
.cal{justify-content:start}
.project-table td:first-child{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.project-share{display:inline-block;width:60px;height:6px;border-radius:3px;background:var(--s2);margin-right:8px;vertical-align:middle;overflow:hidden}
.project-share span{display:block;height:100%;background:var(--blue)}
.machine-total td{font-weight:600;color:var(--hi)}
.machine-scroll{overflow-x:auto}
.machine-table{width:100%;min-width:0}
.machine-table td:first-child{white-space:normal;max-width:150px;overflow-wrap:anywhere}
.machine-table td,.machine-table th{padding-left:6px;padding-right:6px}
.machine-sub{font:10px var(--mono);color:var(--su);margin-top:2px;white-space:normal}
.project-row{cursor:pointer}
.project-row:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.branch-caret{display:inline-block;width:1em;color:var(--su);transition:transform .15s}

<div class="shell">

      <span class="appname">usagestat</span>
    </div>
    <nav id="tabs" class="tab-bar">

        <svg viewBox="0 0 16 16" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">

  <div class="panels">
    <div id="panel-overview" class="panel active">
      <div id="overviewSummary" class="overview-summary"><div class="overview-panel" aria-hidden="true"><span class="sk-shape" style="height:16px;width:46%;margin-bottom:12px"></span><span class="sk-shape" style="width:58%;margin-bottom:20px"></span><div class="sk-metrics" style="grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 14px"><span class="sk-shape sk-block" style="height:58px"></span><span class="sk-shape sk-block" style="height:58px"></span><span class="sk-shape sk-block" style="height:58px"></span><span class="sk-shape sk-block" style="height:58px"></span></div><span class="sk-shape sk-block" style="height:46px;margin-bottom:8px"></span><span class="sk-shape sk-block" style="height:46px"></span></div><div class="overview-panel" aria-hidden="true"><span class="sk-shape" style="height:16px;width:46%;margin-bottom:12px"></span><span class="sk-shape" style="width:58%;margin-bottom:20px"></span><div class="sk-mix"><span class="sk-shape"></span><span class="sk-shape" style="height:5px"></span><span class="sk-shape" style="width:70%"></span></div><div class="sk-mix"><span class="sk-shape"></span><span class="sk-shape" style="height:5px"></span><span class="sk-shape" style="width:70%"></span></div><div class="sk-mix"><span class="sk-shape"></span><span class="sk-shape" style="height:5px"></span><span class="sk-shape" style="width:70%"></span></div><div class="sk-mix"><span class="sk-shape"></span><span class="sk-shape" style="height:5px"></span><span class="sk-shape" style="width:70%"></span></div></div><div class="overview-panel" aria-hidden="true"><span class="sk-shape" style="height:16px;width:46%;margin-bottom:12px"></span><span class="sk-shape" style="width:58%;margin-bottom:20px"></span><div class="sk-metrics" style="gap:10px;margin:0 0 14px"><span class="sk-shape sk-block" style="height:58px"></span><span class="sk-shape sk-block" style="height:58px"></span><span class="sk-shape sk-block" style="height:58px"></span><span class="sk-shape sk-block" style="height:58px"></span></div><span class="sk-shape" style="width:40%;margin-bottom:12px"></span><div class="sk-chart" style="height:40px;padding:0;gap:3px;background:none"><span class="sk-shape" style="height:24%"></span><span class="sk-shape" style="height:22%"></span><span class="sk-shape" style="height:62%"></span><span class="sk-shape" style="height:78%"></span><span class="sk-shape" style="height:4%"></span><span class="sk-shape" style="height:4%"></span><span class="sk-shape" style="height:4%"></span><span class="sk-shape" style="height:4%"></span><span class="sk-shape" style="height:4%"></span><span class="sk-shape" style="height:4%"></span><span class="sk-shape" style="height:18%"></span><span class="sk-shape" style="height:10%"></span><span class="sk-shape" style="height:16%"></span><span class="sk-shape" style="height:4%"></span></div><div style="height:12px"></div><div class="sk-mix"><span class="sk-shape"></span><span class="sk-shape" style="height:5px"></span><span class="sk-shape" style="width:70%"></span></div><div class="sk-mix"><span class="sk-shape"></span><span class="sk-shape" style="height:5px"></span><span class="sk-shape" style="width:70%"></span></div></div></div>
      <div id="overviewControls" class="overview-controls"></div>
      <div id="prefs-notice" class="prefs-notice" role="status"></div>
      <input hidden type="file" id="prefs-file" accept="application/json,.json">
      <div id="grid" class="grid" aria-busy="true">
        <span class="sr-only" role="status">Loading providers</span>
        <div class="sk-card" aria-hidden="true" style="padding:18px 16px"><div class="sk-head" style="margin-bottom:6px"><div style="flex:1"><span class="sk-shape sk-line" style="height:14px;width:38%"></span><span class="sk-shape sk-line short" style="margin:0"></span></div><span class="sk-shape sk-ring"></span></div><div class="sk-kv"><span class="sk-shape"></span><span class="sk-shape"></span></div><div class="sk-kv"><span class="sk-shape"></span><span class="sk-shape"></span></div><div class="sk-kv"><span class="sk-shape"></span><span class="sk-shape"></span></div><span class="sk-shape" style="height:4px"></span><div class="sk-kv"><span class="sk-shape"></span><span class="sk-shape"></span></div></div><div class="sk-card" aria-hidden="true" style="padding:18px 16px"><div class="sk-head" style="margin-bottom:6px"><div style="flex:1"><span class="sk-shape sk-line" style="height:14px;width:38%"></span><span class="sk-shape sk-line short" style="margin:0"></span></div><span class="sk-shape sk-ring"></span></div><div class="sk-kv"><span class="sk-shape"></span><span class="sk-shape"></span></div><div class="sk-kv"><span class="sk-shape"></span><span class="sk-shape"></span></div><div class="sk-kv"><span class="sk-shape"></span><span class="sk-shape"></span></div><span class="sk-shape" style="height:4px"></span><div class="sk-kv"><span class="sk-shape"></span><span class="sk-shape"></span></div></div><div class="sk-card" aria-hidden="true" style="padding:18px 16px"><div class="sk-head" style="margin-bottom:6px"><div style="flex:1"><span class="sk-shape sk-line" style="height:14px;width:38%"></span><span class="sk-shape sk-line short" style="margin:0"></span></div><span class="sk-shape sk-ring"></span></div><div class="sk-kv"><span class="sk-shape"></span><span class="sk-shape"></span></div><div class="sk-kv"><span class="sk-shape"></span><span class="sk-shape"></span></div><div class="sk-kv"><span class="sk-shape"></span><span class="sk-shape"></span></div><span class="sk-shape" style="height:4px"></span><div class="sk-kv"><span class="sk-shape"></span><span class="sk-shape"></span></div></div>
      </div>
    </div>
    <div id="panel-history" class="panel"></div>
    <div id="panel-settings" class="panel"></div>
  </div>

</div>
<script src="/dashboard/trends.js"></script>
<script src="/dashboard/settings.js"></script>
<script src="/dashboard/backend.js"></script>
<script>
// ── state ─────────────────────────────────────────────────────────────────────
const S = {
  snapshots:[],
  providers:[],
  allProviders:[],
  iconCatalog:null,
  settingsSection:'appearance',
  collectionView:'sources',
  dailyRows:[],
  dailyError:false,
  costs:{},
  histories:{},
  active:'overview',
  loadedAt:null,
  online:false,
  prefs:loadPrefs()
};
const Backend=typeof UsageDashboardBackend==='object'&&typeof fetch==='function'?UsageDashboardBackend.create((...args)=>fetch(...args)):null;
const quotaDisplay = document.getElementById('quota-display');
quotaDisplay.value = S.prefs.quotaDisplay === 'remaining' ? 'remaining' : 'used';
quotaDisplay.onchange = () => { S.prefs.quotaDisplay = quotaDisplay.value; savePrefs(); renderOverview(); renderActive(); };
function displayPct(used){return S.prefs.quotaDisplay === 'remaining' ? Math.max(0,100-used) : used;}
function providerIcon(id){
  if(S.prefs.icons===false) return '';
  const pref=providerSetting(id);let style=pref.iconStyle&&pref.iconStyle!=='inherit'?pref.iconStyle:S.prefs.iconStyle;
  const provider=(S.allProviders||S.providers).find(p=>p.id===id)||S.providers.find(p=>p.id===id);
  if(!provider?.icon&&!pref.customIcon)return '';
  const family=UsageDashboardSettings.iconChoices(S.iconCatalog,provider?.pluginId||id),source=family.some(icon=>icon.id===pref.iconSource)?pref.iconSource:'',base=source||provider?.pluginId||id,chosen=S.iconCatalog?.aliases?.[base]||base;
  if(style==='color'&&(S.iconCatalog?.icons?.find(i=>i.id===chosen)?.color===false||(!family.length&&provider?.icon?.monochrome&&!provider.icon.colorPath)))style='monochrome';
  const url=pref.customIcon||`/v1/icons/${encodeURIComponent(id)}?style=${style}${source?'&source='+encodeURIComponent(source):''}`;
  const icon=(extra='')=>style==='monochrome'&&!pref.customIcon?`<span class="provider-icon monochrome ${extra}" style="--icon-url:url('${esc(url)}')" role="img" aria-label="${esc(providerName(id))} logo"></span>`:`<img class="provider-icon ${extra}" alt="" src="${esc(url)}" onerror="this.remove()">`;
  const snap=S.snapshots.find(s=>s.providerId===id),percent=snap&&!snapshotHasError(snap)?primaryPercentOf(snap):null;
  return S.prefs.iconFill==='usage'&&percent!=null?`<span class="provider-icon icon-usage" style="--icon-clip:${100-Math.min(100,displayPct(percent))}%">${icon('icon-back')}${icon('icon-front')}</span>`:icon();
}

// ── countdown ring ────────────────────────────────────────────────────────────
function refreshInterval(){ return S.prefs.refreshSeconds || 30; }
const Rr = 11, Rc = +(2*Math.PI*Rr).toFixed(3);
const ringEl = document.getElementById('ring');
ringEl.style.strokeDasharray = Rc;
let tick = refreshInterval(), tickTimer = null, busy = false;
function setRing(s){ ringEl.style.strokeDashoffset = (Rc*(1-s/refreshInterval())).toFixed(3); }
function startTick(){ clearInterval(tickTimer); tick=refreshInterval(); setRing(tick);
  tickTimer = setInterval(()=>{ tick--; setRing(tick); if(tick<=0) load(); },1000); }
function updAgo(){ const el=document.getElementById('ago');
  if(!S.loadedAt){el.textContent='';return;}
  const s=Math.round((Date.now()-S.loadedAt)/1000);
  el.textContent=s<5?'updated now':s<60?`${s}s ago`:`${Math.round(s/60)}m ago`; }
setInterval(updAgo,5000);

// ── network ───────────────────────────────────────────────────────────────────
async function load(){
  clearInterval(tickTimer);
  try {
    const [usage,providers,daily] = await Promise.all([
      fetch('/v1/usage').then(r=>r.json()),
      fetch('/v1/providers').then(r=>r.json()),
      fetch('/v1/history/daily').then(r=>r.ok?r.json():null).catch(()=>null),
    ]);
    if(!Array.isArray(usage)||!Array.isArray(providers))throw Error("invalid refresh response");
    S.snapshots = usage;
    S.allProviders=providers;
    S.providers = providers.filter(p=>p.enabled);
    S.status = await fetchProviderStatus();
    S.machines = await fetchMachines();
    if(!S.iconCatalog)try{S.iconCatalog=await fetch('/v1/icon-catalog').then(r=>r.ok?r.json():null);}catch{}
    if(daily && !daily.error && (Array.isArray(daily)||Array.isArray(daily.daily)))S.dailyRows = normalizeDailyRows(daily);
    S.dailyError = !daily || !!daily.error || !(Array.isArray(daily) || Array.isArray(daily.daily));
    S.online = true; S.loadedAt = Date.now(); updAgo();
    setOnline(true);
    buildTabs();
    if(!STATIC_TABS.includes(S.active)&&!S.providers.some(p=>p.id===S.active))S.active='overview';
    markActiveTab();
    applyTabVisibility();
    renderActive();
    checkThresholdNotifications();
    checkSpendNotifications();
  } catch {
    S.online = false; setOnline(false); renderActive();
  }
  startTick();
}

async function doRefresh(){
  if(busy) return; busy=true;
  document.getElementById('rbtn').classList.add('spin');
  try{
    await fetch('/v1/refresh',{method:'POST'}).catch(()=>{});
    await new Promise(r=>setTimeout(r,600));
    await load();
  }finally{ busy=false; document.getElementById('rbtn').classList.remove('spin'); }
}

// A late response must not overwrite the cache used after a future failure.
function dataRequest(key){
  const versions=S.dataRequestVersions ||= {};
  const version=versions[key]=(versions[key]||0)+1;
  return ()=>versions[key]===version;
}

async function fetchCost(id){
  const current=dataRequest("cost:"+id);
  try{ const response=await fetch(`/v1/cost/${id}`);if(!response.ok)throw Error("cost unavailable");const data=await response.json();if(!data.error && current())S.costs[id]=data; }
  catch{ /* Retain the last successful response during transient failures. */ }
  return S.costs[id];
}

function loadedHistoryDays(id){ const d=S.historyDays?.[id]; return d===null ? null : Math.max(30, d ?? 30); }
async function fetchHistory(id, days=loadedHistoryDays(id)){
  const current=dataRequest("history:"+id);
  // days=null loads every saved sample; otherwise the span ends today.
  const since = days===null ? null : dateKey(new Date(todayUtcDate().getTime()-(days-1)*86400000));
  try{ const response=await fetch(`/v1/history/${encodeURIComponent(id)}?${since?`since=${since}&`:''}group=hour&view=chart`);if(!response.ok)throw Error("history unavailable");const data=await response.json();if(!data.error && current()){S.histories[id]=data;(S.historyDays ||= {})[id]=days;} }
  catch{ /* Retain the last successful history. */ }
  return S.histories[id] || [];
}

async function fetchCcusageReports(id){
  const current=dataRequest("reports:"+id);
  const reports = ['daily','weekly','monthly'];
  const out = Object.fromEntries(reports.filter(report=>S.localReports?.[id]?.[report]).map(report=>[report,S.localReports[id][report]]));
  await Promise.all(reports.map(async report=>{
    try{ const response=await fetch(`/v1/local-usage/${id}/${report}`);if(!response.ok)throw Error("report unavailable");const data=await response.json();if(!data.error)out[report]=data; }
    catch{ /* Keep the previous report while the backend is unavailable. */ }
  }));
  const combined={...S.localReports?.[id],...out};
  if(current())(S.localReports ||= {})[id]=combined;
  return combined;
}

// ── ui state ──────────────────────────────────────────────────────────────────
function setOnline(on){
  const el=document.getElementById('conn');
  el.className='conn '+(on?'online':'offline');
  document.getElementById('connTxt').textContent=on?'live':'offline';
  document.getElementById('offline').classList.toggle('show',!on);
}

const STATIC_TABS=['overview','history','settings'];
function markActiveTab(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===S.active));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===`panel-${S.active}`));
}

function switchTab(id){
  if(S.active==='settings'&&S.settingsSection==='collection'&&S.collectionDirty)S.collectionDrafts=captureCollectionDrafts();
  S.active=id;
  markActiveTab();
  applyTabVisibility();
  renderActive();
  if(typeof history!=='undefined') history.replaceState(null,'',id==='overview'?'#overview':'#'+encodeURIComponent(id));
}

function renderActive(){
  if(S.active==='overview') renderOverview();
  else if(S.active==='history') renderTrends();
  else if(S.active==='settings') renderSettings();
  else renderProvider(S.active);
}

function orderedSnapshots(){
  const byId = new Map(S.snapshots.map(s=>[s.providerId,s]));
  const ordered = [];
  for(const p of S.providers){
    const snap = byId.get(p.id);
    if(snap) ordered.push(snap);
  }
  const seen = new Set(ordered.map(s=>s.providerId));
  for(const snap of S.snapshots){
    if(!seen.has(snap.providerId)) ordered.push(snap);
  }
  return UsageDashboardSettings.order(ordered, S.prefs, s=>s.providerId);
}

// ── tabs ──────────────────────────────────────────────────────────────────────
function buildTabs(){
  const bar = document.getElementById('tabs');
  const existing = new Set([...bar.querySelectorAll('.tab')].map(t=>t.dataset.tab));

  // overview
  if(!existing.has('overview')){
    const b=document.createElement('button');
    b.className='tab'+(S.active==='overview'?' active':'');
    b.dataset.tab='overview'; b.onclick=()=>switchTab('overview');
    b.textContent='Overview'; bar.prepend(b);
  }

  // per-provider tabs
  for(const p of S.providers){
    if(existing.has(p.id)) continue;
    const snap = S.snapshots.find(s=>s.providerId===p.id);
    const accent = snap?.pace ? paceColor(snap.pace.stage) : '#484f58';
    const b=document.createElement('button');
    b.className='tab'+(S.active===p.id?' active':'');
    b.dataset.tab=p.id; b.onclick=()=>switchTab(p.id);
    b.innerHTML=`${providerIcon(p.id)}<span class="tab-dot" style="background:${accent}"></span>${esc(providerName(p.id))}`;
    bar.appendChild(b);

    // ensure panel exists
    if(!document.getElementById(`panel-${p.id}`)){
      const div=document.createElement('div');
      div.id=`panel-${p.id}`; div.className='panel';
      document.querySelector('.panels').appendChild(div);
    }
  }
  for(const p of UsageDashboardSettings.order(S.providers,S.prefs,p=>p.id)){
    const tab=[...bar.querySelectorAll('.tab')].find(t=>t.dataset.tab===p.id);
    const snap=S.snapshots.find(s=>s.providerId===p.id);
    const accent=snap?.pace?paceColor(snap.pace.stage):'#484f58';
    if(tab){tab.innerHTML=`${providerIcon(p.id)}<span class="tab-dot" style="background:${accent}"></span>${esc(providerName(p.id))}`;bar.appendChild(tab);}
  }
}

// ── overview ─────────────────────────────────────────────────────────────────
function renderOverview(){
  const grid=document.getElementById('grid');
  grid.removeAttribute?.('aria-busy');
  renderOverviewSummary();
  renderOverviewControls();
  if(!S.snapshots.length){grid.innerHTML='';return;}
  const overview = overviewSnapshots();
  if(!overview.length){
    grid.innerHTML=`<div class="empty-state" style="grid-column:1/-1">No providers match the current view</div>`;
    return;
  }
  let html='';
  for(const group of accountGroups(overview)){
    if(group.length>1){ html+=combinedCardHtml(group); continue; }
    const s=group[0];
    const isErr=snapshotHasError(s);
    const pace=S.prefs.showPace&&S.prefs.components.includes('pace')?s.pace:null;
    const primM=isErr?null:UsageDashboardSettings.primary(s,S.prefs);
    const primP=primM?pct(primM):null;
    const accent=pace?paceColor(pace.stage):primP!=null?barCol(primP):'#484f58';
    const roll = providerWindowTotals(s.providerId, 30);
    html+=`<div class="card${isErr?' is-error':''}" style="--accent:${accent}">`;
    html+=`<div class="card-head"><div class="card-meta">`;
    html+=`<div class="card-name"><span data-card-component="logo">${providerIcon(s.providerId)}</span><span data-card-component="name">${esc(providerName(s.providerId))}</span></div>`;
    html+=`<div class="card-tags">`;
    if(S.allProviders.find(p=>p.id===s.providerId)?.enabled===false)html+=`<span class="badge">Collection paused · saved usage</span>`;
    if(isErr)html+=`<span class="badge">Usage unavailable · ${esc(s.state||'failed')}</span>`;
    if(s.source) html+=`<span class="${srcCls(s.source)}">${esc(s.source)}</span>`;
    if(s.plan)   html+=`<span class="plan-tag">${esc(s.plan)}</span>`;
    html+=incidentBadgeHtml(s.providerId);
    html+=`</div></div>`;
    if(primP!=null) html+=arcSvg(displayPct(primP),barCol(primP),snapshotDetail(s,primM));
    html+=`</div><div class="card-body">`;
    for(const m of UsageDashboardSettings.metrics(s,S.prefs)){
      if(m.type==='progress'){
        const p=pct(m),col=barCol(p);
        html+=`<div class="metric" data-card-component="quota" ${chartDetailAttribute(snapshotDetail(s,m))}><div class="mlabel">${esc(m.label)}</div>`;
        html+=`<div class="prog-row"><span class="prog-val">${esc(fmtMetric(m))}</span></div>`;
        if(m.detail) html+=`<div class="metric-detail">${esc(m.detail)}</div>`;
        html+=`<div class="track"><div class="bar" style="background:${col}" data-w="${displayPct(p).toFixed(2)}%"></div></div>`;
        if(m.resetsAt&&S.prefs.showReset&&S.prefs.components.includes('reset')) html+=`<div class="resets">${fmtReset(m.resetsAt)}</div>`;
        html+=runOutHtml(m);
      html+=runOutHtml(m);
        html+=`</div>`;
      } else if(m.type==='text'){
        html+=`<div class="metric"><div class="kv"><span class="mlabel" style="margin:0">${esc(m.label)}</span><span class="kv-val">${esc(groupDollarText(m.value||''))}</span></div></div>`;
      } else if(m.type==='badge'){
        html+=`<div class="metric"><div class="kv"><span class="mlabel" style="margin:0">${esc(m.label)}</span><span class="${pillCls(m.color)}">${esc(m.text||'')}</span></div></div>`;
      } else if(m.type==='barChart'){
        html+=barChartMetricHtml(m,true);
      }
    }
    if(roll.totalTokens>0 || roll.cost>0){
      html+=`<div class="metric" data-card-component="cost" ${chartDetailAttribute(dailyDetail(dailyRowsInWindow(S.dailyRows.filter(r=>r.providerId===s.providerId),30),'30d tracked · '+providerName(s.providerId)))}><div class="kv"><span class="mlabel" style="margin:0">30d tracked</span><span class="kv-val">${recordedCost(roll)} · ${recordedTokens(roll)} tokens</span></div></div>`;
    }
    if(pace){
      const pc=paceColor(pace.stage);
      const dCls=pace.deltaPercent>0.5?'pos':pace.deltaPercent<-0.5?'neg':'';

function selectOption(value,label,current){

function overviewSnapshots(){
  const ordered = visibleSnapshots();
  const query = String(S.prefs.search||'').trim().toLowerCase();
  const status = S.prefs.status || 'all';
  const filtered = ordered.filter(s=>{
    if(query){
      const hay = [s.providerId, providerName(s.providerId), s.plan, s.source, ...(s.metrics||[]).map(m=>m.label)].join(' ').toLowerCase();
      if(!hay.includes(query)) return false;
    }
    const prim = primaryPercentOf(s);
    const roll = providerWindowTotals(s.providerId, 30);
    if(status==='live' && snapshotHasError(s)) return false;
    if(status==='attention' && !snapshotHasError(s)) return false;
    if(status==='near' && !(prim!=null && prim>=80)) return false;
    if(status==='tracked' && !(roll.totalTokens>0 || roll.cost>0)) return false;
    return true;
  });
  const index = new Map(ordered.map((s,i)=>[s.providerId,i]));
  const sorted = filtered.slice();
  const sort = S.prefs.sort || 'order';
  sorted.sort((a,b)=>{
    const pinA=providerSetting(a.providerId).pinned===true,pinB=providerSetting(b.providerId).pinned===true;if(pinA!==pinB)return Number(pinB)-Number(pinA);
    if(sort==='name') return providerName(a.providerId).localeCompare(providerName(b.providerId));
    if(sort==='recent') return (+new Date(b.fetchedAt||0)) - (+new Date(a.fetchedAt||0));
    if(sort==='pressure') return (primaryPercentOf(b)||0) - (primaryPercentOf(a)||0);
    if(sort==='cost30') return providerWindowTotals(b.providerId,30).cost - providerWindowTotals(a.providerId,30).cost;
    if(sort==='tokens30') return providerWindowTotals(b.providerId,30).totalTokens - providerWindowTotals(a.providerId,30).totalTokens;
    return (index.get(a.providerId)||0) - (index.get(b.providerId)||0);
  });
  return sorted;
}

// A provider is inactive when it is failing and has nothing to show: no quota
// lines and no tracked usage in the last 30 days (e.g. an expired login).
// Inactive providers are hidden unless the user chooses to show them.
function isInactiveProvider(s){
  if(!snapshotHasError(s)) return false;
  if((s.metrics||[]).some(m=>m.type==='progress')) return false;
  const roll = providerWindowTotals(s.providerId, 30);
  return !(roll.totalTokens>0 || roll.cost>0);
}
function showInactive(){ return S.prefs.inactive==='show'; }
function providerSetting(id){ return UsageDashboardSettings.provider(S.prefs,id); }

  return providerSetting(id).name || S.snapshots.find(s=>s.providerId===id)?.displayName || S.allProviders.find(p=>p.id===id)?.name || S.providers.find(p=>p.id===id)?.name || id;
}
function visibleSnapshots(){ return orderedSnapshots().filter(s=>providerSetting(s.providerId).visible && (showInactive() || !isInactiveProvider(s))); }
function hiddenInactive(){ return showInactive() ? [] : orderedSnapshots().filter(s=>providerSetting(s.providerId).visible && isInactiveProvider(s)); }

// Plugins report failures either as source 'error' or as an "Error" badge.
function snapshotHasError(s){
  return (!!s.state&&s.state!=='ready'&&s.state!=='no-data') || s.source==='error' || (s.metrics||[]).some(m=>m.type==='badge' && /^error$/i.test(String(m.label||'').trim()));
}

function primaryPercentOf(s){
  const m = UsageDashboardSettings.primary(s,S.prefs);
  return m ? pct(m) : null;
}

// Month-to-date API-equivalent spend from saved daily rows (UTC calendar days).
// Projection extrapolates the month's elapsed share, counting at least one day.
function spendStatus(rows, now=Date.now()){
  const today=dateKey(new Date(now)), month=today.slice(0,7);
  const byDay=new Map();
  let known=true;
  for(const r of rows){
    const d=rowDate(r); if(!d) continue;
    byDay.set(d,(byDay.get(d)||0)+rowCost(r));
    if(d.startsWith(month)&&r.costKnown===false) known=false;
  }
  let monthToDate=0;
  for(const [d,v] of byDay) if(d.startsWith(month)&&d<=today) monthToDate+=v;
  const start=Date.UTC(+month.slice(0,4), +month.slice(5,7)-1, 1);
  const daysInMonth=new Date(Date.UTC(+month.slice(0,4), +month.slice(5,7), 0)).getUTCDate();
  const elapsedDays=Math.max(1,(now-start)/864e5);
  const prior=[];
  for(let i=1;i<=30;i++) prior.push(byDay.get(dateKey(new Date(now-i*864e5)))||0);
  const priorAverage=prior.reduce((a,b)=>a+b,0)/30;
  return {month, today:byDay.get(today)||0, monthToDate, projected:monthToDate/elapsedDays*daysInMonth,
    priorAverage, costKnown:known, daysInMonth};
}
// This month's API-equivalent cost against a subscription price.
function planValue(rows, planUsd, now=Date.now()){
  if(!(planUsd>0)) return null;
  const status=spendStatus(rows, now), month=status.month;
  let savings=0;
  for(const r of rows){ const d=rowDate(r); if(d&&d.startsWith(month)&&Number.isFinite(r.cacheSavingsUsd)) savings+=r.cacheSavingsUsd; }
  return {plan:planUsd, monthToDate:status.monthToDate, projected:status.projected, costKnown:status.costKnown,
    ratio:status.monthToDate/planUsd, projectedRatio:status.projected/planUsd, cacheSavings:savings};
}
function fmtRatio(x){ return (x>=10?x.toFixed(0):x.toFixed(1))+'×'; }
function spendAlerts(status, prefs=S.prefs){
  const alerts=[], budget=prefs.spendBudgetUsd, spike=prefs.spendSpikeMultiple;
  if(budget>0){
    const used=status.monthToDate/budget;
    if(used>=1) alerts.push({key:'budget-over',level:'budget',color:'#ff5f57',text:'Monthly spend is over budget',sub:`${fmtUsd(status.monthToDate)} of ${fmtUsd(budget)} · API-equivalent`});
    else if(status.projected>budget) alerts.push({key:'budget-pace',level:'budget',color:'#f6d32d',text:'On pace to exceed the monthly budget',sub:`${fmtUsd(status.monthToDate)} so far · projected ${fmtUsd(status.projected)} of ${fmtUsd(budget)}`});
  }
  // A one-dollar floor keeps quiet months from alerting on cents.
  if(spike>0&&status.priorAverage>0&&status.today>=1&&status.today>=spike*status.priorAverage)
    alerts.push({key:'spike',level:'spend',color:'#ce8670',text:`Today's spend is ${(status.today/status.priorAverage).toFixed(1)}× the 30-day average`,sub:`${fmtUsd(status.today)} today · ${fmtUsd(status.priorAverage)} average`});
  return alerts;
}
// Notifies when an alert first appears during this session, like quota thresholds.
function checkSpendNotifications(rows=S.dailyRows.filter(r=>providerSetting(r.providerId).visible)){
  const status=spendStatus(rows), keys=new Set(spendAlerts(status).map(a=>a.key+':'+(a.key==='spike'?dateKey(todayUtcDate()):status.month)));
  const previous=S.spendAlertKeys; S.spendAlertKeys=keys;
  if(!previous||!S.prefs.spendNotify||typeof Notification==='undefined'||Notification.permission!=='granted') return;
  for(const alert of spendAlerts(status)) if(!previous.has(alert.key+':'+(alert.key==='spike'?dateKey(todayUtcDate()):status.month)))
    new Notification('usagestat · '+alert.text,{body:alert.sub,tag:'usagestat-spend-'+alert.key});
}

function renderOverviewSummary(){
  const el = document.getElementById('overviewSummary');
  if(!el) return;
  if(S.prefs.summary===false){el.innerHTML='';return;}
  const snaps = visibleSnapshots(), hidden = hiddenInactive();
  if(!snaps.length){ el.innerHTML=''; return; }

  const progressRows = snaps.filter(s=>!snapshotHasError(s)).flatMap(s=>UsageDashboardSettings.metrics(s,S.prefs)
    .filter(m=>m.type==='progress' && m.limit>0)
    .map(m=>({ snap:s, metric:m, percent:pct(m) })));
  const primaryRows = snaps.filter(s=>!snapshotHasError(s)).map(s=>{
    const m = UsageDashboardSettings.primary(s,S.prefs);
    return m ? { snap:s, metric:m, percent:pct(m) } : null;
  }).filter(Boolean);
  const pressure = primaryRows.slice().sort((a,b)=>b.percent-a.percent);
  const highest = pressure[0];

  const nearLimit = progressRows.filter(row=>row.percent>=80).length;
