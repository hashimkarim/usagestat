  let html = `<div class="trends-sub" style="margin-bottom:16px">Quotas plot polled samples (peak per group). Tokens, cost and cache plot saved local usage summed per UTC day, week or month. For period comparisons, open History.</div><div class="history-grid">`;
  html+=`<div><div class="history-controls">`;
  html+=`<div class="history-tabs" id="history-tabs-${esc(id)}" role="group" aria-label="Metric">`;
  html+=historyTab(id,'quota','Quotas',false)+historyTab(id,'tokens','Tokens',false)+historyTab(id,'cost','Cost',false)+historyTab(id,'cache','Cache',false);
  html+=`</div><div class="history-tabs" id="history-ranges-${esc(id)}" role="group" aria-label="Time span">`;
  html+=HISTORY_RANGES.map(([v,l])=>`<button class="history-tab" type="button" data-range="${v}">${l}</button>`).join('');
  html+=`</div><div class="history-tabs" id="history-buckets-${esc(id)}" role="group" aria-label="Group by">`;
  html+=HISTORY_GROUPS.map(([v,l])=>bucketTab(v,l,false)).join('');
  html+=`</div>${exportButton('data-history-export')}</div><div class="history-chart" id="history-chart-${esc(id)}"></div></div>`;
  html+=`<div id="history-summary-${esc(id)}"></div></div>`;
  box.insertAdjacentHTML('beforeend', html);

  const redraw=()=>drawHistoryView(id, box, state);
  box.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>{ state.mode=btn.dataset.mode; redraw(); }));
  box.querySelectorAll('[data-bucket]').forEach(btn=>btn.addEventListener('click',()=>{ state.bucket=btn.dataset.bucket; redraw(); }));
  box.querySelector('[data-history-export]')?.addEventListener('click',()=>exportHistoryView(id, state));
  box.querySelectorAll('[data-range]').forEach(btn=>btn.addEventListener('click',()=>{
    state.range=btn.dataset.range; redraw();
    // Quota samples load 30 days up front; wider spans fetch on demand.

    if(loaded!==null && (days===null || days>loaded)) fetchHistory(id, days).then(data=>{
      if(box.isConnected && box._historyState===state){ state.records=normalizeHistory(data).filter(r=>r.providerId===id).sort((a,b)=>new Date(a.ts)-new Date(b.ts)); redraw(); }
    });
  }));
  redraw();
}

function drawHistoryView(id, box, state){
  const group = historyGroupFor(state.mode, state.bucket);
  box.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));
  box.querySelectorAll('[data-range]').forEach(b=>b.classList.toggle('active',b.dataset.range===state.range));
  box.querySelectorAll('[data-bucket]').forEach(b=>{
    const usable = state.mode==='quota' || USAGE_GROUPS.has(b.dataset.bucket);
    b.disabled = !usable;
    b.title = usable ? '' : 'Saved usage is daily; choose Daily, Weekly or Monthly';
    b.classList.toggle('active', b.dataset.bucket===group);
  });
  const days = historyRangeDays(state.range);
  const chartId = `history-chart-${id}`;
  const view = historyViewData(state);
  if(state.mode==='quota') buildHistoryChart(chartId, view.records, 'quota', group);
  else buildHistoryChart(chartId, usageHistoryRecords(view.rows, group), state.mode, group);
  const summary = box.querySelector(`#history-summary-${CSS.escape(id)}`);
  if(summary) summary.innerHTML = historySummaryHtml(state, days);
}

// What the Usage History chart shows: quota samples or saved daily usage in the span.
function historyViewData(state){
  const days = historyRangeDays(state.range);
  if(state.mode!=='quota') return {rows:usageRangeRows(state.usageRows, days)};
  const end = state.records.length ? +new Date(state.records[state.records.length-1].ts) : Date.now();
  return {records:days===null ? state.records : state.records.filter(r=>+new Date(r.ts)>=end-days*86400000)};
}
function exportHistoryView(id, state){
  const group = historyGroupFor(state.mode, state.bucket), view = historyViewData(state);
  const csv = state.mode==='quota' ? quotaHistoryCsv(view.records, group) : groupedUsageCsv(view.rows, group);
  downloadText(`usagestat-${id}-${state.mode==='quota'?'quota':'usage'}-${state.range}-${group}.csv`, csv, 'text/csv;charset=utf-8');
}

// Saved daily rows inside the span, with idle days filled as zero so lines
// drop to zero instead of bridging quiet days.
function usageRangeRows(rows, days){
  if(!rows.length) return [];
  const end = todayUtcDate();
  const start = days===null ? parseDateOnly(rows.map(r=>r.date).sort()[0]) : addDays(end, -(days-1));
  return calendarRange(rows, start, end);
}

// Daily usage is additive, so groups sum their days (unlike polled counters).
function usageHistoryRecords(rows, group){
  const map = new Map();
  for(const r of rows){
    const key = bucketKey(r.date+'T00:00:00Z', group);
    if(!map.has(key)) map.set(key, { ts:key.length===10?key+'T00:00:00Z':key, inputTokens:0, outputTokens:0, reasoningTokens:0, cacheReadTokens:0, cacheCreationTokens:0, totalTokens:0, cost:0, source:r.source||null, usage:true, _days:0 });
    const b = map.get(key);
    b.inputTokens += rowInput(r); b.outputTokens += rowOutput(r); b.reasoningTokens += rowReasoning(r);
    b.cacheReadTokens += rowCacheRead(r); b.cacheCreationTokens += rowCacheCreate(r);
    b.totalTokens += rowTotalTokens(r); b.cost += rowCost(r); b._days++;
    if(r.source) b.source = r.source;
  }
  return [...map.values()].map(({_days,...b})=>b).sort((a,b)=>a.ts.localeCompare(b.ts));
}

function historySummaryHtml(state, days){
  const span = days===null ? 'all-time' : days===1 ? 'today' : `${days}d`;
  const rows = usageRangeRows(state.usageRows, days);
  const t = rows.length ? usageTotals(rows) : null;
  const end = state.records.length ? +new Date(state.records[state.records.length-1].ts) : 0;
  const recs = days===null ? state.records : state.records.filter(r=>+new Date(r.ts)>=end-days*86400000);
  const latest = recs[recs.length-1], first = recs[0];
  let html = `<div class="insight-grid">`;
  html+=insight(latest?fmtPct(latest.primaryPercent):'—', 'latest quota');
  html+=insight(latest&&first?fmtPct((latest.primaryPercent||0)-(first.primaryPercent||0), true):'—', `${span} quota change`);
  html+=insight(t?fmtTok(t.totalTokens):'—', `${span} total tokens`);
  html+=insight(t?fmtTok(t.outputTokens):'—', `${span} output tokens`);
  html+=insight(t&&t.cost>0?fmtUsd(t.cost):'—', `${span} recorded cost`);
  html+=insight(rows.length?`${rows.filter(r=>rowCost(r)>0||rowTotalTokens(r)>0).length}/${rows.length}`:'—', `${span} active days`);
  html+=`</div><div style="margin-top:14px">`;
  html+=seriesRow('Uncached input', t?.inputTokens||0, '#7289da', fmtTok);
  html+=seriesRow('Cached input', t?.cacheReadTokens||0, '#9b87f5', fmtTok);
  html+=seriesRow('Cache writes', t?.cacheCreationTokens||0, '#eaca8b', fmtTok);
  html+=seriesRow('Output', t?.outputTokens||0, '#43b581', fmtTok);
  return html+`</div>`;
}

function renderCostSection(id, raw, history){
  const box = document.getElementById(`cost-box-${id}`);
  if(!box) return;
  box.innerHTML = costHeaderHtml(id);

  // resolve legacy array-shaped cost responses or our spec shape
  let entry = null;
  if(Array.isArray(raw)) entry = raw[0];
  else if(raw && !raw.error) entry = raw;

  if(!entry || entry.error || !entry.daily?.length){
    const saved = S.dailyRows.filter(r=>r.providerId.toLowerCase()===id.toLowerCase());
    if(saved.length) entry = { daily:saved };
  }
  if(!entry || entry.error || !entry.daily?.length){
    const msg = box.querySelector('.cost-unavail') || document.createElement('div');
    msg.className='cost-unavail';
    msg.innerHTML=`<strong>Daily cost history unavailable</strong>This provider has no saved daily cost report. Snapshot counters appear in Usage History; they cannot be added together to calculate spend.`;
    if(!box.contains(msg)) box.appendChild(msg);
    return;
  }

  const daily = (entry.daily||[]).map(normalizeCostRow).filter(d=>d.date).sort((a,b)=>a.date.localeCompare(b.date));
  const viewDaily = calendarWindow(daily, 30);
  const totals = usageTotals(viewDaily);
  const totalCost = totals.cost;
  const totalTok = totals.totalTokens;
  const activeDays = viewDaily.filter(d=>rowCost(d)>0 || rowTotalTokens(d)>0).length;
  const avgDay = activeDays > 0 ? totalCost / activeDays : 0;

  let html = `<div class="cost-stats" id="cost-stats-${esc(id)}">`;
  html+=`<div class="cstat"><div class="cstat-val">${recordedCost(totals)}</div><div class="cstat-lbl">tracked total</div></div>`;
  html+=`<div class="cstat"><div class="cstat-val">${recordedCost({cost:avgDay,costKnown:totals.costKnown})}</div><div class="cstat-lbl">per active day</div></div>`;
  html+=`<div class="cstat"><div class="cstat-val">${activeDays}</div><div class="cstat-lbl">active days</div></div>`;
  html+=`<div class="cstat"><div class="cstat-val">${recordedTokens(totals)}</div><div class="cstat-lbl">total tokens</div></div>`;
  html+=`</div>`;

  // chart
  html+=`<div class="chart-wrap" id="chart-${esc(id)}"></div>`;

  html+=`<div class="cost-models" id="model-table-${esc(id)}"></div>`;

  box.insertAdjacentHTML('beforeend', html);
  setupCostRange(box, id, daily);
}

function costHeaderHtml(id){

    <div class="cost-range" id="cost-range-${esc(id)}" role="group" aria-label="Time span">${tabs('range',[['7','7D'],['30','30D'],['month','Month'],['90','90D'],['365','Year'],['all','All']])}</div>
    <div class="cost-range" id="cost-group-${esc(id)}" role="group" aria-label="Group by">${tabs('group',[['auto','Auto'],['day','Daily'],['week','Weekly'],['month','Monthly']])}</div>
    ${exportButton('data-cost-export')}
  </div></div>`;

function setupCostRange(box, id, daily){
  const state = { daily: daily.map(normalizeCostRow).filter(d=>d.date).sort((a,b)=>a.date.localeCompare(b.date)), range:S.costRanges?.[id] || '30', group:S.costGroups?.[id] || 'auto' };
  box._costState = state;
  const mark=()=>box.querySelectorAll('.cost-tab:not(.chart-export)').forEach(b=>b.classList.toggle('active', b.dataset.range ? b.dataset.range===state.range : b.dataset.group===state.group));
  box.querySelector('[data-cost-export]')?.addEventListener('click',()=>{
    const rows=costViewRows(state);
    downloadText(`usagestat-${id}-cost-${state.range}-${costGroupFor(rows,state.group)}.csv`, groupedUsageCsv(rows, costGroupFor(rows,state.group)), 'text/csv;charset=utf-8');
  });
  box.querySelectorAll('.cost-tab:not(.chart-export)').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(btn.dataset.range){ state.range = btn.dataset.range; (S.costRanges ||= {})[id]=state.range; }
      else { state.group = btn.dataset.group; (S.costGroups ||= {})[id]=state.group; }
      mark(); updateCostView(id, state);
    });
  });
  mark();
  updateCostView(id, state);
}

function costViewRows(state){
  return state.range === 'all' ? fullCalendarRange(state.daily) : state.range === 'month'
    ? calendarWindow(state.daily, todayUtcDate().getUTCDate()) : calendarWindow(state.daily, Number(state.range));
}
// Auto keeps bars readable by coarsening long ranges to weeks or months.
function costGroupFor(rows, grouping){
  return ['day','week','month'].includes(grouping) ? grouping : rows.length>70*7 ? 'month' : rows.length>70 ? 'week' : 'day';
}
function updateCostView(id, state){
  const rows = costViewRows(state);
  const title = document.querySelector(`#cost-box-${CSS.escape(id)} .cost-head .box-title`);
  if(title) title.textContent = `Cost History · ${rangeLabel(state.range)}`;
  const stats = document.getElementById(`cost-stats-${id}`);
  if(stats){
    const totals = usageTotals(rows);
    const activeDays = rows.filter(d=>rowCost(d)>0 || rowTotalTokens(d)>0).length;
    const avgDay = activeDays > 0 ? totals.cost / activeDays : 0;
    stats.innerHTML = `<div class="cstat"><div class="cstat-val">${recordedCost(totals)}</div><div class="cstat-lbl">${state.range==='30'?'30-day':'range'} total</div></div>
      <div class="cstat"><div class="cstat-val">${recordedCost({cost:avgDay,costKnown:totals.costKnown})}</div><div class="cstat-lbl">per active day</div></div>
      <div class="cstat"><div class="cstat-val">${activeDays}/${rows.length}</div><div class="cstat-lbl">active days</div></div>
      <div class="cstat"><div class="cstat-val">${fmtTok(totals.totalTokens)}</div><div class="cstat-lbl">total tokens</div></div>`
      + (state.range==='month' ? `<div class="cstat"><div class="cstat-val">${fmtUsd(spendStatus(state.daily).projected)}</div><div class="cstat-lbl">projected month</div></div>` : '');
  }

function rangeLabel(range){
  if(range==='month') return 'Month to Date';
  if(range==='7') return 'Last 7 Days';
  if(range==='30') return 'Last 30 Days';

// Provider cost rows rarely carry models, so the table reads the same saved
// daily model history as the History tab, limited to the selected range.
function updateModelTable(id, rows){
  const el = document.getElementById(`model-table-${id}`);
  if(!el || !rows.length) return;
  const start = rows[0].date, end = rows[rows.length-1].date, rangeKey = start+'|'+end;
  el.dataset.range = rangeKey;
  const report = S.modelReports?.[id];
  if(typeof fetch==='function' && (!report || report.status==='loading' || Date.now()-report.at >= 30000)){
    // Ignore the callback if the user picked another range meanwhile.
    ensureModelReports([id])?.then(()=>{ if(document.getElementById(`model-table-${id}`)?.dataset.range===rangeKey) updateModelTable(id, rows); });
  }
  const map = new Map();
  for(const r of report?.rows || []){
    if(r.date<start || r.date>end) continue;
    for(const [name,m] of Object.entries(r.models||{})){
      const cur = map.get(name) || { name, cost:0, tokens:0, cached:0, costKnown:true };
      cur.cost += rowCost(m); cur.tokens += rowTotalTokens(m); cur.cached += rowCacheRead(m);
      cur.costKnown &&= m.costKnown === true;
      map.set(name, cur);
    }
  }
  const models = [...map.values()].sort((a,b)=>b.cost-a.cost || b.tokens-a.tokens);
  if(!models.length){
    el.innerHTML = report?.status==='loading' || !report ? `<div class="small-note">Loading model history…</div>` : '';
    return;
  }
  const priced = models.reduce((a,m)=>a+m.cost,0);
  let html = `<div class="u-sechead"><span class="u-h">Models</span></div><div class="trends-table-wrap"><table class="u-table"><thead><tr><th>Model</th><th>Cost</th><th>Share of priced cost</th><th>Tokens</th><th>Cached input</th></tr></thead><tbody>`;
  for(const m of models.slice(0,20)){
    html+=`<tr><td><span class="u-cell-name">${providerIcon(id)}${esc(m.name)}</span></td><td class="${m.costKnown?'':'u-muted'}">${m.costKnown?fmtUsd(m.cost):m.cost>0?fmtUsd(m.cost)+'+':'Unpriced'}</td><td>${m.costKnown||m.cost>0?(m.costKnown?'':'≈')+shareText(m.cost,priced):'—'}</td><td>${fmtTok(m.tokens)}</td><td>${fmtTok(m.cached)}</td></tr>`;
  }
  el.innerHTML = html+`</tbody></table></div><div class="small-note">From saved daily model history (local logs at standard API rates); totals can differ from the reported cost above. Shares include every known cost amount; ≈ marks a partial model. Retained daily estimates without request detail use base API rates.</div>`;
}

function historyPrimary(row){

}
function normalizeHistory(raw){

    ts: r.ts,

function normalizeCharts(charts){

function normalizeProgress(progress, primaryPercent){

function lastWindow(records, days){
  if(!records.length) return [];
  const end = +new Date(records[records.length-1].ts);
  const start = end - days*86400000;
  return records.filter(r=>+new Date(r.ts)>=start);
}

function normalizeCostRow(row){
  const date = rowDate(row);
  return {
    ...row,
    date,
    inputTokens: rowInput(row),
    outputTokens: rowOutput(row),
    cacheReadTokens: rowCacheRead(row),
    cacheCreationTokens: rowCacheCreate(row),
    reasoningOutputTokens: rowReasoning(row),
    totalTokens: rowTotalTokens(row),
    totalCost: rowCost(row),
  };
}

function calendarWindow(rows, days){
  const end = todayUtcDate();
  const start = addDays(end, -(days - 1));
  return calendarRange(rows, start, end);
}

function fullCalendarRange(rows){
  if(!rows.length) return [];
  const sorted = rows.slice().sort((a,b)=>a.date.localeCompare(b.date));
  return calendarRange(rows, parseDateOnly(sorted[0].date), parseDateOnly(sorted[sorted.length-1].date));
}

function calendarRange(rows, start, end){
  const byDate = new Map(rows.map(r=>[r.date, normalizeCostRow(r)]));
  const out = [];
  for(let d = new Date(start); d <= end; d = addDays(d, 1)){
    const key = dateKey(d);
    out.push(byDate.get(key) || emptyDay(key));
  }
  return out;
}

function emptyDay(date){
  return { date, inputTokens:0, outputTokens:0, cacheReadTokens:0, cacheCreationTokens:0, reasoningOutputTokens:0, totalTokens:0, totalCost:0, models:{} };
}

function todayUtcDate(){
  const n = new Date();
  return new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate()));
}
function parseDateOnly(value){
  const s = String(value);
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return new Date(Date.UTC(Number(m[1]), Number(m[2])-1, Number(m[3])));
  const ms = Date.parse(s);
  if(Number.isFinite(ms)){
    const d = new Date(ms);
    return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  }
  return todayUtcDate();
}
function dateKey(date){ return date.toISOString().slice(0,10); }
function addDays(date, days){
  const d = new Date(date);
  d.setUTCDate(d.getUTCDate() + days);
  return d;
}

function historyTab(id,mode,label,active){

function seriesRow(label,value,color,formatter){

function sum(records,key){return records.reduce((acc,r)=>acc+(Number(r[key])||0),0)}
function fmtPct(v,signed){
  if(v==null || !isFinite(v)) return '—';
  const n = Number(v);
  return (signed && n>0?'+':'') + n.toFixed(1) + '%';
}

function reportRows(report, preferred){
  if(!report || report.error) return [];
  const keys = preferred==='session' ? ['sessions','session'] :
    preferred==='blocks' ? ['blocks'] :
    preferred==='projects' ? ['projects'] :
    preferred==='branches' ? ['branches'] :
    preferred==='hourly' ? ['hourly'] :
    preferred==='weekly' ? ['weekly','weeks'] :
    preferred==='monthly' ? ['monthly','months'] :
    ['daily','days'];
  for(const key of keys){
    if(Array.isArray(report[key])) return report[key];
  }
  if(Array.isArray(report)) return report;
  return [];
}

function readAny(obj, keys, fallback){
  for(const key of keys){
    if(obj && obj[key] != null) return obj[key];
  }
  return fallback;
}
function numAny(obj, keys){ const n = Number(readAny(obj, keys, 0)); return Number.isFinite(n) ? n : 0; }
function rowDate(r){
  const raw = String(readAny(r, ['date','day','week','month','startTime','start_time','blockStart','block_start','lastActivity','last_activity','timestamp','ts'], ''));
  if(/^\d{4}-\d{2}-\d{2}/.test(raw)) return raw.slice(0,10);
  const ms = Date.parse(raw);
  return Number.isFinite(ms) ? new Date(ms).toISOString().slice(0,10) : raw.slice(0,12);
}
function rowLabel(r){ return String(readAny(r, ['date','week','month','sessionId','session_id','id','blockStart','block_start','startTime','start_time','project','projectPath'], '—')); }
function rowInput(r){ return numAny(r, ['inputTokens','input_tokens']); }
function rowOutput(r){ return numAny(r, ['outputTokens','output_tokens']); }
function rowCacheRead(r){ return numAny(r, ['cacheReadTokens','cache_read_tokens','cacheReadInputTokens','cache_read_input_tokens','cachedInputTokens','cached_input_tokens']); }
function rowCacheCreate(r){ return numAny(r, ['cacheCreationTokens','cache_creation_tokens','cacheCreationInputTokens','cache_creation_input_tokens','cacheCreateTokens','cache_create_tokens']); }
function rowReasoning(r){ return numAny(r, ['reasoningOutputTokens','reasoning_output_tokens','reasoningTokens','reasoning_tokens']); }
function rowTotalTokens(r){
  return numAny(r, ['totalTokens','total_tokens','tokens']) || rowInput(r)+rowOutput(r)+rowCacheRead(r)+rowCacheCreate(r);
}
function rowCost(r){ return numAny(r, ['totalCost','total_cost','costUSD','costUsd','cost']); }

function usageTotals(rows){
  return rows.reduce((acc,r)=>{
    acc.inputTokens += rowInput(r);
    acc.outputTokens += rowOutput(r);
    acc.cacheReadTokens += rowCacheRead(r);
    acc.cacheCreationTokens += rowCacheCreate(r);
    acc.reasoningTokens += rowReasoning(r);
    acc.totalTokens += rowTotalTokens(r);
    acc.cost += rowCost(r);
    acc.costKnown &&= r.costKnown !== false;
    acc.tokensKnown &&= r.tokensKnown !== false;
    return acc;
  }, {inputTokens:0,outputTokens:0,cacheReadTokens:0,cacheCreationTokens:0,reasoningTokens:0,totalTokens:0,cost:0,costKnown:true,tokensKnown:true});
}

function bucketRows(rows, bucket){
  const map = new Map();
  for(const r of rows){
    const date = rowDate(r);
    if(!date) continue;
    const key = bucket === 'month' ? date.slice(0,7) : bucketKey(date+'T00:00:00Z', 'week');
    if(!map.has(key)) map.set(key, { date:key, inputTokens:0, outputTokens:0, cacheReadTokens:0, cacheCreationTokens:0, totalTokens:0, totalCost:0, tokensKnown:true, costKnown:true });
    const b = map.get(key);
    b.inputTokens += rowInput(r);
    b.outputTokens += rowOutput(r);
    b.cacheReadTokens += rowCacheRead(r);
    b.cacheCreationTokens += rowCacheCreate(r);
    b.totalTokens += rowTotalTokens(r);
    b.totalCost += rowCost(r);
    b.tokensKnown &&= r.tokensKnown !== false;
    b.costKnown &&= r.costKnown !== false;
  }
  return Array.from(map.values()).sort((a,b)=>rowLabel(b).localeCompare(rowLabel(a)));
}

function usageRowsTable(rows, label){

function sessionTable(rows){

// The model with the most cost in a session (tokens when unpriced).
function sessionMainModel(r){
  const models = r.models && typeof r.models==='object' && !Array.isArray(r.models) ? Object.entries(r.models) : [];
  if(!models.length) return modelsLabel(r);
  models.sort((a,b)=>(b[1].costUsd||0)-(a[1].costUsd||0) || (b[1].totalTokens||0)-(a[1].totalTokens||0));
  return models[0][0];
}
function sessionDuration(r){
  const ms = Date.parse(r.lastActivity) - Date.parse(r.firstActivity);
  if(!Number.isFinite(ms) || ms<0) return '—';
  const m = Math.round(ms/60000);
  return m<1 ? '<1m' : m<60 ? `${m}m` : m<48*60 ? `${Math.floor(m/60)}h ${m%60}m` : `${Math.floor(m/1440)}d`;
}

function blockTable(rows){

const HEATMAP_SPANS=[['13','3M'],['26','6M'],['52','1Y'],['all','All']];
// Earliest saved day decides how many weeks "All" covers.
function heatmapWeeks(rows, span){
  if(span!=='all') return Number(span)||26;
  const first=rows.map(rowDate).filter(Boolean).sort()[0];
  if(!first) return 26;
  const end=todayUtcDate(), start=parseDateOnly(first);
  return Math.max(1, Math.floor((end-start)/864e5/7)+2);
}
function heatmapTitle(span){return span==='all'?'Activity · all saved days':`Activity · last ${({13:'3 months',26:'6 months',52:'year'})[span]||span+' weeks'}`;}
function heatmapSectionHtml(id, rows){

  const span=S.heatmapSpans?.[id]||'26';
  const tabs=HEATMAP_SPANS.map(([v,l])=>`<button class="cost-tab${v===span?' active':''}" type="button" data-heatmap-span="${v}" aria-pressed="${v===span}" onclick="setHeatmapSpan('${esc(id)}','${v}')">${l}</button>`).join('');
  const weeks=heatmapWeeks(rows, span);
  return `<div class="heatmap-section${weeks>26?' wide':''}" id="heatmap-${esc(id)}"><div class="heatmap-head"><div class="u-h">${esc(heatmapTitle(span))}</div><div class="cost-range" role="group" aria-label="Time span">${tabs}</div></div>${renderHeatmap(rows, weeks)}</div>`;
}
function setHeatmapSpan(id, span){

  if(!el) return;

  if(scroller) scroller.scrollLeft=scroller.scrollWidth;

// GitHub-style calendar: one column per week (Mon–Sun), one hue by volume.
function renderHeatmap(rows, weeks=26){
  const byDay = new Map();
  for(const r of rows){
    const d = rowDate(r), day = byDay.get(d) || { totalTokens:0, tokensKnown:true };
    day.totalTokens += rowTotalTokens(r); day.tokensKnown &&= r.tokensKnown !== false;
    byDay.set(d, day);
  }
  const end = todayUtcDate();
  const start = addDays(end, -((end.getUTCDay()+6)%7) - (weeks-1)*7);
  const days = [];
  for(let d = start; d <= end; d = addDays(d,1)) days.push(dateKey(d));
  const values = days.map(d=>byDay.get(d)?.totalTokens||0).filter(v=>v>0).sort((a,b)=>a-b);
  // Quartiles keep one huge day from washing out the rest.
  const q = p=>values.length ? values[Math.min(values.length-1, Math.floor(p*values.length))] : 0;
  const cuts = [q(.25), q(.5), q(.75)];
  let cells = '', months = '', lastLabel = -9;
  days.forEach((d,i)=>{
    const day = byDay.get(d), v = day?.totalTokens||0, level = !v ? 0 : v<=cuts[0] ? 1 : v<=cuts[1] ? 2 : v<=cuts[2] ? 3 : 4;
    cells+=`<div class="cal-cell l${level}" style="grid-column:${Math.floor(i/7)+1};grid-row:${i%7+1}" title="${esc(fmtDay(d))}: ${day?esc(recordedTokens(day))+' tokens':'no record'}" ${chartDetailAttribute(dailyDetail(rows.filter(r=>rowDate(r)===d),fmtDay(d)))}></div>`;
    if(i%7===0 && (i===0 || d.slice(8)<='07') && i/7-lastLabel>=3 && (lastLabel=i/7)>=0) months+=`<span style="grid-column:${i/7+1}">${esc(parseDateOnly(d).toLocaleDateString('en-US',{month:'short',timeZone:'UTC'})+(weeks>52&&(i===0||d.slice(5,7)==='01')?` '${d.slice(2,4)}`:''))}</span>`;
  });
  return `<div class="cal-scroll"><div class="cal" style="--weeks:${weeks};--cal-gap:${weeks>40?2:weeks>20?3:4}px"><div class="cal-months">${months}</div><div class="cal-days"><span style="grid-row:1">Mon</span><span style="grid-row:3">Wed</span><span style="grid-row:5">Fri</span></div><div class="cal-grid">${cells}</div></div></div><div class="cal-legend">Less<span class="cal-cell l0"></span><span class="cal-cell l1"></span><span class="cal-cell l2"></span><span class="cal-cell l3"></span><span class="cal-cell l4"></span>More</div>`;
}

// Model mix from saved daily model history, matching the History Model view.
function savedModelMix(id){
  const report = S.modelReports?.[id];
  if(typeof fetch==='function' && (!report || report.status==='loading' || Date.now()-report.at >= 30000)){
    ensureModelReports([id])?.then(()=>{
      const el = document.getElementById(`model-mix-${id}`), html = savedModelMix(id);
      if(el) el.innerHTML = html || emptyUsage(S.modelReports?.[id]?.status==='error'?'Could not load saved model history':'No saved model history in the last 30 days');
    });
  }
  const end = dateKey(todayUtcDate()), start = dateKey(addDays(todayUtcDate(), -29)), map = new Map();
  for(const r of report?.rows || []){
    if(r.date < start || r.date > end) continue;
    for(const [name,m] of Object.entries(r.models||{})){
      const cur = map.get(name) || { model:name, cost:0, tokens:0, costKnown:true };
      cur.cost += rowCost(m); cur.tokens += rowTotalTokens(m); cur.costKnown &&= m.costKnown === true;
      map.set(name, cur);
    }
  }
  const all = [...map.values()].sort((a,b)=>b.cost-a.cost || b.tokens-a.tokens);
  if(!all.length) return '';
  const priced = all.reduce((a,m)=>a+m.cost,0), models = all.slice(0,8);
  let html = `<div class="model-mix">`;
  for(const m of models){
    const share = priced>0 ? m.cost/priced*100 : 0;
    html+=`<div class="model-row" ${chartDetailAttribute({title:m.model,rows:[['Tokens',exactNumber(m.tokens)],['Cost · USD',tipCost(m)]],note:'Share of this report. Local log costs are API-equivalent amounts, separate from subscription charges.'})}><div class="model-label">${esc(m.model)}</div><div class="pressure-value">${m.costKnown||m.cost>0?(m.costKnown?'':'≈')+shareText(m.cost,priced):'—'}</div><div class="model-bar"><div style="width:${share.toFixed(1)}%"></div></div><div class="pressure-value">${recordedCost(m)}</div></div>`;
  }
  return html+`</div><div class="small-note">Share of priced cost · local logs at API rates</div>`;
}

function aggregateReportModels(rows){
  const map = new Map();
  const costKnown=row=>row.costKnown!==false&&['cost','costUSD','costUsd','totalCost','total_cost'].some(key=>Number.isFinite(row[key]));
  const add = (name,tokens,cost,known=false)=>{
    name = String(name||'unknown').trim() || 'unknown';
    const cur = map.get(name) || { model:name, tokens:0, cost:0, costKnown:true };
    cur.tokens += Number(tokens)||0;
    cur.cost += Number(cost)||0;cur.costKnown &&= known;
    map.set(name, cur);
  };
  for(const r of rows){
    const breakdown = readAny(r, ['modelBreakdowns','model_breakdowns'], []);
    if(Array.isArray(breakdown) && breakdown.length){
      for(const m of breakdown) add(readAny(m,['modelName','model_name','model'], 'unknown'), rowTotalTokens(m), rowCost(m),costKnown(m));
      continue;
    }
    const models = readAny(r, ['modelsUsed','models_used','models','model'], null);
    if(Array.isArray(models)) models.forEach(m=>add(m, rowTotalTokens(r)/models.length, rowCost(r)/models.length,costKnown(r)));
    else if(models && typeof models === 'object') Object.entries(models).forEach(([name,m])=>add(name, rowTotalTokens(m), rowCost(m),costKnown(m)));
    else if(models) add(models, rowTotalTokens(r), rowCost(r),costKnown(r));
  }
  return Array.from(map.values()).sort((a,b)=>b.tokens-a.tokens || b.cost-a.cost).slice(0,10);
}

function renderModelMix(models, totalTokens){
  if(!models.length) return emptyUsage('No model metadata available');
  let html = `<div class="model-mix">`;
  for(const m of models){
    const share = totalTokens>0 ? m.tokens/totalTokens*100 : 0;
    html+=`<div class="model-row" ${chartDetailAttribute({title:m.model,rows:[['Tokens',exactNumber(m.tokens)],['Cost · USD',tipCost(m)]],note:'Share of this report. Local log costs are API-equivalent amounts, separate from subscription charges.'})}><div class="model-label">${esc(m.model)}</div><div class="pressure-value">${share.toFixed(1)}%</div><div class="model-bar"><div style="width:${share.toFixed(1)}%"></div></div><div class="pressure-value">${m.costKnown===false?recordedCost(m):m.cost>0?fmtUsd(m.cost):fmtTok(m.tokens)}</div></div>`;
  }
  html+=`</div>`;
  return html;
}

function modelsLabel(r){
  const breakdown = readAny(r, ['modelBreakdowns','model_breakdowns'], []);
  if(Array.isArray(breakdown) && breakdown.length) return breakdown.map(m=>readAny(m,['modelName','model_name','model'],'model')).slice(0,3).join(', ');
  const models = readAny(r, ['modelsUsed','models_used','models','model'], '—');
  if(models && typeof models === 'object' && !Array.isArray(models)) return Object.keys(models).slice(0,3).join(', ');
  return Array.isArray(models) ? models.slice(0,3).join(', ') : String(models || '—');
}
function projectLabel(r){ return String(readAny(r, ['project','projectName','project_name','projectPath','project_path','cwd','instance'], '—')).split('/').filter(Boolean).slice(-2).join('/') || '—'; }
function shortId(v){ return String(v||'—').split(/[-/]/).filter(Boolean).slice(-2).join('-') || String(v||'—').slice(0,18); }

function bucketKey(ts, bucket){
  const d = new Date(ts);
  if(bucket==='hour'){
    d.setUTCMinutes(0,0,0);
    return d.toISOString();
  }
  if(bucket==='day') return d.toISOString().slice(0,10);
  if(bucket==='week'){
    const u = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
    const day = u.getUTCDay() || 7;
    u.setUTCDate(u.getUTCDate() - day + 1);
    return u.toISOString().slice(0,10);
  }
  if(bucket==='month') return d.toISOString().slice(0,7)+'-01';
  return ts;
}

function aggregateHistory(records, bucket){
  if(bucket==='raw') return records;
  const map = new Map();
  for(const r of records){
    const key = bucketKey(r.ts, bucket);
    if(!map.has(key)){
      map.set(key, {
        ...r,
        ts:key,
        primaryPercent:null,
        inputTokens:0,
        outputTokens:0,
        cacheReadTokens:0,
        cacheCreationTokens:0,
        totalTokens:0,
        cost:0,
        progress:[],
        _quota:Object.create(null),
        _samples:0,
      });
    }
    const b = map.get(key);
    b._samples++;
    if(r.primaryPercent!=null && Number.isFinite(Number(r.primaryPercent))) b.primaryPercent = Math.max(b.primaryPercent??0, Number(r.primaryPercent));
    // These are sampled counters, not usage events. Repeated polls must not
    // multiply usage; take the latest counter while retaining peak quota.
    if(!b._latest || new Date(r.ts)>=new Date(b._latest)){
      for(const field of ['inputTokens','outputTokens','cacheReadTokens','cacheCreationTokens','totalTokens','cost']) b[field] = r[field]==null?null:Number(r[field]);
      for(const field of ['source','state','plan','resetTime','recordedProgress'])b[field]=r[field];
      b._latest = r.ts;
    }
    for(const p of (r.progress||[])){
      if(p.percent == null || !isFinite(p.percent)) continue;
      if(!b._quota[p.label]) b._quota[p.label] = { ...p, percent:0, used:0, samples:0 };
      b._quota[p.label].percent = Math.max(b._quota[p.label].percent, Number(p.percent)||0);
      b._quota[p.label].used = Math.max(b._quota[p.label].used, Number(p.used)||0);
      b._quota[p.label].samples++;
    }
  }
  return Array.from(map.values()).map(b=>{
    b.progress = Object.values(b._quota);
    delete b._quota; delete b._samples; delete b._latest;
    return b;
  }).sort((a,b)=>new Date(a.ts)-new Date(b.ts));
}

function quotaSeries(records){
  const labels = [];
  const seen = new Set();
  for(const r of records){
    for(const p of (r.progress||[])){
      if(p.format==='percent' && !seen.has(p.label)){
        seen.add(p.label);
        labels.push(p.label);
      }
    }
  }
  const palette = ['#7289da','#43b581','#eaca8b','#ce8670','#b48ead','#859bee','#d25050'];
  if(!labels.length) return [{ key:'primaryPercent', label:'Primary', color:'#7289da', fmt:v=>v.toFixed(1)+'%' }];
  return labels.slice(0, 7).map((label, i)=>({
    key:'quota:'+label,
    label,
    color:palette[i % palette.length],
    fmt:v=>v.toFixed(1)+'%',
    value:r=>{
      const p = (r.progress||[]).find(row=>row.label===label);
      return p && p.percent != null ? Number(p.percent) : null;
    }
  }));
}

function historySeries(records, mode){
  if(mode==='quota') return quotaSeries(records);
  if(mode==='tokens') return [
    { key:'inputTokens', label:'Input', color:'#7289da', fmt:fmtTok },
    { key:'outputTokens', label:'Output', color:'#43b581', fmt:fmtTok },
    { key:'totalTokens', label:'Total', color:'#4fb4a8', fmt:fmtTok, line:true },
  ];
  if(mode==='cost') return [
    { key:'cost', label:'Cost', color:'#7289da', fmt:fmtUsd, line:true },
  ];
  if(mode==='cache') return [
    { key:'cacheReadTokens', label:'Cache read', color:'#b48ead', fmt:fmtTok },
    { key:'cacheCreationTokens', label:'Cache write', color:'#eaca8b', fmt:fmtTok },
  ];
  return [{ key:'primaryPercent', label:'Usage', color:'#7289da', fmt:v=>v.toFixed(1)+'%' }];
}

function seriesValue(row, series){
  const value = series.value ? series.value(row) : row[series.key];
  return value!=null && Number.isFinite(Number(value)) ? Number(value) : null;
}

function buildHistoryChart(containerId, sourceRecords, mode, bucket){
  const container = document.getElementById(containerId);
  if(!container) return;
  const records = aggregateHistory(sourceRecords, bucket || 'raw');
  const series = historySeries(records, mode).map(s=>({ ...s,
    // Missing samples stay as null so the chart breaks there instead of bridging.
    pts:records.map(r=>{ const v = seriesValue(r,s); return { t:+new Date(r.ts), v:v!=null && Number.isFinite(v) ? v : null, record:r }; }).filter(p=>Number.isFinite(p.t)) }))
    .filter(s=>s.pts.some(p=>p.v!=null));
  if(!records.length || !series.length){
    container.innerHTML = `<div class="chart-loading">No ${esc(mode)} history recorded for ${esc(bucket||'raw')} view yet</div>`;
    return;
  }
  // Suppress zero-only lines when other series are active; a recorded zero
  // remains real history when every available series is zero.
  const positive = series.filter(s=>s.pts.some(p=>p.v>0));
  timeLineChart(container, positive.length ? positive : series, {
    max: mode==='quota' ? 100 : null,
    axis: v=>axisValue(v,mode),
    peak: mode==='quota',
    when: t=>fmtWhen(t, bucket||'raw'),
    bucket: bucket||'raw',
  });
}

function fmtWhen(t, bucket){
  const d = new Date(t);
  if(bucket==='day') return d.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
  if(bucket==='week') return 'Week of '+d.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
  if(bucket==='month') return d.toLocaleDateString('en-US',{month:'long',year:'numeric',timeZone:'UTC'});
  return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'UTC'})+' UTC';
}

// Time-scaled smooth lines. Dense polling history is reduced to one value per
// pixel column (peak for quotas, latest for counters) and broken across gaps.
function timeLineChart(container, series, opts){
  // Match the rendered width so text keeps its intended size.
  const W=Math.max(300,Math.round(container.clientWidth||860)),H=240,L=52,R=16,T=12,B=28,CW=W-L-R,CH=H-T-B,COLS=Math.min(240,Math.round(CW/3));
  const known = series.flatMap(s=>s.pts.filter(p=>p.v!=null).map(p=>p.t));
  let t0 = Math.min(...known), t1 = Math.max(...known);
  if(t1===t0){ t0 -= 3600000; t1 += 3600000; }
  const col = t=>Math.min(COLS-1, Math.floor((t-t0)/(t1-t0)*COLS));
  const reduced = series.map(s=>{
    // Split at explicit missing samples first, then reduce each run on its own.
    const sorted = s.pts.slice().sort((a,b)=>a.t-b.t), runs = [[]], breaks = [];
    for(const p of sorted){
      if(p.v==null){ breaks.push(p.t); if(runs[runs.length-1].length) runs.push([]); }
      else runs[runs.length-1].push(p);
    }
    const reducedRuns = runs.filter(r=>r.length).map(run=>{
      const cols = new Map();
      for(const p of run){
        const c = col(p.t), cur = cols.get(c);
        if(!cur || (opts.peak ? p.v>=cur.v : p.t>=cur.t)) cols.set(c, { ...p });
      }
      return [...cols.entries()].sort((a,b)=>a[0]-b[0]).map(([,p])=>p);
    });
    const pts = reducedRuns.flat();
    const gaps = reducedRuns.flatMap(run=>run.slice(1).map((p,i)=>p.t-run[i].t)).sort((a,b)=>a-b);
    const limit = Math.max((gaps[Math.floor(gaps.length/2)]||0)*6, (t1-t0)/30);
    const segments = [];
    for(const run of reducedRuns) run.forEach((p,i)=>{ if(!i || p.t-run[i-1].t>limit) segments.push([]); segments[segments.length-1].push(p); });
    return { ...s, pts, segments, limit, breaks };
  });
  const max = opts.max || niceMax(Math.max(...reduced.flatMap(s=>s.pts.map(p=>p.v))));
  const x = t=>L+CW*(t-t0)/(t1-t0), y = v=>T+CH*(1-Math.min(v,max)/max);
  const uid = Array.from(container.id || 'chart', c=>c.codePointAt(0).toString(16)).join('-');
  let svg = `<svg class="chart-svg tl-chart" viewBox="0 0 ${W} ${H}"><defs>${reduced.map((s,i)=>`<linearGradient id="tl-${uid}-${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".22"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`).join('')}</defs>`;
  for(let i=0;i<=4;i++){
    const v = max*i/4, yy = y(v);
    svg+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--bd)"/><text x="${L-8}" y="${yy+4}" text-anchor="end" fill="var(--su)" font-size="10.5">${esc(opts.axis(v))}</text>`;
  }
  // Spans where no series has a sample get a hatched "No data" band, so a
  // break reads as missing data rather than a drop to zero.
  const covered = reduced.flatMap(s=>s.segments.map(seg=>[seg[0].t, seg[seg.length-1].t])).sort((a,b)=>a[0]-b[0]);
  const merged = [];
  for(const [a0,a1] of covered){ const last = merged[merged.length-1]; if(last && a0<=last[1]) last[1] = Math.max(last[1],a1); else merged.push([a0,a1]); }
  const noData = merged.slice(1).map((m,i)=>[merged[i][1], m[0]]).filter(([g0,g1])=>x(g1)-x(g0)>=8);
  if(noData.length){
    svg+=`<defs><pattern id="tl-gap-${uid}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="var(--mu)" stroke-width="1" opacity=".22"/></pattern></defs><g class="tl-gaps" pointer-events="none">`;
    for(const [g0,g1] of noData){
      const gx = x(g0), gw = x(g1)-gx;
      svg+=`<rect x="${gx.toFixed(1)}" y="${T}" width="${gw.toFixed(1)}" height="${CH}" fill="url(#tl-gap-${uid})"/>`;
      if(gw>=56) svg+=`<text x="${(gx+gw/2).toFixed(1)}" y="${T+12}" text-anchor="middle" fill="var(--mu)" font-size="9.5" letter-spacing=".06em">NO DATA</text>`;
    }
    svg+=`</g>`;
  }
  reduced.forEach((s,i)=>{
    // A faint dashed bridge keeps each series readable across a gap without
    // presenting the missing stretch as measured values.
    s.segments.slice(1).forEach((seg,k)=>{
      const p = s.segments[k][s.segments[k].length-1], q = seg[0];
      svg+=`<line class="tl-bridge" x1="${x(p.t).toFixed(1)}" y1="${y(p.v).toFixed(1)}" x2="${x(q.t).toFixed(1)}" y2="${y(q.v).toFixed(1)}" stroke="${s.color}" stroke-width="1.2" stroke-dasharray="2 4" opacity=".45"/>`;
    });
    for(const seg of s.segments){
      const pts = seg.map(p=>[x(p.t), y(p.v)]);
      if(pts.length===1){ svg+=`<circle cx="${pts[0][0].toFixed(1)}" cy="${pts[0][1].toFixed(1)}" r="2.5" fill="${s.color}"/>`; continue; }
      const line = monotonePath(pts);
      svg+=`<path d="M${line.slice(1)}L${pts[pts.length-1][0].toFixed(1)},${y(0)}L${pts[0][0].toFixed(1)},${y(0)}Z" fill="url(#tl-${uid}-${i})"/>`;
      svg+=`<path d="M${line.slice(1)}" fill="none" stroke="${s.color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
  });
  // About one date label per 70px so narrow charts never overlap labels.
  const span = t1-t0, ticks = Math.max(2, Math.min(6, Math.floor(CW/70)+1));
  const anchorAt = t=>x(t)<L+24?'start':x(t)>W-R-24?'end':'middle';
  const marks = timeAxisTicks(t0, t1, opts.bucket, ticks);
  for(const m of marks) svg+=`<text x="${x(m.t).toFixed(1)}" y="${H-6}" text-anchor="${anchorAt(m.t)}" fill="var(--su)" font-size="10.5">${esc(m.label)}</text>`;
  svg+=`<line class="tl-guide" x1="0" x2="0" y1="${T}" y2="${T+CH}" stroke="var(--mu)" stroke-dasharray="3 3" opacity="0"/>`;
  svg+=`<g class="tl-dots" opacity="0">${reduced.map(s=>`<circle r="4" fill="${s.color}" stroke="var(--s0)" stroke-width="2"/>`).join('')}</g></svg>`;
  const legend = reduced.length>1 ? `<div class="chart-legend">${reduced.map(s=>`<span class="legend-item"><span class="legend-dot" style="background:${s.color}"></span>${esc(s.label)}</span>`).join('')}</div>` : '';
  container.innerHTML = legend + svg;

  const el = container.querySelector('svg'), tip = document.getElementById('tip');
  const guide = el.querySelector('.tl-guide'), dots = [...el.querySelector('.tl-dots').children];
  const hideMarks=()=>{ guide.setAttribute('opacity','0'); el.querySelector('.tl-dots').setAttribute('opacity','0'); };
  const inspect=(e,forcedTime,pin=false)=>{
    if(TIP.pinned&&!pin) return;
    const box = el.getBoundingClientRect();
    const t = forcedTime??(t0 + ((e.clientX-box.left)*W/box.width - L)/CW*(t1-t0));
    // Nearest reduced point per series, ignoring series that have a gap here.
    const hits = reduced.map(s=>{
      let best = null;
      for(const p of s.pts) if(!best || Math.abs(p.t-t)<Math.abs(best.t-t)) best = p;
      if(!best || Math.abs(best.t-t) > s.limit/2) return null;
      // Never snap across an explicit missing sample.
      const lo = Math.min(best.t,t), hi = Math.max(best.t,t);
      return s.breaks.some(b=>b>lo && b<hi) ? null : best;
    });
    const anchor = hits.filter(Boolean).sort((a,b)=>Math.abs(a.t-t)-Math.abs(b.t-t))[0];
    if(!anchor){ hideDetail(); return; }
    const gx = x(anchor.t);
    guide.setAttribute('x1',gx); guide.setAttribute('x2',gx); guide.setAttribute('opacity','.7');
    el.querySelector('.tl-dots').setAttribute('opacity','1');
    hits.forEach((p,i)=>{ dots[i].style.display = p ? '' : 'none'; if(p){ dots[i].setAttribute('cx',x(p.t)); dots[i].setAttribute('cy',y(p.v)); } });
    const parts = {heading:'Charted values',items:reduced.map((s,i)=>hits[i]?{color:s.color,label:s.label,value:s.fmt(hits[i].v)}:null).filter(Boolean)};
    showDetail(historyDetail(anchor.record,opts.when(anchor.t),parts),e.clientX,e.clientY,{pin,origin:el,onHide:hideMarks});
    if(pin)pinTipFocus();
  };
  el.addEventListener('mousemove',e=>inspect(e));el.addEventListener('click',e=>inspect(e,undefined,true));
  const times=[...new Set(reduced.flatMap(s=>s.pts.map(p=>p.t)))].sort((a,b)=>a-b);wireChartKeyboard(el,(index,event,pin)=>inspect(event,times[index],pin),times.length);
  el.addEventListener('mouseleave', event=>{ if(event.relatedTarget?.closest?.('#tip'))return;hideDetail(); });
}

function axisValue(v,mode){
  if(mode==='cost') return v>=1000 ? '$'+(+(v/1000).toFixed(2))+'K' : '$'+(v<10&&v%1?v.toFixed(2):v.toFixed(0));
  if(mode==='quota' || mode==='primary') return v.toFixed(0)+'%';
  return v>=1e9?+(v/1e9).toFixed(2)+'B':v>=1e6?+(v/1e6).toFixed(1)+'M':v>=1e3?+(v/1e3).toFixed(1)+'K':String(+v.toFixed(1));
}

// ── chart ─────────────────────────────────────────────────────────────────────
// ── cost chart ────────────────────────────────────────────────────────────────
const COST_PARTS = [
  { key:'input', label:'Uncached input', color:'#7289da' },
  { key:'cacheRead', label:'Cached input', color:'#9b87f5' },
  { key:'cacheWrite', label:'Cache writes', color:'#eaca8b' },
  { key:'output', label:'Output', color:'#43b581' },
  // Cost that cannot be split because the row has no token breakdown.
  { key:'unallocated', label:'Unallocated', color:'#8e9297' },
];
// Relative list-price weights per token type. Daily reports carry one total
// cost, so the stack splits that exact total by these ratios.
function costWeights(providerId){
  const id = String(providerId||'').toLowerCase();
  if(/claude|anthropic/.test(id)) return { input:1, cacheRead:.1, cacheWrite:1.25, output:5 };
  if(/codex|openai|gpt|copilot|cursor/.test(id)) return { input:1, cacheRead:.1, cacheWrite:1, output:8 };

function costParts(row, weights){
  const input = rowInput(row), cacheRead = rowCacheRead(row), cacheWrite = rowCacheCreate(row);
  const output = rowOutput(row), reasoning = rowReasoning(row), total = rowTotalTokens(row);
  // Some reports count reasoning inside output, others separately.
  const separate = Math.abs(total-(input+cacheRead+cacheWrite+output+reasoning)) < Math.abs(total-(input+cacheRead+cacheWrite+output));
  const tokens = { input, cacheRead, cacheWrite, output: output + (separate ? reasoning : 0), unallocated:0 };
  const split = COST_PARTS.filter(p=>p.key!=='unallocated');
  // Locally priced rows carry exact component costs; others get a ratio estimate.
  const fields = { input:'inputCostUsd', cacheRead:'cacheReadCostUsd', cacheWrite:'cacheWriteCostUsd', output:'outputCostUsd' };
  if(split.every(p=>Number.isFinite(row[fields[p.key]]))){
    return { tokens, exact:true, cost: { ...Object.fromEntries(split.map(p=>[p.key, row[fields[p.key]]])), unallocated:0 } };
  }
  const units = Object.fromEntries(split.map(p=>[p.key, tokens[p.key]*weights[p.key]]));
  const sumUnits = Object.values(units).reduce((a,v)=>a+v,0), cost = rowCost(row);
  if(!(sumUnits>0)) return { tokens, exact:false, cost: { ...Object.fromEntries(split.map(p=>[p.key,0])), unallocated:cost } };
  return { tokens, exact:false, cost: { ...Object.fromEntries(split.map(p=>[p.key, cost*units[p.key]/sumUnits])), unallocated:0 } };
}

function buildChart(containerId, daily, providerId, grouping='auto'){
  const container = document.getElementById(containerId);
  if(!container) return;
  daily = daily.map(normalizeCostRow);
  if(!daily.some(d=>rowCost(d)>0)){
    const unpriced = daily.some(d=>d.costKnown===false && rowTotalTokens(d)>0);
    container.innerHTML=`<div class="chart-loading">${unpriced?'Usage in this range is unpriced':'No daily cost data recorded'}</div>`; return;
  }

  const group = costGroupFor(daily, grouping);
  const buckets = [];
  for(const d of daily){
    const key = group==='day' ? d.date : group==='month' ? d.date.slice(0,7) : dateKey(addDays(parseDateOnly(d.date), -((parseDateOnly(d.date).getUTCDay()+6)%7)));
    let b = buckets[buckets.length-1];
    if(!b || b.key!==key){ b = { key, start:d.date, end:d.date, rows:[] }; buckets.push(b); }
    b.end = d.date; b.rows.push(d);
  }
  const weights = costWeights(providerId);
  for(const b of buckets){
    b.cost = {}; b.tokens = {}; b.estimated = 0; b.costKnown = b.rows.every(r=>r.costKnown!==false);
    for(const p of COST_PARTS){ b.cost[p.key]=0; b.tokens[p.key]=0; }
    for(const r of b.rows){
      const parts = costParts(r, weights);
      if(!parts.exact && rowCost(r)>0) b.estimated++;
      for(const p of COST_PARTS){ b.cost[p.key]+=parts.cost[p.key]; b.tokens[p.key]+=parts.tokens[p.key]; }
    }
    b.total = b.rows.reduce((a,r)=>a+rowCost(r),0);
  }
  const shown = COST_PARTS.filter(p=>buckets.some(b=>b.cost[p.key]>0 || b.tokens[p.key]>0));
  const W=Math.max(300,Math.round(container.clientWidth||860)),H=240,L=52,R=12,T=12,B=28,CW=W-L-R,CH=H-T-B;
  const max = niceMax(Math.max(...buckets.map(b=>b.total)));
  const step = CW/buckets.length, barW = Math.max(2, Math.min(28, step*.7));
  const y = v=>T+CH*(1-v/max);
  let svg = `<svg class="chart-svg cost-chart" viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=4;i++){
    const v = max*i/4;
    svg+=`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="var(--bd)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" fill="var(--su)" font-size="10.5">${esc(axisValue(v,'cost'))}</text>`;
  }
  buckets.forEach((b,i)=>{
    const x = L+i*step+(step-barW)/2;
    let acc = 0;
    svg+=`<g class="cost-col" data-i="${i}" tabindex="0" aria-describedby="tip" aria-label="${esc(b.start)} cost details; Enter pins details"><rect x="${(L+i*step).toFixed(1)}" y="${T}" width="${step.toFixed(1)}" height="${CH}" fill="transparent"/>`;
    shown.forEach((p,pi)=>{
      const v = b.cost[p.key]; if(!(v>0)) return;
      const y1 = y(acc+v), h = Math.max(.5, y(acc)-y1);
      const top = pi===shown.length-1 || shown.slice(pi+1).every(q=>!(b.cost[q.key]>0));
      svg+=`<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" fill="${p.color}" ${top?`rx="${Math.min(3,barW/3).toFixed(1)}"`:''}/>`;
      acc += v;
    });
    svg+=`</g>`;
  });
  const tickIdx = tickIndices(buckets.length, Math.max(2, Math.min(8, Math.floor(CW/58))));
  const tickLabels = periodTickLabels(tickIdx.map(i=>buckets[i].start), group);
  tickIdx.forEach((i,k)=>{
    svg+=`<text x="${(L+(i+.5)*step).toFixed(1)}" y="${H-6}" text-anchor="middle" fill="var(--su)" font-size="10.5">${esc(tickLabels[k])}</text>`;
  });
  svg+=`</svg>`;
  const totals = Object.fromEntries(shown.map(p=>[p.key, buckets.reduce((a,b)=>a+b.cost[p.key],0)]));
  const legend = `<div class="chart-legend">${shown.map(p=>`<span class="legend-item"><span class="legend-dot" style="background:${p.color}"></span>${esc(p.label)} <b class="legend-val">${esc(fmtUsd(totals[p.key]))}</b></span>`).join('')}</div>`;
  const estimatedDays = buckets.reduce((a,b)=>a+b.estimated,0), pricedDays = daily.filter(d=>rowCost(d)>0).length;
  const split = !estimatedDays ? 'Split by token type uses per-component prices.'
    : estimatedDays===pricedDays ? 'Daily totals are reported cost; the split by token type is estimated from list-price ratios.'
    : `Split uses per-component prices where available; ${estimatedDays} of ${pricedDays} priced days are estimated from list-price ratios.`;
  const note = `<div class="small-note">${group!=='day'?`Grouped by ${group}. `:''}${split}</div>`;
  container.innerHTML = legend + svg + note;

  container.querySelectorAll('.cost-col').forEach(g=>{
    const inspect=(event,pin=false)=>{
      const b = buckets[+g.dataset.i];
      const when = b.start===b.end ? fmtDay(b.start) : `${fmtDay(b.start)} → ${fmtDay(b.end)}`;
      const items = shown.slice().reverse().filter(p=>b.tokens[p.key]>0 || b.cost[p.key]>0).map(p=>({color:p.color,label:p.label,sub:b.tokens[p.key]>0?fmtTok(b.tokens[p.key]):'',value:tipUsd(b.cost[p.key])}));
      const detail = dailyDetail(b.rows,when,{parts:{heading:'Cost by token type',estimated:!!b.estimated,items}});
      const box=g.getBoundingClientRect(),x=event?.clientX??box.left+box.width/2,y=event?.clientY??box.top+box.height/2;
      if(showDetail(detail,x,y,{pin,origin:g,onHide:()=>g.classList.remove('hover')}))g.classList.add('hover');
      if(pin)pinTipFocus();
    };
    g.addEventListener('mouseenter',e=>inspect(e));g.addEventListener('focus',()=>inspect(null));g.addEventListener('click',e=>inspect(e.detail?e:null,true));
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();inspect(null,true);}});
    g.addEventListener('blur',e=>{if(!e.relatedTarget?.closest?.('#tip'))hideDetail();});
    g.addEventListener('mousemove',e=>{ if(!TIP.pinned)positionTooltip(e.clientX,e.clientY); });
    g.addEventListener('mouseleave',event=>{ if(event.relatedTarget?.closest?.('#tip'))return;hideDetail(); });
  });
}

function fmtMetric(m){

}
function barChartMetricHtml(m, compact){

function chartColor(c){

  return {'green':'#3fb950','red':'#f85149','blue':'#58a6ff','yellow':'#e3b341','orange':'#f0883e','teal':'#39c5cf'}[c] || '#58a6ff';
}
function fmtNum(n){return n>=10000?n.toLocaleString():String(+(n).toFixed(n%1?1:0))}
function fmtTok(n){

function fmtReset(iso){

  const h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000);

  return S.prefs.resetTimeFormat==='absolute'?'resets '+absolute:S.prefs.resetTimeFormat==='both'?relative+' · '+absolute:relative;
}
// Mirrors usagestat_core::model::quota_exhaustion: when the window runs out at

function quotaExhaustion(m, now=Date.now()){
  const used=pct(m), reset=Date.parse(m.resetsAt||''), period=Number(m.periodDurationMs)||0;
  if(used==null||!(used>=5&&used<100)||!Number.isFinite(reset)||!period) return null;
  const untilReset=reset-now, elapsed=period-untilReset;
  if(untilReset<=0||elapsed<Math.max(period*0.05,600000)) return null;

function dailyDetail(rows,title='Recorded usage',extra={}){

  detail.parts=extra.parts||{heading:t.costComponentsKnown?'Tokens and cost by type':'Tokens by type',items:components.filter(([,tk,ck])=>t[tk]>0||(t.costComponentsKnown&&t[ck]>0)).reverse().map(([label,tk,ck,color])=>({color,label,sub:t.costComponentsKnown?short(t[tk]):'',value:t.costComponentsKnown?tipUsd(t[ck]):short(t[tk])}))};

function snapshotDetail(s,selected){

      rows.push([m.label+' · used',exact(m.used)],[m.label+' · limit',m.limit>0?exact(m.limit):'Unknown']);
      if(m.limit>0){
        rows.push(['Remaining',exact(Math.max(0,m.limit-m.used))],['Used / remaining',exactNumber(m.used/m.limit*100)+'% / '+exactNumber(Math.max(0,100-m.used/m.limit*100))+'%']);
        const pct=tipNumber(m.used/m.limit*100)+'% used';
        if(metrics.length===1)headline={value:pct,label:selected?'':m.label,sub:amount(Math.max(0,m.limit-m.used))+' left of '+amount(m.limit)};
        else summary.push([m.label,pct]);
      }else summary.push([m.label,amount(m.used)+' used']);
      if(m.resetsAt){rows.push(['Reset',new Date(m.resetsAt).toLocaleString()]);summary.push([metrics.length===1?'Resets':m.label+' resets',new Date(m.resetsAt).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})]);}
      if(m.periodDurationMs)rows.push(['Window',exactNumber(m.periodDurationMs/3600000)+' hours']);
      if(m.detail){rows.push(['Details',String(m.detail)]);summary.push(['Details',String(m.detail)]);}
    }else if(m.type==='text'||m.type==='badge'){rows.push([m.label,String(m.value||m.text||'Unknown')]);summary.push([m.label,String(m.value||m.text||'Unknown')]);}
  }
  if(s.pace&&S.prefs.showPace){rows.push(['Pace',stageLbl(s.pace.stage)],['Expected usage',exactNumber(s.pace.expectedUsedPercent)+'%'],['Actual usage',exactNumber(s.pace.actualUsedPercent)+'%'],['Quota ETA',fmtEta(s.pace.etaSeconds,s.pace.stage)]);summary.push(['Pace',stageLbl(s.pace.stage)+' · '+tipNumber(s.pace.actualUsedPercent)+'% vs '+tipNumber(s.pace.expectedUsedPercent)+'% expected'],['Quota ETA',fmtEta(s.pace.etaSeconds,s.pace.stage)]);}
  if(s.plan)summary.push(['Plan',s.plan]);
  const state=s.state||(snapshotHasError(s)?'Unavailable':'');
  return{title:selected?.label||providerName(s.providerId),headline,summary,rows,meta:[providerName(s.providerId),s.source||'unknown source',...(state&&state!=='ready'?[state]:[]),'observed '+(s.fetchedAt?new Date(s.fetchedAt).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}):'unknown')],note:snapshotHasError(s)?'This observation is unavailable. Retained measurements are historical and do not establish fresh quota.':'Quota is a provider observation, separate from token/cost accounting.'};
}
function historyDetail(record,title,parts){
  if(!record)return{title,rows:[],parts,note:'Only the selected series was recorded.'};
  const rows=[];
  for(const [label,key] of [['Primary quota','primaryPercent'],['Input tokens','inputTokens'],['Output tokens','outputTokens'],['Reasoning tokens','reasoningTokens'],['Cache reads','cacheReadTokens'],['Cache writes','cacheCreationTokens'],['Total tokens','totalTokens'],['Cost · USD','cost']]){
    if(record[key]!=null)rows.push([label,key==='cost'?tipUsd(record[key]):exactNumber(record[key])+(key==='primaryPercent'?'%':'')]);
  }
  for(const m of record.recordedProgress?.length?record.recordedProgress:record.progress||[]){rows.push([m.label,exactNumber(m.used)+' / '+(m.limit>0?exactNumber(m.limit):'Unknown')]);if(m.resetsAt)rows.push([m.label+' · reset',new Date(m.resetsAt).toLocaleString()]);}
  if(!record.usage)rows.push(['Tokens / cost',record.totalTokens==null&&record.cost==null?'Unknown':'Recorded fields shown above']);
  if(record.state)rows.push(['State',record.state]);if(record.source)rows.push(['Source',record.source]);
  return{title,rows,parts,meta:[record.source,record.state&&record.state!=='ready'?record.state:''].filter(Boolean),note:(record.state&&record.state!=='ready'?'Unavailable observation. Retained fields are historical. ':'')+(record.usage?'Saved local usage summed over this UTC period. Costs are API-rate estimates.':'Values belong to this recorded timestamp or bucket; grouped plots keep peak quota and the latest sampled counters. Missing fields stay unknown.')};
}
// Tooltip layout: title + headline, readable summary, one breakdown, provenance,
// then grouped detail rows (exact tokens, cents) behind a disclosure so nothing is lost.
const TIP={pinned:false,origin:null,exactOpen:false,onHide:null};
const DETAIL_TOTALS=new Set(['Total tokens','Cost · USD']);
function detailHtml(detail,pinned=TIP.pinned){
  const structured=!!(detail.headline||detail.summary?.length||detail.parts?.items?.length);
  const kv=([label,value])=>`<div class="tt-row"><span>${esc(label)}</span><b>${esc(value)}</b></div>`;
  let html=`<div class="tt-head"><div class="tt-date">${esc(detail.title)}</div>`;
  if(detail.headline)html+=`<div class="tt-hero"><b>${esc(detail.headline.value)}</b>${detail.headline.label?`<span>${esc(detail.headline.label)}</span>`:''}</div>${detail.headline.sub?`<div class="tt-sub">${esc(detail.headline.sub)}</div>`:''}`;
  html+=`</div>`;
  const parts=detail.parts;
  if(parts?.items?.length)html+=`<div class="tt-sec">${parts.heading?`<div class="tt-sec-h">${esc(parts.heading)}${parts.estimated?' <i>≈ estimated split</i>':''}</div>`:''}<div class="tt-parts">${parts.items.map(p=>`<div class="tt-part">${p.color?`<span class="u-dot" style="background:${esc(p.color)}"></span>`:'<span></span>'}<span class="tt-part-l">${esc(p.label)}</span><span class="tt-part-s">${esc(p.sub||'')}</span><b>${parts.estimated&&p.value?'≈':''}${esc(p.value)}</b></div>`).join('')}</div></div>`;
  if(detail.summary?.length)html+=`<div class="tt-sec tt-kv">${detail.summary.map(kv).join('')}</div>`;
  if(!structured&&detail.rows?.length)html+=`<div class="tt-sec tt-kv">${detail.rows.map(kv).join('')}</div>`;
  if(detail.meta?.length)html+=`<div class="tt-prov">${detail.meta.map(m=>`<span class="tt-prov-i">${esc(m)}</span>`).join('<span aria-hidden="true"> · </span>')}</div>`;
  // Hover stays to the numbers; explanatory notes appear once pinned.
  if(detail.note&&pinned)html+=`<p class="tt-meta">${esc(detail.note)}</p>`;
  if(structured&&detail.rows?.length){
    // Rows may name a group; groups render in first-seen order, each led by its total.
    const groups=new Map();for(const row of detail.rows){const g=row[2]||'';if(!groups.has(g))groups.set(g,[]);groups.get(g).push(row);}
    // Totals lead their group; text values (sources, dates) skip tabular figures
    // and long ones stack under their label instead of squeezing it.
    const row=([label,value])=>{const text=String(value),cls=['tt-row'];if(DETAIL_TOTALS.has(label))cls.push('tt-total');if(!/^[<≈]?\$?[\d,.]+(\+| · |%|$)/.test(text)){cls.push('tt-text');if(text.length>24)cls.push('tt-long');}return `<div class="${cls.join(' ')}"><span>${esc(label)}</span><b>${esc(text)}</b></div>`;};
    const body=[...groups].map(([name,rows])=>`<div class="tt-grp tt-kv">${name?`<div class="tt-grp-h">${esc(name)}</div>`:''}${rows.map(row).join('')}</div>`).join('');
    html+=`<details class="tt-exact"${TIP.exactOpen?' open':''}><summary>Details <span>· ${detail.rows.length} fields</span></summary>${body}</details>`;
  }
  return html;
}
function tipFooter(){return TIP.pinned?`<div class="tt-foot"><span>Pinned · Esc closes</span><button type="button" class="tt-close" aria-label="Close details">Close</button></div>`:'';}
function positionTooltip(x,y){
  const tip=document.getElementById('tip'),pad=8,gap=16,vw=innerWidth,vh=innerHeight;
  tip.style.maxHeight='';const w=tip.offsetWidth;let h=tip.offsetHeight;
  if(h>vh-pad*2){tip.style.maxHeight=(vh-pad*2)+'px';h=tip.offsetHeight;}
  const clampX=v=>Math.max(pad,Math.min(v,vw-w-pad)),clampY=v=>Math.max(pad,Math.min(v,vh-h-pad));
  let left,top;
  // Beside the pointer keeps the hovered mark and its neighbours visible.
  if(x+gap+w<=vw-pad||x-gap-w>=pad){left=x+gap+w<=vw-pad?x+gap:x-gap-w;top=clampY(y-Math.min(48,h/3));}
  // Narrow screens: above or below, whichever side has more room.
  else{left=clampX(x-w/2);const below=vh-pad-(y+gap),above=y-gap-pad;
    if(h<=below||below>=above){if(h>below&&below>=160){tip.style.maxHeight=below+'px';h=tip.offsetHeight;}top=clampY(y+gap);}
    else{if(h>above&&above>=160){tip.style.maxHeight=above+'px';h=tip.offsetHeight;}top=clampY(y-gap-h);}}
  tip.style.left=Math.round(left)+'px';tip.style.top=Math.round(top)+'px';
}
function showTipHtml(html,x,y,{pin=false,origin=null,onHide=null,label=''}={}){
  if(TIP.pinned&&!pin)return false;
  // Closing a pinned detail returns focus to its source without reopening it.
  if(TIP.skipFocus){const skip=TIP.skipFocus===origin;TIP.skipFocus=null;if(skip&&!pin)return false;}
  const tip=document.getElementById('tip');
  if(TIP.onHide&&TIP.onHide!==onHide){const done=TIP.onHide;TIP.onHide=null;done();}
  TIP.pinned=pin;TIP.origin=origin||TIP.origin;TIP.onHide=onHide;
  tip.innerHTML=html+tipFooter();tip.dataset.pinned=pin?'true':'false';
  tip.setAttribute('role',pin?'dialog':'tooltip');if(pin&&label)tip.setAttribute('aria-label',label+' details');else tip.removeAttribute('aria-label');
  tip.style.display='block';positionTooltip(x,y);
  tip.querySelector('.tt-exact')?.addEventListener('toggle',event=>{TIP.exactOpen=event.target.open;if(TIP.lastPoint)positionTooltip(TIP.lastPoint.x,TIP.lastPoint.y);});
  tip.querySelector('.tt-close')?.addEventListener('click',()=>hideDetail(true,true));
  TIP.lastPoint={x,y};return true;
}
function showDetail(detail,x,y,opts={}){return showTipHtml(detailHtml(detail,!!opts.pin),x,y,{label:detail.title,...opts});}
function hideDetail(force=false,restoreFocus=false){
  if(TIP.pinned&&!force)return;
  const tip=document.getElementById('tip'),origin=TIP.origin,hadFocus=tip.contains?.(document.activeElement);
  tip.style.display='none';tip.dataset.pinned='false';TIP.pinned=false;TIP.origin=null;
  if(TIP.onHide){const done=TIP.onHide;TIP.onHide=null;done();}
  if((restoreFocus||hadFocus)&&origin?.isConnected&&typeof origin.focus==='function'){TIP.skipFocus=origin;origin.focus({preventScroll:true});if(TIP.skipFocus===origin)setTimeout(()=>{if(TIP.skipFocus===origin)TIP.skipFocus=null;},0);}
}
function pinTipFocus(){const tip=document.getElementById('tip');if(TIP.pinned&&typeof tip.focus==='function')tip.focus({preventScroll:true});}
// Provider-specific readouts (credits, daily totals, trends) are not
// configurable components; keep them with the quota bars they explain rather
// than letting order 0 lift them above the primary quota.
function applyCardComponents(root){
  const order=S.prefs.components;
  root.querySelectorAll('[data-card-component]').forEach(el=>{const key=el.dataset.cardComponent;el.hidden=!order.includes(key);el.style.order=order.indexOf(key);});
  const readoutOrder=Math.max(0,order.indexOf('quota'));
  root.querySelectorAll('.card-body>.metric:not([data-card-component])').forEach(el=>{el.style.order=readoutOrder;});
}
function wireChartKeyboard(svg,show,count){
  svg.setAttribute('tabindex','0');svg.setAttribute('aria-describedby','tip');svg.setAttribute('aria-label','Usage chart. Arrow keys inspect recorded points; Enter pins details; Escape closes details.');
  let index=Math.max(0,count-1);
  const inspect=(pin=false)=>{const box=svg.getBoundingClientRect();show(index,{clientX:box.left+box.width*(count>1?index/(count-1):.5),clientY:box.top+box.height/2},pin);};
  svg.addEventListener('focus',()=>inspect());
  svg.addEventListener('keydown',event=>{if(event.key==='Escape'){hideDetail(true);return;}if(event.key==='Enter'||event.key===' '){event.preventDefault();inspect(true);return;}if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();index=event.key==='Home'?0:event.key==='End'?count-1:Math.max(0,Math.min(count-1,index+(event.key==='ArrowRight'?1:-1)));hideDetail(true);inspect();});
  svg.addEventListener('blur',event=>{if(!event.relatedTarget?.closest?.('#tip'))hideDetail();});
}

function arcSvg(p,color,detail){
  const r=18,c=+(2*Math.PI*r).toFixed(3),off=+(c*(1-Math.min(p,100)/100)).toFixed(3);
  return `<div class="arc" data-card-component="percent" ${detail?chartDetailAttribute(detail):''}><svg width="48" height="48" viewBox="0 0 52 52"><circle class="arc-bg" cx="26" cy="26" r="${r}"/><circle class="arc-fill" cx="26" cy="26" r="${r}" stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${off}"/></svg><div class="arc-num">${Math.round(p)}%</div></div>`;
}

function animateBarsAndArcs(root, animate=true){
  const paint=()=>{
    root.querySelectorAll('.bar[data-w],.dm-bar[data-w]').forEach(el=>{if(!animate)el.style.transition='none';el.style.width=el.dataset.w;});
    root.querySelectorAll('.arc-fill[data-off]').forEach(el=>{
      el.style.transition=animate?'stroke-dashoffset .9s cubic-bezier(.4,0,.2,1)':'none';
      el.style.strokeDashoffset=el.dataset.off;
    });
  };
  if(animate&&typeof requestAnimationFrame==='function')requestAnimationFrame(()=>requestAnimationFrame(paint));else paint();
}
function animateCompareBars(root, animate=true){
  const paint=()=>root.querySelectorAll('.compare-fill[data-w]').forEach(el=>{
    el.style.transition=animate?'width .9s cubic-bezier(.4,0,.2,1)':'none';
    el.style.width=el.dataset.w;
  });
  if(animate&&typeof requestAnimationFrame==='function')requestAnimationFrame(()=>requestAnimationFrame(paint));else paint();
}

// ── init ──────────────────────────────────────────────────────────────────────
applyAppearance();
if(typeof document.addEventListener==='function'){
  // Hover/focus previews a detail; click, tap or Enter pins it so the exact
  // values disclosure can be reached. Escape or an outside click closes it.
  const inspect=(event,pin=false)=>{const target=event.target?.closest?.('[data-chart-detail]');if(!target)return;try{const box=target.getBoundingClientRect(),fromPointer=event.clientX!=null&&event.detail!==0;const x=fromPointer?event.clientX:box.right,y=fromPointer?event.clientY:box.top+box.height/2;showDetail(JSON.parse(target.dataset.chartDetail),x,y,{pin,origin:target});if(pin)pinTipFocus();}catch{hideDetail(true);}};
  document.addEventListener('mousemove',event=>inspect(event));
  document.addEventListener('focusin',event=>{if(event.target?.closest?.('#tip'))return;if(TIP.pinned&&event.target!==TIP.origin)hideDetail(true);inspect(event);});
  // Background refresh re-selects tabs with element.click(); only a real
  // outside click/tap closes a pinned detail.
  document.addEventListener('click',event=>{if(event.target?.closest?.('#tip'))return;if(!event.target?.closest?.('[data-chart-detail],[aria-describedby="tip"]')){if(event.isTrusted!==false)hideDetail(true);}else inspect(event,true);});
  document.getElementById('tip').addEventListener('mouseleave',event=>{if(!event.relatedTarget?.closest?.('[data-chart-detail],[aria-describedby="tip"]'))hideDetail();});
  document.addEventListener('mouseout',event=>{if(event.target?.closest?.('[data-chart-detail]')&&!event.relatedTarget?.closest?.('[data-chart-detail],#tip'))hideDetail();});
  document.addEventListener('focusout',event=>{if(event.target?.closest?.('[data-chart-detail]')&&!event.relatedTarget?.closest?.('#tip'))hideDetail();});
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&document.getElementById('tip').style.display==='block'){hideDetail(true,true);return;}
    if((event.key==='Enter'||event.key===' ')&&event.target?.matches?.('[data-chart-detail]')){event.preventDefault();inspect(event,true);return;}
    if(event.key==='Escape'){hideDetail(true);return;}
    if(event.ctrlKey||event.metaKey||event.altKey||event.target?.closest?.('input,textarea,select,[contenteditable="true"]'))return;
    const shortcuts=S.prefs.shortcuts,key=event.key.toLowerCase();if(!key)return;
    if(key===shortcuts.overview)switchTab('overview');else if(key===shortcuts.settings)switchTab('settings');else if(key===shortcuts.refresh)doRefresh();
    else if(key===shortcuts.previous||key===shortcuts.next)switchProvider(key===shortcuts.next?1:-1);else return;
    event.preventDefault();
  });
  document.getElementById('tabs').addEventListener('wheel',event=>{if(!S.prefs.scrollToSwitch||!event.target?.closest?.('.tab[data-tab]'))return;event.preventDefault();switchProvider(event.deltaY+event.deltaX>0?1:-1);},{passive:false});
}
function switchProvider(direction){const ids=UsageDashboardSettings.order(S.providers,S.prefs,p=>p.id).filter(p=>providerSetting(p.id).visible).map(p=>p.id);if(!ids.length)return;const i=ids.indexOf(S.active);switchTab(ids[(i+direction+ids.length)%ids.length]);}
if(typeof matchMedia==='function')matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>{if(S.prefs.theme==='system')applyAppearance();});
if(typeof window!=='undefined')window.addEventListener('storage',event=>{
  if(event.key!==UsageDashboardSettings.STORAGE_KEY)return;
  try{S.prefs=cleanPreferences(event.newValue?JSON.parse(event.newValue):{});applyAppearance();quotaDisplay.value=S.prefs.quotaDisplay;buildTabs();applyTabVisibility();renderActive();startTick();}catch{}
});
// Provider charts are drawn at their container's width so axis text keeps its
// size. Redraw them from their saved view state after a real width change.
let chartViewportWidth=typeof innerWidth==='number'?innerWidth:0;
if(typeof window!=='undefined')window.addEventListener('resize',debounce(()=>{
  if(Math.abs(innerWidth-chartViewportWidth)<40)return;
  chartViewportWidth=innerWidth;
  const id=S.active;
  if(STATIC_TABS.includes(id))return;
  const historyBox=document.getElementById(`history-box-${id}`);
  if(historyBox?._historyState)drawHistoryView(id,historyBox,historyBox._historyState);
  const cost=document.getElementById(`cost-box-${id}`)?._costState;
  if(cost)updateCostView(id,cost);
},200));
// A provider hash is accepted before the first load; load() falls back to
// Overview if that provider turns out not to exist.
function openDashboardHash(){
  if(typeof location==='undefined')return;
  let tab=location.hash.slice(1);
  try{tab=decodeURIComponent(tab);}catch{return;}
  if(STATIC_TABS.includes(tab)||(tab&&!S.loadedAt)||S.providers.some(p=>p.id===tab))switchTab(tab);
}
if(typeof window!=='undefined')window.addEventListener('hashchange',openDashboardHash);
openDashboardHash();
load();
</script>
