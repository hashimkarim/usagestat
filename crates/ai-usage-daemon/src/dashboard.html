      html+=`<div class="u-chart" id="u-chart">${trendsChart(chartModel.buckets, metric, layers)}</div>${chartGroup!==options.group?`<div class="small-note">Charted by ${chartGroup} for readability · the breakdown below stays by ${options.group}.</div>`:''}</div>`;
      html+=`</div>`;

      const input = current.inputTokens, cached = current.cacheReadTokens, write = current.cacheCreationTokens;
      const promptTokens = input + cached + write;
      html+=`<div class="u-section"><div class="u-h">Totals</div><div class="u-totals">`;
      html+=usageTotal('Processed tokens', recordedTokens(current));
      // Billing/ccusage rows lack these; fall back to the separate local-log source.
      const local = (!current.sessionsKnown || !current.cacheSavingsKnown) ? localLogExtras(model) : null;
      if(current.sessionsKnown) html+=usageTotal('Session-days', fmtNum(current.sessions), 'one per session per active day');
      else if(local?.sessionDays) html+=usageTotal('Session-days', fmtNum(local.sessions)+(local.sessionDays<local.days?'+':''), `local logs · ${local.sessionDays}/${local.days} provider-days`);
      if(current.cacheSavingsKnown) html+=usageTotal('Cache read savings', fmtUsd(current.cacheSavingsUsd), 'estimated discount on cached input');
      else if(local?.savingsDays) html+=usageTotal('Cache read savings', fmtUsd(local.savings)+(local.savingsDays<local.days?'+':''), `local logs at API rates · ${local.savingsDays}/${local.days} provider-days`);
      html+=usageTotal('Cached input', fmtTok(cached));
      html+=usageTotal('Uncached input', fmtTok(input));
      if(write>0) html+=usageTotal('Cache writes', fmtTok(write));
      html+=usageTotal('Output', fmtTok(current.outputTokens), current.reasoningOutputTokens>0?`${fmtTok(current.reasoningOutputTokens)} reasoning`:'');
      html+=usageTotal('Cache hit rate', promptTokens>0 ? (cached/promptTokens*100).toFixed(1)+'%' : '—', 'of input tokens');
      html+=usageTotal('Cost', recordedCost(current), current.activeDays?`${recordedCost({cost:current.cost/current.activeDays,costKnown:current.costKnown})} per active day`:'');
      html+=`</div></div>`;
    }
    if(model.providers.length){
      const breakdown = options.breakdown;
      html+=`<div class="u-section"><div class="u-sechead"><span class="u-h">Breakdown</span>${segmented('breakdown', breakdown, [['provider','Provider'],['day',options.group==='day'?'Day':options.group==='week'?'Week':'Month'],['model','Model'],['sources','Sources']])}</div>`;
      if(breakdown==='day') html+=dayBreakdown(model, metric);
      else if(breakdown==='model') html+=modelBreakdown(model);
      else if(breakdown==='sources') html+=sourcesBreakdown(model);
      else html+=providerBreakdown(model);
      html+=`</div>`;
    }
  }
  panel.innerHTML = html + '</div>';
  panel.onclick = e=>{
    const btn = e.target?.closest?.('[data-set]');
    if(btn){
      const next = { ...options, [btn.dataset.set]:btn.dataset.value };
      if(btn.dataset.set==='range' && next.range==='custom' && model.range){ next.start = model.range.start; next.end = model.range.end; }
      S.prefs.trends = next; savePrefs(); renderTrends();
    } else if(e.target?.id==='history-expand'){
      S.showAllHistory = !S.showAllHistory; renderTrends();
    }
  };
  for(const field of ['provider','start','end','group']){
    panel.querySelector('#trends-'+field)?.addEventListener('change', e=>{
      S.prefs.trends = { ...options, [field]:e.target.value };
      savePrefs();
      renderTrends();
    });
  }
  panel.querySelector('#trends-export')?.addEventListener('click',()=>{
    if(model.rows?.length) exportDailyCsv(model.rows, `usagestat-history-${model.range.start}-${model.range.end}.csv`);
  });
  wireUsageChart(panel.querySelector('#u-chart'));
}

function chartGrouping(days, group){
  const order = ['day','week','month'], perBucket = { day:1, week:7, month:30.4 };
  let i = order.indexOf(group);
  while(i < order.length-1 && days/perBucket[order[i]] > 45) i++;
  return order[Math.max(0,i)];
}

// Local-log extras over the headline's provider-days, with coverage so a
// partial sum is never shown as complete.
function localLogExtras(model){
  const ids = model.providers.filter(p=>p.current.rows).map(p=>p.id);
  if(typeof fetch==='function') ensureModelReports(ids);
  const local = new Map();
  // Only transcript-derived rows count as local logs; other sources are not mixed in.
  for(const id of ids) for(const r of S.modelReports?.[id]?.rows || []) if(costSourceLabel(r)==='local estimate') local.set(id+'\u0000'+r.date, r);
  const days = new Set(model.rows.map(r=>r.providerId.toLowerCase()+'\u0000'+r.date));
  const out = { days:days.size, sessions:0, sessionDays:0, savings:0, savingsDays:0 };
  for(const key of days){
    const r = local.get(key);
    if(r?.sessions!=null){ out.sessions += r.sessions; out.sessionDays++; }
    if(r?.cacheSavingsUsd!=null){ out.savings += r.cacheSavingsUsd; out.savingsDays++; }
  }
  return out;
}

function costSourceLabel(r){
  const src = String(r.costSource||r.source||'').toLowerCase();
  if(src.includes('estimate') || src.includes('transcript')) return 'local estimate';
  if(src.includes('ccusage')) return 'ccusage';
  if(src.includes('billing')) return 'billing';
  return src || 'unknown';
}

function usageTotal(label, value, note){
  return `<div class="u-total"><div class="u-tlabel">${esc(label)}</div><div class="u-tvalue">${esc(value)}</div>${note?`<div class="u-tnote">${esc(note)}</div>`:''}</div>`;
}

// Per-provider series aligned to the summary buckets, smallest first so thin
// series stay visible at the bottom of the stack.
function usageLayers(model, metric){
  const index = new Map();
  model.buckets.forEach((b,i)=>{ for(let d=parseDateOnly(b.start); dateKey(d)<=b.end; d=addDays(d,1)) index.set(dateKey(d), i); });
  const layers = model.providers.filter(p=>p.current.rows).map((p,i)=>({ id:p.id, name:p.displayName, provider:p, color:seriesColor(p.id,i), values:model.buckets.map(()=>0), known:model.buckets.map(()=>true) }));
  const byId = new Map(layers.map(l=>[l.id,l])), flag = knownFlag(metric);
  for(const r of model.rows){
    const layer = byId.get(r.providerId.toLowerCase()), i = index.get(r.date);
    if(layer && i!=null){ layer.values[i] += metricOf(r, metric); layer.known[i] &&= r[flag] !== false; }
  }
  const total = layer => layer.values.reduce((a,v)=>a+v,0);
  return layers.sort((a,b)=>total(a)-total(b));
}

function providerBreakdown(model){
  const { current } = model;
  let html = `<div class="trends-table-wrap"><table class="u-table"><thead><tr><th>Provider</th><th>Cost</th><th>Share</th><th>Tokens</th><th>Cached input</th><th>Output</th><th>Token change</th><th>Days recorded</th></tr></thead><tbody>`;
  const rows = model.providers.slice().sort((a,b)=>b.current.cost-a.current.cost || b.current.totalTokens-a.current.totalTokens);
  rows.forEach((p,i)=>{
    const c = p.current;
    html+=`<tr><td><span class="u-cell-name"><span class="u-dot" style="background:${seriesColor(p.id,i)}"></span>${providerIcon(p.id)}${esc(p.displayName)}</span></td><td>${c.rows?recordedCost(c):'—'}</td><td>${!c.rows?'—':metricShare(c,current,'cost')!=='—'?metricShare(c,current,'cost'):pricedShare(c,current)?`<span title="Share of priced cost; some usage is unpriced">≈${pricedShare(c,current)}</span>`:'—'}</td><td>${c.rows?recordedTokens(c):'—'}</td><td>${c.rows?fmtTok(c.cacheReadTokens):'—'}</td><td>${c.rows?fmtTok(c.outputTokens):'—'}</td><td>${esc(trendChange(c,p.previous,'totalTokens'))}</td><td>${c.recordedDays}/${model.range.days}</td></tr>`;
  });
  return html+`</tbody></table></div>`;
}

function dayBreakdown(model, metric){
  const top = model.providers.filter(p=>p.current.rows).slice(0,5);
  const cols = new Map(top.map(p=>[p.id,p]));
  const buckets = S.showAllHistory ? model.buckets : model.buckets.slice(-30);
  let html = `<div class="trends-table-wrap"><table class="u-table"><thead><tr><th>${model.buckets[0]?.start===model.buckets[0]?.end?'Day':'Dates'}</th>${top.map(p=>`<th>${esc(p.displayName)}</th>`).join('')}${model.providers.length>top.length?'<th>Other</th>':''}<th>Total</th><th>${metric==='cost'?'Tokens':'Cost'}</th><th>Cached</th></tr></thead><tbody>`;
  for(const b of buckets.slice().reverse()){
    const per = new Map(), other = { cost:0, totalTokens:0, cacheReadTokens:0, outputTokens:0, costKnown:true, tokensKnown:true };
    for(const r of model.rows){
      if(r.date<b.start || r.date>b.end) continue;
      const id = r.providerId.toLowerCase();
      const acc = cols.has(id) ? (per.get(id) || per.set(id,{ cost:0,totalTokens:0,cacheReadTokens:0,outputTokens:0,costKnown:true,tokensKnown:true }).get(id)) : other;
      acc.cost += rowCost(r); acc.totalTokens += rowTotalTokens(r); acc.cacheReadTokens += rowCacheRead(r); acc.outputTokens += rowOutput(r);
      acc.costKnown &&= r.costKnown !== false; acc.tokensKnown &&= r.tokensKnown !== false;
    }
    const label = b.start===b.end ? fmtDay(b.start) : `${fmtDay(b.start)} → ${fmtDay(b.end)}`;
    if(!b.rows){
      html+=`<tr class="u-norecord"><td>${label}</td>${top.map(()=>'<td>—</td>').join('')}${model.providers.length>top.length?'<td>—</td>':''}<td>No record</td><td>—</td><td>—</td></tr>`;
      continue;
    }
    html+=`<tr><td>${label}</td>${top.map(p=>`<td>${per.has(p.id)?esc(recordedMetric(per.get(p.id),metric)):'—'}</td>`).join('')}${model.providers.length>top.length?`<td>${esc(recordedMetric(other,metric))}</td>`:''}<td class="u-strong">${esc(recordedMetric(b,metric))}</td><td>${metric==='cost'?recordedTokens(b):recordedCost(b)}</td><td>${fmtTok(b.cacheReadTokens)}</td></tr>`;
  }
  html+=`</tbody></table></div>`;
  if(model.buckets.length>30) html+=`<button class="action-btn u-more" type="button" id="history-expand">${S.showAllHistory?'Show latest 30':'Show all '+model.buckets.length}</button>`;
  return html;
}

function fmtDay(key){
  const d = parseDateOnly(key);
  return d ? d.toLocaleDateString('en-US',{ month:'short', day:'numeric', timeZone:'UTC' }) : key;
}

// Fetch compact saved daily model rows; never download session reports here.
function ensureModelReports(ids){
  S.modelReports ||= {};
  const pending = [];
  for(const id of ids){
    const cached = S.modelReports[id];
    if(cached && (cached.status==='loading' || Date.now()-cached.at < 30000)){ if(cached.promise) pending.push(cached.promise); continue; }
    S.modelReports[id] = { status:'loading', at:Date.now(), rows:cached?.rows || [] };
    S.modelReports[id].promise = fetch(`/v1/history/models/${encodeURIComponent(id)}`).then(r=>r.ok?r.json():Promise.reject())
      .then(report=>{ S.modelReports[id] = { status:report?.error?'error':'ok', at:Date.now(), rows:normalizeDailyRows(report) }; })
      .catch(()=>{ S.modelReports[id] = { status:'error', at:Date.now(), rows:[] }; })
      .finally(()=>{ if(S.active==='history') renderTrends(); });
    pending.push(S.modelReports[id].promise);
  }
  return Promise.all(pending);
}

// Per provider-day comparison of every retained source (e.g. ccusage vs local
// API-rate estimate). Loaded on demand; differences only when both are priced.
function ensureSourceReport(){
  const cur = S.sourceReport;
  if(typeof fetch!=='function' || (cur && (cur.status==='loading' || Date.now()-cur.at < 30000))) return;
  S.sourceReport = { status:'loading', at:Date.now(), rows:cur?.rows || [] };
  fetch('/v1/history/daily?includeSources=true').then(r=>r.ok?r.json():Promise.reject())
    .then(d=>{ S.sourceReport = { status:'ok', at:Date.now(), rows:(Array.isArray(d)?d:d?.daily||[]).filter(r=>Array.isArray(r.sourceRows) && r.sourceRows.length>1) }; })
    .catch(()=>{ S.sourceReport = { status:'error', at:Date.now(), rows:[] }; })
    .finally(()=>{ if(S.active==='history') renderTrends(); });
}

function sourcesBreakdown(model){
  ensureSourceReport();
  const report = S.sourceReport || { status:'loading', rows:[] };
  const provider = trendsOptions().provider.toLowerCase();
  const days = report.rows.filter(r=>r.date>=model.range.start && r.date<=model.range.end && (!provider || String(r.providerId).toLowerCase()===provider))
    .sort((a,b)=>b.date.localeCompare(a.date) || String(a.providerId).localeCompare(String(b.providerId)));
  if(!days.length){
    return `<div class="trends-empty">${report.status==='loading'?'Loading source comparison…':report.status==='error'?'Could not load source comparison.':'No provider-day in this range has more than one source.'}</div>`;
  }
  const labels = [...new Set(days.flatMap(r=>r.sourceRows.map(costSourceLabel)))].sort();
  // Totals over days where every listed source has a known cost.
  const both = days.filter(r=>labels.every(l=>r.sourceRows.some(x=>costSourceLabel(x)===l && x.costKnown!==false)));
  const sumFor = l=>both.reduce((a,r)=>a+rowCost(r.sourceRows.find(x=>costSourceLabel(x)===l)),0);
  let html = both.length && labels.length===2 ? `<div class="u-range" style="margin:0 0 12px">On ${both.length} provider-day${both.length===1?'':'s'} priced by both: ${labels.map(l=>`${esc(l)} ${fmtUsd(sumFor(l))}`).join(' vs ')} · difference ${fmtUsd(sumFor(labels[1])-sumFor(labels[0]))} (${labels[1]} − ${labels[0]})</div>` : '';
  html += `<div class="trends-table-wrap"><table class="u-table u-sources"><thead><tr><th>Day</th><th>Provider</th>${labels.map(l=>`<th>${esc(l)} cost</th><th>${esc(l)} tokens</th>`).join('')}${labels.length===2?'<th>Cost difference</th>':''}</tr></thead><tbody>`;
  for(const r of days.slice(0, S.showAllHistory?days.length:60)){
    const by = new Map(r.sourceRows.map(x=>[costSourceLabel(x), x]));
    html+=`<tr><td>${esc(fmtDay(r.date))}</td><td><span class="u-cell-name">${providerIcon(String(r.providerId))}${esc(providerDisplayName(r.providerId, r.displayName))}</span></td>`;
    for(const l of labels){
      const x = by.get(l);
      const mark = x?.selected ? ' <span class="u-sel" title="Used in the headline">●</span>' : '';
      // Today's sources are snapshots taken at different times; show when.
      const asOf = x?.ingestedAt && r.date===dateKey(todayUtcDate()) ? `<div class="u-asof">as of ${esc(new Date(x.ingestedAt).toISOString().slice(11,16))} UTC</div>` : '';
      html+= x ? `<td>${esc(recordedCost({cost:rowCost(x),costKnown:x.costKnown!==false}))}${mark}${asOf}</td><td>${esc(recordedTokens({totalTokens:rowTotalTokens(x),tokensKnown:x.tokensKnown!==false}))}</td>` : '<td>—</td><td>—</td>';
    }
    if(labels.length===2){
      const a = by.get(labels[0]), b = by.get(labels[1]);
      const diff = a && b && a.costKnown!==false && b.costKnown!==false ? rowCost(b)-rowCost(a) : null;
      html+=`<td>${diff==null ? '—' : Math.abs(diff)<0.005 ? '$0.00' : esc((diff>0?'+':'−')+fmtUsd(Math.abs(diff)))}</td>`;
    }
    html+=`</tr>`;
  }
  html+=`</tbody></table></div>${days.length>60?`<button class="action-btn u-more" type="button" id="history-expand">${S.showAllHistory?'Show latest 60':'Show all '+days.length}</button>`:''}`;
  return html+`<div class="small-note">● marks the source used in the headline totals. Sources can cover different sessions, so a difference is not necessarily an error; ccusage and local estimates are API-rate estimates, not invoices.</div>`;
}

function modelBreakdown(model){
  const ids = model.providers.filter(p=>p.current.rows).map(p=>p.id);
  ensureModelReports(ids);
  const reports = ids.map(id=>[id, S.modelReports[id]]);
  const loading = reports.some(([,r])=>r?.status==='loading');
  const failed = reports.some(([,r])=>r?.status==='error');
  const daily = new Map();
  for(const [id, report] of reports){
    for(const r of report?.rows || []){
      if(r.date>=model.range.start && r.date<=model.range.end) daily.set(id+'\u0000'+r.date, r);
    }
  }
  // Prefer the headline's source when it already has model detail.
  for(const r of model.rows){
    if(Object.keys(r.models||{}).length) daily.set(r.providerId.toLowerCase()+'\u0000'+r.date, r);
  }
  const map = new Map();
  for(const r of daily.values()){
    const entries = Object.entries(r.models||{});
    for(const [name, m] of entries){
      const id = r.providerId.toLowerCase(), key = id+'\u0000'+name;
      const cur = map.get(key) || { id, name, cost:0, tokens:0, cached:0, sessions:0, costKnown:true, sessionsKnown:true };
      cur.cost += rowCost(m); cur.tokens += rowTotalTokens(m); cur.cached += rowCacheRead(m);
      cur.costKnown &&= m.costKnown === true;
      cur.sessionsKnown &&= Number.isSafeInteger(m.sessions);
      cur.sessions += Number.isSafeInteger(m.sessions) ? m.sessions : 0;
      map.set(key, cur);
    }
  }
  const rows = [...map.values()].sort((a,b)=>b.cost-a.cost || b.tokens-a.tokens);
  if(!rows.length){
    return `<div class="trends-empty">${loading?'Loading daily model history…':failed?'Could not load daily model history.':'No saved per-model daily data in this range. Local history is prepared in the background; older records may have no model detail.'}</div>`;
  }
  const totalCost = rows.reduce((a,r)=>a+r.cost,0), allPriced = rows.every(r=>r.costKnown);
  // Shares are of priced model cost; unpriced models show a dash, as in T3.
  const pricedCost = rows.filter(r=>r.costKnown).reduce((a,r)=>a+r.cost,0);
  const dailyCost = model.providers.filter(p=>ids.includes(p.id)).reduce((a,p)=>a+p.current.cost,0);
  const drift = Math.abs(totalCost-dailyCost) > Math.max(0.01, dailyCost*0.01);
  const missing = model.rows.filter(r=>!daily.get(r.providerId.toLowerCase()+'\u0000'+r.date)?.models || !Object.keys(daily.get(r.providerId.toLowerCase()+'\u0000'+r.date).models).length).length;
  const pricingDates = [...new Set([...daily.values()].map(r=>r.pricingAsOf).filter(Boolean))].sort();
  let html = `<div class="trends-table-wrap"><table class="u-table"><thead><tr><th>Model</th><th>Cost</th><th>Share of priced cost</th><th>Tokens</th><th>Cached input</th><th>Session-days</th></tr></thead><tbody>`;
  for(const r of rows.slice(0,40)){
    html+=`<tr><td><span class="u-cell-name">${providerIcon(r.id)}${esc(r.name)}</span></td><td>${recordedCost(r)}</td><td>${r.costKnown?shareText(r.cost,pricedCost):'—'}</td><td>${fmtTok(r.tokens)}</td><td>${fmtTok(r.cached)}</td><td>${r.sessionsKnown?r.sessions.toLocaleString('en-US'):'—'}</td></tr>`;
  }
  html+=`</tbody></table></div><div class="small-note">${loading?'Updating daily model history… ':''}${failed?'Some model history could not be loaded. ':''}Usage is assigned to its actual UTC day. Session-days count a session once on each active day.${missing?` Model detail is missing for ${missing} provider-day${missing===1?'':'s'}.`:''}${drift?` Model costs total ${recordedCost({cost:totalCost,costKnown:allPriced})}; saved daily totals are ${recordedCost(model.current)}. Sources or coverage differ.`:''} Local-log costs use standard API-rate estimates, not subscription charges.${pricingDates.length?` Rates dated ${esc(pricingDates.join(', '))} also apply to historical usage.`:''}</div>`;
  return html;
}

// Top of a four-step axis whose step is a round number (e.g. $600 → $2.4K).
function niceMax(v){
  if(!(v>0)) return 1;
  const raw = v/4, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw/p;
  return 4*p*[1,1.5,2,2.5,3,4,5,6,8,10].find(c=>n<=c+1e-9);
}

// Monotone cubic (d3 curveMonotoneX): smooth without overshooting below zero.
function monotonePath(pts){
  const n = pts.length;
  if(n===1) return `L${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  const s = [], t = [];
  for(let i=0;i<n-1;i++) s.push((pts[i+1][1]-pts[i][1])/((pts[i+1][0]-pts[i][0])||1));
  for(let i=1;i<n-1;i++){
    const h0 = pts[i][0]-pts[i-1][0], h1 = pts[i+1][0]-pts[i][0], p = (s[i-1]*h1+s[i]*h0)/(h0+h1);
    t[i] = (Math.sign(s[i-1])+Math.sign(s[i]))*Math.min(Math.abs(s[i-1]),Math.abs(s[i]),0.5*Math.abs(p)) || 0;
  }
  t[0] = n>2 ? (3*s[0]-t[1])/2 : s[0];
  t[n-1] = n>2 ? (3*s[n-2]-t[n-2])/2 : s[0];
  let d = `L${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<n-1;i++){
    const h = (pts[i+1][0]-pts[i][0])/3;
    d += `C${(pts[i][0]+h).toFixed(1)},${(pts[i][1]+t[i]*h).toFixed(1)} ${(pts[i+1][0]-h).toFixed(1)},${(pts[i+1][1]-t[i+1]*h).toFixed(1)} ${pts[i+1][0].toFixed(1)},${pts[i+1][1].toFixed(1)}`;
  }
  return d;
}

function trendsChart(buckets, metric, layers){
  // Keep large imports readable without dropping any totals from the chart.
  const stride = Math.max(1,Math.ceil(buckets.length/180));
  const flag = knownFlag(metric);
  const series = layers?.length ? layers : [{ id:'all', name:'All', color:'var(--blue)', values:buckets.map(b=>metricOf(b,metric)), known:buckets.map(b=>b[flag]!==false) }];
  const points = [];
  for(let i=0;i<buckets.length;i+=stride){
    const group = buckets.slice(i,i+stride);
    points.push({ start:group[0].start, end:group[group.length-1].end,
      value:sum(group,metric), days:sum(group,'days'), recordedDays:sum(group,'recordedDays'),
      parts:series.map(l=>l.values.slice(i,i+stride).reduce((a,v)=>a+v,0)),
      partsKnown:series.map(l=>(l.known||[]).slice(i,i+stride).every(k=>k!==false)),
      known:group.every(b=>b[flag]!==false) });
  }
  const W=960,H=300,L=64,R=14,T=14,B=30,CW=W-L-R,CH=H-T-B;
  const max = niceMax(Math.max(0,...points.flatMap(p=>p.parts)));
  const x = i => points.length===1 ? L+CW/2 : L+CW*i/(points.length-1);
  const y = v => T+CH*(1-v/max);
  const fmt = v=>metric==='cost'?'$'+v.toFixed(2):fmtTok(v);
  const axis = v=>metric==='cost'?(v>=1000?'$'+(+(v/1000).toFixed(2))+'K':'$'+(v<10&&v%1?v.toFixed(2):v.toFixed(0))):v>=1e9?+(v/1e9).toFixed(2)+'B':v>=1e6?+(v/1e6).toFixed(1)+'M':v>=1e3?+(v/1e3).toFixed(1)+'K':String(+v.toFixed(1));
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(USAGE_METRICS[metric]?.title||'Usage')} by provider; days without a saved record plot as zero" data-l="${L}" data-cw="${CW}" data-n="${points.length}"><title>Recorded ${metric==='cost'?'cost':'usage'} by period. Totals are also available in the breakdown table.</title>`;
  for(let i=0;i<=4;i++){
    const v = max*i/4, yy = y(v);
    svg+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--bd)"${i?'':' stroke-width="1.5"'}/><text x="${L-10}" y="${yy+4}" text-anchor="end" fill="var(--su)" font-size="11">${esc(axis(v))}</text>`;
  }
  svg+=`<defs>${series.map((l,li)=>`<linearGradient id="u-fade-${li}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${l.color}" stop-opacity=".28"/><stop offset="1" stop-color="${l.color}" stop-opacity="0"/></linearGradient>`).join('')}</defs>`;
  // Largest series last so it draws on top; small ones stay visible beneath.
  series.forEach((layer,li)=>{
    if(!points.some(p=>p.parts[li]>0)) return;
    if(points.length===1){
      svg+=`<circle cx="${x(0).toFixed(1)}" cy="${y(points[0].parts[li]).toFixed(1)}" r="3" fill="${layer.color}"/>`;
      return;
    }
    const line = monotonePath(points.map((p,i)=>[x(i), y(p.parts[li])]));
    svg+=`<path d="M${line.slice(1)}L${x(points.length-1).toFixed(1)},${y(0)}L${x(0).toFixed(1)},${y(0)}Z" fill="url(#u-fade-${li})"/>`;
    svg+=`<path d="M${line.slice(1)}" fill="none" stroke="${layer.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  svg+=`<g class="u-dots" opacity="0">${series.map((l,li)=>`<circle r="4" cx="0" cy="0" fill="${l.color}" stroke="var(--s0)" stroke-width="2" data-li="${li}"/>`).join('')}</g>`;
  svg+=`<g pointer-events="none">`;
  points.forEach((p,i)=>{
    const label = `${p.start}${p.end!==p.start?' → '+p.end:''}: ${!p.recordedDays?'No record':p.known?fmt(p.value):fmtMetricValue(metric,p.value,false)} · ${p.recordedDays}/${p.days} days recorded`;
    svg+=`<circle cx="${x(i).toFixed(1)}" cy="${y(p.parts.reduce((a,v)=>a+v,0)).toFixed(1)}" r="0"><title>${esc(label)}</title></circle>`;
  });
  svg+=`</g>`;
  const labelEvery = Math.max(1,Math.ceil(points.length/6));
  points.forEach((p,i)=>{
    if(i%labelEvery===0 || i===points.length-1){
      if(i!==points.length-1 && points.length-1-i < labelEvery/2) return;
      const anchor = i===0?'start':i===points.length-1?'end':'middle';
      svg+=`<text x="${x(i)}" y="${H-8}" text-anchor="${points.length===1?'middle':anchor}" fill="var(--su)" font-size="10.5" letter-spacing=".04em">${esc(fmtDay(p.start).toUpperCase())}</text>`;
    }
  });
  svg+=`<line class="u-guide" x1="0" x2="0" y1="${T}" y2="${T+CH}" stroke="var(--mu)" stroke-dasharray="3 3" opacity="0"/>`;
  S.chartPoints = { points, series, metric, max, T, CH };
  return svg+'</svg>'+(stride>1?`<div class="small-note">Each point combines up to ${stride} adjacent buckets. Export retains daily detail.</div>`:'');
}

function wireUsageChart(el){
  const svg = el?.querySelector?.('svg');
  const tip = document.getElementById('tip');
  if(!svg || !tip || !svg.getBoundingClientRect) return;
  const guide = svg.querySelector('.u-guide');
  svg.addEventListener('mousemove', e=>{
    const data = S.chartPoints; if(!data?.points.length) return;
    const box = svg.getBoundingClientRect(), scale = 960/box.width;
    const L = +svg.dataset.l, CW = +svg.dataset.cw, n = data.points.length;
    const i = n===1 ? 0 : Math.max(0, Math.min(n-1, Math.round(((e.clientX-box.left)*scale - L)/CW*(n-1))));
    const p = data.points[i], gx = n===1 ? L+CW/2 : L+CW*i/(n-1);
    guide.setAttribute('x1',gx); guide.setAttribute('x2',gx); guide.setAttribute('opacity','.7');
    const dots = svg.querySelector('.u-dots');
    dots.setAttribute('opacity','1');
    for(const c of dots.children){
      const v = p.parts[+c.dataset.li];
      c.setAttribute('cx',gx); c.setAttribute('cy',data.T+data.CH*(1-v/data.max));
      c.style.display = v>0 || data.series.length===1 ? '' : 'none';
    }
    const rows = data.series.map((l,li)=>[l,p.parts[li],p.partsKnown[li]]).filter(([,v,k])=>v>0 || k===false).reverse();
    tip.innerHTML = `<div class="tt-date">${esc(p.start===p.end?fmtDay(p.start):fmtDay(p.start)+' → '+fmtDay(p.end))}</div><div class="tt-cost">${p.recordedDays?esc(fmtMetricValue(data.metric,p.value,p.known)):'No record'}</div>`+
      (data.series.length>1 ? rows.map(([l,v,k])=>`<div class="tt-row"><span class="u-dot" style="background:${l.color}"></span><span>${esc(l.name)}</span><b>${esc(fmtMetricValue(data.metric,v,k))}</b></div>`).join('') : '')+
      `<div class="tt-meta">${p.recordedDays}/${p.days} days recorded</div>`;
    tip.style.display = 'block';
    const left = e.clientX + 16 + tip.offsetWidth > innerWidth ? e.clientX - tip.offsetWidth - 16 : e.clientX + 16;
    tip.style.left = left+'px'; tip.style.top = Math.max(8, e.clientY - 40)+'px';
  });
  svg.addEventListener('mouseleave', ()=>{ tip.style.display='none'; guide.setAttribute('opacity','0'); svg.querySelector('.u-dots').setAttribute('opacity','0'); });
}

function exportDailyCsv(selectedRows = S.dailyRows, filename){
  // Event listeners pass a MouseEvent; explicit arrays export a filtered view.
  const rows = (Array.isArray(selectedRows)?selectedRows:S.dailyRows).slice().sort((a,b)=>b.date.localeCompare(a.date) || a.providerId.localeCompare(b.providerId));
  const lines = [
    ['date','provider_id','display_name','source','input_tokens','output_tokens','reasoning_tokens','cache_write_tokens','cache_read_tokens','total_tokens','cost_usd','ingested_at','tokens_known','cost_known','sessions','cache_read_savings_usd','cost_source','pricing_as_of','input_cost_usd','cache_read_cost_usd','cache_write_cost_usd','output_cost_usd'].join(',')
  ];
  for(const r of rows){
    lines.push([
      r.date,
      r.providerId,
      r.displayName,
      r.source,
      r.inputTokens,
      r.outputTokens,
      r.reasoningOutputTokens,
      r.cacheCreationTokens,
      r.cacheReadTokens,
      r.totalTokens,
      r.cost.toFixed(6),
      r.ingestedAt || '',
      r.tokensKnown !== false,
      r.costKnown !== false,
      r.sessions ?? '',
      r.cacheSavingsUsd ?? '',
      r.costSource || '',
      r.pricingAsOf || '',
      r.inputCostUsd ?? '',
      r.cacheReadCostUsd ?? '',
      r.cacheWriteCostUsd ?? '',
      r.outputCostUsd ?? '',
    ].map(csvCell).join(','));
  }
  downloadText(filename || `usagestat-daily-${dateKey(todayUtcDate())}.csv`, lines.join('\r\n'), 'text/csv;charset=utf-8');
}

function exportQuotaCsv(){
  const lines = [['captured_at','provider_id','display_name','source','plan','primary_percent','progress_label','progress_used','progress_limit','reset_at'].join(',')];
  for(const s of orderedSnapshots()){
    const progress = (s.metrics||[]).filter(m=>m.type==='progress');
    if(!progress.length){
      lines.push([s.fetchedAt||'',s.providerId,s.displayName||'',s.source||'',s.plan||'',primaryPercentOf(s)??'','','','',''].map(csvCell).join(','));
      continue;
    }
    for(const m of progress){
      lines.push([
        s.fetchedAt||'',
        s.providerId,
        s.displayName||'',
        s.source||'',
        s.plan||'',
        m.format?.kind==='percent' && m.limit>0 ? pct(m).toFixed(1) : '',
        m.label||'',
        m.used ?? '',
        m.limit ?? '',
        m.resetsAt || '',
      ].map(csvCell).join(','));
    }
  }
  downloadText(`usagestat-quota-${dateKey(todayUtcDate())}.csv`, lines.join('\r\n'), 'text/csv;charset=utf-8');
}

function exportDashboardJson(){
  const body = JSON.stringify({
    generatedAt:new Date().toISOString(),
    snapshots:S.snapshots,
    dailyRows:S.dailyRows,
  }, null, 2);
  downloadText(`usagestat-dashboard-${dateKey(todayUtcDate())}.json`, body, 'application/json;charset=utf-8');
}

function downloadText(filename, content, type){
  const blob = new Blob([content], { type:type || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function csvCell(value){
  const s = String(value ?? '');
  return /[",\n\r]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
}

function loadPrefs(){
  try{
    const raw = localStorage.getItem('usagestat.dashboard.prefs');
    return cleanPreferences(raw ? JSON.parse(raw) : {});
  }catch{
    return { search:'', status:'all', sort:'order' };
  }
}

function cleanPreferences(value){
  if(!value || typeof value!=='object' || Array.isArray(value)) throw new Error('Invalid preferences.');
  const result={search:'',status:'all',sort:'order'};
  for(const key of ['search','status','sort','quotaDisplay','inactive']) if(typeof value[key]==='string' && value[key].length<=256) result[key]=value[key];
  if(value.trends && typeof value.trends==='object') {
    result.trends={};
    for(const key of ['provider','range','group','metric','breakdown','start','end']) if(typeof value.trends[key]==='string' && value.trends[key].length<=128) result.trends[key]=value.trends[key];
  }
  return result;
}
function exportPreferences(){downloadText('usagestat-preferences.json',JSON.stringify({version:1,preferences:cleanPreferences(S.prefs)},null,2),'application/json');}
document.getElementById('prefs-file').addEventListener('change',async event=>{
  const notice=document.getElementById('prefs-notice');
  try{
    const file=event.target.files[0]; if(!file)return;
    if(file.size>16384)throw new Error('Preferences file is too large.');
    const data=JSON.parse(await file.text());
    if(data.version!==1)throw new Error('Unsupported preferences version.');
    S.prefs=cleanPreferences(data.preferences);savePrefs();
    quotaDisplay.value=S.prefs.quotaDisplay==='remaining'?'remaining':'used';
    renderActive();notice.textContent='Preferences imported.';
  }catch(error){notice.textContent=error.message||'Could not import preferences.';}
  event.target.value='';
});

function savePrefs(){
  try{ localStorage.setItem('usagestat.dashboard.prefs', JSON.stringify(S.prefs)); }catch{}
}

function debounce(fn, ms){
  let timer = null;
  return (...args)=>{
    clearTimeout(timer);
    timer = setTimeout(()=>fn(...args), ms);
  };
}

// ── provider detail ───────────────────────────────────────────────────────────
async function renderProvider(id){

      html+=`<div class="dm-row"><span class="dm-val">${fmtMetric(m)}</span><span class="dm-pct">${displayPct(p).toFixed(1)}%</span></div>`;
      if(m.detail) html+=`<div class="dm-detail">${esc(m.detail)}</div>`;
      html+=`<div class="dm-track"><div class="dm-bar" style="background:${col}" data-w="${displayPct(p).toFixed(2)}%"></div></div>`;
      if(m.resetsAt) html+=`<div class="dm-reset">${fmtReset(m.resetsAt)}</div>`;
      html+=`</div>`;
    } else if(m.type==='text'){
      html+=`<div class="dmetric"><div class="kv"><span class="mlabel" style="margin:0">${esc(m.label)}</span><span class="kv-val">${esc(m.value||'')}</span></div></div>`;
    } else if(m.type==='badge'){
      html+=`<div class="dmetric"><div class="kv"><span class="mlabel" style="margin:0">${esc(m.label)}</span><span class="${pillCls(m.color)}">${esc(m.text||'')}</span></div></div>`;
    } else if(m.type==='barChart'){

    html+=`<div class="compare-row"><span class="compare-lbl">Actual</span><div class="compare-track"><div class="compare-fill" style="width:0;background:${pc}" data-w="${pace.actualUsedPercent.toFixed(2)}%"></div></div><span class="compare-pct">${pace.actualUsedPercent.toFixed(1)}%</span></div>`;
    html+=`</div>`;

  html+=`<div class="history-box" id="history-box-${esc(id)}">`;

  // Load history first so deeper usage graphs do not wait on slower external
  // cost scanners.
  const history = await fetchHistory(id);
  renderStatsSection(id, snap, history, null);
  renderHistorySection(id, history, snap);
  const reportsPromise = fetchCcusageReports(id).then(reports=>{
    renderStatsSection(id, snap, history, reports);
