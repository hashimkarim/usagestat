function selectOption(value,label,current){
  return `<option value="${esc(value)}"${(current??'all')===value?' selected':''}>${esc(label)}</option>`;
}

function overviewSnapshots(){
  const ordered = visibleSnapshots();
  const query = String(S.prefs.search||'').trim().toLowerCase();
  const status = S.prefs.status || 'all';
  const filtered = ordered.filter(s=>{
    if(query){
      const hay = [s.providerId, providerName(s.providerId), s.plan, s.source, ...(s.metrics||[]).map(m=>m.label)].join(' ').toLowerCase();
      if(!hay.includes(query)) return false;
    }
    const prim = primaryPercentOf(s);
    const roll = providerWindowTotals(s.providerId, 30);
    if(status==='live' && snapshotHasError(s)) return false;
    if(status==='attention' && !snapshotHasError(s)) return false;
    if(status==='near' && !(prim!=null && prim>=80)) return false;
    if(status==='tracked' && !(roll.totalTokens>0 || roll.cost>0)) return false;
    return true;
  });
  const index = new Map(ordered.map((s,i)=>[s.providerId,i]));
  const sorted = filtered.slice();
  const sort = S.prefs.sort || 'order';
  sorted.sort((a,b)=>{
    const pinA=providerSetting(a.providerId).pinned===true,pinB=providerSetting(b.providerId).pinned===true;if(pinA!==pinB)return Number(pinB)-Number(pinA);
    if(sort==='name') return providerName(a.providerId).localeCompare(providerName(b.providerId));
    if(sort==='recent') return (+new Date(b.fetchedAt||0)) - (+new Date(a.fetchedAt||0));
    if(sort==='pressure') return (primaryPercentOf(b)||0) - (primaryPercentOf(a)||0);
    if(sort==='cost30') return providerWindowTotals(b.providerId,30).cost - providerWindowTotals(a.providerId,30).cost;
    if(sort==='tokens30') return providerWindowTotals(b.providerId,30).totalTokens - providerWindowTotals(a.providerId,30).totalTokens;
    return (index.get(a.providerId)||0) - (index.get(b.providerId)||0);
  });
  return sorted;
}

// A provider is inactive when it is failing and has nothing to show: no quota
// lines and no tracked usage in the last 30 days (e.g. an expired login).
// Inactive providers are hidden unless the user chooses to show them.
function isInactiveProvider(s){
  if(!snapshotHasError(s)) return false;
  if((s.metrics||[]).some(m=>m.type==='progress')) return false;
  const roll = providerWindowTotals(s.providerId, 30);
  return !(roll.totalTokens>0 || roll.cost>0);
}
function showInactive(){ return S.prefs.inactive==='show'; }
function providerSetting(id){ return UsageDashboardSettings.provider(S.prefs,id); }
function providerName(id){
  return providerSetting(id).name || S.snapshots.find(s=>s.providerId===id)?.displayName || S.allProviders.find(p=>p.id===id)?.name || S.providers.find(p=>p.id===id)?.name || id;
}
function visibleSnapshots(){ return orderedSnapshots().filter(s=>providerSetting(s.providerId).visible && (showInactive() || !isInactiveProvider(s))); }
function hiddenInactive(){ return showInactive() ? [] : orderedSnapshots().filter(s=>providerSetting(s.providerId).visible && isInactiveProvider(s)); }
function applyTabVisibility(){
  const hidden = new Set([...hiddenInactive().map(s=>s.providerId),...S.providers.filter(p=>!providerSetting(p.id).visible).map(p=>p.id)]);
  document.querySelectorAll?.('#tabs .tab').forEach(t=>{ t.hidden = hidden.has(t.dataset.tab) && S.active!==t.dataset.tab; });
}

// Plugins report failures either as source 'error' or as an "Error" badge.
function snapshotHasError(s){
  return (!!s.state&&s.state!=='ready'&&s.state!=='no-data') || s.source==='error' || (s.metrics||[]).some(m=>m.type==='badge' && /^error$/i.test(String(m.label||'').trim()));
}

function primaryPercentOf(s){
  const m = UsageDashboardSettings.primary(s,S.prefs);
  return m ? pct(m) : null;
}

function renderOverviewSummary(){
  const el = document.getElementById('overviewSummary');
  if(!el) return;
  if(S.prefs.summary===false){el.innerHTML='';return;}
  const snaps = visibleSnapshots(), hidden = hiddenInactive();
  if(!snaps.length){ el.innerHTML=''; return; }

  const progressRows = snaps.filter(s=>!snapshotHasError(s)).flatMap(s=>UsageDashboardSettings.metrics(s,S.prefs)
    .filter(m=>m.type==='progress' && m.limit>0)
    .map(m=>({ snap:s, metric:m, percent:pct(m) })));
  const primaryRows = snaps.filter(s=>!snapshotHasError(s)).map(s=>{
    const m = UsageDashboardSettings.primary(s,S.prefs);
    return m ? { snap:s, metric:m, percent:pct(m) } : null;
  }).filter(Boolean);
  const pressure = primaryRows.slice().sort((a,b)=>b.percent-a.percent);
  const highest = pressure[0];
  const avg = primaryRows.length ? primaryRows.reduce((acc,row)=>acc+row.percent,0)/primaryRows.length : null;
  const nearLimit = progressRows.filter(row=>row.percent>=80).length;
  const live = snaps.filter(s=>!snapshotHasError(s)).length;
  const errorCount = snaps.length - live;
  const withPace = S.prefs.showPace?snaps.filter(s=>s.pace).length:0;
  const resets = progressRows
    .filter(row=>row.metric.resetsAt)
    .sort((a,b)=>new Date(a.metric.resetsAt)-new Date(b.metric.resetsAt));
  const nextReset = resets[0];
  const updated = snaps.map(s=>+new Date(s.fetchedAt||0)).filter(Boolean).sort((a,b)=>b-a)[0];
  const riskyPace = snaps
    .filter(s=>S.prefs.showPace && s.pace && (!s.pace.willLastToReset || /over$/.test(String(s.pace.stage||''))))
    .sort((a,b)=>(b.pace?.deltaPercent||0)-(a.pace?.deltaPercent||0));
  const alerts = [];
  if(riskyPace.length){
    const s = riskyPace[0], p = s.pace;
    alerts.push({
      level:'pace',
      color:paceColor(p.stage),
      text:`${providerName(s.providerId)} is ${stageLbl(p.stage)}`,
      sub:`${fmtDelta(p.deltaPercent)} - ETA ${fmtEta(p.etaSeconds,p.stage)}`
    });
  }
  if(highest && highest.percent >= 80){
    alerts.push({
      level:highest.percent >= 95 ? 'limit' : 'watch',
      color:barCol(highest.percent),
      text:`${providerName(highest.snap.providerId)} has the tightest quota`,
      sub:`${highest.metric.label}: ${highest.percent.toFixed(1)}% used`
    });
  }
  if(nextReset&&S.prefs.showReset){
    alerts.push({
      level:'reset',
      color:'#7289da',
      text:`Next reset: ${providerName(nextReset.snap.providerId)}`,
      sub:`${nextReset.metric.label} ${fmtReset(nextReset.metric.resetsAt)}`
    });
  }
  if(errorCount > 0){
    alerts.push({
      level:'auth',
      color:'#d25050',
      text:`${errorCount} provider${errorCount===1?' needs':'s need'} attention`,
      sub:'Open the provider tab for setup or login details'
    });
  }
  if(hidden.length){
    alerts.push({
      level:'hidden',
      color:'#8e9297',
      text:`${hidden.length} inactive provider${hidden.length===1?'':'s'} hidden`,
      sub:`${hidden.map(s=>providerName(s.providerId)).join(', ')} · use Show inactive to display`
    });
  }

  let html = `<div class="overview-panel">`;
  html+=`<div class="overview-title">Provider Health</div>`;
  html+=`<div class="overview-sub">${esc(snaps.length)} providers · ${esc(progressRows.length)} quota lines · ${esc(withPace)} paced</div>`;
  html+=`<div class="kpi-grid">`;
  html+=overviewKpi(`${live}/${snaps.length}`, 'live');
  html+=overviewKpi(highest ? `${highest.percent.toFixed(0)}%` : '-', 'highest');
  html+=overviewKpi(avg == null ? '-' : `${avg.toFixed(1)}%`, 'avg usage');
  html+=overviewKpi(String(nearLimit), 'near limit');
  html+=`</div>`;
  if(alerts.length){
    html+=`<div class="alert-list">`;
    for(const row of alerts.slice(0,4)) html+=overviewAlert(row);
    html+=`</div>`;
  }
  html+=`</div>`;

  html+=`<div class="overview-panel">`;
  html+=`<div class="overview-title">Quota Pressure</div>`;
  html+=`<div class="overview-sub">${S.prefs.showReset&&nextReset ? esc(fmtReset(nextReset.metric.resetsAt)) : 'quota observations'} · ${updated ? esc(fmtAgo(new Date(updated).toISOString())) : 'not updated'}</div>`;
  html+=`<div class="pressure-list">`;
  for(const row of pressure.slice(0,5)){
    const name = providerName(row.snap.providerId);
    const col = row.snap.pace ? paceColor(row.snap.pace.stage) : barCol(row.percent);
    html+=`<div class="pressure-row" ${chartDetailAttribute(snapshotDetail(row.snap,row.metric))}>`;
    html+=`<div class="pressure-name">${esc(name)}</div>`;
    html+=`<div class="pressure-value">${row.percent.toFixed(1)}%</div>`;
    html+=`<div class="pressure-track"><div class="pressure-fill" style="width:${row.percent.toFixed(2)}%;background:${col}"></div></div>`;
    html+=`</div>`;
  }
  if(!pressure.length) html+=`<div class="cost-unavail" style="padding:18px">No quota data reported</div>`;
  html+=`</div></div>`;

  const dailyRows = S.dailyRows.filter(r=>providerSetting(r.providerId).visible);
  const r7 = dailyWindowTotals(dailyRows, 7);
  const p7 = dailyWindowTotals(dailyRows, 7, 7);
  const r30 = dailyWindowTotals(dailyRows, 30);
  const p30 = dailyWindowTotals(dailyRows, 30, 30);
  const trend = aggregateDailyTrend(dailyRows, 14);
  const top = topDailyContributors(dailyRows, 30, 5);
  html+=`<div class="overview-panel">`;
  html+=`<div class="overview-title">Spend & Tokens</div>`;
  html+=`<div class="overview-sub">${dailyRows.length ? `${esc(dailyRows.length)} saved daily rows` : 'no saved daily history'}${Object.values(S.prefs.providers).some(p=>!p.visible)?' · visible providers':''}</div>`;
  html+=`<div class="rollup-grid">`;
  html+=rollupCard(r7.rows?recordedCost(r7):'—','7d spend',r7.costKnown&&p7.costKnown?deltaBadge(deltaPercent(r7.cost,p7.cost)):'');
  html+=rollupCard(fmtTok(r7.totalTokens),'7d tokens',deltaBadge(deltaPercent(r7.totalTokens,p7.totalTokens)));
  html+=rollupCard(r30.rows?recordedCost(r30):'—','30d spend',r30.costKnown&&p30.costKnown?deltaBadge(deltaPercent(r30.cost,p30.cost)):'');
  html+=rollupCard(fmtTok(r30.totalTokens),'30d tokens',deltaBadge(deltaPercent(r30.totalTokens,p30.totalTokens)));
  html+=`</div>`;
  html+=overviewTrendHtml(trend);
  html+=topContributorsHtml(top, r30);
  html+=`</div>`;

  el.innerHTML = html;
}

function overviewKpi(value,label){
  return `<div class="kpi"><div class="kpi-value">${esc(value)}</div><div class="kpi-label">${esc(label)}</div></div>`;
}
function rollupCard(value,label,delta){
  return `<div class="rollup-card"><div class="rollup-value">${esc(value)}${delta||''}</div><div class="rollup-label">${esc(label)}</div></div>`;
}
function overviewAlert(row){
  return `<div class="alert-row" style="--alert:${esc(row.color||'#7289da')}"><div class="alert-mark">${esc(row.level||'info')}</div><div class="alert-text">${esc(row.text||'')}<span class="alert-sub">${esc(row.sub||'')}</span></div></div>`;
}

function normalizeDailyRows(payload){
  const rows = Array.isArray(payload) ? payload : Array.isArray(payload?.daily) ? payload.daily : [];
  return rows.map(r=>({
    providerId:String(readAny(r,['providerId','provider_id','instanceId','instance_id'],'')).trim(),
    displayName:String(readAny(r,['displayName','display_name','provider','name'],'')).trim(),
    date:rowDate(r),
    source:String(readAny(r,['source'],'')).trim(),
    inputTokens:rowInput(r),
    outputTokens:rowOutput(r),
    cacheReadTokens:rowCacheRead(r),
    cacheCreationTokens:rowCacheCreate(r),
    reasoningOutputTokens:rowReasoning(r),
    totalTokens:rowTotalTokens(r),
    cost:rowCost(r),
    costKnown:r.costKnown !== false,
    tokensKnown:r.tokensKnown !== false,
    inputCostUsd:Number.isFinite(r.inputCostUsd) && r.inputCostUsd>=0 ? r.inputCostUsd : null,
    cacheReadCostUsd:Number.isFinite(r.cacheReadCostUsd) && r.cacheReadCostUsd>=0 ? r.cacheReadCostUsd : null,
    cacheWriteCostUsd:Number.isFinite(r.cacheWriteCostUsd) && r.cacheWriteCostUsd>=0 ? r.cacheWriteCostUsd : null,
    outputCostUsd:Number.isFinite(r.outputCostUsd) && r.outputCostUsd>=0 ? r.outputCostUsd : null,
    sessions:Number.isSafeInteger(r.sessions) ? r.sessions : null,
    cacheSavingsUsd:Number.isFinite(r.cacheSavingsUsd) ? r.cacheSavingsUsd : null,
    costSource:r.costSource || r.source || '',
    pricingAsOf:r.pricingAsOf || '',
    models:r.models && typeof r.models === 'object' ? r.models : {},
    ingestedAt:readAny(r,['ingestedAt','ingested_at'],null),
  })).filter(r=>r.providerId && /^\d{4}-\d{2}-\d{2}$/.test(r.date));
}

function providerWindowTotals(providerId, days){
  return dailyWindowTotals(S.dailyRows.filter(r=>r.providerId.toLowerCase()===String(providerId).toLowerCase()), days);
}

function dailyWindowTotals(rows, days, offsetDays){
  return dailyRowsInWindow(rows, days, offsetDays).reduce((acc,r)=>{
    acc.inputTokens += rowInput(r);
    acc.outputTokens += rowOutput(r);
    acc.cacheReadTokens += rowCacheRead(r);
    acc.cacheCreationTokens += rowCacheCreate(r);
    acc.reasoningTokens += rowReasoning(r);
    acc.totalTokens += rowTotalTokens(r);
    acc.cost += rowCost(r);
    acc.costKnown &&= r.costKnown !== false;
    acc.tokensKnown &&= r.tokensKnown !== false;
    acc.rows++;
    return acc;
  }, {inputTokens:0,outputTokens:0,cacheReadTokens:0,cacheCreationTokens:0,reasoningTokens:0,totalTokens:0,cost:0,costKnown:true,tokensKnown:true,rows:0});
}

function dailyRowsInWindow(rows, days, offsetDays){
  const end = addDays(todayUtcDate(), -(offsetDays||0));
  const start = addDays(end, -(days - 1));
  const a = dateKey(start), b = dateKey(end);
  return rows.filter(r=>{
    const d = rowDate(r);
    return d >= a && d <= b;
  });
}

function aggregateDailyTrend(rows, days){
  const windowRows = dailyRowsInWindow(rows, days, 0);
  const byDay = new Map();
  for(const r of windowRows){
    const d = rowDate(r);
    const cur = byDay.get(d) || { date:d, totalTokens:0, cost:0, costKnown:true, tokensKnown:true };
    cur.totalTokens += rowTotalTokens(r);
    cur.cost += rowCost(r);
    cur.costKnown &&= r.costKnown !== false;
    cur.tokensKnown &&= r.tokensKnown !== false;
    byDay.set(d, cur);
  }
  const end = todayUtcDate();
  const start = addDays(end, -(days - 1));
  const out = [];
  for(let d = new Date(start); d <= end; d = addDays(d, 1)){
    const key = dateKey(d);
    out.push(byDay.get(key) || { date:key, totalTokens:0, cost:0 });
  }
  return out;
}

function topDailyContributors(rows, days, limit){
  const map = new Map();
  for(const r of dailyRowsInWindow(rows, days, 0)){
    const id = r.providerId;
    const cur = map.get(id) || { providerId:id, displayName:r.displayName || id, totalTokens:0, cost:0, costKnown:true,tokensKnown:true };
    cur.totalTokens += rowTotalTokens(r);
    cur.cost += rowCost(r);
    cur.costKnown &&= r.costKnown !== false;
    cur.tokensKnown &&= r.tokensKnown !== false;
    map.set(id, cur);
  }
  return Array.from(map.values()).sort((a,b)=>b.cost-a.cost || b.totalTokens-a.totalTokens).slice(0, limit || 5);
}

function overviewTrendHtml(rows){
  if(!rows.length || !rows.some(r=>r.totalTokens>0 || r.cost>0)){
    return `<div class="cost-unavail" style="padding:16px 0"><strong style="font-size:13px">No tracked trend yet</strong></div>`;
  }
  const max = Math.max(1, ...rows.map(r=>Math.max(r.cost, r.totalTokens/1000000)));
  const latest = rows[rows.length-1];
  const bars = rows.map(r=>{
    const basis = Math.max(r.cost, r.totalTokens/1000000);
    const h = Math.max(3, Math.round(basis/max*100));
    const color = r.cost>0 ? '#43b581' : '#7289da';
    return `<div class="trend-bar" style="height:${h}%;background:${color}" ${chartDetailAttribute(dailyDetail(S.dailyRows.filter(d=>d.date===r.date&&providerSetting(d.providerId).visible),r.date))}></div>`;
  }).join('');
  return `<div class="overview-trend"><div class="trend-head"><span class="trend-title">Last 14 days</span><span class="trend-readout">${recordedCost(latest)} · ${esc(recordedTokens(latest))} tokens today</span></div><div class="trend-bars">${bars}</div></div>`;
}

function topContributorsHtml(rows, totals){
  if(!rows.length) return '';
  let html = `<div class="contrib-list">`;
  for(const r of rows){
    const basis = totals.cost>0 ? r.cost : r.totalTokens;
    const max = totals.cost>0 ? totals.cost : totals.totalTokens;
    const p = max>0 ? Math.min(100, basis/max*100) : 0;
    const label = r.cost>0 || r.costKnown===false ? recordedCost(r) : recordedTokens(r);
    html+=`<div class="contrib-row" ${chartDetailAttribute(dailyDetail(dailyRowsInWindow(S.dailyRows.filter(d=>d.providerId===r.providerId),30),providerDisplayName(r.providerId,r.displayName)))}><div class="contrib-name">${esc(providerDisplayName(r.providerId, r.displayName))}</div><div class="contrib-value">${esc(label)}</div><div class="pressure-track"><div class="pressure-fill" style="width:${p.toFixed(1)}%;background:#43b581"></div></div></div>`;
  }
  html+=`</div>`;
  return html;
}

function deltaPercent(current, prior){
  current = Number(current)||0; prior = Number(prior)||0;
  if(prior <= 0) return current > 0 ? 100 : null;
  return Math.round((current - prior) / prior * 100);
}

function deltaBadge(value){
  if(value == null || !Number.isFinite(value)) return '';
  if(value === 0) return `<span class="delta flat">0%</span>`;
  const cls = value > 0 ? 'up' : 'down';
  const sign = value > 0 ? '+' : '';
  return `<span class="delta ${cls}">${sign}${value}%</span>`;
}

// ── saved daily history and trends ────────────────────────────────────────────
function trendsOptions(){
  const prefs = S.prefs.trends || {};
  return {
    provider: typeof prefs.provider==='string' ? prefs.provider : '',
    range: ['7','30','90','365','month','all','custom'].includes(prefs.range) ? prefs.range : '30',
    group: ['day','week','month'].includes(prefs.group) ? prefs.group : 'day',
    metric: ['cost','totalTokens','cacheReadTokens','outputTokens'].includes(prefs.metric) ? prefs.metric : 'cost',
    breakdown: ['provider','day','model','sources'].includes(prefs.breakdown) ? prefs.breakdown : 'provider',
    start: prefs.start || dateKey(addDays(todayUtcDate(),-29)),
    end: prefs.end || dateKey(todayUtcDate()),
  };
}

function trendChange(current, previous, field){
  const known = field === 'cost' ? 'costKnown' : 'tokensKnown';
  if(current[field] == null) return 'Comparison unavailable';
  if(current[known] === false || previous[known] === false) return 'Partial data';
  const delta = UsageTrends.change(current[field], previous[field], current.rows, previous.rows);
  if(delta.kind==='unavailable') return 'Comparison unavailable';
  if(delta.kind==='fromZero') return 'Up from a recorded zero';
  // Huge percentages from a near-empty prior period read better as a multiple.
  if(delta.percent >= 1000) return `${Math.round(current[field]/previous[field]).toLocaleString('en-US')}× previous period`;
  return `${delta.percent>0?'+':''}${delta.percent.toFixed(1)}% vs previous period`;
}

function trendKpi(value, label, note){
  return `<div class="insight"><div class="insight-value">${esc(value)}</div><div class="insight-label">${esc(label)}</div><div class="trends-change">${esc(note)}</div></div>`;
}

function recordedCost(row){ const cost=rowCost(row); return row.costKnown === false ? (cost > 0 ? fmtUsd(cost)+'+' : 'Unpriced') : fmtUsd(cost); }
function recordedTokens(row){ const tokens=rowTotalTokens(row); return row.tokensKnown === false && !tokens ? 'Unknown' : fmtTok(tokens)+(row.tokensKnown === false ? '+' : ''); }

const USAGE_METRICS = {
  cost:{ label:'Cost', title:'Daily cost', field:'cost' },
  totalTokens:{ label:'Tokens', title:'Daily processed tokens', field:'totalTokens' },
  cacheReadTokens:{ label:'Cache', title:'Daily cached input', field:'cacheReadTokens' },
  outputTokens:{ label:'Output', title:'Daily output tokens', field:'outputTokens' },
};
const PROVIDER_COLORS = { codex:'#e4e4e7', claude:'#d97757', antigravity:'#9b87f5', copilot:'#5fb4e8', gemini:'#4f8ff7', cursor:'#a1a1aa' };
const SERIES_PALETTE = ['#7289da','#43b581','#eaca8b','#da97cd','#6ec3d8','#ce8670','#b48ead'];
function seriesColor(id, index){ return PROVIDER_COLORS[String(id).toLowerCase()] || SERIES_PALETTE[index % SERIES_PALETTE.length]; }
function fmtUsd(v){ return '$'+(Number(v)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
// known=false: a partial sum shows '+', an unknown zero shows Unpriced/Unknown.
function fmtMetricValue(metric, v, known){
  if(known===false) return metric==='cost' ? (v>0 ? fmtUsd(v)+'+' : 'Unpriced') : (v>0 ? fmtTok(v)+'+' : 'Unknown');
  return metric==='cost' ? fmtUsd(v) : fmtTok(v);
}
function knownFlag(metric){ return metric==='cost' ? 'costKnown' : 'tokensKnown'; }
function metricOf(row, metric){ return metric==='cost' ? rowCost(row) : Number(row[metric])||0; }
function recordedMetric(row, metric){ return metric==='cost' ? recordedCost(row) : metric==='totalTokens' ? recordedTokens(row) : fmtMetricValue(metric, Number(row[metric])||0, row.tokensKnown); }
function shareText(part, whole){ if(!(whole>0)) return '—'; const p=part/whole*100; return p>0&&p<0.1 ? '<0.1%' : p<100&&p>=99.95 ? '>99.9%' : p.toFixed(1)+'%'; }
// With partial pricing, shares are only meaningful over the priced portion.
function pricedShare(part, whole){ return whole.cost>0 && part.cost>0 ? shareText(part.cost, whole.cost) : null; }
function providerDisplayName(id, fallback){
  const p = S.providers.find(x=>String(x.id).toLowerCase()===String(id).toLowerCase());
  return providerSetting(p?.id || id).name || p?.name || fallback || id;
}
function metricShare(part, whole, metric){
  const known=metric==='cost'?'costKnown':'tokensKnown';
  return part[known]!==false&&whole[known]!==false ? shareText(metricOf(part,metric),metricOf(whole,metric)) : '—';
}
function segmented(set, current, items){
  return `<div class="u-seg" role="group">${items.map(([v,l])=>`<button type="button" class="u-seg-btn${String(current)===v?' active':''}" data-set="${esc(set)}" data-value="${esc(v)}" aria-pressed="${String(current)===v}">${esc(l)}</button>`).join('')}</div>`;
}

function renderTrends(){
  const panel = document.getElementById('panel-history');
  const options = trendsOptions();
  const model = UsageTrends.summarize(S.dailyRows, options);
  // Include saved providers even after they have been disabled or removed.
  const providers = new Map(S.providers.map(p=>[p.id.toLowerCase(),providerDisplayName(p.id,p.name)]));
  for(const r of S.dailyRows) providers.set(r.providerId.toLowerCase(), providerDisplayName(r.providerId,r.displayName));
  if(options.provider && !providers.has(options.provider.toLowerCase())) providers.set(options.provider, options.provider);
  const metric = options.metric, info = USAGE_METRICS[metric];
  // Local-log rows may carry raw ids ("codex"); prefer the registry's names.
  for(const p of model.providers || []) p.displayName = providerDisplayName(p.id, p.displayName);

  let html = `<div class="u-page">`;
  html+=`<div class="u-toolbar">`;
  html+=`<label class="u-field"><span class="sr-only">Provider</span><select id="trends-provider"><option value=""${!options.provider?' selected':''}>All providers</option>${[...providers].sort((a,b)=>a[1].localeCompare(b[1])).map(([id,name])=>selectOption(id,name,options.provider.toLowerCase())).join('')}</select></label>`;
  html+=segmented('range', options.range, [['7','7D'],['30','30D'],['month','MTD'],['90','90D'],['365','1Y'],['all','All'],['custom','Custom']]);
  if(options.range==='custom'){
    const max = dateKey(todayUtcDate());
    html+=`<label class="u-field"><span>From</span><input id="trends-start" type="date" value="${esc(options.start)}" max="${max}"></label><label class="u-field"><span>Through</span><input id="trends-end" type="date" value="${esc(options.end)}" max="${max}"></label>`;
  }
  html+=`<label class="u-field"><span class="sr-only">Group by</span><select id="trends-group">${[['day','Day'],['week','Week'],['month','Month']].map(([v,l])=>selectOption(v,l,options.group)).join('')}</select></label>`;
  html+=`<button class="action-btn u-export" id="trends-export" ${!model.rows?.length||S.dailyError?'disabled':''}><svg viewBox="0 0 16 16"><path d="M8 2v7"/><path d="M5 6l3 3 3-3"/><path d="M3 13h10"/></svg>Export CSV</button>`;
  html+=`</div>`;

  if(model.error){
    html+=`<div class="trends-empty" role="alert">${esc(model.error)}</div>`;
  } else if(S.dailyError){
    html+=`<div class="trends-empty" role="alert">Could not load saved daily history. Try Refresh to load it again.</div>`;
  } else {
    const { range, current, previous } = model;
    html+=`<div class="u-range">${range.start} → ${range.end} · ${range.days} calendar days · UTC${range.end===dateKey(todayUtcDate())?' · Today is partial':''} · compared with ${range.previousStart} → ${range.previousEnd}</div>`;
    // The headline mixes one source per provider-day; say which.
    const sourceDays = new Map();
    for(const r of current.rows ? model.rows : []){ const k = costSourceLabel(r); sourceDays.set(k, (sourceDays.get(k)||0)+1); }
    if(sourceDays.size>1 || [...sourceDays.keys()].some(k=>k==='local estimate')) html+=`<div class="u-range" style="margin-top:-2px">Cost sources: ${[...sourceDays].sort((a,b)=>b[1]-a[1]).map(([k,n])=>`${esc(k)} ${n} provider-day${n===1?'':'s'}`).join(' · ')}</div>`;
    if(!current.rows){
      html+=`<div class="trends-empty"><strong>No saved daily usage in this range</strong><br>Try another period or provider. Daily totals are saved when a supported provider reads local usage logs.<br>Run <code>usagestat usage</code> or keep the daemon running to collect available reports.<br>Providers that report only quotas have snapshot charts in their provider tab.</div>`;
    } else {
      // Dense daily curves read as noise; the chart coarsens itself while the
      // breakdown keeps the chosen grouping.
      const chartGroup = chartGrouping(range.days, options.group);
      const chartModel = chartGroup===options.group ? model : UsageTrends.summarize(S.dailyRows, { ...options, group:chartGroup });
      const layers = usageLayers(chartModel, metric);
      html+=`<div class="u-hero"><div class="u-summary">`;
      html+=`<div class="u-big">${esc(recordedMetric(current, metric))}</div>`;
      html+=`<div class="u-bigsub">${current.recordedDays}/${range.days} days recorded · ${esc(trendChange(current,previous,metric==='cost'?'cost':metric))}</div>`;
      html+=`<div class="u-plist">`;
      for(const layer of layers.slice().reverse()){
        const p = layer.provider;
        const other = metric==='cost' ? `${recordedTokens(p.current)} tokens` : recordedCost(p.current);
        html+=`<div class="u-prow"><span class="u-dot" style="background:${layer.color}"></span>${providerIcon(p.id)}<span class="u-pname">${esc(p.displayName)}</span><span class="u-pdays">${p.current.activeDays} active day${p.current.activeDays===1?'':'s'}</span><span class="u-pval">${esc(recordedMetric(p.current, metric))}</span>`;
        const share = metricShare(p.current,current,metric), priced = share==='—' && metric==='cost' ? pricedShare(p.current,current) : null;
        html+=`<div class="u-psub">${priced ? `≈${priced} of priced cost` : `${share} of ${esc(info.label.toLowerCase())}`} · ${esc(other)}</div></div>`;
      }
      html+=`</div></div>`;
      html+=`<div class="u-chartcard"><div class="u-charthead"><span class="u-h">${esc(chartGroup==='day'?info.title:info.title.replace('Daily', chartGroup==='week'?'Weekly':'Monthly'))}</span>${segmented('metric', metric, Object.entries(USAGE_METRICS).map(([k,v])=>[k,v.label]))}</div>`;
      html+=`<div class="u-chart" id="u-chart">${trendsChart(chartModel.buckets, metric, layers)}</div>${chartGroup!==options.group?`<div class="small-note">Charted by ${chartGroup} for readability · the breakdown below stays by ${options.group}.</div>`:''}</div>`;
      html+=`</div>`;

      const input = current.inputTokens, cached = current.cacheReadTokens, write = current.cacheCreationTokens;
      const promptTokens = input + cached + write;
      html+=`<div class="u-section"><div class="u-h">Totals</div><div class="u-totals">`;
      html+=usageTotal('Processed tokens', recordedTokens(current));
      // Billing/ccusage rows lack these; fall back to the separate local-log source.
      const local = (!current.sessionsKnown || !current.cacheSavingsKnown) ? localLogExtras(model) : null;
      if(current.sessionsKnown) html+=usageTotal('Session-days', fmtNum(current.sessions), 'one per session per active day');
      else if(local?.sessionDays) html+=usageTotal('Session-days', fmtNum(local.sessions)+(local.sessionDays<local.days?'+':''), `local logs · ${local.sessionDays}/${local.days} provider-days`);
      if(current.cacheSavingsKnown) html+=usageTotal('Cache read savings', fmtUsd(current.cacheSavingsUsd), 'estimated discount on cached input');
      else if(local?.savingsDays) html+=usageTotal('Cache read savings', fmtUsd(local.savings)+(local.savingsDays<local.days?'+':''), `local logs at API rates · ${local.savingsDays}/${local.days} provider-days`);
      html+=usageTotal('Cached input', fmtTok(cached));
      html+=usageTotal('Uncached input', fmtTok(input));
      if(write>0) html+=usageTotal('Cache writes', fmtTok(write));
      html+=usageTotal('Output', fmtTok(current.outputTokens), current.reasoningOutputTokens>0?`${fmtTok(current.reasoningOutputTokens)} reasoning`:'');
      html+=usageTotal('Cache hit rate', promptTokens>0 ? (cached/promptTokens*100).toFixed(1)+'%' : '—', 'of input tokens');
      html+=usageTotal('Cost', recordedCost(current), current.activeDays?`${recordedCost({cost:current.cost/current.activeDays,costKnown:current.costKnown})} per active day`:'');
      html+=`</div></div>`;
    }
    if(model.providers.length){
      const breakdown = options.breakdown;
      html+=`<div class="u-section"><div class="u-sechead"><span class="u-h">Breakdown</span>${segmented('breakdown', breakdown, [['provider','Provider'],['day',options.group==='day'?'Day':options.group==='week'?'Week':'Month'],['model','Model'],['sources','Sources']])}</div>`;
      if(breakdown==='day') html+=dayBreakdown(model, metric);
      else if(breakdown==='model') html+=modelBreakdown(model);
      else if(breakdown==='sources') html+=sourcesBreakdown(model);
      else html+=providerBreakdown(model);
      html+=`</div>`;
    }
  }
  panel.innerHTML = html + '</div>';
  panel.onclick = e=>{
    const btn = e.target?.closest?.('[data-set]');
    if(btn){
      const next = { ...options, [btn.dataset.set]:btn.dataset.value };
      if(btn.dataset.set==='range' && next.range==='custom' && model.range){ next.start = model.range.start; next.end = model.range.end; }
      S.prefs.trends = next; savePrefs(); renderTrends();
    } else if(e.target?.id==='history-expand'){
      S.showAllHistory = !S.showAllHistory; renderTrends();
    }
  };
  for(const field of ['provider','start','end','group']){
    panel.querySelector('#trends-'+field)?.addEventListener('change', e=>{
      S.prefs.trends = { ...options, [field]:e.target.value };
      savePrefs();
      renderTrends();
    });
  }
  panel.querySelector('#trends-export')?.addEventListener('click',()=>{
    if(model.rows?.length) exportDailyCsv(model.rows, `usagestat-history-${model.range.start}-${model.range.end}.csv`);
  });
  wireUsageChart(panel.querySelector('#u-chart'));
}

function chartGrouping(days, group){
  const order = ['day','week','month'], perBucket = { day:1, week:7, month:30.4 };
  let i = order.indexOf(group);
  while(i < order.length-1 && days/perBucket[order[i]] > 45) i++;
  return order[Math.max(0,i)];
}

// Local-log extras over the headline's provider-days, with coverage so a
// partial sum is never shown as complete.
function localLogExtras(model){
  const ids = model.providers.filter(p=>p.current.rows).map(p=>p.id);
  if(typeof fetch==='function') ensureModelReports(ids);
  const local = new Map();
  // Only transcript-derived rows count as local logs; other sources are not mixed in.
  for(const id of ids) for(const r of S.modelReports?.[id]?.rows || []) if(costSourceLabel(r)==='local estimate') local.set(id+'\u0000'+r.date, r);
  const days = new Set(model.rows.map(r=>r.providerId.toLowerCase()+'\u0000'+r.date));
  const out = { days:days.size, sessions:0, sessionDays:0, savings:0, savingsDays:0 };
  for(const key of days){
    const r = local.get(key);
    if(r?.sessions!=null){ out.sessions += r.sessions; out.sessionDays++; }
    if(r?.cacheSavingsUsd!=null){ out.savings += r.cacheSavingsUsd; out.savingsDays++; }
  }
  return out;
}

function costSourceLabel(r){
  const src = String(r.costSource||r.source||'').toLowerCase();
  if(src.includes('estimate') || src.includes('transcript')) return 'local estimate';
  if(src.includes('ccusage')) return 'ccusage';
  if(src.includes('billing')) return 'billing';
  return src || 'unknown';
}

function usageTotal(label, value, note){
  return `<div class="u-total"><div class="u-tlabel">${esc(label)}</div><div class="u-tvalue">${esc(value)}</div>${note?`<div class="u-tnote">${esc(note)}</div>`:''}</div>`;
}

// Per-provider series aligned to the summary buckets, smallest first so thin
// series stay visible at the bottom of the stack.
function usageLayers(model, metric){
  const index = new Map();
  model.buckets.forEach((b,i)=>{ for(let d=parseDateOnly(b.start); dateKey(d)<=b.end; d=addDays(d,1)) index.set(dateKey(d), i); });
  const layers = model.providers.filter(p=>p.current.rows).map((p,i)=>({ id:p.id, name:p.displayName, provider:p, color:seriesColor(p.id,i), values:model.buckets.map(()=>0), known:model.buckets.map(()=>true) }));
  const byId = new Map(layers.map(l=>[l.id,l])), flag = knownFlag(metric);
  for(const r of model.rows){
    const layer = byId.get(r.providerId.toLowerCase()), i = index.get(r.date);
    if(layer && i!=null){ layer.values[i] += metricOf(r, metric); layer.known[i] &&= r[flag] !== false; }
  }
  const total = layer => layer.values.reduce((a,v)=>a+v,0);
  return layers.sort((a,b)=>total(a)-total(b));
}

function providerBreakdown(model){
  const { current } = model;
  let html = `<div class="trends-table-wrap"><table class="u-table"><thead><tr><th>Provider</th><th>Cost</th><th>Share</th><th>Tokens</th><th>Cached input</th><th>Output</th><th>Token change</th><th>Days recorded</th></tr></thead><tbody>`;
  const rows = model.providers.slice().sort((a,b)=>b.current.cost-a.current.cost || b.current.totalTokens-a.current.totalTokens);
  rows.forEach((p,i)=>{
    const c = p.current;
    html+=`<tr><td><span class="u-cell-name"><span class="u-dot" style="background:${seriesColor(p.id,i)}"></span>${providerIcon(p.id)}${esc(p.displayName)}</span></td><td>${c.rows?recordedCost(c):'—'}</td><td>${!c.rows?'—':metricShare(c,current,'cost')!=='—'?metricShare(c,current,'cost'):pricedShare(c,current)?`<span title="Share of priced cost; some usage is unpriced">≈${pricedShare(c,current)}</span>`:'—'}</td><td>${c.rows?recordedTokens(c):'—'}</td><td>${c.rows?fmtTok(c.cacheReadTokens):'—'}</td><td>${c.rows?fmtTok(c.outputTokens):'—'}</td><td>${esc(trendChange(c,p.previous,'totalTokens'))}</td><td>${c.recordedDays}/${model.range.days}</td></tr>`;
  });
  return html+`</tbody></table></div>`;
}

function dayBreakdown(model, metric){
  const top = model.providers.filter(p=>p.current.rows).slice(0,5);
  const cols = new Map(top.map(p=>[p.id,p]));
  const buckets = S.showAllHistory ? model.buckets : model.buckets.slice(-30);
  let html = `<div class="trends-table-wrap"><table class="u-table"><thead><tr><th>${model.buckets[0]?.start===model.buckets[0]?.end?'Day':'Dates'}</th>${top.map(p=>`<th>${esc(p.displayName)}</th>`).join('')}${model.providers.length>top.length?'<th>Other</th>':''}<th>Total</th><th>${metric==='cost'?'Tokens':'Cost'}</th><th>Cached</th></tr></thead><tbody>`;
  for(const b of buckets.slice().reverse()){
    const per = new Map(), other = { cost:0, totalTokens:0, cacheReadTokens:0, outputTokens:0, costKnown:true, tokensKnown:true };
    for(const r of model.rows){
      if(r.date<b.start || r.date>b.end) continue;
      const id = r.providerId.toLowerCase();
      const acc = cols.has(id) ? (per.get(id) || per.set(id,{ cost:0,totalTokens:0,cacheReadTokens:0,outputTokens:0,costKnown:true,tokensKnown:true }).get(id)) : other;
      acc.cost += rowCost(r); acc.totalTokens += rowTotalTokens(r); acc.cacheReadTokens += rowCacheRead(r); acc.outputTokens += rowOutput(r);
      acc.costKnown &&= r.costKnown !== false; acc.tokensKnown &&= r.tokensKnown !== false;
    }
    const label = b.start===b.end ? fmtDay(b.start) : `${fmtDay(b.start)} → ${fmtDay(b.end)}`;
    if(!b.rows){
      html+=`<tr class="u-norecord"><td>${label}</td>${top.map(()=>'<td>—</td>').join('')}${model.providers.length>top.length?'<td>—</td>':''}<td>No record</td><td>—</td><td>—</td></tr>`;
      continue;
    }
    html+=`<tr><td>${label}</td>${top.map(p=>`<td>${per.has(p.id)?esc(recordedMetric(per.get(p.id),metric)):'—'}</td>`).join('')}${model.providers.length>top.length?`<td>${esc(recordedMetric(other,metric))}</td>`:''}<td class="u-strong">${esc(recordedMetric(b,metric))}</td><td>${metric==='cost'?recordedTokens(b):recordedCost(b)}</td><td>${fmtTok(b.cacheReadTokens)}</td></tr>`;
  }
  html+=`</tbody></table></div>`;
  if(model.buckets.length>30) html+=`<button class="action-btn u-more" type="button" id="history-expand">${S.showAllHistory?'Show latest 30':'Show all '+model.buckets.length}</button>`;
  return html;
}

function fmtDay(key){
  const d = parseDateOnly(key);
  return d ? d.toLocaleDateString('en-US',{ month:'short', day:'numeric', timeZone:'UTC' }) : key;
}

// Fetch compact saved daily model rows; never download session reports here.
function ensureModelReports(ids){
  S.modelReports ||= {};
  const pending = [];
  for(const id of ids){
    const cached = S.modelReports[id];
    if(cached && (cached.status==='loading' || Date.now()-cached.at < 30000)){ if(cached.promise) pending.push(cached.promise); continue; }
    S.modelReports[id] = { status:'loading', at:Date.now(), rows:cached?.rows || [] };
    S.modelReports[id].promise = fetch(`/v1/history/models/${encodeURIComponent(id)}`).then(r=>r.ok?r.json():Promise.reject())
      .then(report=>{ S.modelReports[id] = { status:report?.error?'error':'ok', at:Date.now(), rows:normalizeDailyRows(report) }; })
      .catch(()=>{ S.modelReports[id] = { status:'error', at:Date.now(), rows:[] }; })
      .finally(()=>{ if(S.active==='history') renderTrends(); });
    pending.push(S.modelReports[id].promise);
  }
  return Promise.all(pending);
}

// Per provider-day comparison of every retained source (e.g. ccusage vs local
// API-rate estimate). Loaded on demand; differences only when both are priced.
function ensureSourceReport(){
  const cur = S.sourceReport;
  if(typeof fetch!=='function' || (cur && (cur.status==='loading' || Date.now()-cur.at < 30000))) return;
  S.sourceReport = { status:'loading', at:Date.now(), rows:cur?.rows || [] };
  fetch('/v1/history/daily?includeSources=true').then(r=>r.ok?r.json():Promise.reject())
    .then(d=>{ S.sourceReport = { status:'ok', at:Date.now(), rows:(Array.isArray(d)?d:d?.daily||[]).filter(r=>Array.isArray(r.sourceRows) && r.sourceRows.length>1) }; })
    .catch(()=>{ S.sourceReport = { status:'error', at:Date.now(), rows:[] }; })
    .finally(()=>{ if(S.active==='history') renderTrends(); });
}

function sourcesBreakdown(model){
  ensureSourceReport();
  const report = S.sourceReport || { status:'loading', rows:[] };
  const provider = trendsOptions().provider.toLowerCase();
  const days = report.rows.filter(r=>r.date>=model.range.start && r.date<=model.range.end && (!provider || String(r.providerId).toLowerCase()===provider))
    .sort((a,b)=>b.date.localeCompare(a.date) || String(a.providerId).localeCompare(String(b.providerId)));
  if(!days.length){
    return `<div class="trends-empty">${report.status==='loading'?'Loading source comparison…':report.status==='error'?'Could not load source comparison.':'No provider-day in this range has more than one source.'}</div>`;
  }
  const labels = [...new Set(days.flatMap(r=>r.sourceRows.map(costSourceLabel)))].sort();
  // Totals over days where every listed source has a known cost.
  const both = days.filter(r=>labels.every(l=>r.sourceRows.some(x=>costSourceLabel(x)===l && x.costKnown!==false)));
  const sumFor = l=>both.reduce((a,r)=>a+rowCost(r.sourceRows.find(x=>costSourceLabel(x)===l)),0);
  let html = both.length && labels.length===2 ? `<div class="u-range" style="margin:0 0 12px">On ${both.length} provider-day${both.length===1?'':'s'} priced by both: ${labels.map(l=>`${esc(l)} ${fmtUsd(sumFor(l))}`).join(' vs ')} · difference ${fmtUsd(sumFor(labels[1])-sumFor(labels[0]))} (${labels[1]} − ${labels[0]})</div>` : '';
  html += `<div class="trends-table-wrap"><table class="u-table u-sources"><thead><tr><th>Day</th><th>Provider</th>${labels.map(l=>`<th>${esc(l)} cost</th><th>${esc(l)} tokens</th>`).join('')}${labels.length===2?'<th>Cost difference</th>':''}</tr></thead><tbody>`;
  for(const r of days.slice(0, S.showAllHistory?days.length:60)){
    const by = new Map(r.sourceRows.map(x=>[costSourceLabel(x), x]));
    html+=`<tr><td>${esc(fmtDay(r.date))}</td><td><span class="u-cell-name">${providerIcon(String(r.providerId))}${esc(providerDisplayName(r.providerId, r.displayName))}</span></td>`;
    for(const l of labels){
      const x = by.get(l);
      const mark = x?.selected ? ' <span class="u-sel" title="Used in the headline">●</span>' : '';
      // Today's sources are snapshots taken at different times; show when.
      const asOf = x?.ingestedAt && r.date===dateKey(todayUtcDate()) ? `<div class="u-asof">as of ${esc(new Date(x.ingestedAt).toISOString().slice(11,16))} UTC</div>` : '';
      html+= x ? `<td>${esc(recordedCost({cost:rowCost(x),costKnown:x.costKnown!==false}))}${mark}${asOf}</td><td>${esc(recordedTokens({totalTokens:rowTotalTokens(x),tokensKnown:x.tokensKnown!==false}))}</td>` : '<td>—</td><td>—</td>';
    }
    if(labels.length===2){
      const a = by.get(labels[0]), b = by.get(labels[1]);
      const diff = a && b && a.costKnown!==false && b.costKnown!==false ? rowCost(b)-rowCost(a) : null;
      html+=`<td>${diff==null ? '—' : Math.abs(diff)<0.005 ? '$0.00' : esc((diff>0?'+':'−')+fmtUsd(Math.abs(diff)))}</td>`;
    }
    html+=`</tr>`;
  }
  html+=`</tbody></table></div>${days.length>60?`<button class="action-btn u-more" type="button" id="history-expand">${S.showAllHistory?'Show latest 60':'Show all '+days.length}</button>`:''}`;
  return html+`<div class="small-note">● marks the source used in the headline totals. Sources can cover different sessions, so a difference is not necessarily an error; ccusage and local estimates are API-rate estimates, not invoices.</div>`;
}

function modelBreakdown(model){
  const ids = model.providers.filter(p=>p.current.rows).map(p=>p.id);
  ensureModelReports(ids);
  const reports = ids.map(id=>[id, S.modelReports[id]]);
  const loading = reports.some(([,r])=>r?.status==='loading');
  const failed = reports.some(([,r])=>r?.status==='error');
  const daily = new Map();
  for(const [id, report] of reports){
    for(const r of report?.rows || []){
      if(r.date>=model.range.start && r.date<=model.range.end) daily.set(id+'\u0000'+r.date, r);
    }
  }
  // Prefer the headline's source when it already has model detail.
  for(const r of model.rows){
    if(Object.keys(r.models||{}).length) daily.set(r.providerId.toLowerCase()+'\u0000'+r.date, r);
  }
  const map = new Map();
  for(const r of daily.values()){
    const entries = Object.entries(r.models||{});
    for(const [name, m] of entries){
      const id = r.providerId.toLowerCase(), key = id+'\u0000'+name;
      const cur = map.get(key) || { id, name, cost:0, tokens:0, cached:0, sessions:0, costKnown:true, sessionsKnown:true };
      cur.cost += rowCost(m); cur.tokens += rowTotalTokens(m); cur.cached += rowCacheRead(m);
      cur.costKnown &&= m.costKnown === true;
      cur.sessionsKnown &&= Number.isSafeInteger(m.sessions);
      cur.sessions += Number.isSafeInteger(m.sessions) ? m.sessions : 0;
      map.set(key, cur);
    }
  }
  const rows = [...map.values()].sort((a,b)=>b.cost-a.cost || b.tokens-a.tokens);
  if(!rows.length){
    return `<div class="trends-empty">${loading?'Loading daily model history…':failed?'Could not load daily model history.':'No saved per-model daily data in this range. Local history is prepared in the background; older records may have no model detail.'}</div>`;
  }
  const totalCost = rows.reduce((a,r)=>a+r.cost,0), allPriced = rows.every(r=>r.costKnown);
  // Shares are of priced model cost; unpriced models show a dash, as in T3.
  const pricedCost = rows.filter(r=>r.costKnown).reduce((a,r)=>a+r.cost,0);
  const dailyCost = model.providers.filter(p=>ids.includes(p.id)).reduce((a,p)=>a+p.current.cost,0);
  const drift = Math.abs(totalCost-dailyCost) > Math.max(0.01, dailyCost*0.01);
  const missing = model.rows.filter(r=>!daily.get(r.providerId.toLowerCase()+'\u0000'+r.date)?.models || !Object.keys(daily.get(r.providerId.toLowerCase()+'\u0000'+r.date).models).length).length;
  const pricingDates = [...new Set([...daily.values()].map(r=>r.pricingAsOf).filter(Boolean))].sort();
  let html = `<div class="trends-table-wrap"><table class="u-table"><thead><tr><th>Model</th><th>Cost</th><th>Share of priced cost</th><th>Tokens</th><th>Cached input</th><th>Session-days</th></tr></thead><tbody>`;
  for(const r of rows.slice(0,40)){
    html+=`<tr><td><span class="u-cell-name">${providerIcon(r.id)}${esc(r.name)}</span></td><td>${recordedCost(r)}</td><td>${r.costKnown?shareText(r.cost,pricedCost):'—'}</td><td>${fmtTok(r.tokens)}</td><td>${fmtTok(r.cached)}</td><td>${r.sessionsKnown?r.sessions.toLocaleString('en-US'):'—'}</td></tr>`;
  }
  html+=`</tbody></table></div><div class="small-note">${loading?'Updating daily model history… ':''}${failed?'Some model history could not be loaded. ':''}Usage is assigned to its actual UTC day. Session-days count a session once on each active day.${missing?` Model detail is missing for ${missing} provider-day${missing===1?'':'s'}.`:''}${drift?` Model costs total ${recordedCost({cost:totalCost,costKnown:allPriced})}; saved daily totals are ${recordedCost(model.current)}. Sources or coverage differ.`:''} Local-log costs use standard API-rate estimates, not subscription charges.${pricingDates.length?` Rates dated ${esc(pricingDates.join(', '))} also apply to historical usage.`:''}</div>`;
  return html;
}

// Top of a four-step axis whose step is a round number (e.g. $600 → $2.4K).
function niceMax(v){
  if(!(v>0)) return 1;
  const raw = v/4, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw/p;
  return 4*p*[1,1.5,2,2.5,3,4,5,6,8,10].find(c=>n<=c+1e-9);
}

// Monotone cubic (d3 curveMonotoneX): smooth without overshooting below zero.
function monotonePath(pts){
  const n = pts.length;
  if(n===1) return `L${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  const s = [], t = [];
  for(let i=0;i<n-1;i++) s.push((pts[i+1][1]-pts[i][1])/((pts[i+1][0]-pts[i][0])||1));
  for(let i=1;i<n-1;i++){
    const h0 = pts[i][0]-pts[i-1][0], h1 = pts[i+1][0]-pts[i][0], p = (s[i-1]*h1+s[i]*h0)/(h0+h1);
    t[i] = (Math.sign(s[i-1])+Math.sign(s[i]))*Math.min(Math.abs(s[i-1]),Math.abs(s[i]),0.5*Math.abs(p)) || 0;
  }
  t[0] = n>2 ? (3*s[0]-t[1])/2 : s[0];
  t[n-1] = n>2 ? (3*s[n-2]-t[n-2])/2 : s[0];
  let d = `L${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<n-1;i++){
    const h = (pts[i+1][0]-pts[i][0])/3;
    d += `C${(pts[i][0]+h).toFixed(1)},${(pts[i][1]+t[i]*h).toFixed(1)} ${(pts[i+1][0]-h).toFixed(1)},${(pts[i+1][1]-t[i+1]*h).toFixed(1)} ${pts[i+1][0].toFixed(1)},${pts[i+1][1].toFixed(1)}`;
  }
  return d;
}

function trendsChart(buckets, metric, layers){
  // Keep large imports readable without dropping any totals from the chart.
  const stride = Math.max(1,Math.ceil(buckets.length/180));
  const flag = knownFlag(metric);
  const series = layers?.length ? layers : [{ id:'all', name:'All', color:'var(--blue)', values:buckets.map(b=>metricOf(b,metric)), known:buckets.map(b=>b[flag]!==false) }];
  const points = [];
  for(let i=0;i<buckets.length;i+=stride){
    const group = buckets.slice(i,i+stride);
    points.push({ start:group[0].start, end:group[group.length-1].end,
      value:sum(group,metric), days:sum(group,'days'), recordedDays:sum(group,'recordedDays'),
      parts:series.map(l=>l.values.slice(i,i+stride).reduce((a,v)=>a+v,0)),
      partsKnown:series.map(l=>(l.known||[]).slice(i,i+stride).every(k=>k!==false)),
      known:group.every(b=>b[flag]!==false) });
  }
  const W=960,H=300,L=64,R=14,T=14,B=30,CW=W-L-R,CH=H-T-B;
  const max = niceMax(Math.max(0,...points.flatMap(p=>p.parts)));
  const x = i => points.length===1 ? L+CW/2 : L+CW*i/(points.length-1);
  const y = v => T+CH*(1-v/max);
  const fmt = v=>metric==='cost'?'$'+v.toFixed(2):fmtTok(v);
  const axis = v=>metric==='cost'?(v>=1000?'$'+(+(v/1000).toFixed(2))+'K':'$'+(v<10&&v%1?v.toFixed(2):v.toFixed(0))):v>=1e9?+(v/1e9).toFixed(2)+'B':v>=1e6?+(v/1e6).toFixed(1)+'M':v>=1e3?+(v/1e3).toFixed(1)+'K':String(+v.toFixed(1));
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(USAGE_METRICS[metric]?.title||'Usage')} by provider; days without a saved record plot as zero" data-l="${L}" data-cw="${CW}" data-n="${points.length}"><title>Recorded ${metric==='cost'?'cost':'usage'} by period. Totals are also available in the breakdown table.</title>`;
  for(let i=0;i<=4;i++){
    const v = max*i/4, yy = y(v);
    svg+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--bd)"${i?'':' stroke-width="1.5"'}/><text x="${L-10}" y="${yy+4}" text-anchor="end" fill="var(--su)" font-size="11">${esc(axis(v))}</text>`;
  }
  svg+=`<defs>${series.map((l,li)=>`<linearGradient id="u-fade-${li}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${l.color}" stop-opacity=".28"/><stop offset="1" stop-color="${l.color}" stop-opacity="0"/></linearGradient>`).join('')}</defs>`;
  // Largest series last so it draws on top; small ones stay visible beneath.
  series.forEach((layer,li)=>{
    if(!points.some(p=>p.parts[li]>0)) return;
    if(points.length===1){
      svg+=`<circle cx="${x(0).toFixed(1)}" cy="${y(points[0].parts[li]).toFixed(1)}" r="3" fill="${layer.color}"/>`;
      return;
    }
    const line = monotonePath(points.map((p,i)=>[x(i), y(p.parts[li])]));
    svg+=`<path d="M${line.slice(1)}L${x(points.length-1).toFixed(1)},${y(0)}L${x(0).toFixed(1)},${y(0)}Z" fill="url(#u-fade-${li})"/>`;
    svg+=`<path d="M${line.slice(1)}" fill="none" stroke="${layer.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  svg+=`<g class="u-dots" opacity="0">${series.map((l,li)=>`<circle r="4" cx="0" cy="0" fill="${l.color}" stroke="var(--s0)" stroke-width="2" data-li="${li}"/>`).join('')}</g>`;
  svg+=`<g pointer-events="none">`;
  points.forEach((p,i)=>{
    const label = `${p.start}${p.end!==p.start?' → '+p.end:''}: ${!p.recordedDays?'No record':p.known?fmt(p.value):fmtMetricValue(metric,p.value,false)} · ${p.recordedDays}/${p.days} days recorded`;
    svg+=`<circle cx="${x(i).toFixed(1)}" cy="${y(p.parts.reduce((a,v)=>a+v,0)).toFixed(1)}" r="0"><title>${esc(label)}</title></circle>`;
  });
  svg+=`</g>`;
  const labelEvery = Math.max(1,Math.ceil(points.length/6));
  points.forEach((p,i)=>{
    if(i%labelEvery===0 || i===points.length-1){
      if(i!==points.length-1 && points.length-1-i < labelEvery/2) return;
      const anchor = i===0?'start':i===points.length-1?'end':'middle';
      svg+=`<text x="${x(i)}" y="${H-8}" text-anchor="${points.length===1?'middle':anchor}" fill="var(--su)" font-size="10.5" letter-spacing=".04em">${esc(fmtDay(p.start).toUpperCase())}</text>`;
    }
  });
  svg+=`<line class="u-guide" x1="0" x2="0" y1="${T}" y2="${T+CH}" stroke="var(--mu)" stroke-dasharray="3 3" opacity="0"/>`;
  S.chartPoints = { points, series, metric, max, T, CH };
  return svg+'</svg>'+(stride>1?`<div class="small-note">Each point combines up to ${stride} adjacent buckets. Export retains daily detail.</div>`:'');
}

function wireUsageChart(el){
  const svg = el?.querySelector?.('svg');
  const tip = document.getElementById('tip');
  if(!svg || !tip || !svg.getBoundingClientRect) return;
  const guide = svg.querySelector('.u-guide');
  const inspect=(e,forcedIndex)=>{
    const data = S.chartPoints; if(!data?.points.length) return;
    const box = svg.getBoundingClientRect(), scale = 960/box.width;
    const L = +svg.dataset.l, CW = +svg.dataset.cw, n = data.points.length;
    const i = forcedIndex??(n===1 ? 0 : Math.max(0, Math.min(n-1, Math.round(((e.clientX-box.left)*scale - L)/CW*(n-1)))));
    const p = data.points[i], gx = n===1 ? L+CW/2 : L+CW*i/(n-1);
    guide.setAttribute('x1',gx); guide.setAttribute('x2',gx); guide.setAttribute('opacity','.7');
    const dots = svg.querySelector('.u-dots');
    dots.setAttribute('opacity','1');
    for(const c of dots.children){
      const v = p.parts[+c.dataset.li];
      c.setAttribute('cx',gx); c.setAttribute('cy',data.T+data.CH*(1-v/data.max));
      c.style.display = v>0 || data.series.length===1 ? '' : 'none';
    }
    const rows = data.series.map((l,li)=>[l,p.parts[li],p.partsKnown[li]]).filter(([,v,k])=>v>0 || k===false).reverse();
    const selected=trendsOptions().provider.toLowerCase(),records=S.dailyRows.filter(r=>r.date>=p.start&&r.date<=p.end&&(!selected||r.providerId.toLowerCase()===selected));
    tip.innerHTML = detailHtml(dailyDetail(records,p.start===p.end?fmtDay(p.start):fmtDay(p.start)+' → '+fmtDay(p.end)))+
      (data.series.length>1 ? rows.map(([l,v,k])=>`<div class="tt-row"><span class="u-dot" style="background:${l.color}"></span><span>${esc(l.name)}</span><b>${esc(fmtMetricValue(data.metric,v,k))}</b></div>`).join('') : '')+
      `<div class="tt-meta">${p.recordedDays}/${p.days} days recorded</div>`;
    tip.style.display = 'block';
    positionTooltip(e.clientX,e.clientY);
  };
  svg.addEventListener('mousemove',e=>inspect(e));svg.addEventListener('click',e=>inspect(e));
  wireChartKeyboard(svg,(index,event)=>inspect(event,index),S.chartPoints?.points.length||1);
  svg.addEventListener('mouseleave', event=>{ if(event.relatedTarget?.closest?.('#tip'))return;tip.style.display='none'; guide.setAttribute('opacity','0'); svg.querySelector('.u-dots').setAttribute('opacity','0'); });
}

  const lines = [
    ['date','provider_id','display_name','source','input_tokens','output_tokens','reasoning_tokens','cache_write_tokens','cache_read_tokens','total_tokens','cost_usd','ingested_at','tokens_known','cost_known','sessions','cache_read_savings_usd','cost_source','pricing_as_of','input_cost_usd','cache_read_cost_usd','cache_write_cost_usd','output_cost_usd'].join(',')

function exportQuotaCsv(){
  const lines = [['captured_at','provider_id','display_name','source','plan','primary_percent','progress_label','progress_used','progress_limit','reset_at'].join(',')];
  for(const s of orderedSnapshots()){
    const progress = (s.metrics||[]).filter(m=>m.type==='progress');
    if(!progress.length){
      lines.push([s.fetchedAt||'',s.providerId,s.displayName||'',s.source||'',s.plan||'',primaryPercentOf(s)??'','','','',''].map(csvCell).join(','));
      continue;
    }
    for(const m of progress){
      lines.push([
        s.fetchedAt||'',
        s.providerId,
        s.displayName||'',
        s.source||'',
        s.plan||'',
        m.format?.kind==='percent' && m.limit>0 ? pct(m).toFixed(1) : '',
        m.label||'',
        m.used ?? '',
        m.limit ?? '',
        m.resetsAt || '',
      ].map(csvCell).join(','));
    }
  }
  downloadText(`usagestat-quota-${dateKey(todayUtcDate())}.csv`, lines.join('\r\n'), 'text/csv;charset=utf-8');
}

function downloadText(filename, content, type){
  const blob = new Blob([content], { type:type || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

    root.querySelector('#'+id).addEventListener('change',event=>setDashboardPref(key,event.target.value));
  }
  root.querySelector('#setting-refresh').addEventListener('change',event=>setDashboardPref('refreshSeconds',Number(event.target.value)));
  for(const [id,key] of [['setting-icons','icons'],['setting-summary','summary']])root.querySelector('#'+id).addEventListener('change',event=>setDashboardPref(key,event.target.checked));

}

function settingsNavigation(){

}
function bindSettingsNavigation(root){root.querySelectorAll('.settings-tab').forEach(button=>button.addEventListener('click',()=>{if(S.settingsSection==='collection'&&S.collectionDirty)S.collectionDrafts=captureCollectionDrafts();S.settingsSection=button.dataset.section;renderSettings(true);}));}
function preferenceSelect(key,label,options){return `<div class="setting-row"><label for="pref-${key}">${label}</label><select class="ctrl-select" id="pref-${key}" data-pref="${key}">${options.map(([value,name])=>selectOption(value,name,String(S.prefs[key]))).join('')}</select></div>`;}
function preferenceCheck(key,label){return `<div class="setting-row"><label for="pref-${key}">${label}</label><input type="checkbox" id="pref-${key}" data-pref="${key}"${S.prefs[key]?' checked':''}></div>`;}
function displayAppearanceHtml(){return preferenceSelect('iconStyle','Default icon style',[['color','Colour'],['monochrome','Monochrome']])+

  `<div class="setting-row"><label for="pref-customAccent">Custom meter colour<span class="setting-hint">Leave empty to use the selected accent.</span></label><input class="ctrl-input" id="pref-customAccent" data-pref="customAccent" placeholder="#7289da" value="${esc(S.prefs.customAccent)}"></div>`+
  `<div class="setting-row"><label for="pref-neutralColor">Monochrome logo colour<span class="setting-hint">Leave empty to follow the theme.</span></label><input class="ctrl-input" id="pref-neutralColor" data-pref="neutralColor" placeholder="#e6edf3" value="${esc(S.prefs.neutralColor)}"></div>`;}
function providerDisplayExtras(id,snapshot,pref){

function bindDisplayExtras(root){
  root.querySelectorAll('[data-pref]').forEach(input=>input.addEventListener('change',()=>setDashboardPref(input.dataset.pref,input.type==='checkbox'?input.checked:input.type==='number'?Number(input.value):input.value)));
  root.querySelectorAll('[data-shortcut]').forEach(input=>input.addEventListener('change',()=>{S.prefs.shortcuts[input.dataset.shortcut]=input.value;refreshSettings();}));
  root.querySelectorAll('[data-component]').forEach(input=>input.addEventListener('change',()=>{const values=S.prefs.components.filter(c=>c!==input.dataset.component);if(input.checked)values.push(input.dataset.component);setDashboardPref('components',values);}));
  root.querySelectorAll('[data-component-move]').forEach(button=>button.addEventListener('click',()=>{const values=S.prefs.components.slice(),i=values.indexOf(button.dataset.component),next=i+Number(button.dataset.direction);if(i>=0&&next>=0&&next<values.length){[values[i],values[next]]=[values[next],values[i]];setDashboardPref('components',values);}}));
  root.querySelectorAll('[data-threshold]').forEach(row=>row.querySelectorAll('[data-threshold-field]').forEach(input=>input.addEventListener('change',()=>{const t=S.prefs.thresholds.find(t=>t.id===row.dataset.threshold);if(t){t[input.dataset.thresholdField]=input.type==='checkbox'?input.checked:input.type==='number'?Number(input.value):input.value;refreshSettings();}})));
  root.querySelectorAll('[data-delete-threshold]').forEach(button=>button.addEventListener('click',()=>setDashboardPref('thresholds',S.prefs.thresholds.filter(t=>t.id!==button.dataset.deleteThreshold))));
  root.querySelector('#add-threshold')?.addEventListener('click',()=>{if(S.prefs.thresholds.length<12)setDashboardPref('thresholds',[...S.prefs.thresholds,{id:'threshold-'+Date.now(),name:'New threshold',percent:85,color:'#ce8670',notify:false}]);});
  root.querySelector('#enable-notifications')?.addEventListener('click',async()=>{if(S.prefs.notifications){setDashboardPref('notifications',false);return;}if(typeof Notification==='undefined'){settingsStatus('This browser does not support notifications.',true);return;}const permission=await Notification.requestPermission();setDashboardPref('notifications',permission==='granted');if(permission!=='granted')settingsStatus('Browser notifications were not enabled.',true);});
  root.querySelectorAll('.provider-setting').forEach(row=>row.querySelectorAll('[data-metric-key]').forEach(input=>input.addEventListener('change',()=>{const pref=providerSetting(row.dataset.provider),values=(pref.hiddenMetrics||[]).filter(v=>v!==input.dataset.metricKey);if(!input.checked)values.push(input.dataset.metricKey);updateProviderSetting(row.dataset.provider,'hiddenMetrics',values);})));
  root.querySelectorAll('[data-clear-icon]').forEach(button=>button.addEventListener('click',()=>updateProviderSetting(button.dataset.clearIcon,'customIcon','')));
  root.querySelectorAll('[data-custom-icon]').forEach(input=>input.addEventListener('change',async()=>{
    const file=input.files?.[0];if(!file)return;
    if(file.size>380*1024||!['image/png','image/jpeg','image/webp'].includes(file.type)){settingsStatus('Choose a PNG, JPEG or WebP image smaller than 380 KB.',true);return;}
    const reader=new FileReader();reader.onload=()=>updateProviderSetting(input.dataset.customIcon,'customIcon',String(reader.result));reader.onerror=()=>settingsStatus('Could not read that image.',true);reader.readAsDataURL(file);
  }));
}

function collectionField(key,label,value='',hint='',secret=false,configured=false){return `<div class="collection-field"><label>${esc(label)}<input class="ctrl-input" name="${key}" type="${secret?'password':'text'}" value="${esc(value)}" placeholder="${configured?'Saved · leave empty to keep':esc(hint)}" autocomplete="off"${secret?' data-secret="true"':''}></label>${secret?`<label class="settings-note"><input type="checkbox" data-clear="${key}"> Clear saved value</label>`:''}</div>`;}

function renderCollectionSettings(root){
  const data=Backend?.data;
  root.innerHTML=`<div class="settings-heading"><div><h1>Collection settings</h1><p class="settings-description">Configure what this backend measures. Changes are shared with Bar and other clients. Display settings remain independent.</p></div><button class="action-btn" onclick="switchTab('overview')">Back to Overview</button></div>${settingsNavigation()}
    <p class="settings-status${S.collectionError?' is-error':''}" id="collection-status" role="status">${esc(S.collectionError||S.collectionMessage||(!data?'Loading collection settings…':''))}</p><div class="settings-actions"><button class="action-btn" id="reload-collection">Reload collection settings</button></div>`;
  bindSettingsNavigation(root);
  root.querySelector('#reload-collection').addEventListener('click',()=>{S.collectionDirty=false;S.collectionDrafts=null;loadCollectionSettings();});
  if(!data&&S.collectionKeyFile){
    root.insertAdjacentHTML('beforeend',`<section class="settings-section"><h2>Unlock collection settings</h2><p>Choose this backend’s private setup key file: <code>${esc(S.collectionKeyFile)}</code></p><p class="settings-note">This proves access to your local profile. It is separate from provider API keys. The file contents stay out of display preferences; access lasts until this backend restarts.</p><label for="collection-key-file">Choose local setup key</label><input type="file" id="collection-key-file" accept=".key,text/plain"></section>`);
    root.querySelector('#collection-key-file').addEventListener('change',async event=>{

        const key=(await file.text()).trim();if(!/^[a-fA-F0-9]{64}$/.test(key))throw new Error('Choose the backend’s dashboard-setup.key file.');
        await loadCollectionSettings(key);
      }catch(error){collectionStatus(error.message,true);}
    });
  }
  if(!data){if(!S.collectionLoading&&!S.collectionError)loadCollectionSettings();return;}
  const groups=data.providers.slice().sort((a,b)=>Number(b.enabled)-Number(a.enabled)||(a.displayName||a.id).localeCompare(b.displayName||b.id));
  root.insertAdjacentHTML('beforeend',`<form class="settings-section collection-provider" id="collection-global"><h2>Polling and provider discovery</h2><p>Polling measures usage; refreshing the view only reads saved measurements.</p><div class="collection-fields"><div class="collection-field"><label for="collection-refresh">Poll every · seconds</label><input class="ctrl-input" type="number" min="5" max="86400" id="collection-refresh" name="refreshSec" value="${data.refreshSec}"${data.refreshOverride!=null?' disabled':''}><span class="setting-hint">${data.refreshOverride!=null?'This daemon was launched with a polling override of '+data.effectiveRefreshSec+' seconds.':'Applies without restarting the daemon.'}</span></div><div class="collection-field"><label for="collection-plugins">Additional plugin directories · one per line</label><textarea id="collection-plugins" name="pluginDirs">${esc(data.pluginDirs.join('\n'))}</textarea></div></div><div class="settings-actions"><button class="action-btn" type="submit">Save polling settings</button></div></form>
    <section class="settings-section collection-provider"><h2>Add another account or source</h2><p>Create an independent measurement source. New sources start with collection paused until you configure and enable them.</p><form id="collection-add" class="collection-fields"><div class="collection-field"><label>Provider</label><select class="ctrl-select" name="id">${data.catalog.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></div><div class="collection-field"><label>Source name</label><input class="ctrl-input" name="displayName" placeholder="Work account"></div><button class="action-btn" type="submit">Add source</button></form></section>
    <div id="collection-providers">${groups.map(entry=>{
      const catalog=data.catalog.find(p=>p.id===entry.id),key=UsageDashboardBackend.key(entry),name=entry.displayName||catalog?.name||entry.id;
      return `<details class="settings-section collection-provider" data-collection-key="${esc(key)}"><summary>${providerIcon(key)}${esc(name)} <span class="badge">${entry.enabled?'Collecting':'Paused'}</span><span class="setting-hint">${esc(entry.instanceId||entry.id)}</span></summary><form data-collection-form="${esc(key)}"><div class="collection-fields">
        <label><input type="checkbox" name="enabled"${entry.enabled?' checked':''}> Measure this source</label>
        <div class="collection-field"><label>Usage source<select class="ctrl-select" name="source">${UsageDashboardBackend.modes(catalog).map(mode=>selectOption(mode,mode==='auto'?'Auto · '+(catalog?.autoMode||'provider default'):mode,entry.source)).join('')}</select></label></div>
        ${collectionField('displayName','Source name',entry.displayName||'')}
        ${collectionField('apiKey','API key or token','','Provider API token',true,entry.apiKeyConfigured)}
        ${collectionField('cookieHeader','Session cookie header','','name=value; other=value',true,entry.cookieHeaderConfigured)}
        ${collectionField('region','Region',entry.region||'','Provider-specific region')}
        ${collectionField('workspaceId','Workspace / project ID',entry.workspaceId||'')}
        ${collectionField('customCommand','Custom usage command','','Command that returns usage JSON',true,entry.customCommandConfigured)}
        <div class="full"><p class="settings-note">Auto uses the provider’s normal local credential discovery. API keys and cookies override discovery where supported by the chosen source. Saving does not sign in to the provider. Enabled Custom commands run locally with your user permissions.</p></div>
        <details class="full"><summary>Provider-specific settings</summary><p class="settings-note">Edit named provider settings as text, numbers or true / false. Existing saved secrets remain hidden and are preserved unless replaced or cleared.</p><table class="setting-table"><tbody>${Object.entries(entry.settings||{}).map(([key,value])=>settingEditorRow(key,value)).join('')}${settingEditorRow()}</tbody></table><button class="action-btn" type="button" data-add-setting>Add setting</button></details>

  });
  restoreCollectionDrafts(root);

function captureCollectionDrafts(exclude){
  const result=new Map();
  document.getElementById('panel-settings').querySelectorAll('form').forEach(form=>{
    const key=form.dataset.collectionForm||form.getAttribute('id');if(form.dataset.dirty!=='true'||key===exclude)return;
    const fields=[...form.querySelectorAll('[name]')].map(input=>({name:input.name,value:input.value,checked:input.checked}));
    const settings=[...form.querySelectorAll('[data-extra-setting]')].map(row=>({name:row.querySelector('[data-setting-name]').value,value:row.querySelector('[data-setting-value]').value,type:row.querySelector('[data-setting-type]').value,secret:row.querySelector('[data-setting-value]').dataset.secret==='true',clear:row.querySelector('[data-setting-clear]').checked}));
    result.set(key,{fields,settings,open:form.closest('details')?.open});
  });
  return result;
}
function restoreCollectionDrafts(root){
  let restored=false;root.querySelectorAll('form').forEach(form=>{const key=form.dataset.collectionForm||form.getAttribute('id'),draft=S.collectionDrafts?.get(key);if(!draft)return;
    draft.fields.forEach(field=>{const input=form.elements.namedItem(field.name);if(input){input.value=field.value;if(input.type==='checkbox')input.checked=field.checked;}});
    const tbody=form.querySelector('tbody');if(tbody){tbody.innerHTML=draft.settings.map(row=>settingEditorRow(row.name,{type:row.type,secret:row.secret,configured:row.secret})).join('');[...tbody.children].forEach((row,i)=>{row.querySelector('[data-setting-value]').value=draft.settings[i].value;row.querySelector('[data-setting-clear]').checked=draft.settings[i].clear;});}
    if(draft.open&&form.closest('details'))form.closest('details').open=true;form.dataset.dirty='true';restored=true;
  });S.collectionDirty=restored;
}
function collectionStatus(message,error=false){S.collectionError=error?message:'';S.collectionMessage=error?'':message;const el=document.getElementById('collection-status');if(el){el.textContent=message;el.className='settings-status'+(error?' is-error':'');}}
async function loadCollectionSettings(setupKey){
  if(S.collectionLoading)return;S.collectionLoading=true;
  try{if(!Backend)throw new Error('Collection settings require the local backend.');await Backend.load(typeof setupKey==='string'?setupKey:undefined);S.collectionError='';S.collectionMessage='Collection settings loaded.';}
  catch(error){S.collectionError=error.message;if(error.keyFile)S.collectionKeyFile=error.keyFile;}
  finally{S.collectionLoading=false;if(S.active==='settings'&&S.settingsSection==='collection')renderSettings(true);}
}
function collectionFormPatch(form){
  const entry=Backend.data.providers.find(p=>UsageDashboardBackend.key(p)===form.dataset.collectionForm);
  const patch={id:entry.id,...(entry.instanceId?{instanceId:entry.instanceId}:{}),enabled:form.elements.enabled.checked,source:form.elements.source.value,settings:Object.create(null)};
  for(const key of ['displayName','region','workspaceId'])patch[key]=form.elements[key].value.trim()||null;
  for(const key of ['apiKey','cookieHeader','customCommand']){
    if(form.querySelector(`[data-clear="${key}"]`).checked)patch[key]=null;
    else if(form.elements[key].value.trim())patch[key]=form.elements[key].value;
  }
  form.querySelectorAll('[data-extra-setting]').forEach(row=>{
    const key=row.querySelector('[data-setting-name]').value.trim();if(!key)return;
    if(!/^[a-zA-Z0-9][a-zA-Z0-9_.:-]{0,127}$/.test(key)||['__proto__','constructor','prototype'].includes(key))throw new Error('Use a valid provider setting name.');
    const input=row.querySelector('[data-setting-value]');
    if(row.querySelector('[data-setting-clear]').checked)patch.settings[key]=null;
    else if(!input.dataset.secret||input.value)patch.settings[key]=UsageDashboardBackend.settingValue(input.value,row.querySelector('[data-setting-type]').value);
  });
  return patch;
}
async function saveCollectionPatch(patch,savedForm){
  if(S.collectionSaving)return;S.collectionSaving=true;collectionStatus('Saving collection settings…');
  try{const drafts=captureCollectionDrafts(savedForm);await Backend.save(patch);S.collectionDrafts=drafts;S.collectionDirty=false;S.collectionError='';S.collectionMessage='Saved. Collection reloads automatically; display preferences were preserved.';if(S.active==='settings')renderSettings(true);await load();}
  catch(error){collectionStatus(error.message,true);}
  finally{S.collectionSaving=false;}
}
function checkThresholdNotifications(){
  const previous=S.thresholdObservations||(S.thresholdObservations=new Map());
  for(const snap of S.snapshots){
    const metric=UsageDashboardSettings.primary(snap,S.prefs),used=metric?metric.used/metric.limit*100:null;
    if(used==null||snapshotHasError(snap)||(snap.state&&snap.state!=='ready')||!Number.isFinite(+new Date(snap.fetchedAt))||Date.now()-new Date(snap.fetchedAt)>600000||new Date(snap.fetchedAt)>Date.now())continue;
    const key=snap.providerId+':'+metric.label,prior=previous.get(key),ts=+new Date(snap.fetchedAt);
    if(prior&&prior.ts>=ts)continue;const old=prior?.used;previous.set(key,{used,ts});
    if(old==null||!S.prefs.notifications||!providerSetting(snap.providerId).visible||typeof Notification==='undefined'||Notification.permission!=='granted')continue;
    const crossed=S.prefs.thresholds.filter(t=>t.notify&&old<t.percent&&used>=t.percent).at(-1);
    if(crossed)new Notification(providerName(snap.providerId)+' · '+crossed.name,{body:metric.label+': '+used.toFixed(1)+'% used',tag:'usagestat-'+snap.providerId});
  }
}

function loadPrefs(){
  try{
    const raw = localStorage.getItem(UsageDashboardSettings.STORAGE_KEY);
    return cleanPreferences(raw ? JSON.parse(raw) : {});
  }catch{
    return cleanPreferences({});
  }
}

function cleanPreferences(value){
  return UsageDashboardSettings.normalize(value);
}
function exportPreferences(){downloadText('usagestat-preferences.json',JSON.stringify({version:1,preferences:cleanPreferences(S.prefs)},null,2),'application/json');}
document.getElementById('prefs-file').addEventListener('change',async event=>{
  const notice=document.getElementById('prefs-notice');
  try{
    const file=event.target.files[0]; if(!file)return;
    if(file.size>2*1024*1024)throw new Error('Preferences file is too large.');
    const data=JSON.parse(await file.text());
    if(data.version!==1)throw new Error('Unsupported preferences version.');
    S.prefs=cleanPreferences(data.preferences);refreshSettings('Preferences imported.');
    notice.textContent=S.storageError?'Preferences imported for this session; browser storage is unavailable.':'Preferences imported.';
  }catch(error){notice.textContent=error.message||'Could not import preferences.';settingsStatus(notice.textContent,true);}
  event.target.value='';
});

function savePrefs(){
  try{ localStorage.setItem(UsageDashboardSettings.STORAGE_KEY, JSON.stringify(cleanPreferences(S.prefs)));S.storageError=false; }
  catch{S.storageError=true;settingsStatus('Browser storage is unavailable. Changes apply to this session only.',true);}
}

function debounce(fn, ms){
  let timer = null;
  return (...args)=>{
    clearTimeout(timer);
    timer = setTimeout(()=>fn(...args), ms);
  };
}
