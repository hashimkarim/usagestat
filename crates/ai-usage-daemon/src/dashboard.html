function renderStatsSection(id, snap, rawHistory, reports){
  const box = document.getElementById(`stats-box-${id}`);
  if(!box) return;
  box.innerHTML = `<div class="box-title">Usage Analytics</div>` + buildUsageAnalytics(id, snap, rawHistory, reports);
  // Narrow screens scroll the calendar; start at the most recent week.
  box.querySelectorAll('.cal-scroll').forEach(el=>{ el.scrollLeft = el.scrollWidth; });
  box.querySelectorAll('.usage-tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      box.querySelectorAll('.usage-tab').forEach(b=>b.classList.toggle('active', b===btn));
      box.querySelectorAll('.usage-panel').forEach(p=>p.classList.toggle('active', p.dataset.panel===btn.dataset.panel));
      const report = btn.dataset.panel==='sessions' ? 'session' : btn.dataset.panel==='blocks' ? 'blocks' : null;
      if(!report) return;
      const pane = box.querySelector(`.usage-panel[data-panel="${btn.dataset.panel}"]`);
      if(pane.dataset.loaded) return;
      pane.dataset.loaded = 'loading';
      pane.innerHTML = '<div class="chart-loading">Loading local usage…</div>';
      fetch(`/v1/local-usage/${encodeURIComponent(id)}/${report}?limit=80`).then(r=>r.ok?r.json():Promise.reject())
        .then(data=>{
          if(data?.error) throw new Error('unavailable');
          const rows = reportRows(data,report);
          pane.innerHTML = rows.length ? (report==='session'?sessionTable(rows):blockTable(rows)) : emptyUsage('No local usage in this report');
          if(data.totalRows>rows.length) pane.innerHTML += `<div class="small-note">Showing ${rows.length} of ${data.totalRows.toLocaleString('en-US')} rows.</div>`;
          pane.dataset.loaded = 'yes';
        }).catch(()=>{ pane.innerHTML=emptyUsage('Could not load local usage. Select this tab to retry.'); delete pane.dataset.loaded; });
    });
  });
}

function buildUsageAnalytics(id, snap, rawHistory, reports){
  const progress = (snap.metrics||[]).filter(m=>m.type==='progress');
  const text = (snap.metrics||[]).filter(m=>m.type==='text');
  const badges = (snap.metrics||[]).filter(m=>m.type==='badge');
  const percent = progress.filter(m=>m.format?.kind==='percent'&&m.limit>0);
  const counts = progress.filter(m=>m.format?.kind==='count');
  const dollars = progress.filter(m=>m.format?.kind==='dollars');
  const highest = percent.slice().sort((a,b)=>pct(b)-pct(a))[0];
  const nextReset = progress
    .filter(m=>m.resetsAt)
    .sort((a,b)=>new Date(a.resetsAt)-new Date(b.resetsAt))[0];
  const exhausted = percent.filter(m=>pct(m)>=95).length;
  const averageUsage = percent.length ? percent.reduce((a,m)=>a+pct(m),0)/percent.length : null;
  const dailyRows = reportRows(reports?.daily, 'daily');
  const weeklyRows = reportRows(reports?.weekly, 'weekly');
  const monthlyRows = reportRows(reports?.monthly, 'monthly');
  const sessionRows = reportRows(reports?.session, 'session');
  const blockRows = reportRows(reports?.blocks, 'blocks');
  const fallbackDaily = dailyRows.length ? dailyRows : S.dailyRows.filter(r=>r.providerId.toLowerCase()===id.toLowerCase());
  const totals = usageTotals(fallbackDaily);
  const today = fallbackDaily.find(r=>rowDate(r)===new Date().toISOString().slice(0,10));
  const activeDays = fallbackDaily.filter(r=>rowTotalTokens(r)>0 || rowCost(r)>0).length;
  const modelBasis = dailyRows.length ? dailyRows :
    sessionRows.length ? sessionRows :
    weeklyRows.length ? weeklyRows :
    monthlyRows.length ? monthlyRows :
    blockRows;
  const models = aggregateReportModels(modelBasis);
  const topModel = models[0];
  const sources = [...new Set(fallbackDaily.map(costSourceLabel))];
  const sourceLabel = !fallbackDaily.length ? 'daily reports unavailable' : sources.length===1 ? (sources[0]==='local estimate' ? 'local logs at API rates' : sources[0]) : 'mixed sources: '+sources.join(', ');
  // ccusage and local estimates are API-rate estimates; anything else is just what was recorded.
  const costLabel = fallbackDaily.length && sources.every(k=>k==='local estimate' || k==='ccusage') ? 'API-equivalent cost' : 'Recorded cost';

  const firstDay = fallbackDaily.map(rowDate).sort()[0];
  let html = `<div class="u-range" style="margin-top:0">All recorded history${firstDay?` since ${esc(parseDateOnly(firstDay).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}))}`:''} · ${esc(sourceLabel)}</div><div class="u-totals" style="margin:6px 0 20px">`;
  html+=usageTotal('Today', today?recordedTokens(today):'—', today?recordedCost(today):'');
  html+=usageTotal('Processed tokens', fallbackDaily.length?recordedTokens(totals):'—');
  html+=usageTotal(costLabel, fallbackDaily.length?recordedCost(totals):'—');
  html+=usageTotal('Active days', String(activeDays));
  html+=usageTotal('Cached input', fmtTok(totals.cacheReadTokens));
  html+=usageTotal('Uncached input', fmtTok(totals.inputTokens));
  if(totals.cacheCreationTokens > 0) html+=usageTotal('Cache writes', fmtTok(totals.cacheCreationTokens));
  html+=usageTotal('Output', fmtTok(totals.outputTokens), totals.reasoningTokens>0?`${fmtTok(totals.reasoningTokens)} reasoning`:'');
  html+=`</div>`;

  html+=`<div class="usage-tabs" id="usage-tabs-${esc(id)}">`;
  html+=usageTab('summary','Summary',true);
  html+=usageTab('daily','Daily',false);
  html+=usageTab('weekly','Weekly',false);
  html+=usageTab('monthly','Monthly',false);
  html+=usageTab('sessions','Sessions',false);
  html+=usageTab('blocks','5h Blocks',false);
  html+=usageTab('limits','Limits',false);
  html+=`</div>`;

  html+=`<div class="usage-panel active" data-panel="summary">`;
  html+=`<div class="usage-split"><div>`;
  html+=`<div class="u-h" style="margin-bottom:10px">Activity · last 26 weeks</div>${renderHeatmap(fallbackDaily)}`;
  html+=`</div><div>`;
  html+=`<div class="u-h" style="margin-bottom:10px">Model mix · last 30 days</div><div id="model-mix-${esc(id)}">${savedModelMix(id) || renderModelMix(models, totals.totalTokens)}</div>`;
  html+=`</div></div>`;
  html+=`</div>`;

  html+=usagePanel('daily', usageRowsTable(fallbackDaily, 'Date'));
  html+=usagePanel('weekly', usageRowsTable(weeklyRows.length?weeklyRows:bucketRows(fallbackDaily,'week'), 'Week'));
  html+=usagePanel('monthly', usageRowsTable(monthlyRows.length?monthlyRows:bucketRows(fallbackDaily,'month'), 'Month'));
  html+=usagePanel('sessions', sessionRows.length?sessionTable(sessionRows):emptyUsage('No session report available from local logs yet'));
  html+=usagePanel('blocks', blockRows.length?blockTable(blockRows):emptyUsage('No 5-hour block report available from local logs yet'));
  html+=usagePanel('limits', limitsTable(progress, text, badges, averageUsage, highest, nextReset, exhausted));
  return html;
}

function usageTab(panel,label,active){
  return `<button class="usage-tab${active?' active':''}" type="button" data-panel="${panel}">${esc(label)}</button>`;
}
function usagePanel(panel, content){ return `<div class="usage-panel" data-panel="${panel}">${content}</div>`; }
function emptyUsage(msg){ return `<div class="cost-unavail"><strong>${esc(msg)}</strong></div>`; }

function limitsTable(progress, text, badges, averageUsage, highest, nextReset, exhausted){
  let html = `<div class="stats-grid">`;
  html+=statCard(progress.filter(m=>m.format?.kind==='percent'&&m.limit>0).length, 'quota lines');
  html+=statCard(averageUsage==null?'—':averageUsage.toFixed(1)+'%', 'avg quota usage');
  html+=statCard(highest?`${highest.label} ${pct(highest).toFixed(0)}%`:'—', 'highest pressure');
  html+=statCard(nextReset?fmtReset(nextReset.resetsAt):'—', 'next reset');
  html+=statCard(text.length, 'text rows');
  html+=statCard(badges.length, 'badges');
  html+=statCard(exhausted, 'near exhausted');
  html+=`</div>`;
  if(progress.length){
    html+=`<table class="metric-table"><thead><tr><th>Metric</th><th>Kind</th><th>Used</th><th>Limit</th><th>Percent</th><th>Reset</th></tr></thead><tbody>`;
    for(const m of progress){
      const p = m.limit>0 ? pct(m) : null;
      const label = m.detail ? `${esc(m.label)}<div class="metric-detail" style="margin:4px 0 0">${esc(m.detail)}</div>` : esc(m.label);
      html+=`<tr><td>${label}</td><td>${esc(m.format?.kind||'')}</td><td>${esc(formatScalar(m.used,m.format))}</td><td>${esc(formatScalar(m.limit,m.format))}</td><td>${p==null?'—':p.toFixed(1)+'%'}</td><td>${m.resetsAt?esc(fmtReset(m.resetsAt)):'—'}</td></tr>`;
    }
    html+=`</tbody></table>`;
  }
  return html;
}

function statCard(value,label){
  return `<div class="stat-card"><div class="stat-value">${esc(value)}</div><div class="stat-label">${esc(label)}</div></div>`;
}

function formatScalar(value, format){
  const n = Number(value||0);
  if(format?.kind==='dollars') return fmtUsd(n);
  if(format?.kind==='percent') return fmtNum(n);
  return `${fmtNum(n)} ${format?.suffix||''}`.trim();
}

function renderHistorySection(id, raw, snap, reports){
  const box = document.getElementById(`history-box-${id}`);
  if(!box) return;
  box.innerHTML = `<div class="box-title">Usage History</div>`;
  const records = normalizeHistory(raw).filter(r=>r.providerId===id)
    .sort((a,b)=>new Date(a.ts)-new Date(b.ts));

  if(!records.length){
    box.insertAdjacentHTML('beforeend', `<div class="cost-unavail"><strong>No usage history yet</strong>Keep the daemon running, or probe with <code style="font-size:12px;color:var(--teal)">usagestat usage --save</code>, to build charts.</div>`);
    return;
  }

  const recent = lastWindow(records, 30);
  const latest = recent[recent.length-1] || records[records.length-1];
  const first = recent[0] || records[0];
  const activeDays = new Set(recent.map(r=>String(r.ts).slice(0,10))).size;
  const reportDaily = reportRows(reports?.daily, 'daily');
  const localDaily = (reportDaily.length ? reportDaily : S.dailyRows.filter(r=>r.providerId.toLowerCase()===id.toLowerCase())).map(normalizeCostRow).filter(r=>r.date);
  const summaryRows = localDaily.length ? calendarWindow(localDaily, 30) : [];
  const summaryTotals = summaryRows.length ? usageTotals(summaryRows) : null;
  const summaryActiveDays = summaryRows.length ? summaryRows.filter(r=>rowCost(r)>0 || rowTotalTokens(r)>0).length : activeDays;
  const summaryInput = summaryTotals ? summaryTotals.inputTokens : latest.inputTokens;
  const summaryOutput = summaryTotals ? summaryTotals.outputTokens : latest.outputTokens;
  const summaryCacheRead = summaryTotals ? summaryTotals.cacheReadTokens : latest.cacheReadTokens;
  const summaryCacheCreate = summaryTotals ? summaryTotals.cacheCreationTokens : latest.cacheCreationTokens;
  const summaryCost = summaryTotals ? summaryTotals.cost : latest.cost;

  let html = `<div class="trends-sub" style="margin-bottom:16px">Charts show hourly polling summaries for the last 30 days, with peak quota and the last reported counters in each bucket. For daily totals and period comparisons, open History.</div><div class="history-grid">`;
  html+=`<div>`;
  html+=`<div class="history-controls">`;
  html+=`<div class="history-tabs" id="history-tabs-${esc(id)}">`;
  html+=historyTab(id,'quota','Quotas',true);
  html+=historyTab(id,'tokens','Tokens',false);
  html+=historyTab(id,'cost','Cost',false);
  html+=historyTab(id,'cache','Cache',false);
  html+=`</div><div class="history-tabs" id="history-buckets-${esc(id)}">`;
  html+=bucketTab('raw','Raw',true);
  html+=bucketTab('hour','Hourly',false);
  html+=bucketTab('day','Daily',false);
  html+=bucketTab('week','Weekly',false);
  html+=`</div></div><div class="history-chart" id="history-chart-${esc(id)}"></div></div>`;
  html+=`<div><div class="insight-grid">`;
  html+=insight(`${fmtPct(latest.primaryPercent)}`, 'latest usage');
  html+=insight(fmtPct((latest.primaryPercent||0)-(first.primaryPercent||0), true), 'window change');
  html+=insight(fmtTok(summaryInput), summaryTotals?'30d input tokens':'latest input tokens');
  html+=insight(fmtTok(summaryOutput), summaryTotals?'30d output tokens':'latest output tokens');
  html+=insight(summaryCost>0?fmtUsd(summaryCost):'—', summaryTotals?'30d recorded cost':'latest reported cost');
  html+=insight(summaryRows.length?`${summaryActiveDays}/${summaryRows.length}`:String(activeDays), summaryTotals?'30d active days':'days sampled');
  html+=`</div>`;
  html+=`<div style="margin-top:14px">`;
  html+=seriesRow('Uncached input', summaryInput, '#7289da', fmtTok);
  html+=seriesRow('Cached input', summaryCacheRead, '#9b87f5', fmtTok);
  html+=seriesRow('Cache writes', summaryCacheCreate, '#eaca8b', fmtTok);
  html+=seriesRow('Output', summaryOutput, '#43b581', fmtTok);
  html+=`</div></div></div>`;

  box.insertAdjacentHTML('beforeend', html);
  const state = { mode:'quota', bucket:'raw', records:recent, snap };
  box._historyState = state;
  box.querySelectorAll('#history-tabs-'+CSS.escape(id)+' .history-tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      state.mode = btn.dataset.mode;
      box.querySelectorAll('#history-tabs-'+CSS.escape(id)+' .history-tab').forEach(b=>b.classList.toggle('active',b===btn));
      buildHistoryChart(`history-chart-${id}`, state.records, state.mode, state.bucket);
    });
  });
  box.querySelectorAll('#history-buckets-'+CSS.escape(id)+' .history-tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      state.bucket = btn.dataset.bucket;
      box.querySelectorAll('#history-buckets-'+CSS.escape(id)+' .history-tab').forEach(b=>b.classList.toggle('active',b===btn));
      buildHistoryChart(`history-chart-${id}`, state.records, state.mode, state.bucket);
    });
  });
  buildHistoryChart(`history-chart-${id}`, recent, 'quota', 'raw');
}

function renderCostSection(id, raw, history){
  const box = document.getElementById(`cost-box-${id}`);
  if(!box) return;
  box.innerHTML = costHeaderHtml(id);

  // resolve legacy array-shaped cost responses or our spec shape
  let entry = null;
  if(Array.isArray(raw)) entry = raw[0];
  else if(raw && !raw.error) entry = raw;

  if(!entry || entry.error || !entry.daily?.length){
    const saved = S.dailyRows.filter(r=>r.providerId.toLowerCase()===id.toLowerCase());
    if(saved.length) entry = { daily:saved };
  }
  if(!entry || entry.error || !entry.daily?.length){
    const msg = box.querySelector('.cost-unavail') || document.createElement('div');
    msg.className='cost-unavail';
    msg.innerHTML=`<strong>Daily cost history unavailable</strong>This provider has no saved daily cost report. Snapshot counters appear in Usage History; they cannot be added together to calculate spend.`;
    if(!box.contains(msg)) box.appendChild(msg);
    return;
  }

  const daily = (entry.daily||[]).map(normalizeCostRow).filter(d=>d.date).sort((a,b)=>a.date.localeCompare(b.date));
  const viewDaily = calendarWindow(daily, 30);
  const totals = usageTotals(viewDaily);
  const totalCost = totals.cost;
  const totalTok = totals.totalTokens;
  const activeDays = viewDaily.filter(d=>rowCost(d)>0 || rowTotalTokens(d)>0).length;
  const avgDay = activeDays > 0 ? totalCost / activeDays : 0;

  let html = `<div class="cost-stats" id="cost-stats-${esc(id)}">`;
  html+=`<div class="cstat"><div class="cstat-val">${recordedCost(totals)}</div><div class="cstat-lbl">tracked total</div></div>`;
  html+=`<div class="cstat"><div class="cstat-val">${recordedCost({cost:avgDay,costKnown:totals.costKnown})}</div><div class="cstat-lbl">per active day</div></div>`;
  html+=`<div class="cstat"><div class="cstat-val">${activeDays}</div><div class="cstat-lbl">active days</div></div>`;
  html+=`<div class="cstat"><div class="cstat-val">${recordedTokens(totals)}</div><div class="cstat-lbl">total tokens</div></div>`;
  html+=`</div>`;

  // chart
  html+=`<div class="chart-wrap" id="chart-${esc(id)}"></div>`;

  html+=`<div class="cost-models" id="model-table-${esc(id)}"></div>`;

  box.insertAdjacentHTML('beforeend', html);
  setupCostRange(box, id, daily);
}

function costHeaderHtml(id){
  return `<div class="cost-head"><div class="box-title">Cost History · Last 30 Days</div><div class="cost-range" id="cost-range-${esc(id)}">
    <button class="cost-tab active" type="button" data-range="30">30D</button>
    <button class="cost-tab" type="button" data-range="month">Month</button>
    <button class="cost-tab" type="button" data-range="90">90D</button>
    <button class="cost-tab" type="button" data-range="365">Year</button>
    <button class="cost-tab" type="button" data-range="all">All</button>
  </div></div>`;
}

function setupCostRange(box, id, daily){
  const state = { daily: daily.map(normalizeCostRow).filter(d=>d.date).sort((a,b)=>a.date.localeCompare(b.date)), range:'30' };
  box._costState = state;
  box.querySelectorAll('.cost-tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      state.range = btn.dataset.range;
      box.querySelectorAll('.cost-tab').forEach(b=>b.classList.toggle('active', b===btn));
      updateCostView(id, state);
    });
  });
  updateCostView(id, state);
}

function updateCostView(id, state){
  const rows = state.range === 'all' ? fullCalendarRange(state.daily) : state.range === 'month'
    ? calendarWindow(state.daily, todayUtcDate().getUTCDate()) : calendarWindow(state.daily, Number(state.range));
  const title = document.querySelector(`#cost-box-${CSS.escape(id)} .cost-head .box-title`);
  if(title) title.textContent = `Cost History · ${rangeLabel(state.range)}`;
  const stats = document.getElementById(`cost-stats-${id}`);
  if(stats){
    const totals = usageTotals(rows);
    const activeDays = rows.filter(d=>rowCost(d)>0 || rowTotalTokens(d)>0).length;
    const avgDay = activeDays > 0 ? totals.cost / activeDays : 0;
    stats.innerHTML = `<div class="cstat"><div class="cstat-val">${recordedCost(totals)}</div><div class="cstat-lbl">${state.range==='30'?'30-day':'range'} total</div></div>
      <div class="cstat"><div class="cstat-val">${recordedCost({cost:avgDay,costKnown:totals.costKnown})}</div><div class="cstat-lbl">per active day</div></div>
      <div class="cstat"><div class="cstat-val">${activeDays}/${rows.length}</div><div class="cstat-lbl">active days</div></div>
      <div class="cstat"><div class="cstat-val">${fmtTok(totals.totalTokens)}</div><div class="cstat-lbl">total tokens</div></div>`;
  }
  buildChart(`chart-${id}`, rows, id);
  updateModelTable(id, rows);
}

function rangeLabel(range){
  if(range==='month') return 'Month to Date';
  if(range==='30') return 'Last 30 Days';
  if(range==='90') return 'Last 90 Days';
  if(range==='365') return 'Year';
  return 'All Tracked Days';
}

// Provider cost rows rarely carry models, so the table reads the same saved
// daily model history as the History tab, limited to the selected range.
function updateModelTable(id, rows){
  const el = document.getElementById(`model-table-${id}`);
  if(!el || !rows.length) return;
  const start = rows[0].date, end = rows[rows.length-1].date, rangeKey = start+'|'+end;
  el.dataset.range = rangeKey;
  const report = S.modelReports?.[id];
  if(typeof fetch==='function' && (!report || report.status==='loading' || Date.now()-report.at >= 30000)){
    // Ignore the callback if the user picked another range meanwhile.
    ensureModelReports([id])?.then(()=>{ if(document.getElementById(`model-table-${id}`)?.dataset.range===rangeKey) updateModelTable(id, rows); });
  }
  const map = new Map();
  for(const r of report?.rows || []){
    if(r.date<start || r.date>end) continue;
    for(const [name,m] of Object.entries(r.models||{})){
      const cur = map.get(name) || { name, cost:0, tokens:0, cached:0, costKnown:true };
      cur.cost += rowCost(m); cur.tokens += rowTotalTokens(m); cur.cached += rowCacheRead(m);
      cur.costKnown &&= m.costKnown === true;
      map.set(name, cur);
    }
  }
  const models = [...map.values()].sort((a,b)=>b.cost-a.cost || b.tokens-a.tokens);
  if(!models.length){
    el.innerHTML = report?.status==='loading' || !report ? `<div class="small-note">Loading model history…</div>` : '';
    return;
  }
  const priced = models.filter(m=>m.costKnown).reduce((a,m)=>a+m.cost,0);
  let html = `<div class="u-sechead"><span class="u-h">Models</span></div><div class="trends-table-wrap"><table class="u-table"><thead><tr><th>Model</th><th>Cost</th><th>Share of priced cost</th><th>Tokens</th><th>Cached input</th></tr></thead><tbody>`;
  for(const m of models.slice(0,20)){
    html+=`<tr><td><span class="u-cell-name">${providerIcon(id)}${esc(m.name)}</span></td><td class="${m.costKnown?'':'u-muted'}">${m.costKnown?fmtUsd(m.cost):m.cost>0?fmtUsd(m.cost)+'+':'Unpriced'}</td><td>${m.costKnown?shareText(m.cost,priced):'—'}</td><td>${fmtTok(m.tokens)}</td><td>${fmtTok(m.cached)}</td></tr>`;
  }
  el.innerHTML = html+`</tbody></table></div><div class="small-note">From saved daily model history (local logs at standard API rates); totals can differ from the reported cost above. Shares are of priced model cost.</div>`;
}

function normalizeHistory(raw){
  return (Array.isArray(raw)?raw:[]).map(r=>({
    ts: r.ts,
    providerId: r.providerId || r.provider_id,
    displayName: r.displayName || r.display_name,
    plan: r.plan || null,
    primaryPercent: (r.primaryPercent ?? r.primary_percent) == null ? null : Number(r.primaryPercent ?? r.primary_percent),
    inputTokens: Number(r.inputTokens ?? r.input_tokens ?? 0),
    outputTokens: Number(r.outputTokens ?? r.output_tokens ?? 0),
    cacheReadTokens: Number(r.cacheReadTokens ?? r.cache_read_tokens ?? 0),
    cacheCreationTokens: Number(r.cacheCreationTokens ?? r.cache_creation_tokens ?? 0),
    totalTokens: Number(r.totalTokens ?? r.total_tokens ?? 0),
    cost: Number(r.cost ?? 0),
    resetTime: r.resetTime || r.reset_time || null,
    progress: normalizeProgress(r.progress, r.primaryPercent ?? r.primary_percent),
    text: Array.isArray(r.text) ? r.text : [],
    badges: Array.isArray(r.badges) ? r.badges : [],
    charts: normalizeCharts(r.charts),
  })).filter(r=>r.ts && r.providerId);
}

function normalizeCharts(charts){
  return (Array.isArray(charts)?charts:[]).map(c=>({
    label: String(c.label||'History'),
    note: c.note || null,
    color: c.color || null,
    points: (Array.isArray(c.points)?c.points:[]).map(p=>({
      label: String(p.label||''),
      value: Number(p.value||0),
      valueLabel: p.valueLabel || p.value_label || null,
    })).filter(p=>p.label && Number.isFinite(p.value) && p.value>=0),
  })).filter(c=>c.points.length);
}

function normalizeProgress(progress, primaryPercent){
  const rows = Array.isArray(progress) ? progress.map(p=>({
    label: String(p.label||'Usage'),
    used: Number(p.used||0),
    limit: Number(p.limit||0),
    percent: p.percent == null ? null : Number(p.percent),
    format: String(p.format || p.formatKind || 'percent'),
    suffix: p.suffix || null,
    resetsAt: p.resetsAt || p.resets_at || null,
    periodDurationMs: Number(p.periodDurationMs ?? p.period_duration_ms ?? 0) || null,
    detail: p.detail || null,
    color: p.color || null,
  })) : [];
  if(!rows.length && primaryPercent != null){
    rows.push({
      label:'Primary',
      used:Number(primaryPercent)||0,
      limit:100,
      percent:Number(primaryPercent)||0,
      format:'percent',
      suffix:null,
      resetsAt:null,
      periodDurationMs:null,
      color:null,
    });
  }
  return rows;
}

function lastWindow(records, days){
  if(!records.length) return [];
  const end = +new Date(records[records.length-1].ts);
  const start = end - days*86400000;
  return records.filter(r=>+new Date(r.ts)>=start);
}

function normalizeCostRow(row){
  const date = rowDate(row);
  return {
    ...row,
    date,
    inputTokens: rowInput(row),
    outputTokens: rowOutput(row),
    cacheReadTokens: rowCacheRead(row),
    cacheCreationTokens: rowCacheCreate(row),
    reasoningOutputTokens: rowReasoning(row),
    totalTokens: rowTotalTokens(row),
    totalCost: rowCost(row),
  };
}

function calendarWindow(rows, days){
  const end = todayUtcDate();
  const start = addDays(end, -(days - 1));
  return calendarRange(rows, start, end);
}

function fullCalendarRange(rows){
  if(!rows.length) return [];
  const sorted = rows.slice().sort((a,b)=>a.date.localeCompare(b.date));
  return calendarRange(rows, parseDateOnly(sorted[0].date), parseDateOnly(sorted[sorted.length-1].date));
}

function calendarRange(rows, start, end){
  const byDate = new Map(rows.map(r=>[r.date, normalizeCostRow(r)]));
  const out = [];
  for(let d = new Date(start); d <= end; d = addDays(d, 1)){
    const key = dateKey(d);
    out.push(byDate.get(key) || emptyDay(key));
  }
  return out;
}

function emptyDay(date){
  return { date, inputTokens:0, outputTokens:0, cacheReadTokens:0, cacheCreationTokens:0, reasoningOutputTokens:0, totalTokens:0, totalCost:0, models:{} };
}

function todayUtcDate(){
  const n = new Date();
  return new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate()));
}
function parseDateOnly(value){
  const s = String(value);
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return new Date(Date.UTC(Number(m[1]), Number(m[2])-1, Number(m[3])));
  const ms = Date.parse(s);
  if(Number.isFinite(ms)){
    const d = new Date(ms);
    return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  }
  return todayUtcDate();
}
function dateKey(date){ return date.toISOString().slice(0,10); }
function addDays(date, days){
  const d = new Date(date);
  d.setUTCDate(d.getUTCDate() + days);
  return d;
}

function historyTab(id,mode,label,active){
  return `<button class="history-tab${active?' active':''}" type="button" data-provider="${esc(id)}" data-mode="${mode}">${esc(label)}</button>`;
}
function bucketTab(bucket,label,active){
  return `<button class="history-tab${active?' active':''}" type="button" data-bucket="${bucket}">${esc(label)}</button>`;
}
function insight(value,label){
  return `<div class="insight"><div class="insight-value">${esc(value)}</div><div class="insight-label">${esc(label)}</div></div>`;
}
function seriesRow(label,value,color,formatter){
  const display = value>0 ? formatter(value) : '—';
  return `<div class="series-row"><div class="series-left"><span class="series-dot" style="background:${color}"></span><span class="series-name">${esc(label)}</span></div><span class="series-value">${esc(display)}</span></div>`;
}
function sum(records,key){return records.reduce((acc,r)=>acc+(Number(r[key])||0),0)}
function fmtPct(v,signed){
  if(v==null || !isFinite(v)) return '—';
  const n = Number(v);
  return (signed && n>0?'+':'') + n.toFixed(1) + '%';
}

function reportRows(report, preferred){
  if(!report || report.error) return [];
  const keys = preferred==='session' ? ['sessions','session'] :
    preferred==='blocks' ? ['blocks'] :
    preferred==='weekly' ? ['weekly','weeks'] :
    preferred==='monthly' ? ['monthly','months'] :
    ['daily','days'];
  for(const key of keys){
    if(Array.isArray(report[key])) return report[key];
  }
  if(Array.isArray(report)) return report;
  return [];
}

function readAny(obj, keys, fallback){
  for(const key of keys){
    if(obj && obj[key] != null) return obj[key];
  }
  return fallback;
}
function numAny(obj, keys){ const n = Number(readAny(obj, keys, 0)); return Number.isFinite(n) ? n : 0; }
function rowDate(r){
  const raw = String(readAny(r, ['date','day','week','month','startTime','start_time','blockStart','block_start','lastActivity','last_activity','timestamp','ts'], ''));
  if(/^\d{4}-\d{2}-\d{2}/.test(raw)) return raw.slice(0,10);
  const ms = Date.parse(raw);
  return Number.isFinite(ms) ? new Date(ms).toISOString().slice(0,10) : raw.slice(0,12);
}
function rowLabel(r){ return String(readAny(r, ['date','week','month','sessionId','session_id','id','blockStart','block_start','startTime','start_time','project','projectPath'], '—')); }
function rowInput(r){ return numAny(r, ['inputTokens','input_tokens']); }
function rowOutput(r){ return numAny(r, ['outputTokens','output_tokens']); }
function rowCacheRead(r){ return numAny(r, ['cacheReadTokens','cache_read_tokens','cacheReadInputTokens','cache_read_input_tokens','cachedInputTokens','cached_input_tokens']); }
function rowCacheCreate(r){ return numAny(r, ['cacheCreationTokens','cache_creation_tokens','cacheCreationInputTokens','cache_creation_input_tokens','cacheCreateTokens','cache_create_tokens']); }
function rowReasoning(r){ return numAny(r, ['reasoningOutputTokens','reasoning_output_tokens','reasoningTokens','reasoning_tokens']); }
function rowTotalTokens(r){
  return numAny(r, ['totalTokens','total_tokens','tokens']) || rowInput(r)+rowOutput(r)+rowCacheRead(r)+rowCacheCreate(r);
}
function rowCost(r){ return numAny(r, ['totalCost','total_cost','costUSD','costUsd','cost']); }

function usageTotals(rows){
  return rows.reduce((acc,r)=>{
    acc.inputTokens += rowInput(r);
    acc.outputTokens += rowOutput(r);
    acc.cacheReadTokens += rowCacheRead(r);
    acc.cacheCreationTokens += rowCacheCreate(r);
    acc.reasoningTokens += rowReasoning(r);
    acc.totalTokens += rowTotalTokens(r);
    acc.cost += rowCost(r);
    acc.costKnown &&= r.costKnown !== false;
    acc.tokensKnown &&= r.tokensKnown !== false;
    return acc;
  }, {inputTokens:0,outputTokens:0,cacheReadTokens:0,cacheCreationTokens:0,reasoningTokens:0,totalTokens:0,cost:0,costKnown:true,tokensKnown:true});
}

function bucketRows(rows, bucket){
  const map = new Map();
  for(const r of rows){
    const date = rowDate(r);
    if(!date) continue;
    const key = bucket === 'month' ? date.slice(0,7) : bucketKey(date+'T00:00:00Z', 'week');
    if(!map.has(key)) map.set(key, { date:key, inputTokens:0, outputTokens:0, cacheReadTokens:0, cacheCreationTokens:0, totalTokens:0, totalCost:0, tokensKnown:true, costKnown:true });
    const b = map.get(key);
    b.inputTokens += rowInput(r);
    b.outputTokens += rowOutput(r);
    b.cacheReadTokens += rowCacheRead(r);
    b.cacheCreationTokens += rowCacheCreate(r);
    b.totalTokens += rowTotalTokens(r);
    b.totalCost += rowCost(r);
    b.tokensKnown &&= r.tokensKnown !== false;
    b.costKnown &&= r.costKnown !== false;
  }
  return Array.from(map.values()).sort((a,b)=>rowLabel(b).localeCompare(rowLabel(a)));
}

function usageRowsTable(rows, label){
  if(!rows.length) return emptyUsage(`No ${label.toLowerCase()} usage rows available`);
  const sorted = rows.slice().sort((a,b)=>rowLabel(b).localeCompare(rowLabel(a))).slice(0,60);
  let html = `<table class="usage-table"><thead><tr><th>${esc(label)}</th><th>Input</th><th>Output</th><th>Reasoning</th><th>Cache Write</th><th>Cache Read</th><th>Total</th><th>Cost</th><th>Models</th></tr></thead><tbody>`;
  for(const r of sorted){
    html+=`<tr><td>${esc(rowLabel(r))}</td><td>${fmtTok(rowInput(r))}</td><td>${fmtTok(rowOutput(r))}</td><td>${fmtTok(rowReasoning(r))}</td><td>${fmtTok(rowCacheCreate(r))}</td><td>${fmtTok(rowCacheRead(r))}</td><td>${recordedTokens(r)}</td><td>${recordedCost(r)}</td><td>${esc(modelsLabel(r))}</td></tr>`;
  }
  html+=`</tbody></table>`;
  return html;
}

function sessionTable(rows){
  const sorted = rows.slice().sort((a,b)=>rowCost(b)-rowCost(a) || rowTotalTokens(b)-rowTotalTokens(a)).slice(0,80);
  let html = `<table class="usage-table"><thead><tr><th>Session</th><th>Project</th><th>Input</th><th>Output</th><th>Reasoning</th><th>Cache Write</th><th>Cache Read</th><th>Total</th><th>Cost</th><th>Last</th></tr></thead><tbody>`;
  for(const r of sorted){
    html+=`<tr><td>${esc(shortId(readAny(r,['sessionId','session_id','id'], rowLabel(r))))}</td><td>${esc(projectLabel(r))}</td><td>${fmtTok(rowInput(r))}</td><td>${fmtTok(rowOutput(r))}</td><td>${fmtTok(rowReasoning(r))}</td><td>${fmtTok(rowCacheCreate(r))}</td><td>${fmtTok(rowCacheRead(r))}</td><td>${fmtTok(rowTotalTokens(r))}</td><td>${recordedCost(r)}</td><td>${esc(rowDate(r)||'—')}</td></tr>`;
  }
  html+=`</tbody></table>`;
  return html;
}

function blockTable(rows){
  const sorted = rows.slice().sort((a,b)=>rowLabel(b).localeCompare(rowLabel(a))).slice(0,80);
  let html = `<table class="usage-table"><thead><tr><th>Block Start</th><th>Models</th><th>Input</th><th>Output</th><th>Reasoning</th><th>Cache Write</th><th>Cache Read</th><th>Total</th><th>Cost</th><th>Projection</th></tr></thead><tbody>`;
  for(const r of sorted){
    const projection = numAny(r,['projectedTotalTokens','projected_total_tokens','projectionTokens','projection_tokens']);
    html+=`<tr><td>${esc(rowLabel(r))}</td><td>${esc(modelsLabel(r))}</td><td>${fmtTok(rowInput(r))}</td><td>${fmtTok(rowOutput(r))}</td><td>${fmtTok(rowReasoning(r))}</td><td>${fmtTok(rowCacheCreate(r))}</td><td>${fmtTok(rowCacheRead(r))}</td><td>${fmtTok(rowTotalTokens(r))}</td><td>${recordedCost(r)}</td><td>${projection?fmtTok(projection):'—'}</td></tr>`;
  }
  html+=`</tbody></table>`;
  return html;
}

// GitHub-style calendar: one column per week (Mon–Sun), one hue by volume.
function renderHeatmap(rows){
  const byDay = new Map();
  for(const r of rows){
    const d = rowDate(r), day = byDay.get(d) || { totalTokens:0, tokensKnown:true };
    day.totalTokens += rowTotalTokens(r); day.tokensKnown &&= r.tokensKnown !== false;
    byDay.set(d, day);
  }
  const end = todayUtcDate(), weeks = 26;
  const start = addDays(end, -((end.getUTCDay()+6)%7) - (weeks-1)*7);
  const days = [];
  for(let d = start; d <= end; d = addDays(d,1)) days.push(dateKey(d));
  const values = days.map(d=>byDay.get(d)?.totalTokens||0).filter(v=>v>0).sort((a,b)=>a-b);
  // Quartiles keep one huge day from washing out the rest.
  const q = p=>values.length ? values[Math.min(values.length-1, Math.floor(p*values.length))] : 0;
  const cuts = [q(.25), q(.5), q(.75)];
  let cells = '', months = '', lastLabel = -9;
  days.forEach((d,i)=>{
    const day = byDay.get(d), v = day?.totalTokens||0, level = !v ? 0 : v<=cuts[0] ? 1 : v<=cuts[1] ? 2 : v<=cuts[2] ? 3 : 4;
    cells+=`<div class="cal-cell l${level}" style="grid-column:${Math.floor(i/7)+1};grid-row:${i%7+1}" title="${esc(fmtDay(d))}: ${day?esc(recordedTokens(day))+' tokens':'no record'}"></div>`;
    if(i%7===0 && (i===0 || d.slice(8)<='07') && i/7-lastLabel>=3 && (lastLabel=i/7)>=0) months+=`<span style="grid-column:${i/7+1}">${esc(parseDateOnly(d).toLocaleDateString('en-US',{month:'short',timeZone:'UTC'}))}</span>`;
  });
  return `<div class="cal-scroll"><div class="cal" style="--weeks:${weeks}"><div class="cal-months">${months}</div><div class="cal-days"><span style="grid-row:1">Mon</span><span style="grid-row:3">Wed</span><span style="grid-row:5">Fri</span></div><div class="cal-grid">${cells}</div></div></div><div class="cal-legend">Less<span class="cal-cell l0"></span><span class="cal-cell l1"></span><span class="cal-cell l2"></span><span class="cal-cell l3"></span><span class="cal-cell l4"></span>More</div>`;
}

// Model mix from saved daily model history, matching the History Model view.
function savedModelMix(id){
  const report = S.modelReports?.[id];
  if(typeof fetch==='function' && (!report || report.status==='loading' || Date.now()-report.at >= 30000)){
    ensureModelReports([id])?.then(()=>{
      const el = document.getElementById(`model-mix-${id}`), html = savedModelMix(id);
      if(el) el.innerHTML = html || emptyUsage(S.modelReports?.[id]?.status==='error'?'Could not load saved model history':'No saved model history in the last 30 days');
    });
  }
  const end = dateKey(todayUtcDate()), start = dateKey(addDays(todayUtcDate(), -29)), map = new Map();
  for(const r of report?.rows || []){
    if(r.date < start || r.date > end) continue;
    for(const [name,m] of Object.entries(r.models||{})){
      const cur = map.get(name) || { model:name, cost:0, tokens:0, costKnown:true };
      cur.cost += rowCost(m); cur.tokens += rowTotalTokens(m); cur.costKnown &&= m.costKnown === true;
      map.set(name, cur);
    }
  }
  const all = [...map.values()].sort((a,b)=>b.cost-a.cost || b.tokens-a.tokens);
  if(!all.length) return '';
  const priced = all.filter(m=>m.costKnown).reduce((a,m)=>a+m.cost,0), models = all.slice(0,8);
  let html = `<div class="model-mix">`;
  for(const m of models){
    const share = m.costKnown && priced>0 ? m.cost/priced*100 : 0;
    html+=`<div class="model-row"><div class="model-label">${esc(m.model)}</div><div class="pressure-value">${m.costKnown?shareText(m.cost,priced):'—'}</div><div class="model-bar"><div style="width:${share.toFixed(1)}%"></div></div><div class="pressure-value">${recordedCost(m)}</div></div>`;
  }
  return html+`</div><div class="small-note">Share of priced cost · local logs at API rates</div>`;
}

function aggregateReportModels(rows){
  const map = new Map();
  const add = (name,tokens,cost)=>{
    name = String(name||'unknown').trim() || 'unknown';
    const cur = map.get(name) || { model:name, tokens:0, cost:0 };
    cur.tokens += Number(tokens)||0;
    cur.cost += Number(cost)||0;
    map.set(name, cur);
  };
  for(const r of rows){
    const breakdown = readAny(r, ['modelBreakdowns','model_breakdowns'], []);
    if(Array.isArray(breakdown) && breakdown.length){
      for(const m of breakdown) add(readAny(m,['modelName','model_name','model'], 'unknown'), rowTotalTokens(m), rowCost(m));
      continue;
    }
    const models = readAny(r, ['modelsUsed','models_used','models','model'], null);
    if(Array.isArray(models)) models.forEach(m=>add(m, rowTotalTokens(r)/models.length, rowCost(r)/models.length));
    else if(models && typeof models === 'object') Object.entries(models).forEach(([name,m])=>add(name, rowTotalTokens(m), rowCost(m)));
    else if(models) add(models, rowTotalTokens(r), rowCost(r));
  }
  return Array.from(map.values()).sort((a,b)=>b.tokens-a.tokens || b.cost-a.cost).slice(0,10);
}

function renderModelMix(models, totalTokens){
  if(!models.length) return emptyUsage('No model metadata available');
  let html = `<div class="model-mix">`;
  for(const m of models){
    const share = totalTokens>0 ? m.tokens/totalTokens*100 : 0;
    html+=`<div class="model-row"><div class="model-label">${esc(m.model)}</div><div class="pressure-value">${share.toFixed(1)}%</div><div class="model-bar"><div style="width:${share.toFixed(1)}%"></div></div><div class="pressure-value">${m.cost>0?'$'+m.cost.toFixed(2):fmtTok(m.tokens)}</div></div>`;
  }
  html+=`</div>`;
  return html;
}

function modelsLabel(r){
  const breakdown = readAny(r, ['modelBreakdowns','model_breakdowns'], []);
  if(Array.isArray(breakdown) && breakdown.length) return breakdown.map(m=>readAny(m,['modelName','model_name','model'],'model')).slice(0,3).join(', ');
  const models = readAny(r, ['modelsUsed','models_used','models','model'], '—');
  if(models && typeof models === 'object' && !Array.isArray(models)) return Object.keys(models).slice(0,3).join(', ');
  return Array.isArray(models) ? models.slice(0,3).join(', ') : String(models || '—');
}
function projectLabel(r){ return String(readAny(r, ['project','projectName','project_name','projectPath','project_path','cwd','instance'], '—')).split('/').filter(Boolean).slice(-2).join('/') || '—'; }
function shortId(v){ return String(v||'—').split(/[-/]/).filter(Boolean).slice(-2).join('-') || String(v||'—').slice(0,18); }

function bucketKey(ts, bucket){
  const d = new Date(ts);
  if(bucket==='hour'){
    d.setUTCMinutes(0,0,0);
    return d.toISOString();
  }
  if(bucket==='day') return d.toISOString().slice(0,10);
  if(bucket==='week'){
    const u = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
    const day = u.getUTCDay() || 7;
    u.setUTCDate(u.getUTCDate() - day + 1);
    return u.toISOString().slice(0,10);
  }
  return ts;
}

function aggregateHistory(records, bucket){
  if(bucket==='raw') return records;
  const map = new Map();
  for(const r of records){
    const key = bucketKey(r.ts, bucket);
    if(!map.has(key)){
      map.set(key, {
        ...r,
        ts:key,
        primaryPercent:null,
        inputTokens:0,
        outputTokens:0,
        cacheReadTokens:0,
        cacheCreationTokens:0,
        totalTokens:0,
        cost:0,
        progress:[],
        _quota:Object.create(null),
        _samples:0,
      });
    }
    const b = map.get(key);
    b._samples++;
    if(r.primaryPercent!=null && Number.isFinite(Number(r.primaryPercent))) b.primaryPercent = Math.max(b.primaryPercent??0, Number(r.primaryPercent));
    // These are sampled counters, not usage events. Repeated polls must not
    // multiply usage; take the latest counter while retaining peak quota.
    if(!b._latest || new Date(r.ts)>=new Date(b._latest)){
      for(const field of ['inputTokens','outputTokens','cacheReadTokens','cacheCreationTokens','totalTokens','cost']) b[field] = Number(r[field])||0;
      b._latest = r.ts;
    }
    for(const p of (r.progress||[])){
      if(p.percent == null || !isFinite(p.percent)) continue;
      if(!b._quota[p.label]) b._quota[p.label] = { ...p, percent:0, used:0, samples:0 };
      b._quota[p.label].percent = Math.max(b._quota[p.label].percent, Number(p.percent)||0);
      b._quota[p.label].used = Math.max(b._quota[p.label].used, Number(p.used)||0);
      b._quota[p.label].samples++;
    }
  }
  return Array.from(map.values()).map(b=>{
    b.progress = Object.values(b._quota);
    delete b._quota; delete b._samples; delete b._latest;
    return b;
  }).sort((a,b)=>new Date(a.ts)-new Date(b.ts));
}

function quotaSeries(records){
  const labels = [];
  const seen = new Set();
  for(const r of records){
    for(const p of (r.progress||[])){
      if(p.format==='percent' && !seen.has(p.label)){
        seen.add(p.label);
        labels.push(p.label);
      }
    }
  }
  const palette = ['#7289da','#43b581','#eaca8b','#ce8670','#b48ead','#859bee','#d25050'];
  if(!labels.length) return [{ key:'primaryPercent', label:'Primary', color:'#7289da', fmt:v=>v.toFixed(1)+'%' }];
  return labels.slice(0, 7).map((label, i)=>({
    key:'quota:'+label,
    label,
    color:palette[i % palette.length],
    fmt:v=>v.toFixed(1)+'%',
    value:r=>{
      const p = (r.progress||[]).find(row=>row.label===label);
      return p && p.percent != null ? Number(p.percent) : null;
    }
  }));
}

function historySeries(records, mode){
  if(mode==='quota') return quotaSeries(records);
  if(mode==='tokens') return [
    { key:'inputTokens', label:'Input', color:'#7289da', fmt:fmtTok },
    { key:'outputTokens', label:'Output', color:'#43b581', fmt:fmtTok },
    { key:'totalTokens', label:'Total', color:'#859bee', fmt:fmtTok, line:true },
  ];
  if(mode==='cost') return [
    { key:'cost', label:'Cost', color:'#7289da', fmt:fmtUsd, line:true },
  ];
  if(mode==='cache') return [
    { key:'cacheReadTokens', label:'Cache read', color:'#b48ead', fmt:fmtTok },
    { key:'cacheCreationTokens', label:'Cache write', color:'#eaca8b', fmt:fmtTok },
  ];
  return [{ key:'primaryPercent', label:'Usage', color:'#7289da', fmt:v=>v.toFixed(1)+'%' }];
}

function seriesValue(row, series){
  const value = series.value ? series.value(row) : row[series.key];
  return value!=null && Number.isFinite(Number(value)) ? Number(value) : null;
}

function buildHistoryChart(containerId, sourceRecords, mode, bucket){
  const container = document.getElementById(containerId);
  if(!container) return;
  const records = aggregateHistory(sourceRecords, bucket || 'raw');
  const series = historySeries(records, mode).map(s=>({ ...s,
    // Missing samples stay as null so the chart breaks there instead of bridging.
    pts:records.map(r=>{ const v = seriesValue(r,s); return { t:+new Date(r.ts), v:v!=null && Number.isFinite(v) ? v : null }; }).filter(p=>Number.isFinite(p.t)) }))
    .filter(s=>s.pts.some(p=>p.v!=null));
  if(!records.length || !series.length){
    container.innerHTML = `<div class="chart-loading">No ${esc(mode)} history recorded for ${esc(bucket||'raw')} view yet</div>`;
    return;
  }
  // Suppress zero-only lines when other series are active; a recorded zero
  // remains real history when every available series is zero.
  const positive = series.filter(s=>s.pts.some(p=>p.v>0));
  timeLineChart(container, positive.length ? positive : series, {
    max: mode==='quota' ? 100 : null,
    axis: v=>axisValue(v,mode),
    peak: mode==='quota',
    when: t=>fmtWhen(t, bucket||'raw'),
  });
}

function fmtWhen(t, bucket){
  const d = new Date(t);
  if(bucket==='day') return d.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
  if(bucket==='week') return 'Week of '+d.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
  return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'UTC'})+' UTC';
}

// Time-scaled smooth lines. Dense polling history is reduced to one value per
// pixel column (peak for quotas, latest for counters) and broken across gaps.
function timeLineChart(container, series, opts){
  // Match the rendered width so text keeps its intended size.
  const W=Math.max(300,Math.round(container.clientWidth||860)),H=240,L=52,R=16,T=12,B=28,CW=W-L-R,CH=H-T-B,COLS=Math.min(240,Math.round(CW/3));
  const known = series.flatMap(s=>s.pts.filter(p=>p.v!=null).map(p=>p.t));
  let t0 = Math.min(...known), t1 = Math.max(...known);
  if(t1===t0){ t0 -= 3600000; t1 += 3600000; }
  const col = t=>Math.min(COLS-1, Math.floor((t-t0)/(t1-t0)*COLS));
  const reduced = series.map(s=>{
    // Split at explicit missing samples first, then reduce each run on its own.
    const sorted = s.pts.slice().sort((a,b)=>a.t-b.t), runs = [[]], breaks = [];
    for(const p of sorted){
      if(p.v==null){ breaks.push(p.t); if(runs[runs.length-1].length) runs.push([]); }
      else runs[runs.length-1].push(p);
    }
    const reducedRuns = runs.filter(r=>r.length).map(run=>{
      const cols = new Map();
      for(const p of run){
        const c = col(p.t), cur = cols.get(c);
        if(!cur || (opts.peak ? p.v>=cur.v : p.t>=cur.t)) cols.set(c, { t:p.t, v:p.v });
      }
      return [...cols.entries()].sort((a,b)=>a[0]-b[0]).map(([,p])=>p);
    });
    const pts = reducedRuns.flat();
    const gaps = reducedRuns.flatMap(run=>run.slice(1).map((p,i)=>p.t-run[i].t)).sort((a,b)=>a-b);
    const limit = Math.max((gaps[Math.floor(gaps.length/2)]||0)*6, (t1-t0)/30);
    const segments = [];
    for(const run of reducedRuns) run.forEach((p,i)=>{ if(!i || p.t-run[i-1].t>limit) segments.push([]); segments[segments.length-1].push(p); });
    return { ...s, pts, segments, limit, breaks };
  });
  const max = opts.max || niceMax(Math.max(...reduced.flatMap(s=>s.pts.map(p=>p.v))));
  const x = t=>L+CW*(t-t0)/(t1-t0), y = v=>T+CH*(1-Math.min(v,max)/max);
  const uid = Array.from(container.id || 'chart', c=>c.codePointAt(0).toString(16)).join('-');
  let svg = `<svg class="chart-svg tl-chart" viewBox="0 0 ${W} ${H}"><defs>${reduced.map((s,i)=>`<linearGradient id="tl-${uid}-${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".22"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`).join('')}</defs>`;
  for(let i=0;i<=4;i++){
    const v = max*i/4, yy = y(v);
    svg+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--bd)"/><text x="${L-8}" y="${yy+4}" text-anchor="end" fill="var(--su)" font-size="10.5">${esc(opts.axis(v))}</text>`;
  }
  reduced.forEach((s,i)=>{
    for(const seg of s.segments){
      const pts = seg.map(p=>[x(p.t), y(p.v)]);
      if(pts.length===1){ svg+=`<circle cx="${pts[0][0].toFixed(1)}" cy="${pts[0][1].toFixed(1)}" r="2.5" fill="${s.color}"/>`; continue; }
      const line = monotonePath(pts);
      svg+=`<path d="M${line.slice(1)}L${pts[pts.length-1][0].toFixed(1)},${y(0)}L${pts[0][0].toFixed(1)},${y(0)}Z" fill="url(#tl-${uid}-${i})"/>`;
      svg+=`<path d="M${line.slice(1)}" fill="none" stroke="${s.color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
  });
  const span = t1-t0, ticks = 6;
  for(let i=0;i<ticks;i++){
    const t = t0 + span*i/(ticks-1), d = new Date(t);
    const label = span < 2*86400000 ? d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'UTC'}) : d.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
    svg+=`<text x="${x(t).toFixed(1)}" y="${H-6}" text-anchor="${i===0?'start':i===ticks-1?'end':'middle'}" fill="var(--su)" font-size="10.5">${esc(label.toUpperCase())}</text>`;
  }
  svg+=`<line class="tl-guide" x1="0" x2="0" y1="${T}" y2="${T+CH}" stroke="var(--mu)" stroke-dasharray="3 3" opacity="0"/>`;
  svg+=`<g class="tl-dots" opacity="0">${reduced.map(s=>`<circle r="4" fill="${s.color}" stroke="var(--s0)" stroke-width="2"/>`).join('')}</g></svg>`;
  const legend = reduced.length>1 ? `<div class="chart-legend">${reduced.map(s=>`<span class="legend-item"><span class="legend-dot" style="background:${s.color}"></span>${esc(s.label)}</span>`).join('')}</div>` : '';
  container.innerHTML = legend + svg;

  const el = container.querySelector('svg'), tip = document.getElementById('tip');
  const guide = el.querySelector('.tl-guide'), dots = [...el.querySelector('.tl-dots').children];
  el.addEventListener('mousemove', e=>{
    const box = el.getBoundingClientRect();
    const t = t0 + ((e.clientX-box.left)*W/box.width - L)/CW*(t1-t0);
    // Nearest reduced point per series, ignoring series that have a gap here.
    const hits = reduced.map(s=>{
      let best = null;
      for(const p of s.pts) if(!best || Math.abs(p.t-t)<Math.abs(best.t-t)) best = p;
      if(!best || Math.abs(best.t-t) > s.limit/2) return null;
      // Never snap across an explicit missing sample.
      const lo = Math.min(best.t,t), hi = Math.max(best.t,t);
      return s.breaks.some(b=>b>lo && b<hi) ? null : best;
    });
    const anchor = hits.filter(Boolean).sort((a,b)=>Math.abs(a.t-t)-Math.abs(b.t-t))[0];
    if(!anchor){ tip.style.display='none'; guide.setAttribute('opacity','0'); el.querySelector('.tl-dots').setAttribute('opacity','0'); return; }
    const gx = x(anchor.t);
    guide.setAttribute('x1',gx); guide.setAttribute('x2',gx); guide.setAttribute('opacity','.7');
    el.querySelector('.tl-dots').setAttribute('opacity','1');
    hits.forEach((p,i)=>{ dots[i].style.display = p ? '' : 'none'; if(p){ dots[i].setAttribute('cx',x(p.t)); dots[i].setAttribute('cy',y(p.v)); } });
    tip.innerHTML = `<div class="tt-date">${esc(opts.when(anchor.t))}</div>`+reduced.map((s,i)=>hits[i]?`<div class="tt-row"><span class="u-dot" style="background:${s.color}"></span><span>${esc(s.label)}</span><b>${esc(s.fmt(hits[i].v))}</b></div>`:'').join('');
    tip.style.display = 'block';
    const left = e.clientX + 16 + tip.offsetWidth > innerWidth ? e.clientX - tip.offsetWidth - 16 : e.clientX + 16;
    tip.style.left = left+'px'; tip.style.top = Math.max(8, e.clientY - 40)+'px';
  });
  el.addEventListener('mouseleave', ()=>{ tip.style.display='none'; guide.setAttribute('opacity','0'); el.querySelector('.tl-dots').setAttribute('opacity','0'); });
}

function axisValue(v,mode){
  if(mode==='cost') return v>=1000 ? '$'+(+(v/1000).toFixed(2))+'K' : '$'+(v<10&&v%1?v.toFixed(2):v.toFixed(0));
  if(mode==='quota' || mode==='primary') return v.toFixed(0)+'%';
  return v>=1e9?+(v/1e9).toFixed(2)+'B':v>=1e6?+(v/1e6).toFixed(1)+'M':v>=1e3?+(v/1e3).toFixed(1)+'K':String(+v.toFixed(1));
}

// ── chart ─────────────────────────────────────────────────────────────────────
// ── cost chart ────────────────────────────────────────────────────────────────
const COST_PARTS = [
  { key:'input', label:'Uncached input', color:'#7289da' },
  { key:'cacheRead', label:'Cached input', color:'#9b87f5' },
  { key:'cacheWrite', label:'Cache writes', color:'#eaca8b' },
  { key:'output', label:'Output', color:'#43b581' },
  // Cost that cannot be split because the row has no token breakdown.
  { key:'unallocated', label:'Unallocated', color:'#8e9297' },
];
// Relative list-price weights per token type. Daily reports carry one total
// cost, so the stack splits that exact total by these ratios.
function costWeights(providerId){
  const id = String(providerId||'').toLowerCase();
  if(/claude|anthropic/.test(id)) return { input:1, cacheRead:.1, cacheWrite:1.25, output:5 };
  if(/codex|openai|gpt|copilot|cursor/.test(id)) return { input:1, cacheRead:.1, cacheWrite:1, output:8 };
  return { input:1, cacheRead:.1, cacheWrite:1.25, output:4 };
}
function costParts(row, weights){
  const input = rowInput(row), cacheRead = rowCacheRead(row), cacheWrite = rowCacheCreate(row);
  const output = rowOutput(row), reasoning = rowReasoning(row), total = rowTotalTokens(row);
  // Some reports count reasoning inside output, others separately.
  const separate = Math.abs(total-(input+cacheRead+cacheWrite+output+reasoning)) < Math.abs(total-(input+cacheRead+cacheWrite+output));
  const tokens = { input, cacheRead, cacheWrite, output: output + (separate ? reasoning : 0), unallocated:0 };
  const split = COST_PARTS.filter(p=>p.key!=='unallocated');
  // Locally priced rows carry exact component costs; others get a ratio estimate.
  const fields = { input:'inputCostUsd', cacheRead:'cacheReadCostUsd', cacheWrite:'cacheWriteCostUsd', output:'outputCostUsd' };
  if(split.every(p=>Number.isFinite(row[fields[p.key]]))){
    return { tokens, exact:true, cost: { ...Object.fromEntries(split.map(p=>[p.key, row[fields[p.key]]])), unallocated:0 } };
  }
  const units = Object.fromEntries(split.map(p=>[p.key, tokens[p.key]*weights[p.key]]));
  const sumUnits = Object.values(units).reduce((a,v)=>a+v,0), cost = rowCost(row);
  if(!(sumUnits>0)) return { tokens, exact:false, cost: { ...Object.fromEntries(split.map(p=>[p.key,0])), unallocated:cost } };
  return { tokens, exact:false, cost: { ...Object.fromEntries(split.map(p=>[p.key, cost*units[p.key]/sumUnits])), unallocated:0 } };
}

function buildChart(containerId, daily, providerId){
  const container = document.getElementById(containerId);
  if(!container) return;
  daily = daily.map(normalizeCostRow);
  if(!daily.some(d=>rowCost(d)>0)){
    const unpriced = daily.some(d=>d.costKnown===false && rowTotalTokens(d)>0);
    container.innerHTML=`<div class="chart-loading">${unpriced?'Usage in this range is unpriced':'No daily cost data recorded'}</div>`; return;
  }

  // Keep bars readable: coarsen long ranges to weeks or months.
  const group = daily.length>70*7 ? 'month' : daily.length>70 ? 'week' : 'day';
  const buckets = [];
  for(const d of daily){
    const key = group==='day' ? d.date : group==='month' ? d.date.slice(0,7) : dateKey(addDays(parseDateOnly(d.date), -((parseDateOnly(d.date).getUTCDay()+6)%7)));
    let b = buckets[buckets.length-1];
    if(!b || b.key!==key){ b = { key, start:d.date, end:d.date, rows:[] }; buckets.push(b); }
    b.end = d.date; b.rows.push(d);
  }
  const weights = costWeights(providerId);
  for(const b of buckets){
    b.cost = {}; b.tokens = {}; b.estimated = 0; b.costKnown = b.rows.every(r=>r.costKnown!==false);
    for(const p of COST_PARTS){ b.cost[p.key]=0; b.tokens[p.key]=0; }
    for(const r of b.rows){
      const parts = costParts(r, weights);
      if(!parts.exact && rowCost(r)>0) b.estimated++;
      for(const p of COST_PARTS){ b.cost[p.key]+=parts.cost[p.key]; b.tokens[p.key]+=parts.tokens[p.key]; }
    }
    b.total = b.rows.reduce((a,r)=>a+rowCost(r),0);
  }
  const shown = COST_PARTS.filter(p=>buckets.some(b=>b.cost[p.key]>0 || b.tokens[p.key]>0));
  const W=Math.max(300,Math.round(container.clientWidth||860)),H=240,L=52,R=12,T=12,B=28,CW=W-L-R,CH=H-T-B;
  const max = niceMax(Math.max(...buckets.map(b=>b.total)));
  const step = CW/buckets.length, barW = Math.max(2, Math.min(28, step*.7));
  const y = v=>T+CH*(1-v/max);
  let svg = `<svg class="chart-svg cost-chart" viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=4;i++){
    const v = max*i/4;
    svg+=`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="var(--bd)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" fill="var(--su)" font-size="10.5">${esc(axisValue(v,'cost'))}</text>`;
  }
  buckets.forEach((b,i)=>{
    const x = L+i*step+(step-barW)/2;
    let acc = 0;
    svg+=`<g class="cost-col" data-i="${i}"><rect x="${(L+i*step).toFixed(1)}" y="${T}" width="${step.toFixed(1)}" height="${CH}" fill="transparent"/>`;
    shown.forEach((p,pi)=>{
      const v = b.cost[p.key]; if(!(v>0)) return;
      const y1 = y(acc+v), h = Math.max(.5, y(acc)-y1);
      const top = pi===shown.length-1 || shown.slice(pi+1).every(q=>!(b.cost[q.key]>0));
      svg+=`<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" fill="${p.color}" ${top?`rx="${Math.min(3,barW/3).toFixed(1)}"`:''}/>`;
      acc += v;
    });
    svg+=`</g>`;
  });
  const every = Math.max(1, Math.ceil(buckets.length/8));
  buckets.forEach((b,i)=>{
    if(i%every && i!==buckets.length-1) return;
    if(i!==buckets.length-1 && buckets.length-1-i < every/2) return;
    svg+=`<text x="${(L+(i+.5)*step).toFixed(1)}" y="${H-6}" text-anchor="middle" fill="var(--su)" font-size="10.5">${esc((group==='month'?new Date(b.start+'T00:00:00Z').toLocaleDateString('en-US',{month:'short',year:'2-digit',timeZone:'UTC'}):fmtDay(b.start)).toUpperCase())}</text>`;
  });
  svg+=`</svg>`;
  const totals = Object.fromEntries(shown.map(p=>[p.key, buckets.reduce((a,b)=>a+b.cost[p.key],0)]));
  const legend = `<div class="chart-legend">${shown.map(p=>`<span class="legend-item"><span class="legend-dot" style="background:${p.color}"></span>${esc(p.label)} <b class="legend-val">${esc(fmtUsd(totals[p.key]))}</b></span>`).join('')}</div>`;
  const estimatedDays = buckets.reduce((a,b)=>a+b.estimated,0), pricedDays = daily.filter(d=>rowCost(d)>0).length;
  const split = !estimatedDays ? 'Split by token type uses per-component prices.'
    : estimatedDays===pricedDays ? 'Daily totals are reported cost; the split by token type is estimated from list-price ratios.'
    : `Split uses per-component prices where available; ${estimatedDays} of ${pricedDays} priced days are estimated from list-price ratios.`;
  const note = `<div class="small-note">${group!=='day'?`Grouped by ${group}. `:''}${split}</div>`;
  container.innerHTML = legend + svg + note;

  const tip = document.getElementById('tip');
  container.querySelectorAll('.cost-col').forEach(g=>{
    g.addEventListener('mouseenter',()=>{
      const b = buckets[+g.dataset.i];
      const when = b.start===b.end ? fmtDay(b.start) : `${fmtDay(b.start)} → ${fmtDay(b.end)}`;
      tip.innerHTML = `<div class="tt-date">${esc(when)}</div><div class="tt-cost">${esc(recordedCost({cost:b.total,costKnown:b.costKnown}))}</div>`+
        shown.slice().reverse().filter(p=>b.tokens[p.key]>0 || b.cost[p.key]>0).map(p=>`<div class="tt-row"><span class="u-dot" style="background:${p.color}"></span><span>${esc(p.label)} <i>${esc(fmtTok(b.tokens[p.key]))}</i></span><b>${b.estimated?'≈':''}${esc(fmtUsd(b.cost[p.key]))}</b></div>`).join('')+(b.estimated?`<div class="tt-meta">split estimated from price ratios</div>`:'');
      tip.style.display='block';
      g.classList.add('hover');
    });
    g.addEventListener('mousemove',e=>{
      const left = e.clientX + 16 + tip.offsetWidth > innerWidth ? e.clientX - tip.offsetWidth - 16 : e.clientX + 16;
      tip.style.left=left+'px'; tip.style.top=Math.max(8,e.clientY-40)+'px';
    });
    g.addEventListener('mouseleave',()=>{ tip.style.display='none'; g.classList.remove('hover'); });
  });
}

// ── helpers ───────────────────────────────────────────────────────────────────
const PACE_COLORS={
  well_under:'#859bee',under:'#43b581',slightly_under:'#1ed760',
  on_track:'#7289da',slightly_over:'#eaca8b',over:'#ce8670',well_over:'#d25050'
};
function paceColor(s){return PACE_COLORS[s]||'#484f58'}
function stageLbl(s){return(s||'').replace(/_/g,' ')}
function barCol(p){return p>=95?'#d25050':p>=80?'#ce8670':p>=65?'#eaca8b':'#7289da'}
function pct(m){return m.limit>0?Math.min(m.used/m.limit*100,100):0}
function pillCls(c){return'pill '+({'green':'pill-green','red':'pill-red','blue':'pill-blue','yellow':'pill-yellow','orange':'pill-orange'}[c]||'')}
function srcCls(s){return'badge b-'+({'oauth':'oauth','web':'web','api':'api','cli':'cli','local':'local','error':'error'}[s]||'local')}

function fmtMetric(m){
  const k=m.format?.kind;
  if(k==='percent'){const p=m.limit>0?m.used/m.limit*100:0;return`${displayPct(p).toFixed(1)}% ${S.prefs.quotaDisplay === 'remaining' ? 'remaining' : 'used'}`;}
  const remaining=S.prefs.quotaDisplay==='remaining', value=remaining?Math.max(0,m.limit-m.used):m.used;
  if(k==='dollars') return `${fmtUsd(value)} / ${fmtUsd(m.limit)}${remaining?' remaining':''}`;
  return `${fmtNum(value)} / ${fmtNum(m.limit)} ${m.format?.suffix||''}${remaining?' remaining':''}`.trim();
}
function barChartMetricHtml(m, compact){
  const points = (Array.isArray(m.points)?m.points:[])
    .map(p=>({label:String(p.label||''),value:Number(p.value||0),valueLabel:p.valueLabel||p.value_label||null}))
    .filter(p=>p.label && Number.isFinite(p.value) && p.value>=0);
  const cls = compact ? 'metric' : 'dmetric';
  if(!points.length) return '';
  const max = Math.max(...points.map(p=>p.value), 1);
  const latest = points[points.length-1];
  const peak = points.reduce((a,p)=>p.value>a.value?p:a, points[0]);
  const color = chartColor(m.color);
  const bars = points.slice(-31).map(p=>{
    const h = Math.max(3, Math.round((p.value/max)*100));
    return `<div class="spark-bar" style="height:${h}%;--spark:${color}" title="${esc(p.label)}: ${esc(formatChartValue(p))}"></div>`;
  }).join('');
  const readout = compact ? formatChartValue(latest) : `${formatChartValue(latest)} latest · ${formatChartValue(peak)} peak`;
  const note = m.note ? `<div class="spark-note">${esc(m.note)}</div>` : '';
  return `<div class="${cls}"><div class="spark"><div class="spark-head"><span class="spark-title">${esc(m.label||'History')}</span><span class="spark-readout">${esc(readout)}</span></div><div class="spark-bars" aria-label="${esc(m.label||'History')}">${bars}</div>${note}</div></div>`;
}
function formatChartValue(point){
  if(point?.valueLabel) return String(point.valueLabel);
  return fmtTok(Math.round(Number(point?.value)||0));
}
function chartColor(c){
  if(typeof c === 'string' && /^#[0-9a-f]{3,8}$/i.test(c.trim())) return c.trim();
  return {'green':'#3fb950','red':'#f85149','blue':'#58a6ff','yellow':'#e3b341','orange':'#f0883e','teal':'#39c5cf'}[c] || '#58a6ff';
}
function fmtNum(n){return n>=10000?n.toLocaleString():String(+(n).toFixed(n%1?1:0))}
function fmtTok(n){
  if(!Number.isFinite(n)) return '—';
  const magnitude=Math.abs(n);
  // Promote when rounding the smaller unit would display 1000.0.
  if(magnitude>=999950000) return (n/1e9).toFixed(2)+'B';
  if(magnitude>=999950) return (n/1e6).toFixed(1)+'M';
  if(magnitude>=1e3) return (n/1e3).toFixed(1)+'K';
  return String(n);
}
function fmtReset(iso){
  if(!iso) return '';
  const ms=new Date(iso)-Date.now();
  if(ms<=0) return 'resetting…';
  const h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000);
  if(h>48) return `resets in ${Math.floor(h/24)}d`;
  return h>0?`resets in ${h}h ${m}m`:`resets in ${m}m`;
}
function fmtEta(secs,stage){
  if(secs==null||stage==='well_under') return '∞';
  if(secs<60) return '<1m';
  const h=Math.floor(secs/3600),m=Math.floor((secs%3600)/60);
  return h>0?`${h}h ${m}m`:`${m}m`;
}
function fmtDelta(d){
  if(d==null) return '—';
  const a=Math.abs(d).toFixed(1);
  return d>0.5?`+${a}% ahead`:d<-0.5?`${-a}% behind`:'on schedule';
}
function fmtAgo(iso){
  if(!iso) return '';
  const s=Math.round((Date.now()-new Date(iso))/1000);
  if(s<60) return `${s}s ago`;
  if(s<3600) return `${Math.round(s/60)}m ago`;
  if(s<172800) return `${Math.round(s/3600)}h ago`;
  return `${Math.round(s/86400)}d ago`;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function arcSvg(p,color){
  const r=18,c=+(2*Math.PI*r).toFixed(3),off=+(c*(1-Math.min(p,100)/100)).toFixed(3);
  return `<div class="arc"><svg width="48" height="48" viewBox="0 0 52 52"><circle class="arc-bg" cx="26" cy="26" r="${r}"/><circle class="arc-fill" cx="26" cy="26" r="${r}" stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${off}"/></svg><div class="arc-num">${Math.round(p)}%</div></div>`;
}

function animateBarsAndArcs(root){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    root.querySelectorAll('.bar[data-w],.dm-bar[data-w]').forEach(el=>{el.style.width=el.dataset.w});
    root.querySelectorAll('.arc-fill[data-off]').forEach(el=>{
      el.style.transition='stroke-dashoffset .9s cubic-bezier(.4,0,.2,1)';
      el.style.strokeDashoffset=el.dataset.off;
    });
  }));
}
function animateCompareBars(root){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    root.querySelectorAll('.compare-fill[data-w]').forEach(el=>{
      el.style.transition='width .9s cubic-bezier(.4,0,.2,1)';
      el.style.width=el.dataset.w;
    });
  }));
}

// ── init ──────────────────────────────────────────────────────────────────────
load();
</script>
