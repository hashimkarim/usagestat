<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Usage</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#23283d; --s0:#1e2233; --s1:#191f2e; --s2:#101320; --s3:#32364a;
  --bd:#e4e4e410; --bd2:#23283d60; --bd3:#10132060;
  --tx:#dadada; --hi:#ffffff; --mu:#b9bbbe; --su:#8e9297;
  --blue:#7289da; --green:#43b581; --ltgreen:#1ed760;
  --teal:#6e84d1; --yellow:#eaca8b; --orange:#ce8670; --red:#d25050;
  --purple:#b48ead; --magenta:#da97cd; --deep:#4f5d92; --bright:#859bee;
  --mono:ui-monospace,'Cascadia Code','Source Code Pro',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --r:8px;
}

html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.5}
body{
  background-image:
    radial-gradient(ellipse 70% 45% at 50% -8%,rgba(114,137,218,.12),transparent 62%),
    linear-gradient(180deg,#23283d 0%,#1e2233 42%,#101320 100%);
  background-size:100% 100%;
  background-attachment:fixed;
}

/* ── layout ── */
.shell{max-width:1480px;margin:0 auto;padding:16px 20px 60px}

/* ── header ── */
header{
  display:flex;align-items:center;gap:0;
  background:color-mix(in srgb,var(--s0) 92%,transparent);border:1px solid var(--bd);
  border-radius:var(--r);backdrop-filter:blur(12px);
  margin-bottom:0;position:sticky;top:10px;z-index:50;
  overflow:hidden;
}
.hstart{display:flex;align-items:center;gap:10px;padding:11px 16px;flex-shrink:0}
.mark{
  width:28px;height:28px;border-radius:5px;border:1px solid color-mix(in srgb,var(--blue) 70%,transparent);
  display:flex;align-items:center;justify-content:center;
  font:700 10px/1 var(--mono);color:var(--bright);letter-spacing:-.5px;flex-shrink:0;
  background:color-mix(in srgb,var(--deep) 22%,transparent);
}
.appname{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--tx);white-space:nowrap}

/* ── tab bar (inside header) ── */
.tab-bar{
  display:flex;align-items:stretch;flex:1;
  overflow-x:auto;scrollbar-width:none;border-left:1px solid var(--bd);
}
.tab-bar::-webkit-scrollbar{display:none}
.tab{
  display:flex;align-items:center;gap:7px;padding:0 16px;
  background:transparent;border:none;cursor:pointer;
  font:13px var(--sans);color:var(--mu);white-space:nowrap;
  position:relative;transition:color .15s;min-height:50px;flex-shrink:0;
}
.tab:hover{color:var(--tx)}
.tab.active{color:var(--tx)}
.tab.active::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:var(--blue);border-radius:2px 2px 0 0;
}
.tab-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;opacity:.8}

.hend{display:flex;align-items:center;gap:10px;padding:11px 14px;flex-shrink:0;border-left:1px solid var(--bd)}
.conn{
  display:flex;align-items:center;gap:5px;padding:3px 9px;
  border:1px solid var(--bd);border-radius:100px;
  font:11px var(--mono);color:var(--mu);transition:border-color .3s,color .3s;
}
.conn.online{border-color:rgba(63,185,80,.4);color:var(--green)}
.conn.offline{border-color:rgba(248,81,73,.4);color:var(--red)}
.cdot{width:5px;height:5px;border-radius:50%;background:var(--su);flex-shrink:0;transition:background .3s,box-shadow .3s}
.conn.online .cdot{background:var(--green);box-shadow:0 0 5px var(--green)}
.conn.offline .cdot{background:var(--red);box-shadow:0 0 5px var(--red)}
.ago{font:11px var(--mono);color:var(--mu)}
.rbtn{
  position:relative;width:32px;height:32px;border-radius:50%;
  background:var(--s1);border:1px solid var(--bd2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .2s,background .2s;flex-shrink:0;
}
.rbtn:hover{border-color:var(--blue);background:var(--s3)}
.rbtn svg{position:relative;z-index:1;width:13px;height:13px;stroke:var(--mu);transition:stroke .2s}
.rbtn:hover svg{stroke:var(--bright)}
.rbtn.spin svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ring-svg{position:absolute;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px)}
.ring-t{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;opacity:.38;
  transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 1s linear}
@media(max-width:640px){
  .shell{padding:16px 20px 44px}
  header{flex-wrap:wrap}
  .hstart{flex:1}
  .hend{border-left:1px solid var(--bd);margin-left:auto}
  .tab-bar{order:3;flex-basis:100%;border-left:0;border-top:1px solid var(--bd)}
  .tab{min-height:42px;padding:0 14px}
}
@media(max-width:440px){
  .ago{display:none}
  .hend{gap:8px}
}

/* ── panels ── */
.panels{margin-top:16px}
.panel{display:none;animation:fadeIn .2s ease}
.panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ── offline banner ── */
.offline-wrap{display:none;text-align:center;padding:64px 24px;
  background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:16px}
.offline-wrap.show{display:block}
.oicon{font-size:32px;margin-bottom:12px}
.otitle{font-size:16px;font-weight:600;margin-bottom:6px}
.osub{color:var(--mu);font-size:13px;margin-bottom:12px}
.ocmd{display:inline-block;padding:4px 12px;background:var(--s1);border:1px solid var(--bd2);
  border-radius:5px;font:12px var(--mono);color:var(--bright)}

/* ── overview grid ── */
.overview-summary{display:grid;grid-template-columns:1.08fr .92fr .92fr;gap:16px;margin-bottom:16px;align-items:flex-start}
@media(max-width:1180px){.overview-summary{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.overview-summary{grid-template-columns:1fr}}
.overview-panel{
  background:linear-gradient(180deg,color-mix(in srgb,var(--s0) 92%,var(--blue) 8%),var(--s0));
  border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;align-self:flex-start;
}
.overview-title{font-size:18px;font-weight:700;color:var(--hi);margin-bottom:4px}
.overview-sub{font:12px var(--mono);color:var(--mu);margin-bottom:14px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:760px){.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:color-mix(in srgb,var(--s1) 76%,transparent);border:1px solid var(--bd);border-radius:7px;padding:11px 12px}
.kpi-value{font:700 21px/1 var(--mono);color:var(--hi);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-label{font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.alert-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.alert-row{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;background:color-mix(in srgb,var(--s1) 78%,transparent);border:1px solid var(--bd);border-left:3px solid var(--alert,var(--blue));border-radius:7px}
.alert-mark{font:700 10px/1 var(--mono);color:var(--alert,var(--blue));text-transform:uppercase;min-width:42px;padding-top:2px}
.alert-text{font:12px/1.35 var(--sans);color:var(--tx);min-width:0}
.alert-sub{display:block;font:11px var(--mono);color:var(--mu);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pressure-list{display:flex;flex-direction:column;gap:9px}
.pressure-row{display:grid;grid-template-columns:minmax(90px,1fr) 70px 1.8fr;gap:10px;align-items:center}
.pressure-name{font:12px var(--mono);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pressure-value{font:12px var(--mono);color:var(--mu);text-align:right}
.pressure-track{height:5px;background:var(--s2);border-radius:999px;overflow:hidden}
.pressure-fill{height:100%;border-radius:999px;background:var(--blue)}
.overview-controls{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);
  padding:10px 12px;margin-bottom:16px;
}
.ctrl-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctrl-input,.ctrl-select{
  height:32px;border:1px solid var(--bd2);border-radius:6px;background:var(--s1);
  color:var(--tx);font:12px var(--mono);outline:none;
}
.ctrl-input{width:min(280px,72vw);padding:0 10px}
.ctrl-select{padding:0 30px 0 9px}
.ctrl-input:focus,.ctrl-select:focus{border-color:var(--blue);box-shadow:0 0 0 2px color-mix(in srgb,var(--blue) 18%,transparent)}
.action-btn{
  height:32px;display:inline-flex;align-items:center;gap:7px;padding:0 10px;
  border:1px solid var(--bd2);border-radius:6px;background:var(--s1);
  color:var(--mu);font:11px var(--mono);cursor:pointer;transition:border-color .2s,color .2s,background .2s;
}
.action-btn:hover{border-color:var(--blue);color:var(--hi);background:var(--s3)}
.action-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.result-count{font:11px var(--mono);color:var(--mu)}
.rollup-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.rollup-card{background:color-mix(in srgb,var(--s1) 76%,transparent);border:1px solid var(--bd);border-radius:7px;padding:11px 12px;min-width:0}
.rollup-value{font:700 19px/1.1 var(--mono);color:var(--hi);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rollup-label{font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.delta{font:10px var(--mono);margin-left:4px;color:var(--mu)}
.delta.up{color:var(--orange)}.delta.down{color:var(--green)}.delta.flat{color:var(--mu)}
@media(max-width:440px){
  .rollup-card{padding:10px}
  .rollup-value{font-size:17px;white-space:normal;overflow:visible;text-overflow:clip;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
  .delta{margin-left:0;font-size:9px}
}
.overview-trend{margin-top:12px}
.trend-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}
.trend-title{font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.trend-readout{font:11px var(--mono);color:var(--tx);text-align:right}
.trend-bars{display:flex;align-items:flex-end;gap:3px;height:48px;padding:6px 0 3px;border-bottom:1px solid var(--bd)}
.trend-bar{flex:1;min-width:4px;border-radius:3px 3px 0 0;background:var(--blue);opacity:.82}
.contrib-list{display:flex;flex-direction:column;gap:8px;margin-top:11px}
.contrib-row{display:grid;grid-template-columns:minmax(84px,1fr) 82px 1.4fr;gap:9px;align-items:center}
.contrib-name{font:12px var(--mono);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contrib-value{font:12px var(--mono);color:var(--mu);text-align:right}
.empty-state{padding:36px 16px;text-align:center;background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);color:var(--mu);font:13px var(--mono)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.sk-card{height:240px;background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);
  position:relative;overflow:hidden}
.sk-card::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);
  animation:shim 1.5s infinite}
@keyframes shim{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* ── overview card ── */
.card{
  background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column;position:relative;
  animation:cardIn .3s ease both;transition:border-color .2s,box-shadow .2s;
}
.card:hover{
  border-color:color-mix(in srgb,var(--accent,var(--su)) 40%,var(--bd));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--accent,var(--su)) 12%,transparent);
}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--accent,var(--su));transition:background .4s}
.card.is-error{border-color:rgba(248,81,73,.25)}
.card.is-error::before{background:var(--red)}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.card-head{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 14px 10px 17px;gap:10px}
.card-meta{flex:1;min-width:0}
.card-name{font-size:14px;font-weight:600;color:var(--tx);margin-bottom:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-tags{display:flex;align-items:center;flex-wrap:wrap;gap:4px}

/* badges */
.badge{font:600 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:100px;border:1px solid;white-space:nowrap}
.b-oauth{color:var(--purple);border-color:color-mix(in srgb,var(--purple) 45%,transparent);background:color-mix(in srgb,var(--purple) 10%,transparent)}
.b-web  {color:var(--bright); border-color:color-mix(in srgb,var(--bright) 45%,transparent);background:color-mix(in srgb,var(--bright) 10%,transparent)}
.b-api  {color:var(--teal); border-color:color-mix(in srgb,var(--teal) 45%,transparent);background:color-mix(in srgb,var(--teal) 10%,transparent)}
.b-cli  {color:var(--yellow);border-color:color-mix(in srgb,var(--yellow) 45%,transparent);background:color-mix(in srgb,var(--yellow) 10%,transparent)}
.b-local{color:var(--mu);   border-color:var(--bd2);         background:transparent}
.b-error{color:var(--red);  border-color:rgba(248,81,73,.4); background:rgba(248,81,73,.08)}
.plan-tag{font:11px var(--mono);color:var(--mu);padding:2px 6px;border:1px solid var(--bd);border-radius:4px}

/* arc */
.arc{position:relative;width:48px;height:48px;flex-shrink:0}
.arc svg{width:48px;height:48px}
.arc-bg{fill:none;stroke:var(--s2);stroke-width:5}
.arc-fill{fill:none;stroke-width:5;stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:center}
.arc-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font:700 11px/1 var(--mono);color:var(--tx)}

/* card body */
.card-body{padding:0 14px 4px 17px;flex:1}
.metric{margin-bottom:12px}
.mlabel{font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin-bottom:3px}
.prog-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.prog-val{font:12px var(--mono);color:var(--tx)}
.metric-detail{font:11px var(--mono);color:var(--mu);margin:0 0 5px;word-break:break-word}
.track{height:3px;background:var(--s2);border-radius:2px;overflow:hidden}
.bar{height:100%;border-radius:2px;width:0;transition:width .85s cubic-bezier(.4,0,.2,1)}
.resets{font:11px var(--mono);color:var(--mu);margin-top:3px}
.kv{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kv-val{font:12px var(--mono);color:var(--tx);text-align:right}
.pill{font:11px var(--mono);padding:2px 7px;border-radius:100px;border:1px solid var(--bd2);color:var(--tx)}
.pill-green{border-color:rgba(63,185,80,.5);color:var(--green);background:rgba(63,185,80,.08)}
.pill-red  {border-color:rgba(248,81,73,.5);color:var(--red);  background:rgba(248,81,73,.08)}
.pill-blue {border-color:rgba(88,166,255,.5);color:var(--blue); background:rgba(88,166,255,.08)}
.pill-yellow{border-color:rgba(227,179,65,.5);color:var(--yellow);background:rgba(227,179,65,.08)}
.pill-orange{border-color:rgba(240,136,62,.5);color:var(--orange);background:rgba(240,136,62,.08)}
.spark{margin-top:4px}
.spark-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.spark-title{font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.spark-readout{font:11px var(--mono);color:var(--tx);text-align:right}
.spark-bars{display:flex;align-items:flex-end;gap:2px;height:42px;padding:6px 0 3px;border-bottom:1px solid var(--bd)}
.spark-bar{flex:1;min-width:2px;max-width:12px;border-radius:2px 2px 0 0;background:var(--spark,var(--blue));opacity:.78}
.spark-note{font:10px var(--mono);color:var(--mu);margin-top:4px}

/* card pace */
.card-pace{margin:10px 0 4px;padding:9px 11px;background:var(--s1);border:1px solid var(--bd);border-radius:7px}
.pace-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.pace-lbl{font:10px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--mu)}
.pace-stage{font:700 10px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;
  padding:2px 8px;border-radius:100px;border:1px solid currentColor}
.pace-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.ps-lbl{font:10px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--mu);margin-bottom:1px}
.ps-val{font:12px var(--mono);color:var(--tx)}
.ps-val.pos{color:var(--green)}.ps-val.neg{color:var(--orange)}.ps-val.ok{color:var(--green)}.ps-val.no{color:var(--red)}

/* card footer */
.card-foot{display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px 10px 17px;border-top:1px solid var(--bd);margin-top:auto}
.foot-ts{font:11px var(--mono);color:var(--su)}
.slink{display:flex;align-items:center;gap:4px;font:11px var(--mono);color:var(--mu);text-decoration:none;transition:color .15s}
.slink:hover{color:var(--teal)}
.slink svg{width:10px;height:10px}

/* ── PROVIDER DETAIL ── */
.detail{max-width:1280px}

.detail-header{
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:20px 22px;background:var(--s0);border:1px solid var(--bd);
  border-radius:var(--r);margin-bottom:16px;
}
.dh-left{flex:1;min-width:0}
.dh-name{font-size:22px;font-weight:700;color:var(--tx);margin-bottom:8px}
.dh-tags{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.dh-right{text-align:right;flex-shrink:0;margin-left:20px}
.dh-pct{font:700 40px/1 var(--mono);color:var(--tx)}
.dh-pct-lbl{font:11px var(--mono);color:var(--mu);margin-top:4px;text-transform:uppercase;letter-spacing:.08em}

/* two-col split */
.detail-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:16px;align-items:start}
@media(max-width:700px){.detail-cols{grid-template-columns:1fr}}

.detail-box{background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);padding:18px 20px}
.box-title{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;
  color:var(--mu);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.box-title::after{content:'';flex:1;height:1px;background:var(--bd)}

/* detail metrics */
.dmetric{margin-bottom:16px}
.dmetric:last-child{margin-bottom:0}
.dm-label{font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin-bottom:5px}
.dm-val{font:13px var(--mono);color:var(--tx);margin-bottom:6px}
.dm-detail{font:12px var(--mono);color:var(--mu);margin:0 0 6px;word-break:break-word}
.dm-track{height:5px;background:var(--s2);border-radius:3px;overflow:hidden;margin-bottom:4px}
.dm-bar{height:100%;border-radius:3px;width:0;transition:width .9s cubic-bezier(.4,0,.2,1)}
.dm-row{display:flex;align-items:center;justify-content:space-between}
.dm-pct{font:11px var(--mono);color:var(--mu)}
.dm-reset{font:11px var(--mono);color:var(--mu)}

/* pace detail */
.compare-bars{margin-bottom:14px}
.compare-row{display:grid;grid-template-columns:70px 1fr 44px;align-items:center;gap:8px;margin-bottom:6px}
.compare-lbl{font:11px var(--mono);color:var(--mu);text-align:right}
.compare-track{height:6px;background:var(--s2);border-radius:3px;overflow:hidden}
.compare-fill{height:100%;border-radius:3px;transition:width .9s cubic-bezier(.4,0,.2,1)}
.compare-pct{font:11px var(--mono);color:var(--tx)}

.pace-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--bd)}

@media(max-width:1000px){.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.stats-grid{grid-template-columns:1fr}}
.stat-card{background:var(--s1);border:1px solid var(--bd);border-radius:7px;padding:11px 12px;min-width:0}

  padding:0 8px 8px;text-align:left;border-bottom:1px solid var(--bd)}

.usage-table th:not(:first-child){text-align:right}
.usage-table td{padding:8px;border-bottom:1px solid var(--bd);font:12px var(--mono);color:var(--tx);vertical-align:middle}

.usage-table tr:last-child td{border-bottom:none}
.heatmap{display:grid;grid-template-columns:repeat(31,minmax(8px,1fr));gap:3px;align-items:end;margin-top:10px}

<body>
<div id="tip"></div>
<div class="shell">

  <header>
    <div class="hstart">
      <div class="mark">AI</div>
      <span class="appname">Usage</span>
    </div>
    <nav id="tabs" class="tab-bar">
      <button class="tab active" data-tab="overview" onclick="switchTab('overview')">Overview</button>
      <button class="tab" data-tab="history" onclick="switchTab('history')">History</button>
    </nav>
    <div class="hend">
      <div id="conn" class="conn"><span class="cdot"></span><span id="connTxt">connecting</span></div>
      <span id="ago" class="ago"></span>
      <button id="rbtn" class="rbtn" title="Refresh" onclick="doRefresh()">
        <svg class="ring-svg" viewBox="0 0 28 28">
          <circle id="ring" class="ring-t" cx="14" cy="14" r="11"/>
        </svg>
        <svg viewBox="0 0 16 16" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13.5 6A6 6 0 1 0 14 10"/><polyline points="14,2 14,6 10,6"/>
        </svg>
      </button>
    </div>
  </header>

  <div id="offline" class="offline-wrap">
    <div class="oicon">⚡</div>
    <div class="otitle">Daemon offline</div>
    <div class="osub">Start the AI usage daemon to see live data.</div>
    <code class="ocmd">ai-usage-daemon</code>
  </div>

  <div class="panels">
    <div id="panel-overview" class="panel active">
      <div id="overviewSummary" class="overview-summary"></div>
      <div id="overviewControls" class="overview-controls"></div>
      <div id="grid" class="grid">
        <div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div>
      </div>
    </div>
    <div id="panel-history" class="panel"></div>
  </div>

</div>
<script src="/dashboard/trends.js"></script>
<script>
// ── state ─────────────────────────────────────────────────────────────────────
const S = {
  snapshots:[],
  providers:[],
  dailyRows:[],
  dailyError:false,
  costs:{},
  histories:{},
  active:'overview',
  loadedAt:null,
  online:false,
  prefs:loadPrefs()
};

// ── countdown ring ────────────────────────────────────────────────────────────
const INTERVAL = 30;
const Rr = 11, Rc = +(2*Math.PI*Rr).toFixed(3);
const ringEl = document.getElementById('ring');
ringEl.style.strokeDasharray = Rc;
let tick = INTERVAL, tickTimer = null, busy = false;
function setRing(s){ ringEl.style.strokeDashoffset = (Rc*(1-s/INTERVAL)).toFixed(3); }
function startTick(){ clearInterval(tickTimer); tick=INTERVAL; setRing(INTERVAL);
  tickTimer = setInterval(()=>{ tick--; setRing(tick); if(tick<=0) load(); },1000); }
function updAgo(){ const el=document.getElementById('ago');
  if(!S.loadedAt){el.textContent='';return;}
  const s=Math.round((Date.now()-S.loadedAt)/1000);
  el.textContent=s<5?'updated now':s<60?`${s}s ago`:`${Math.round(s/60)}m ago`; }
setInterval(updAgo,5000);

// ── network ───────────────────────────────────────────────────────────────────
async function load(){
  clearInterval(tickTimer);
  try {
    const [usage,providers,daily] = await Promise.all([
      fetch('/v1/usage').then(r=>r.json()),
      fetch('/v1/providers').then(r=>r.json()),
      fetch('/v1/history/daily').then(r=>r.ok?r.json():null).catch(()=>null),
    ]);
    S.snapshots = usage;
    S.providers = providers.filter(p=>p.enabled);
    S.dailyRows = normalizeDailyRows(daily);
    S.dailyError = !daily || !!daily.error || !(Array.isArray(daily) || Array.isArray(daily.daily));
    S.histories = {};
    S.costs = {};
    S.online = true; S.loadedAt = Date.now(); updAgo();
    setOnline(true);
    buildTabs();
    renderActive();
  } catch {
    S.online = false; setOnline(false); renderActive();
  }
  startTick();
}

async function doRefresh(){
  if(busy) return; busy=true;
  document.getElementById('rbtn').classList.add('spin');
  try{
    await fetch('/v1/refresh',{method:'POST'}).catch(()=>{});
    await new Promise(r=>setTimeout(r,600));
    await load();
  }finally{ busy=false; document.getElementById('rbtn').classList.remove('spin'); }
}

async function fetchCost(id){
  if(id in S.costs) return S.costs[id];
  try{ S.costs[id]=await fetch(`/v1/cost/${id}`).then(r=>r.json()); }
  catch{ S.costs[id]=null; }
  return S.costs[id];
}

async function fetchHistory(id){
  if(id in S.histories) return S.histories[id];
  try{ S.histories[id]=await fetch(`/v1/history/${id}`).then(r=>r.json()); }
  catch{ S.histories[id]=[]; }
  return S.histories[id];
}

async function fetchCcusageReports(id){
  const reports = ['daily','weekly','monthly','session','blocks'];
  const out = {};
  await Promise.all(reports.map(async report=>{
    try{ out[report]=await fetch(`/v1/local-usage/${id}/${report}`).then(r=>r.json()); }
    catch{ out[report]={ error:{ code:'FETCH_FAILED' } }; }
  }));
  return out;
}

// ── ui state ──────────────────────────────────────────────────────────────────
function setOnline(on){
  const el=document.getElementById('conn');
  el.className='conn '+(on?'online':'offline');
  document.getElementById('connTxt').textContent=on?'live':'offline';
  document.getElementById('offline').classList.toggle('show',!on);
}

function switchTab(id){
  S.active=id;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===id));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===`panel-${id}`));
  renderActive();
}

function renderActive(){
  if(S.active==='overview') renderOverview();
  else if(S.active==='history') renderTrends();
  else renderProvider(S.active);
}

function orderedSnapshots(){
  const byId = new Map(S.snapshots.map(s=>[s.providerId,s]));
  const ordered = [];
  for(const p of S.providers){
    const snap = byId.get(p.id);
    if(snap) ordered.push(snap);
  }
  const seen = new Set(ordered.map(s=>s.providerId));
  for(const snap of S.snapshots){
    if(!seen.has(snap.providerId)) ordered.push(snap);
  }
  return ordered;
}

// ── tabs ──────────────────────────────────────────────────────────────────────
function buildTabs(){
  const bar = document.getElementById('tabs');
  const existing = new Set([...bar.querySelectorAll('.tab')].map(t=>t.dataset.tab));

  // overview
  if(!existing.has('overview')){
    const b=document.createElement('button');
    b.className='tab'+(S.active==='overview'?' active':'');
    b.dataset.tab='overview'; b.onclick=()=>switchTab('overview');
    b.textContent='Overview'; bar.prepend(b);
  }

  // per-provider tabs
  for(const p of S.providers){
    if(existing.has(p.id)) continue;
    const snap = S.snapshots.find(s=>s.providerId===p.id);
    const accent = snap?.pace ? paceColor(snap.pace.stage) : '#484f58';
    const b=document.createElement('button');
    b.className='tab'+(S.active===p.id?' active':'');
    b.dataset.tab=p.id; b.onclick=()=>switchTab(p.id);
    b.innerHTML=`<span class="tab-dot" style="background:${accent}"></span>${esc(p.name)}`;
    bar.appendChild(b);

    // ensure panel exists
    if(!document.getElementById(`panel-${p.id}`)){
      const div=document.createElement('div');
      div.id=`panel-${p.id}`; div.className='panel';
      document.querySelector('.panels').appendChild(div);
    }
  }
}

// ── overview ─────────────────────────────────────────────────────────────────
function renderOverview(){
  const grid=document.getElementById('grid');
  renderOverviewSummary();
  renderOverviewControls();
  if(!S.snapshots.length){grid.innerHTML='';return;}
  const overview = overviewSnapshots();
  if(!overview.length){
    grid.innerHTML=`<div class="empty-state" style="grid-column:1/-1">No providers match the current view</div>`;
    return;
  }
  let html='';
  overview.forEach((s,i)=>{
    const isErr=s.source==='error';
    const pace=s.pace;
    const primM=s.metrics?.find(m=>m.type==='progress'&&m.format?.kind==='percent'&&m.limit>0);
    const primP=primM?pct(primM):null;
    const accent=pace?paceColor(pace.stage):primP!=null?barCol(primP):'#484f58';
    const roll = providerWindowTotals(s.providerId, 30);
    html+=`<div class="card${isErr?' is-error':''}" style="--accent:${accent};animation-delay:${i*50}ms">`;
    html+=`<div class="card-head"><div class="card-meta">`;
    html+=`<div class="card-name">${esc(s.displayName||s.providerId)}</div>`;
    html+=`<div class="card-tags">`;
    if(s.source) html+=`<span class="badge b-${s.source||'local'}">${esc(s.source)}</span>`;
    if(s.plan)   html+=`<span class="plan-tag">${esc(s.plan)}</span>`;
    html+=`</div></div>`;
    if(primP!=null) html+=arcSvg(primP,barCol(primP));
    html+=`</div><div class="card-body">`;
    for(const m of (s.metrics||[])){
      if(m.type==='progress'){
        const p=pct(m),col=barCol(p);
        html+=`<div class="metric"><div class="mlabel">${esc(m.label)}</div>`;
        html+=`<div class="prog-row"><span class="prog-val">${fmtMetric(m)}</span></div>`;
        if(m.detail) html+=`<div class="metric-detail">${esc(m.detail)}</div>`;
        html+=`<div class="track"><div class="bar" style="background:${col}" data-w="${p.toFixed(2)}%"></div></div>`;
        if(m.resetsAt) html+=`<div class="resets">${fmtReset(m.resetsAt)}</div>`;
        html+=`</div>`;
      } else if(m.type==='text'){
        html+=`<div class="metric"><div class="kv"><span class="mlabel" style="margin:0">${esc(m.label)}</span><span class="kv-val">${esc(m.value||'')}</span></div></div>`;
      } else if(m.type==='badge'){
        html+=`<div class="metric"><div class="kv"><span class="mlabel" style="margin:0">${esc(m.label)}</span><span class="${pillCls(m.color)}">${esc(m.text||'')}</span></div></div>`;
      } else if(m.type==='barChart'){
        html+=barChartMetricHtml(m,true);
      }
    }
    if(roll.totalTokens>0 || roll.cost>0){
      html+=`<div class="metric"><div class="kv"><span class="mlabel" style="margin:0">30d tracked</span><span class="kv-val">${roll.cost>0?'$'+roll.cost.toFixed(2)+' · ':''}${fmtTok(roll.totalTokens)} tokens</span></div></div>`;
    }
    if(pace){
      const pc=paceColor(pace.stage);
      const dCls=pace.deltaPercent>0.5?'pos':pace.deltaPercent<-0.5?'neg':'';
      html+=`<div class="card-pace">`;
      html+=`<div class="pace-top"><span class="pace-lbl">Pace</span>`;
      html+=`<span class="pace-stage" style="color:${pc};border-color:${pc}55">${stageLbl(pace.stage)}</span></div>`;
      html+=`<div class="pace-grid">`;
      html+=`<div><div class="ps-lbl">vs schedule</div><div class="ps-val ${dCls}">${fmtDelta(pace.deltaPercent)}</div></div>`;
      html+=`<div><div class="ps-lbl">ETA</div><div class="ps-val">${fmtEta(pace.etaSeconds,pace.stage)}</div></div>`;
      html+=`<div><div class="ps-lbl">expected</div><div class="ps-val">${pace.expectedUsedPercent.toFixed(1)}%</div></div>`;
      html+=`<div><div class="ps-lbl">lasts</div><div class="ps-val ${pace.willLastToReset?'ok':'no'}">${pace.willLastToReset?'Yes':'No'}</div></div>`;
      html+=`</div></div>`;
    }
    html+=`</div>`;
    html+=`<div class="card-foot"><span class="foot-ts">${fmtAgo(s.fetchedAt)}</span>`;

function selectOption(value,label,current){
  return `<option value="${esc(value)}"${(current||'all')===value?' selected':''}>${esc(label)}</option>`;
}

function overviewSnapshots(){
  const ordered = orderedSnapshots();
  const query = String(S.prefs.search||'').trim().toLowerCase();
  const status = S.prefs.status || 'all';
  const filtered = ordered.filter(s=>{
    if(query){
      const hay = [s.providerId, s.displayName, s.plan, s.source, ...(s.metrics||[]).map(m=>m.label)].join(' ').toLowerCase();
      if(!hay.includes(query)) return false;
    }
    const prim = primaryPercentOf(s);
    const roll = providerWindowTotals(s.providerId, 30);
    if(status==='live' && s.source==='error') return false;
    if(status==='attention' && s.source!=='error') return false;
    if(status==='near' && !(prim!=null && prim>=80)) return false;
    if(status==='tracked' && !(roll.totalTokens>0 || roll.cost>0)) return false;
    return true;
  });
  const index = new Map(ordered.map((s,i)=>[s.providerId,i]));
  const sorted = filtered.slice();
  const sort = S.prefs.sort || 'order';
  sorted.sort((a,b)=>{
    if(sort==='name') return String(a.displayName||a.providerId).localeCompare(String(b.displayName||b.providerId));
    if(sort==='recent') return (+new Date(b.fetchedAt||0)) - (+new Date(a.fetchedAt||0));
    if(sort==='pressure') return (primaryPercentOf(b)||0) - (primaryPercentOf(a)||0);
    if(sort==='cost30') return providerWindowTotals(b.providerId,30).cost - providerWindowTotals(a.providerId,30).cost;
    if(sort==='tokens30') return providerWindowTotals(b.providerId,30).totalTokens - providerWindowTotals(a.providerId,30).totalTokens;
    return (index.get(a.providerId)||0) - (index.get(b.providerId)||0);
  });
  return sorted;
}

function primaryPercentOf(s){
  const m = (s.metrics||[]).find(row=>row.type==='progress' && row.format?.kind==='percent' && row.limit>0);
  return m ? pct(m) : null;
}

function renderOverviewSummary(){
  const el = document.getElementById('overviewSummary');
  if(!el) return;
  const snaps = orderedSnapshots();
  if(!snaps.length){ el.innerHTML=''; return; }

  const progressRows = snaps.flatMap(s=>(s.metrics||[])
    .filter(m=>m.type==='progress' && m.format?.kind==='percent' && m.limit>0)
    .map(m=>({ snap:s, metric:m, percent:pct(m) })));
  const primaryRows = snaps.map(s=>{
    const m = (s.metrics||[]).find(row=>row.type==='progress' && row.format?.kind==='percent' && row.limit>0);
    return m ? { snap:s, metric:m, percent:pct(m) } : null;
  }).filter(Boolean);
  const pressure = primaryRows.slice().sort((a,b)=>b.percent-a.percent);
  const highest = pressure[0];
  const avg = primaryRows.length ? primaryRows.reduce((acc,row)=>acc+row.percent,0)/primaryRows.length : null;
  const nearLimit = progressRows.filter(row=>row.percent>=80).length;
  const live = snaps.filter(s=>s.source!=='error').length;
  const errorCount = snaps.length - live;
  const withPace = snaps.filter(s=>s.pace).length;
  const resets = progressRows
    .filter(row=>row.metric.resetsAt)
    .sort((a,b)=>new Date(a.metric.resetsAt)-new Date(b.metric.resetsAt));
  const nextReset = resets[0];
  const updated = snaps.map(s=>+new Date(s.fetchedAt||0)).filter(Boolean).sort((a,b)=>b-a)[0];
  const riskyPace = snaps
    .filter(s=>s.pace && (!s.pace.willLastToReset || /over$/.test(String(s.pace.stage||''))))
    .sort((a,b)=>(b.pace?.deltaPercent||0)-(a.pace?.deltaPercent||0));
  const alerts = [];
  if(riskyPace.length){
    const s = riskyPace[0], p = s.pace;
    alerts.push({
      level:'pace',
      color:paceColor(p.stage),
      text:`${s.displayName||s.providerId} is ${stageLbl(p.stage)}`,
      sub:`${fmtDelta(p.deltaPercent)} - ETA ${fmtEta(p.etaSeconds,p.stage)}`
    });
  }
  if(highest && highest.percent >= 80){
    alerts.push({
      level:highest.percent >= 95 ? 'limit' : 'watch',
      color:barCol(highest.percent),
      text:`${highest.snap.displayName||highest.snap.providerId} has the tightest quota`,
      sub:`${highest.metric.label}: ${highest.percent.toFixed(1)}% used`
    });
  }
  if(nextReset){
    alerts.push({
      level:'reset',
      color:'#7289da',
      text:`Next reset: ${nextReset.snap.displayName||nextReset.snap.providerId}`,
      sub:`${nextReset.metric.label} ${fmtReset(nextReset.metric.resetsAt)}`
    });
  }
  if(errorCount > 0){
    alerts.push({
      level:'auth',
      color:'#d25050',
      text:`${errorCount} provider${errorCount===1?'':'s'} need attention`,
      sub:'Open the provider tab for setup or login details'
    });
  }

  let html = `<div class="overview-panel">`;
  html+=`<div class="overview-title">Provider Health</div>`;
  html+=`<div class="overview-sub">${esc(snaps.length)} providers · ${esc(progressRows.length)} quota lines · ${esc(withPace)} paced</div>`;
  html+=`<div class="kpi-grid">`;
  html+=overviewKpi(`${live}/${snaps.length}`, 'live');
  html+=overviewKpi(highest ? `${highest.percent.toFixed(0)}%` : '-', 'highest');
  html+=overviewKpi(avg == null ? '-' : `${avg.toFixed(1)}%`, 'avg usage');
  html+=overviewKpi(String(nearLimit), 'near limit');
  html+=`</div>`;
  if(alerts.length){
    html+=`<div class="alert-list">`;
    for(const row of alerts.slice(0,4)) html+=overviewAlert(row);
    html+=`</div>`;
  }
  html+=`</div>`;

  html+=`<div class="overview-panel">`;
  html+=`<div class="overview-title">Quota Pressure</div>`;
  html+=`<div class="overview-sub">${nextReset ? esc(fmtReset(nextReset.metric.resetsAt)) : 'no reset window'} · ${updated ? esc(fmtAgo(new Date(updated).toISOString())) : 'not updated'}</div>`;
  html+=`<div class="pressure-list">`;
  for(const row of pressure.slice(0,5)){
    const name = row.snap.displayName || row.snap.providerId;
    const col = row.snap.pace ? paceColor(row.snap.pace.stage) : barCol(row.percent);
    html+=`<div class="pressure-row">`;
    html+=`<div class="pressure-name">${esc(name)}</div>`;
    html+=`<div class="pressure-value">${row.percent.toFixed(1)}%</div>`;
    html+=`<div class="pressure-track"><div class="pressure-fill" style="width:${row.percent.toFixed(2)}%;background:${col}"></div></div>`;
    html+=`</div>`;
  }
  if(!pressure.length) html+=`<div class="cost-unavail" style="padding:18px">No quota data reported</div>`;
  html+=`</div></div>`;

  const r7 = dailyWindowTotals(S.dailyRows, 7);
  const p7 = dailyWindowTotals(S.dailyRows, 7, 7);
  const r30 = dailyWindowTotals(S.dailyRows, 30);
  const p30 = dailyWindowTotals(S.dailyRows, 30, 30);
  const trend = aggregateDailyTrend(S.dailyRows, 14);
  const top = topDailyContributors(S.dailyRows, 30, 5);
  html+=`<div class="overview-panel">`;
  html+=`<div class="overview-title">Spend & Tokens</div>`;
  html+=`<div class="overview-sub">${S.dailyRows.length ? `${esc(S.dailyRows.length)} saved daily rows` : 'no saved daily history'}</div>`;
  html+=`<div class="rollup-grid">`;
  html+=rollupCard(r7.cost>0?'$'+r7.cost.toFixed(2):'—','7d spend',deltaBadge(deltaPercent(r7.cost,p7.cost)));
  html+=rollupCard(fmtTok(r7.totalTokens),'7d tokens',deltaBadge(deltaPercent(r7.totalTokens,p7.totalTokens)));
  html+=rollupCard(r30.cost>0?'$'+r30.cost.toFixed(2):'—','30d spend',deltaBadge(deltaPercent(r30.cost,p30.cost)));
  html+=rollupCard(fmtTok(r30.totalTokens),'30d tokens',deltaBadge(deltaPercent(r30.totalTokens,p30.totalTokens)));
  html+=`</div>`;
  html+=overviewTrendHtml(trend);
  html+=topContributorsHtml(top, r30);
  html+=`</div>`;

  el.innerHTML = html;
}

function overviewKpi(value,label){
  return `<div class="kpi"><div class="kpi-value">${esc(value)}</div><div class="kpi-label">${esc(label)}</div></div>`;
}
function rollupCard(value,label,delta){
  return `<div class="rollup-card"><div class="rollup-value">${esc(value)}${delta||''}</div><div class="rollup-label">${esc(label)}</div></div>`;
}
function overviewAlert(row){
  return `<div class="alert-row" style="--alert:${esc(row.color||'#7289da')}"><div class="alert-mark">${esc(row.level||'info')}</div><div class="alert-text">${esc(row.text||'')}<span class="alert-sub">${esc(row.sub||'')}</span></div></div>`;
}

function normalizeDailyRows(payload){
  const rows = Array.isArray(payload) ? payload : Array.isArray(payload?.daily) ? payload.daily : [];
  return rows.map(r=>({
    providerId:String(readAny(r,['providerId','provider_id','instanceId','instance_id'],'')).trim(),
    displayName:String(readAny(r,['displayName','display_name','provider','name'],'')).trim(),
    date:rowDate(r),
    source:String(readAny(r,['source'],'')).trim(),
    inputTokens:rowInput(r),
    outputTokens:rowOutput(r),
    cacheReadTokens:rowCacheRead(r),
    cacheCreationTokens:rowCacheCreate(r),
    reasoningOutputTokens:rowReasoning(r),
    totalTokens:rowTotalTokens(r),
    cost:rowCost(r),
    ingestedAt:readAny(r,['ingestedAt','ingested_at'],null),
  })).filter(r=>r.providerId && /^\d{4}-\d{2}-\d{2}$/.test(r.date));
}

function providerWindowTotals(providerId, days){
  return dailyWindowTotals(S.dailyRows.filter(r=>r.providerId.toLowerCase()===String(providerId).toLowerCase()), days);
}

function dailyWindowTotals(rows, days, offsetDays){
  return dailyRowsInWindow(rows, days, offsetDays).reduce((acc,r)=>{
    acc.inputTokens += rowInput(r);
    acc.outputTokens += rowOutput(r);
    acc.cacheReadTokens += rowCacheRead(r);
    acc.cacheCreationTokens += rowCacheCreate(r);
    acc.reasoningTokens += rowReasoning(r);
    acc.totalTokens += rowTotalTokens(r);
    acc.cost += rowCost(r);
    acc.rows++;
    return acc;
  }, {inputTokens:0,outputTokens:0,cacheReadTokens:0,cacheCreationTokens:0,reasoningTokens:0,totalTokens:0,cost:0,rows:0});
}

function dailyRowsInWindow(rows, days, offsetDays){
  const end = addDays(todayUtcDate(), -(offsetDays||0));
  const start = addDays(end, -(days - 1));
  const a = dateKey(start), b = dateKey(end);
  return rows.filter(r=>{
    const d = rowDate(r);
    return d >= a && d <= b;
  });
}

function aggregateDailyTrend(rows, days){
  const windowRows = dailyRowsInWindow(rows, days, 0);
  const byDay = new Map();
  for(const r of windowRows){
    const d = rowDate(r);
    const cur = byDay.get(d) || { date:d, totalTokens:0, cost:0 };
    cur.totalTokens += rowTotalTokens(r);
    cur.cost += rowCost(r);
    byDay.set(d, cur);
  }
  const end = todayUtcDate();
  const start = addDays(end, -(days - 1));
  const out = [];
  for(let d = new Date(start); d <= end; d = addDays(d, 1)){
    const key = dateKey(d);
    out.push(byDay.get(key) || { date:key, totalTokens:0, cost:0 });
  }
  return out;
}

function topDailyContributors(rows, days, limit){
  const map = new Map();
  for(const r of dailyRowsInWindow(rows, days, 0)){
    const id = r.providerId;
    const cur = map.get(id) || { providerId:id, displayName:r.displayName || id, totalTokens:0, cost:0 };
    cur.totalTokens += rowTotalTokens(r);
    cur.cost += rowCost(r);
    map.set(id, cur);
  }
  return Array.from(map.values()).sort((a,b)=>b.cost-a.cost || b.totalTokens-a.totalTokens).slice(0, limit || 5);
}

function overviewTrendHtml(rows){
  if(!rows.length || !rows.some(r=>r.totalTokens>0 || r.cost>0)){
    return `<div class="cost-unavail" style="padding:16px 0"><strong style="font-size:13px">No tracked trend yet</strong></div>`;
  }
  const max = Math.max(1, ...rows.map(r=>Math.max(r.cost, r.totalTokens/1000000)));
  const latest = rows[rows.length-1];
  const bars = rows.map(r=>{
    const basis = Math.max(r.cost, r.totalTokens/1000000);
    const h = Math.max(3, Math.round(basis/max*100));
    const color = r.cost>0 ? '#43b581' : '#7289da';
    return `<div class="trend-bar" style="height:${h}%;background:${color}" title="${esc(r.date)}: ${r.cost>0?'$'+r.cost.toFixed(2)+' · ':''}${esc(fmtTok(r.totalTokens))} tokens"></div>`;
  }).join('');
  return `<div class="overview-trend"><div class="trend-head"><span class="trend-title">Last 14 days</span><span class="trend-readout">${latest.cost>0?'$'+latest.cost.toFixed(2)+' · ':''}${esc(fmtTok(latest.totalTokens))} tokens today</span></div><div class="trend-bars">${bars}</div></div>`;
}

function topContributorsHtml(rows, totals){
  if(!rows.length) return '';
  let html = `<div class="contrib-list">`;
  for(const r of rows){
    const basis = totals.cost>0 ? r.cost : r.totalTokens;
    const max = totals.cost>0 ? totals.cost : totals.totalTokens;
    const p = max>0 ? Math.min(100, basis/max*100) : 0;
    const label = r.cost>0 ? '$'+r.cost.toFixed(2) : fmtTok(r.totalTokens);
    html+=`<div class="contrib-row"><div class="contrib-name">${esc(r.displayName)}</div><div class="contrib-value">${esc(label)}</div><div class="pressure-track"><div class="pressure-fill" style="width:${p.toFixed(1)}%;background:#43b581"></div></div></div>`;
  }
  html+=`</div>`;
  return html;
}

function deltaPercent(current, prior){
  current = Number(current)||0; prior = Number(prior)||0;
  if(prior <= 0) return current > 0 ? 100 : null;
  return Math.round((current - prior) / prior * 100);
}

function deltaBadge(value){
  if(value == null || !Number.isFinite(value)) return '';
  if(value === 0) return `<span class="delta flat">0%</span>`;
  const cls = value > 0 ? 'up' : 'down';
  const sign = value > 0 ? '+' : '';
  return `<span class="delta ${cls}">${sign}${value}%</span>`;
}

// ── saved daily history and trends ────────────────────────────────────────────
function trendsOptions(){
  const prefs = S.prefs.trends || {};
  return {
    provider: typeof prefs.provider==='string' ? prefs.provider : '',
    range: ['7','30','90','365','all','custom'].includes(prefs.range) ? prefs.range : '30',
    group: ['day','week','month'].includes(prefs.group) ? prefs.group : 'day',
    metric: prefs.metric==='cost' ? 'cost' : 'totalTokens',
    start: prefs.start || dateKey(addDays(todayUtcDate(),-29)),
    end: prefs.end || dateKey(todayUtcDate()),
  };
}

function trendChange(current, previous, field){
  const delta = UsageTrends.change(current[field], previous[field], current.rows, previous.rows);
  if(delta.kind==='unavailable') return 'Comparison unavailable';
  if(delta.kind==='fromZero') return 'Up from a recorded zero';
  return `${delta.percent>0?'+':''}${delta.percent.toFixed(1)}% vs previous period`;
}

function trendKpi(value, label, note){
  return `<div class="insight"><div class="insight-value">${esc(value)}</div><div class="insight-label">${esc(label)}</div><div class="trends-change">${esc(note)}</div></div>`;
}

function renderTrends(){
  const panel = document.getElementById('panel-history');
  const options = trendsOptions();
  const model = UsageTrends.summarize(S.dailyRows, options);
  // Include saved providers even after they have been disabled or removed.
  const providers = new Map(S.providers.map(p=>[p.id.toLowerCase(),p.name||p.id]));
  for(const r of S.dailyRows) providers.set(r.providerId.toLowerCase(), r.displayName||r.providerId);
  if(options.provider && !providers.has(options.provider.toLowerCase())) providers.set(options.provider, options.provider);
  let html = `<div class="history-box"><div class="box-title">Usage history & trends</div>`;
  html+=`<div class="trends-sub">Explore saved daily usage across providers. Cost is reported or API-equivalent cost, where available.</div>`;
  html+=`<div class="trends-controls">`;
  html+=`<label>Provider<select id="trends-provider"><option value=""${!options.provider?' selected':''}>All providers</option>${[...providers].sort((a,b)=>a[1].localeCompare(b[1])).map(([id,name])=>selectOption(id,name,options.provider.toLowerCase())).join('')}</select></label>`;
  html+=`<label>Period<select id="trends-range">${[['7','Last 7 days'],['30','Last 30 days'],['90','Last 90 days'],['365','Last year'],['all','All saved history'],['custom','Custom dates']].map(([v,l])=>selectOption(v,l,options.range)).join('')}</select></label>`;
  if(options.range==='custom'){
    const max = dateKey(todayUtcDate());
    html+=`<label>From<input id="trends-start" type="date" value="${esc(options.start)}" max="${max}"></label><label>Through<input id="trends-end" type="date" value="${esc(options.end)}" max="${max}"></label>`;
  }
  html+=`<label>Group by<select id="trends-group">${[['day','Day'],['week','Week'],['month','Month']].map(([v,l])=>selectOption(v,l,options.group)).join('')}</select></label>`;
  html+=`<label>Chart<select id="trends-metric">${selectOption('totalTokens','Tokens',options.metric)}${selectOption('cost','Cost (USD)',options.metric)}</select></label>`;
  html+=`<button class="trends-export" id="trends-export" ${!model.rows?.length||S.dailyError?'disabled':''}>Export selected CSV</button></div>`;
  if(model.error){
    html+=`<div class="trends-empty" role="alert">${esc(model.error)}</div>`;
  } else if(S.dailyError){
    html+=`<div class="trends-empty" role="alert">Could not load saved daily history. Try Refresh to load it again.</div>`;
  } else {
    const { range, current, previous } = model;
    html+=`<div class="trends-sub">${range.start} → ${range.end} · ${range.days} calendar days · UTC${range.end===dateKey(todayUtcDate())?' · Today is partial':''}<br>Previous period: ${range.previousStart} → ${range.previousEnd}</div>`;
    if(!current.rows){
      html+=`<div class="trends-empty"><strong>No saved daily usage in this range</strong><br>Try another period or provider. Daily totals are saved when a supported provider reads local usage logs.<br>Run <code>usagestat usage</code> or keep the daemon running to collect available reports.<br>Providers that report only quotas have snapshot charts in their provider tab.</div>`;
    } else {
      html+=`<div class="trends-kpis">`;
      html+=trendKpi(fmtTok(current.totalTokens),'recorded tokens',trendChange(current,previous,'totalTokens'));
      html+=trendKpi('$'+current.cost.toFixed(2),'recorded cost',trendChange(current,previous,'cost'));
      html+=trendKpi(fmtTok(current.totalTokens/current.recordedDays),'tokens per recorded day',`${current.activeDays} days with recorded activity`);
      html+=trendKpi(`${current.recordedDays}/${range.days}`,'days with records',`${current.providers} providers · previous: ${previous.recordedDays}/${range.days} days`);
      html+=`</div><div class="trends-sub">Comparisons use recorded totals; coverage may differ between periods and providers. Gaps mean no saved record. A zero cost can also mean pricing was unavailable.</div>`;
      html+=`<div class="trends-chart">${trendsChart(model.buckets,options.metric)}</div>`;
      html+=`<div class="small-note">${options.group==='week'?'Weeks start on Monday. ':''}Edge buckets include only dates in the selected range. Hover a bar for its total and recorded days.</div>`;
    }
    if(model.providers.length){
      html+=`<div class="box-title" style="margin-top:26px">By provider</div><div class="trends-table-wrap"><table class="usage-table"><thead><tr><th>Provider</th><th>Tokens</th><th>Token change</th><th>Cost</th><th>Cost change</th><th>Days recorded</th></tr></thead><tbody>`;
      for(const p of model.providers){
        html+=`<tr><td>${esc(p.displayName)}</td><td>${p.current.rows?fmtTok(p.current.totalTokens):'—'}</td><td>${esc(trendChange(p.current,p.previous,'totalTokens'))}</td><td>${p.current.rows?'$'+p.current.cost.toFixed(2):'—'}</td><td>${esc(trendChange(p.current,p.previous,'cost'))}</td><td>${p.current.recordedDays}/${range.days}</td></tr>`;
      }
      html+=`</tbody></table></div>`;
    }
    if(current.rows){
      html+=`<details style="margin-top:22px"><summary>Period details</summary><div class="trends-table-wrap"><table class="usage-table"><thead><tr><th>Dates</th><th>Tokens</th><th>Cache read</th><th>Cost</th><th>Days recorded</th></tr></thead><tbody>`;
      for(const b of model.buckets.slice(-60).reverse()){
        html+=`<tr><td>${b.start===b.end?b.start:b.start+' → '+b.end}</td><td>${b.rows?fmtTok(b.totalTokens):'No record'}</td><td>${b.rows?fmtTok(b.cacheReadTokens):'—'}</td><td>${b.rows?'$'+b.cost.toFixed(2):'—'}</td><td>${b.recordedDays}/${b.days}</td></tr>`;
      }
      html+=`</tbody></table></div>${model.buckets.length>60?'<div class="small-note">Showing the latest 60 buckets. Export includes every selected daily row.</div>':''}</details>`;
    }
  }
  panel.innerHTML = html + '</div>';
  for(const field of ['provider','range','start','end','group','metric']){
    panel.querySelector('#trends-'+field)?.addEventListener('change', e=>{
      const next = { ...options, [field]:e.target.value };
      if(field==='range' && next.range==='custom' && model.range){
        next.start = model.range.start; next.end = model.range.end;
      }
      S.prefs.trends = next;
      savePrefs();
      renderTrends();
    });
  }
  panel.querySelector('#trends-export')?.addEventListener('click',()=>{
    if(model.rows?.length) exportDailyCsv(model.rows, `usagestat-history-${model.range.start}-${model.range.end}.csv`);
  });
}

function trendsChart(buckets, metric){
  // Keep large imports readable without dropping any totals from the chart.
  const stride = Math.max(1,Math.ceil(buckets.length/180));
  const points = [];
  for(let i=0;i<buckets.length;i+=stride){
    const group = buckets.slice(i,i+stride);
    points.push({ start:group[0].start,end:group[group.length-1].end,
      value:sum(group,metric),days:sum(group,'days'),recordedDays:sum(group,'recordedDays') });
  }
  const W=1000,H=270,L=70,R=18,T=18,B=38,CW=W-L-R,CH=H-T-B;
  const max = Math.max(1,...points.map(p=>p.value));
  const step = CW/Math.max(1,points.length), width = Math.max(.5,step*.72);
  const fmt = v=>metric==='cost'?'$'+v.toFixed(2):fmtTok(v);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Recorded ${metric==='cost'?'cost':'tokens'} by period; gaps have no saved record"><title>Recorded ${metric==='cost'?'cost':'tokens'} by period. Totals are also available in Period details.</title>`;
  for(let i=0;i<=4;i++){
    const y=T+CH*(1-i/4);
    svg+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="var(--bd)"/><text x="${L-10}" y="${y+4}" text-anchor="end" fill="var(--mu)" font-size="11">${esc(fmt(max*i/4))}</text>`;
  }
  points.forEach((p,i)=>{
    const x=L+step*(i+.5),h=p.recordedDays?Math.max(2,CH*p.value/max):2;
    const label = `${p.start}${p.end!==p.start?' → '+p.end:''}: ${p.recordedDays?fmt(p.value):'No record'} · ${p.recordedDays}/${p.days} days recorded`;
    if(p.recordedDays){
      svg+=`<rect x="${x-width/2}" y="${T+CH-h}" width="${width}" height="${h}" rx="2" fill="${metric==='cost'?'var(--teal)':'var(--blue)'}"><title>${esc(label)}</title></rect>`;
    }else{
      svg+=`<rect x="${x-width/2}" y="${T+CH-2}" width="${width}" height="2" fill="none" stroke="var(--mu)" stroke-dasharray="2 2"><title>${esc(label)}</title></rect>`;
    }
    if(i%Math.max(1,Math.ceil(points.length/7))===0 || i===points.length-1){
      svg+=`<text x="${x}" y="${H-12}" text-anchor="middle" fill="var(--mu)" font-size="10">${p.start.slice(5)}</text>`;
    }
  });
  return svg+'</svg>'+(stride>1?`<div class="small-note">Each bar combines up to ${stride} adjacent buckets. Export retains daily detail.</div>`:'');
}

function exportDailyCsv(selectedRows = S.dailyRows, filename){
  // Event listeners pass a MouseEvent; explicit arrays export a filtered view.
  const rows = (Array.isArray(selectedRows)?selectedRows:S.dailyRows).slice().sort((a,b)=>b.date.localeCompare(a.date) || a.providerId.localeCompare(b.providerId));
  const lines = [
    ['date','provider_id','display_name','source','input_tokens','output_tokens','reasoning_tokens','cache_write_tokens','cache_read_tokens','total_tokens','cost_usd','ingested_at'].join(',')
  ];
  for(const r of rows){
    lines.push([
      r.date,
      r.providerId,
      r.displayName,
      r.source,
      r.inputTokens,
      r.outputTokens,
      r.reasoningOutputTokens,
      r.cacheCreationTokens,
      r.cacheReadTokens,
      r.totalTokens,
      r.cost.toFixed(6),
      r.ingestedAt || '',
    ].map(csvCell).join(','));
  }
  downloadText(filename || `usagestat-daily-${dateKey(todayUtcDate())}.csv`, lines.join('\r\n'), 'text/csv;charset=utf-8');
}

function exportQuotaCsv(){
  const lines = [['captured_at','provider_id','display_name','source','plan','primary_percent','progress_label','progress_used','progress_limit','reset_at'].join(',')];
  for(const s of orderedSnapshots()){
    const progress = (s.metrics||[]).filter(m=>m.type==='progress');
    if(!progress.length){
      lines.push([s.fetchedAt||'',s.providerId,s.displayName||'',s.source||'',s.plan||'',primaryPercentOf(s)??'','','','',''].map(csvCell).join(','));
      continue;
    }
    for(const m of progress){
      lines.push([
        s.fetchedAt||'',
        s.providerId,
        s.displayName||'',
        s.source||'',
        s.plan||'',
        m.format?.kind==='percent' && m.limit>0 ? pct(m).toFixed(1) : '',
        m.label||'',
        m.used ?? '',
        m.limit ?? '',
        m.resetsAt || '',
      ].map(csvCell).join(','));
    }
  }
  downloadText(`usagestat-quota-${dateKey(todayUtcDate())}.csv`, lines.join('\r\n'), 'text/csv;charset=utf-8');
}

function exportDashboardJson(){
  const body = JSON.stringify({
    generatedAt:new Date().toISOString(),
    snapshots:S.snapshots,
    dailyRows:S.dailyRows,
  }, null, 2);
  downloadText(`usagestat-dashboard-${dateKey(todayUtcDate())}.json`, body, 'application/json;charset=utf-8');
}

function downloadText(filename, content, type){
  const blob = new Blob([content], { type:type || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function csvCell(value){
  const s = String(value ?? '');
  return /[",\n\r]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
}

function loadPrefs(){
  try{
    const raw = localStorage.getItem('usagestat.dashboard.prefs');
    return { search:'', status:'all', sort:'order', ...(raw ? JSON.parse(raw) : {}) };
  }catch{
    return { search:'', status:'all', sort:'order' };
  }
}

function savePrefs(){
  try{ localStorage.setItem('usagestat.dashboard.prefs', JSON.stringify(S.prefs)); }catch{}
}

function debounce(fn, ms){
  let timer = null;
  return (...args)=>{
    clearTimeout(timer);
    timer = setTimeout(()=>fn(...args), ms);
  };
}

function renderStatsSection(id, snap, rawHistory, reports){
  const box = document.getElementById(`stats-box-${id}`);
  if(!box) return;
  box.innerHTML = `<div class="box-title">Usage Analytics</div>` + buildUsageAnalytics(id, snap, rawHistory, reports);
  box.querySelectorAll('.usage-tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      box.querySelectorAll('.usage-tab').forEach(b=>b.classList.toggle('active', b===btn));
      box.querySelectorAll('.usage-panel').forEach(p=>p.classList.toggle('active', p.dataset.panel===btn.dataset.panel));
    });
  });
}

function buildUsageAnalytics(id, snap, rawHistory, reports){
  const progress = (snap.metrics||[]).filter(m=>m.type==='progress');
  const text = (snap.metrics||[]).filter(m=>m.type==='text');
  const badges = (snap.metrics||[]).filter(m=>m.type==='badge');
  const percent = progress.filter(m=>m.format?.kind==='percent'&&m.limit>0);
  const counts = progress.filter(m=>m.format?.kind==='count');
  const dollars = progress.filter(m=>m.format?.kind==='dollars');
  const highest = percent.slice().sort((a,b)=>pct(b)-pct(a))[0];
  const nextReset = progress
    .filter(m=>m.resetsAt)
    .sort((a,b)=>new Date(a.resetsAt)-new Date(b.resetsAt))[0];
  const exhausted = percent.filter(m=>pct(m)>=95).length;
  const averageUsage = percent.length ? percent.reduce((a,m)=>a+pct(m),0)/percent.length : null;
  const dailyRows = reportRows(reports?.daily, 'daily');
  const weeklyRows = reportRows(reports?.weekly, 'weekly');
  const monthlyRows = reportRows(reports?.monthly, 'monthly');
  const sessionRows = reportRows(reports?.session, 'session');
  const blockRows = reportRows(reports?.blocks, 'blocks');
  const fallbackDaily = dailyRows.length ? dailyRows : S.dailyRows.filter(r=>r.providerId.toLowerCase()===id.toLowerCase());
  const totals = usageTotals(fallbackDaily);
  const today = fallbackDaily.find(r=>rowDate(r)===new Date().toISOString().slice(0,10));
  const activeDays = fallbackDaily.filter(r=>rowTotalTokens(r)>0 || rowCost(r)>0).length;
  const modelBasis = dailyRows.length ? dailyRows :
    sessionRows.length ? sessionRows :
    weeklyRows.length ? weeklyRows :
    monthlyRows.length ? monthlyRows :
    blockRows;
  const models = aggregateReportModels(modelBasis);
  const topModel = models[0];
  const sourceLabel = dailyRows.length ? 'native local logs' : fallbackDaily.length ? 'saved daily reports' : 'daily reports unavailable';

  let html = `<div class="stats-grid">`;
  html+=statCard(fmtTok(rowTotalTokens(today||{})), 'today tokens');
  html+=statCard(fmtTok(totals.totalTokens), 'tracked tokens');
  html+=statCard(totals.cost>0?'$'+totals.cost.toFixed(2):'—', 'api-equivalent');
  html+=statCard(String(activeDays), 'active days');
  html+=statCard(fmtTok(totals.inputTokens), 'input');
  html+=statCard(fmtTok(totals.outputTokens), 'output');
  html+=statCard(fmtTok(totals.cacheCreationTokens), 'cache write');
  html+=statCard(fmtTok(totals.cacheReadTokens), 'cache read');
  if(totals.reasoningTokens > 0) html+=statCard(fmtTok(totals.reasoningTokens), 'reasoning');
  html+=`</div>`;

  html+=`<div class="usage-tabs" id="usage-tabs-${id}">`;
  html+=usageTab('summary','Summary',true);
  html+=usageTab('daily','Daily',false);
  html+=usageTab('weekly','Weekly',false);
  html+=usageTab('monthly','Monthly',false);
  html+=usageTab('sessions','Sessions',false);
  html+=usageTab('blocks','5h Blocks',false);
  html+=usageTab('limits','Limits',false);
  html+=`</div>`;

  html+=`<div class="usage-panel active" data-panel="summary">`;
  html+=`<div class="usage-split"><div>`;
  html+=`<div class="box-title">Token Heatmap</div>${renderHeatmap(fallbackDaily)}`;
  html+=`<div class="small-note">${esc(sourceLabel)} · ${esc(fallbackDaily.length)} daily rows</div>`;
  html+=`</div><div>`;
  html+=`<div class="box-title">Model Mix</div>${renderModelMix(models, totals.totalTokens)}`;
  html+=`</div></div>`;
  html+=`</div>`;

  html+=usagePanel('daily', usageRowsTable(fallbackDaily, 'Date'));
  html+=usagePanel('weekly', usageRowsTable(weeklyRows.length?weeklyRows:bucketRows(fallbackDaily,'week'), 'Week'));
  html+=usagePanel('monthly', usageRowsTable(monthlyRows.length?monthlyRows:bucketRows(fallbackDaily,'month'), 'Month'));
  html+=usagePanel('sessions', sessionRows.length?sessionTable(sessionRows):emptyUsage('No session report available from local logs yet'));
  html+=usagePanel('blocks', blockRows.length?blockTable(blockRows):emptyUsage('No 5-hour block report available from local logs yet'));
  html+=usagePanel('limits', limitsTable(progress, text, badges, averageUsage, highest, nextReset, exhausted));
  return html;
}

function usageTab(panel,label,active){
  return `<button class="usage-tab${active?' active':''}" type="button" data-panel="${panel}">${esc(label)}</button>`;
}
function usagePanel(panel, content){ return `<div class="usage-panel" data-panel="${panel}">${content}</div>`; }
function emptyUsage(msg){ return `<div class="cost-unavail"><strong>${esc(msg)}</strong></div>`; }

function limitsTable(progress, text, badges, averageUsage, highest, nextReset, exhausted){
  let html = `<div class="stats-grid">`;
  html+=statCard(progress.filter(m=>m.format?.kind==='percent'&&m.limit>0).length, 'quota lines');
  html+=statCard(averageUsage==null?'—':averageUsage.toFixed(1)+'%', 'avg quota usage');
  html+=statCard(highest?`${highest.label} ${pct(highest).toFixed(0)}%`:'—', 'highest pressure');
  html+=statCard(nextReset?fmtReset(nextReset.resetsAt):'—', 'next reset');
  html+=statCard(text.length, 'text rows');
  html+=statCard(badges.length, 'badges');
  html+=statCard(exhausted, 'near exhausted');
  html+=`</div>`;
  if(progress.length){
    html+=`<table class="metric-table"><thead><tr><th>Metric</th><th>Kind</th><th>Used</th><th>Limit</th><th>Percent</th><th>Reset</th></tr></thead><tbody>`;
    for(const m of progress){
      const p = m.limit>0 ? pct(m) : null;
      const label = m.detail ? `${esc(m.label)}<div class="metric-detail" style="margin:4px 0 0">${esc(m.detail)}</div>` : esc(m.label);
      html+=`<tr><td>${label}</td><td>${esc(m.format?.kind||'')}</td><td>${esc(formatScalar(m.used,m.format))}</td><td>${esc(formatScalar(m.limit,m.format))}</td><td>${p==null?'—':p.toFixed(1)+'%'}</td><td>${m.resetsAt?esc(fmtReset(m.resetsAt)):'—'}</td></tr>`;
    }
    html+=`</tbody></table>`;
  }
  return html;
}

function statCard(value,label){
  return `<div class="stat-card"><div class="stat-value">${esc(value)}</div><div class="stat-label">${esc(label)}</div></div>`;
}

function formatScalar(value, format){
  const n = Number(value||0);
  if(format?.kind==='dollars') return '$'+n.toFixed(2);
  if(format?.kind==='percent') return fmtNum(n);
  return `${fmtNum(n)} ${format?.suffix||''}`.trim();
}

function renderHistorySection(id, raw, snap, reports){
  const box = document.getElementById(`history-box-${id}`);
  if(!box) return;
  box.innerHTML = `<div class="box-title">Usage History</div>`;
  const records = normalizeHistory(raw).filter(r=>r.providerId===id)
    .sort((a,b)=>new Date(a.ts)-new Date(b.ts));

  if(!records.length){
    box.insertAdjacentHTML('beforeend', `<div class="cost-unavail"><strong>No usage history yet</strong>Keep the daemon running, or probe with <code style="font-size:12px;color:var(--teal)">usagestat usage --save</code>, to build charts.</div>`);
    return;
  }

  const recent = lastWindow(records, 30);
  const latest = recent[recent.length-1] || records[records.length-1];
  const first = recent[0] || records[0];
  const activeDays = new Set(recent.map(r=>String(r.ts).slice(0,10))).size;
  const reportDaily = reportRows(reports?.daily, 'daily');
  const localDaily = (reportDaily.length ? reportDaily : S.dailyRows.filter(r=>r.providerId.toLowerCase()===id.toLowerCase())).map(normalizeCostRow).filter(r=>r.date);
  const summaryRows = localDaily.length ? calendarWindow(localDaily, 30) : [];
  const summaryTotals = summaryRows.length ? usageTotals(summaryRows) : null;
  const summaryActiveDays = summaryRows.length ? summaryRows.filter(r=>rowCost(r)>0 || rowTotalTokens(r)>0).length : activeDays;
  const summaryInput = summaryTotals ? summaryTotals.inputTokens : latest.inputTokens;
  const summaryOutput = summaryTotals ? summaryTotals.outputTokens : latest.outputTokens;
  const summaryCacheRead = summaryTotals ? summaryTotals.cacheReadTokens : latest.cacheReadTokens;
  const summaryCacheCreate = summaryTotals ? summaryTotals.cacheCreationTokens : latest.cacheCreationTokens;
  const summaryCost = summaryTotals ? summaryTotals.cost : latest.cost;

  let html = `<div class="trends-sub" style="margin-bottom:16px">Charts show polled snapshot values. Grouped views show peak quota and the last reported counters in each bucket. For daily totals and period comparisons, open History.</div><div class="history-grid">`;

function renderCostSection(id, raw, history){
  const box = document.getElementById(`cost-box-${id}`);
  if(!box) return;
  box.innerHTML = costHeaderHtml(id);

  // resolve legacy array-shaped cost responses or our spec shape
  let entry = null;
  if(Array.isArray(raw)) entry = raw[0];
  else if(raw && !raw.error) entry = raw;

  if(!entry || entry.error || !entry.daily?.length){
    const saved = S.dailyRows.filter(r=>r.providerId.toLowerCase()===id.toLowerCase());
    if(saved.length) entry = { daily:saved };
  }
  if(!entry || entry.error || !entry.daily?.length){
    const msg = box.querySelector('.cost-unavail') || document.createElement('div');
    msg.className='cost-unavail';
    msg.innerHTML=`<strong>Daily cost history unavailable</strong>This provider has no saved daily cost report. Snapshot counters appear in Usage History; they cannot be added together to calculate spend.`;
    if(!box.contains(msg)) box.appendChild(msg);
    return;
  }

  const daily = (entry.daily||[]).map(normalizeCostRow).filter(d=>d.date).sort((a,b)=>a.date.localeCompare(b.date));
  const viewDaily = calendarWindow(daily, 30);
  const totals = usageTotals(viewDaily);
  const totalCost = totals.cost;
  const totalTok = totals.totalTokens;
  const activeDays = viewDaily.filter(d=>rowCost(d)>0 || rowTotalTokens(d)>0).length;
  const avgDay = activeDays > 0 ? totalCost / activeDays : 0;

  let html = `<div class="cost-stats" id="cost-stats-${id}">`;
  html+=`<div class="cstat"><div class="cstat-val">$${totalCost.toFixed(2)}</div><div class="cstat-lbl">tracked total</div></div>`;
  html+=`<div class="cstat"><div class="cstat-val">$${avgDay.toFixed(2)}</div><div class="cstat-lbl">per active day</div></div>`;
  html+=`<div class="cstat"><div class="cstat-val">${activeDays}</div><div class="cstat-lbl">active days</div></div>`;
  html+=`<div class="cstat"><div class="cstat-val">${fmtTok(totalTok)}</div><div class="cstat-lbl">total tokens</div></div>`;
  html+=`</div>`;

  // chart
  html+=`<div class="chart-wrap" id="chart-${id}"></div>`;

  // model table
  const models = aggregateModels(viewDaily);
  if(models.length){
    html+=`<table class="model-table" id="model-table-${id}">`;
    html+=`<thead><tr><th>Model</th><th style="text-align:right">Cost</th><th style="text-align:right">Share</th><th style="text-align:right">Tokens</th></tr></thead><tbody>`;
    for(const [name,{cost,tokens}] of models){
      const p = totalCost>0?cost/totalCost*100:0;
      html+=`<tr>
        <td class="model-name">${esc(name)}</td>
        <td class="model-cost">$${cost.toFixed(2)}</td>
        <td><div class="share-cell"><div class="share-bar"><div style="width:${p.toFixed(1)}%"></div></div><span class="share-pct">${p.toFixed(1)}%</span></div></td>
        <td class="model-toks">${fmtTok(tokens)}</td>
      </tr>`;
    }
    html+=`</tbody></table>`;
  }

  box.insertAdjacentHTML('beforeend', html);
  setupCostRange(box, id, daily);
}
