function normalizeHistory(raw){
  return (Array.isArray(raw)?raw:[]).map(r=>({
    ts: r.ts,
    providerId: r.providerId || r.provider_id,
    displayName: r.displayName || r.display_name,
    plan: r.plan || null,
    primaryPercent: Number(r.primaryPercent ?? r.primary_percent ?? 0),
    inputTokens: Number(r.inputTokens ?? r.input_tokens ?? 0),
    outputTokens: Number(r.outputTokens ?? r.output_tokens ?? 0),
    cacheReadTokens: Number(r.cacheReadTokens ?? r.cache_read_tokens ?? 0),
    cacheCreationTokens: Number(r.cacheCreationTokens ?? r.cache_creation_tokens ?? 0),
    totalTokens: Number(r.totalTokens ?? r.total_tokens ?? 0),
    cost: Number(r.cost ?? 0),
    resetTime: r.resetTime || r.reset_time || null,
    progress: normalizeProgress(r.progress, r.primaryPercent ?? r.primary_percent),
    text: Array.isArray(r.text) ? r.text : [],
    badges: Array.isArray(r.badges) ? r.badges : [],
    charts: normalizeCharts(r.charts),
  })).filter(r=>r.ts && r.providerId);
}

function normalizeCharts(charts){
  return (Array.isArray(charts)?charts:[]).map(c=>({
    label: String(c.label||'History'),
    note: c.note || null,
    color: c.color || null,
    points: (Array.isArray(c.points)?c.points:[]).map(p=>({
      label: String(p.label||''),
      value: Number(p.value||0),
      valueLabel: p.valueLabel || p.value_label || null,
    })).filter(p=>p.label && Number.isFinite(p.value) && p.value>=0),
  })).filter(c=>c.points.length);
}

function normalizeProgress(progress, primaryPercent){
  const rows = Array.isArray(progress) ? progress.map(p=>({
    label: String(p.label||'Usage'),
    used: Number(p.used||0),
    limit: Number(p.limit||0),
    percent: p.percent == null ? null : Number(p.percent),
    format: String(p.format || p.formatKind || 'percent'),
    suffix: p.suffix || null,
    resetsAt: p.resetsAt || p.resets_at || null,
    periodDurationMs: Number(p.periodDurationMs ?? p.period_duration_ms ?? 0) || null,
    detail: p.detail || null,
    color: p.color || null,
  })) : [];
  if(!rows.length && primaryPercent != null){
    rows.push({
      label:'Primary',
      used:Number(primaryPercent)||0,
      limit:100,
      percent:Number(primaryPercent)||0,
      format:'percent',
      suffix:null,
      resetsAt:null,
      periodDurationMs:null,
      color:null,
    });
  }
  return rows;
}

function lastWindow(records, days){
  if(!records.length) return [];
  const end = +new Date(records[records.length-1].ts);
  const start = end - days*86400000;
  return records.filter(r=>+new Date(r.ts)>=start);
}

function normalizeCostRow(row){
  const date = rowDate(row);
  return {
    ...row,
    date,
    inputTokens: rowInput(row),
    outputTokens: rowOutput(row),
    cacheReadTokens: rowCacheRead(row),
    cacheCreationTokens: rowCacheCreate(row),
    reasoningOutputTokens: rowReasoning(row),
    totalTokens: rowTotalTokens(row),
    totalCost: rowCost(row),
  };
}

function calendarWindow(rows, days){
  const end = todayUtcDate();
  const start = addDays(end, -(days - 1));
  return calendarRange(rows, start, end);
}

function fullCalendarRange(rows){
  if(!rows.length) return [];
  const sorted = rows.slice().sort((a,b)=>a.date.localeCompare(b.date));
  return calendarRange(rows, parseDateOnly(sorted[0].date), parseDateOnly(sorted[sorted.length-1].date));
}

function calendarRange(rows, start, end){
  const byDate = new Map(rows.map(r=>[r.date, normalizeCostRow(r)]));
  const out = [];
  for(let d = new Date(start); d <= end; d = addDays(d, 1)){
    const key = dateKey(d);
    out.push(byDate.get(key) || emptyDay(key));
  }
  return out;
}

function emptyDay(date){
  return { date, inputTokens:0, outputTokens:0, cacheReadTokens:0, cacheCreationTokens:0, reasoningOutputTokens:0, totalTokens:0, totalCost:0, models:{} };
}

function todayUtcDate(){
  const n = new Date();
  return new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate()));
}
function parseDateOnly(value){
  const s = String(value);
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return new Date(Date.UTC(Number(m[1]), Number(m[2])-1, Number(m[3])));
  const ms = Date.parse(s);
  if(Number.isFinite(ms)){
    const d = new Date(ms);
    return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  }
  return todayUtcDate();
}
function dateKey(date){ return date.toISOString().slice(0,10); }
function addDays(date, days){
  const d = new Date(date);
  d.setUTCDate(d.getUTCDate() + days);
  return d;
}

function historyTab(id,mode,label,active){
  return `<button class="history-tab${active?' active':''}" type="button" data-provider="${esc(id)}" data-mode="${mode}">${esc(label)}</button>`;
}
function bucketTab(bucket,label,active){
  return `<button class="history-tab${active?' active':''}" type="button" data-bucket="${bucket}">${esc(label)}</button>`;
}
function insight(value,label){
  return `<div class="insight"><div class="insight-value">${esc(value)}</div><div class="insight-label">${esc(label)}</div></div>`;
}
function seriesRow(label,value,color,formatter){
  const display = value>0 ? formatter(value) : '—';
  return `<div class="series-row"><div class="series-left"><span class="series-dot" style="background:${color}"></span><span class="series-name">${esc(label)}</span></div><span class="series-value">${esc(display)}</span></div>`;
}
function sum(records,key){return records.reduce((acc,r)=>acc+(Number(r[key])||0),0)}
function fmtPct(v,signed){
  if(v==null || !isFinite(v)) return '—';
  const n = Number(v);
  return (signed && n>0?'+':'') + n.toFixed(1) + '%';
}

function reportRows(report, preferred){
  if(!report || report.error) return [];
  const keys = preferred==='session' ? ['sessions','session'] :
    preferred==='blocks' ? ['blocks'] :
    preferred==='weekly' ? ['weekly','weeks'] :
    preferred==='monthly' ? ['monthly','months'] :
    ['daily','days'];
  for(const key of keys){
    if(Array.isArray(report[key])) return report[key];
  }
  if(Array.isArray(report)) return report;
  return [];
}

function readAny(obj, keys, fallback){
  for(const key of keys){
    if(obj && obj[key] != null) return obj[key];
  }
  return fallback;
}
function numAny(obj, keys){ const n = Number(readAny(obj, keys, 0)); return Number.isFinite(n) ? n : 0; }
function rowDate(r){
  const raw = String(readAny(r, ['date','day','week','month','startTime','start_time','blockStart','block_start','lastActivity','last_activity','timestamp','ts'], ''));
  if(/^\d{4}-\d{2}-\d{2}/.test(raw)) return raw.slice(0,10);
  const ms = Date.parse(raw);
  return Number.isFinite(ms) ? new Date(ms).toISOString().slice(0,10) : raw.slice(0,12);
}
function rowLabel(r){ return String(readAny(r, ['date','week','month','sessionId','session_id','id','blockStart','block_start','startTime','start_time','project','projectPath'], '—')); }
function rowInput(r){ return numAny(r, ['inputTokens','input_tokens']); }
function rowOutput(r){ return numAny(r, ['outputTokens','output_tokens']); }
function rowCacheRead(r){ return numAny(r, ['cacheReadTokens','cache_read_tokens','cacheReadInputTokens','cache_read_input_tokens','cachedInputTokens','cached_input_tokens']); }
function rowCacheCreate(r){ return numAny(r, ['cacheCreationTokens','cache_creation_tokens','cacheCreationInputTokens','cache_creation_input_tokens','cacheCreateTokens','cache_create_tokens']); }
function rowReasoning(r){ return numAny(r, ['reasoningOutputTokens','reasoning_output_tokens','reasoningTokens','reasoning_tokens']); }
function rowTotalTokens(r){
  return numAny(r, ['totalTokens','total_tokens','tokens']) || rowInput(r)+rowOutput(r)+rowCacheRead(r)+rowCacheCreate(r)+rowReasoning(r);
}
function rowCost(r){ return numAny(r, ['totalCost','total_cost','costUSD','costUsd','cost']); }

function usageTotals(rows){
  return rows.reduce((acc,r)=>{
    acc.inputTokens += rowInput(r);
    acc.outputTokens += rowOutput(r);
    acc.cacheReadTokens += rowCacheRead(r);
    acc.cacheCreationTokens += rowCacheCreate(r);
    acc.reasoningTokens += rowReasoning(r);
    acc.totalTokens += rowTotalTokens(r);
    acc.cost += rowCost(r);
    return acc;
  }, {inputTokens:0,outputTokens:0,cacheReadTokens:0,cacheCreationTokens:0,reasoningTokens:0,totalTokens:0,cost:0});
}

function bucketRows(rows, bucket){
  const map = new Map();
  for(const r of rows){
    const date = rowDate(r);
    if(!date) continue;
    const key = bucket === 'month' ? date.slice(0,7) : bucketKey(date+'T00:00:00Z', 'week');
    if(!map.has(key)) map.set(key, { date:key, inputTokens:0, outputTokens:0, cacheReadTokens:0, cacheCreationTokens:0, totalTokens:0, totalCost:0 });
    const b = map.get(key);
    b.inputTokens += rowInput(r);
    b.outputTokens += rowOutput(r);
    b.cacheReadTokens += rowCacheRead(r);
    b.cacheCreationTokens += rowCacheCreate(r);
    b.totalTokens += rowTotalTokens(r);
    b.totalCost += rowCost(r);
  }
  return Array.from(map.values()).sort((a,b)=>rowLabel(b).localeCompare(rowLabel(a)));
}

function usageRowsTable(rows, label){
  if(!rows.length) return emptyUsage(`No ${label.toLowerCase()} usage rows available`);
  const sorted = rows.slice().sort((a,b)=>rowLabel(b).localeCompare(rowLabel(a))).slice(0,60);
  let html = `<table class="usage-table"><thead><tr><th>${esc(label)}</th><th>Input</th><th>Output</th><th>Reasoning</th><th>Cache Write</th><th>Cache Read</th><th>Total</th><th>Cost</th><th>Models</th></tr></thead><tbody>`;
  for(const r of sorted){
    html+=`<tr><td>${esc(rowLabel(r))}</td><td>${fmtTok(rowInput(r))}</td><td>${fmtTok(rowOutput(r))}</td><td>${fmtTok(rowReasoning(r))}</td><td>${fmtTok(rowCacheCreate(r))}</td><td>${fmtTok(rowCacheRead(r))}</td><td>${fmtTok(rowTotalTokens(r))}</td><td>${rowCost(r)>0?'$'+rowCost(r).toFixed(2):'—'}</td><td>${esc(modelsLabel(r))}</td></tr>`;
  }
  html+=`</tbody></table>`;
  return html;
}

function sessionTable(rows){
  const sorted = rows.slice().sort((a,b)=>rowCost(b)-rowCost(a) || rowTotalTokens(b)-rowTotalTokens(a)).slice(0,80);
  let html = `<table class="usage-table"><thead><tr><th>Session</th><th>Project</th><th>Input</th><th>Output</th><th>Reasoning</th><th>Cache Write</th><th>Cache Read</th><th>Total</th><th>Cost</th><th>Last</th></tr></thead><tbody>`;
  for(const r of sorted){
    html+=`<tr><td>${esc(shortId(readAny(r,['sessionId','session_id','id'], rowLabel(r))))}</td><td>${esc(projectLabel(r))}</td><td>${fmtTok(rowInput(r))}</td><td>${fmtTok(rowOutput(r))}</td><td>${fmtTok(rowReasoning(r))}</td><td>${fmtTok(rowCacheCreate(r))}</td><td>${fmtTok(rowCacheRead(r))}</td><td>${fmtTok(rowTotalTokens(r))}</td><td>${rowCost(r)>0?'$'+rowCost(r).toFixed(2):'—'}</td><td>${esc(rowDate(r)||'—')}</td></tr>`;
  }
  html+=`</tbody></table>`;
  return html;
}

function blockTable(rows){
  const sorted = rows.slice().sort((a,b)=>rowLabel(b).localeCompare(rowLabel(a))).slice(0,80);
  let html = `<table class="usage-table"><thead><tr><th>Block Start</th><th>Models</th><th>Input</th><th>Output</th><th>Reasoning</th><th>Cache Write</th><th>Cache Read</th><th>Total</th><th>Cost</th><th>Projection</th></tr></thead><tbody>`;
  for(const r of sorted){
    const projection = numAny(r,['projectedTotalTokens','projected_total_tokens','projectionTokens','projection_tokens']);
    html+=`<tr><td>${esc(rowLabel(r))}</td><td>${esc(modelsLabel(r))}</td><td>${fmtTok(rowInput(r))}</td><td>${fmtTok(rowOutput(r))}</td><td>${fmtTok(rowReasoning(r))}</td><td>${fmtTok(rowCacheCreate(r))}</td><td>${fmtTok(rowCacheRead(r))}</td><td>${fmtTok(rowTotalTokens(r))}</td><td>${rowCost(r)>0?'$'+rowCost(r).toFixed(2):'—'}</td><td>${projection?fmtTok(projection):'—'}</td></tr>`;
  }
  html+=`</tbody></table>`;
  return html;
}

function renderHeatmap(rows){
  const last = rows.slice().sort((a,b)=>rowDate(a).localeCompare(rowDate(b))).slice(-31);
  const max = Math.max(1, ...last.map(rowTotalTokens));
  let html = `<div class="heatmap">`;
  for(const r of last){
    const rel = rowTotalTokens(r)/max;
    const col = rel<=0 ? 'var(--s2)' : rel<.25 ? '#4f5d92' : rel<.55 ? '#7289da' : rel<.8 ? '#eaca8b' : '#d25050';
    html+=`<div class="heat-cell" title="${esc(rowDate(r))}: ${esc(fmtTok(rowTotalTokens(r)))}" style="background:${col};opacity:${Math.max(.35, rel).toFixed(2)}"></div>`;
  }
  html+=`</div>`;
  return html;
}

function aggregateReportModels(rows){
  const map = new Map();
  const add = (name,tokens,cost)=>{
    name = String(name||'unknown').trim() || 'unknown';
    const cur = map.get(name) || { model:name, tokens:0, cost:0 };
    cur.tokens += Number(tokens)||0;
    cur.cost += Number(cost)||0;
    map.set(name, cur);
  };
  for(const r of rows){
    const breakdown = readAny(r, ['modelBreakdowns','model_breakdowns'], []);
    if(Array.isArray(breakdown) && breakdown.length){
      for(const m of breakdown) add(readAny(m,['modelName','model_name','model'], 'unknown'), rowTotalTokens(m), rowCost(m));
      continue;
    }
    const models = readAny(r, ['modelsUsed','models_used','models','model'], null);
    if(Array.isArray(models)) models.forEach(m=>add(m, rowTotalTokens(r)/models.length, rowCost(r)/models.length));
    else if(models && typeof models === 'object') Object.entries(models).forEach(([name,m])=>add(name, rowTotalTokens(m), rowCost(m)));
    else if(models) add(models, rowTotalTokens(r), rowCost(r));
  }
  return Array.from(map.values()).sort((a,b)=>b.tokens-a.tokens || b.cost-a.cost).slice(0,10);
}

function renderModelMix(models, totalTokens){
  if(!models.length) return emptyUsage('No model metadata available');
  let html = `<div class="model-mix">`;
  for(const m of models){
    const share = totalTokens>0 ? m.tokens/totalTokens*100 : 0;
    html+=`<div class="model-row"><div class="model-label">${esc(m.model)}</div><div class="pressure-value">${share.toFixed(1)}%</div><div class="model-bar"><div style="width:${share.toFixed(1)}%"></div></div><div class="pressure-value">${m.cost>0?'$'+m.cost.toFixed(2):fmtTok(m.tokens)}</div></div>`;
  }
  html+=`</div>`;
  return html;
}

function modelsLabel(r){
  const breakdown = readAny(r, ['modelBreakdowns','model_breakdowns'], []);
  if(Array.isArray(breakdown) && breakdown.length) return breakdown.map(m=>readAny(m,['modelName','model_name','model'],'model')).slice(0,3).join(', ');
  const models = readAny(r, ['modelsUsed','models_used','models','model'], '—');
  if(models && typeof models === 'object' && !Array.isArray(models)) return Object.keys(models).slice(0,3).join(', ');
  return Array.isArray(models) ? models.slice(0,3).join(', ') : String(models || '—');
}
function projectLabel(r){ return String(readAny(r, ['project','projectName','project_name','projectPath','project_path','cwd','instance'], '—')).split('/').filter(Boolean).slice(-2).join('/') || '—'; }
function shortId(v){ return String(v||'—').split(/[-/]/).filter(Boolean).slice(-2).join('-') || String(v||'—').slice(0,18); }

function bucketKey(ts, bucket){
  const d = new Date(ts);
  if(bucket==='hour'){
    d.setMinutes(0,0,0);
    return d.toISOString().slice(0,13)+':00';
  }
  if(bucket==='day') return d.toISOString().slice(0,10);
  if(bucket==='week'){
    const u = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
    const day = u.getUTCDay() || 7;
    u.setUTCDate(u.getUTCDate() - day + 1);
    return u.toISOString().slice(0,10);
  }
  return ts;
}

function aggregateHistory(records, bucket){
  if(bucket==='raw') return records;
  const map = new Map();
  for(const r of records){
    const key = bucketKey(r.ts, bucket);
    if(!map.has(key)){
      map.set(key, {
        ...r,
        ts:key,
        primaryPercent:0,
        inputTokens:0,
        outputTokens:0,
        cacheReadTokens:0,
        cacheCreationTokens:0,
        totalTokens:0,
        cost:0,
        progress:[],
        _quota:{},
        _samples:0,
      });
    }
    const b = map.get(key);
    b._samples++;
    b.primaryPercent = Math.max(b.primaryPercent, Number(r.primaryPercent)||0);
    // These are sampled counters, not usage events. Repeated polls must not
    // multiply usage; take the latest counter while retaining peak quota.
    if(!b._latest || new Date(r.ts)>=new Date(b._latest)){
      for(const field of ['inputTokens','outputTokens','cacheReadTokens','cacheCreationTokens','totalTokens','cost']) b[field] = Number(r[field])||0;
      b._latest = r.ts;
    }
    for(const p of (r.progress||[])){
      if(p.percent == null || !isFinite(p.percent)) continue;
      if(!b._quota[p.label]) b._quota[p.label] = { ...p, percent:0, used:0, samples:0 };
      b._quota[p.label].percent = Math.max(b._quota[p.label].percent, Number(p.percent)||0);
      b._quota[p.label].used = Math.max(b._quota[p.label].used, Number(p.used)||0);
      b._quota[p.label].samples++;
    }
  }
  return Array.from(map.values()).map(b=>{
    b.progress = Object.values(b._quota);
    delete b._quota; delete b._samples; delete b._latest;
    return b;
  }).sort((a,b)=>new Date(a.ts)-new Date(b.ts));
}

function quotaSeries(records){
  const labels = [];
  const seen = new Set();
  for(const r of records){
    for(const p of (r.progress||[])){
      if(p.format==='percent' && !seen.has(p.label)){
        seen.add(p.label);
        labels.push(p.label);
      }
    }
  }
  const palette = ['#7289da','#43b581','#eaca8b','#ce8670','#b48ead','#859bee','#d25050'];
  if(!labels.length) return [{ key:'primaryPercent', label:'Primary', color:'#7289da', fmt:v=>v.toFixed(1)+'%' }];
  return labels.slice(0, 7).map((label, i)=>({
    key:'quota:'+label,
    label,
    color:palette[i % palette.length],
    fmt:v=>v.toFixed(1)+'%',
    value:r=>{
      const p = (r.progress||[]).find(row=>row.label===label);
      return p && p.percent != null ? Number(p.percent) : 0;
    }
  }));
}

function historySeries(records, mode){
  if(mode==='quota') return quotaSeries(records);
  if(mode==='tokens') return [
    { key:'inputTokens', label:'Input', color:'#7289da', fmt:fmtTok },
    { key:'outputTokens', label:'Output', color:'#43b581', fmt:fmtTok },
    { key:'totalTokens', label:'Total', color:'#859bee', fmt:fmtTok, line:true },
  ];
  if(mode==='cost') return [
    { key:'cost', label:'Cost', color:'#7289da', fmt:v=>'$'+v.toFixed(2), line:true },
  ];
  if(mode==='cache') return [
    { key:'cacheReadTokens', label:'Cache read', color:'#b48ead', fmt:fmtTok },
    { key:'cacheCreationTokens', label:'Cache write', color:'#eaca8b', fmt:fmtTok },
  ];
  return [{ key:'primaryPercent', label:'Usage', color:'#7289da', fmt:v=>v.toFixed(1)+'%' }];
}

function seriesValue(row, series){
  return series.value ? series.value(row) : Number(row[series.key]) || 0;
}

function buildHistoryChart(containerId, sourceRecords, mode, bucket){
  const container = document.getElementById(containerId);
  if(!container) return;
  const records = aggregateHistory(sourceRecords, bucket || 'raw');
  const series = historySeries(records, mode);
  const hasData = records.some(r=>series.some(s=>seriesValue(r,s)>0));
  if(!records.length || !hasData){
    container.innerHTML = `<div class="chart-loading">No ${esc(mode)} history recorded for ${esc(bucket||'raw')} view yet</div>`;
    return;
  }

  const W=860,H=230,PL=56,PB=34,PT=16,PR=18;
  const CW=W-PL-PR, CH=H-PT-PB;
  const maxVal = Math.max(1, ...records.flatMap(r=>series.map(s=>seriesValue(r,s))));
  const step = records.length > 1 ? CW/(records.length-1) : CW;
  const barModes = mode==='tokens' || mode==='cache';
  const legend = `<div class="chart-legend">${series.map(s=>`<span class="legend-item"><span class="legend-dot" style="background:${s.color}"></span>${esc(s.label)}</span>`).join('')}</div>`;
  let svg=`<svg class="chart-svg" viewBox="0 0 ${W} ${H}">`;
  svg+=`<defs>`;
  series.forEach((s,i)=>{
    svg+=`<linearGradient id="hist-fill-${containerId}-${i}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".22"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`;
  });
  svg+=`</defs>`;

  for(let i=0;i<=4;i++){
    const y=PT+CH*(1-i/4), v=maxVal*i/4;
    svg+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#e4e4e410" stroke-width="1"/>`;
    svg+=`<text x="${PL-7}" y="${y+4}" text-anchor="end" fill="#8e9297" font-size="11" font-family="monospace">${axisValue(v,mode)}</text>`;
  }

  if(barModes){
    const stackSeries = series.filter(s=>!s.line);
    const lineSeries = series.filter(s=>s.line);
    const barW = Math.max(8, Math.min(34, CW / Math.max(records.length,1) * .54));
    records.forEach((r,i)=>{
      const x = PL + (records.length === 1 ? CW/2 : i*step) - barW/2;
      let yStack = PT + CH;
      stackSeries.forEach(s=>{
        const val = seriesValue(r,s);
        const h = CH * (val / maxVal);
        yStack -= h;
        svg+=`<rect class="hist-point" x="${x.toFixed(1)}" y="${yStack.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(h, val>0?2:0).toFixed(1)}" rx="3" fill="${s.color}" opacity=".9"
          data-date="${String(r.ts).slice(0,10)}" data-label="${esc(s.label)}" data-value="${esc(s.fmt(val))}"/>`;
      });
    });
    lineSeries.forEach((s,idx)=>{ svg += historyLinePath(records, s, idx, containerId, PL, PT, CH, CW, step, maxVal); });
  } else series.forEach((s,idx)=>{
    svg += historyLinePath(records, s, idx, containerId, PL, PT, CH, CW, step, maxVal);
  });

  const every = Math.max(1, Math.ceil(records.length/8));
  records.forEach((r,i)=>{
    if(i%every===0 || i===records.length-1){
      const x = PL + (records.length === 1 ? CW/2 : i*step);
      svg+=`<text x="${x.toFixed(1)}" y="${H-8}" text-anchor="middle" fill="#8e9297" font-size="10" font-family="monospace">${axisDate(r.ts,bucket)}</text>`;
    }
  });
  svg+=`</svg>`;
  container.innerHTML = legend + svg;

  const tip=document.getElementById('tip');
  container.querySelectorAll('.hist-point').forEach(p=>{
    p.addEventListener('mouseenter',()=>{
      tip.innerHTML=`<div class="tt-date">${p.dataset.date}</div><div class="tt-cost">${p.dataset.value}</div><div class="tt-meta">${p.dataset.label}</div>`;
      tip.style.display='block';
    });
    p.addEventListener('mousemove',e=>{tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-52)+'px';});
    p.addEventListener('mouseleave',()=>tip.style.display='none');
  });
}

function historyLinePath(records, s, idx, fillId, PL, PT, CH, CW, step, maxVal){
    const points = records.map((r,i)=>{
      const x = PL + (records.length === 1 ? CW/2 : i*step);
      const val = seriesValue(r,s);
      const y = PT + CH - (val/maxVal)*CH;
      return {x,y,val,r};
    });
    const d = points.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
    const area = `${d} L${points[points.length-1].x.toFixed(1)} ${(PT+CH).toFixed(1)} L${points[0].x.toFixed(1)} ${(PT+CH).toFixed(1)} Z`;
    let svg = `<path d="${area}" fill="url(#hist-fill-${fillId}-${idx})" opacity=".8"/>`;
    svg+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
    points.forEach(p=>{
      svg+=`<circle class="hist-point" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="${s.color}"
        data-date="${String(p.r.ts).slice(0,10)}" data-label="${esc(s.label)}" data-value="${esc(s.fmt(p.val))}"/>`;
    });
    return svg;
}

function axisValue(v,mode){
  if(mode==='cost') return '$'+(v<10?v.toFixed(2):v.toFixed(1));
  if(mode==='quota' || mode==='primary') return v.toFixed(0)+'%';
  return fmtTok(v);
}
function axisDate(ts,bucket){
  const s = String(ts);
  if(bucket==='hour') return s.slice(5,13).replace('T',' ');
  if(bucket==='week') return 'W '+s.slice(5,10);
  if(bucket==='day') return s.slice(5,10);
  return s.slice(5,10);
}

// ── chart ─────────────────────────────────────────────────────────────────────
function buildChart(containerId, daily){
  const container = document.getElementById(containerId);
  if(!container) return;
  daily = daily.map(normalizeCostRow);
  const active = daily.filter(d=>rowCost(d)>0);
  if(!active.length){ container.innerHTML=`<div class="chart-loading">No daily cost data recorded</div>`; return; }

  const W=800,H=190,PL=54,PB=32,PT=12,PR=12;
  const CW=W-PL-PR, CH=H-PT-PB;
  const maxCost=Math.max(...daily.map(rowCost));
  const barW=CW/daily.length*0.68;
  const step=CW/daily.length;

  let svg=`<svg class="chart-svg" viewBox="0 0 ${W} ${H}">`;

  // grid + y-labels
  for(let i=0;i<=4;i++){
    const y=PT+CH*(1-i/4);
    const v=maxCost*i/4;
    svg+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#e4e4e410" stroke-width="1"/>`;
    svg+=`<text x="${PL-6}" y="${y+4}" text-anchor="end" fill="#8e9297" font-size="11" font-family="monospace">$${v<10?v.toFixed(2):v.toFixed(1)}</text>`;
  }

  // bars
  daily.forEach((d,i)=>{
    const cost=rowCost(d);
    const x=PL+i*step+(step-barW)/2;
    const bH=CH*(cost/maxCost)||0;
    const y=PT+CH-bH;
    const rel=cost/maxCost;
    const col=cost<=0?'#101320':rel<0.25?'#7289da':rel<0.5?'#43b581':rel<0.75?'#eaca8b':'#d25050';

    svg+=`<g class="bar-g" data-date="${d.date}" data-cost="${cost.toFixed(4)}"
            data-tokens="${rowTotalTokens(d)}" data-models="${esc(modelsLabel(d))}">`;
    svg+=`<rect x="${x.toFixed(1)}" y="${bH>0?y.toFixed(1):(PT+CH-1)}" width="${barW.toFixed(1)}" height="${cost>0?Math.max(bH,2).toFixed(1):'1'}" fill="${col}" rx="2" opacity="${cost>0?'.9':'.45'}"/>`;
    svg+=`<rect x="${x.toFixed(1)}" y="${PT}" width="${barW.toFixed(1)}" height="${CH}" fill="transparent"/>`;
    svg+=`</g>`;

    // x-axis labels — show every N days so they don't overlap
    const every = Math.max(1, Math.ceil(daily.length/10));
    if(i%every===0||i===daily.length-1)
      svg+=`<text x="${(x+barW/2).toFixed(1)}" y="${H-6}" text-anchor="middle" fill="#8e9297" font-size="10" font-family="monospace">${d.date.slice(5)}</text>`;
  });

  svg+=`</svg>`;
  container.innerHTML=svg;

  // tooltip wiring
  const tip=document.getElementById('tip');
  container.querySelectorAll('.bar-g').forEach(g=>{
    g.addEventListener('mouseenter',()=>{
      const {date,cost,tokens,models}=g.dataset;
      tip.innerHTML=`<div class="tt-date">${date}</div><div class="tt-cost">$${parseFloat(cost).toFixed(2)}</div><div class="tt-meta">${fmtTok(+tokens)} tokens</div>${models?`<div class="tt-meta">${models}</div>`:''}`;
      tip.style.display='block';
    });
    g.addEventListener('mousemove',e=>{tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-52)+'px';});
    g.addEventListener('mouseleave',()=>tip.style.display='none');
  });
}

// ── helpers ───────────────────────────────────────────────────────────────────
const PACE_COLORS={
  well_under:'#859bee',under:'#43b581',slightly_under:'#1ed760',
  on_track:'#7289da',slightly_over:'#eaca8b',over:'#ce8670',well_over:'#d25050'
};
function paceColor(s){return PACE_COLORS[s]||'#484f58'}
function stageLbl(s){return(s||'').replace(/_/g,' ')}
function barCol(p){return p>=95?'#d25050':p>=80?'#ce8670':p>=65?'#eaca8b':'#7289da'}
function pct(m){return m.limit>0?Math.min(m.used/m.limit*100,100):0}
function pillCls(c){return'pill '+({'green':'pill-green','red':'pill-red','blue':'pill-blue','yellow':'pill-yellow','orange':'pill-orange'}[c]||'')}
function srcCls(s){return'badge b-'+({'oauth':'oauth','web':'web','api':'api','cli':'cli','local':'local','error':'error'}[s]||'local')}

function fmtMetric(m){
  const k=m.format?.kind;
  if(k==='percent'){const p=m.limit>0?m.used/m.limit*100:0;return`${p.toFixed(1)}%  (${fmtNum(m.used)} / ${fmtNum(m.limit)})`;}
  if(k==='dollars') return `$${m.used.toFixed(2)} / $${m.limit.toFixed(2)}`;
  return `${fmtNum(m.used)} / ${fmtNum(m.limit)} ${m.format?.suffix||''}`.trim();
}
function barChartMetricHtml(m, compact){
  const points = (Array.isArray(m.points)?m.points:[])
    .map(p=>({label:String(p.label||''),value:Number(p.value||0),valueLabel:p.valueLabel||p.value_label||null}))
    .filter(p=>p.label && Number.isFinite(p.value) && p.value>=0);
  const cls = compact ? 'metric' : 'dmetric';
  if(!points.length) return '';
  const max = Math.max(...points.map(p=>p.value), 1);
  const latest = points[points.length-1];
  const peak = points.reduce((a,p)=>p.value>a.value?p:a, points[0]);
  const color = chartColor(m.color);
  const bars = points.slice(-31).map(p=>{
    const h = Math.max(3, Math.round((p.value/max)*100));
    return `<div class="spark-bar" style="height:${h}%;--spark:${color}" title="${esc(p.label)}: ${esc(formatChartValue(p))}"></div>`;
  }).join('');
  const readout = compact ? formatChartValue(latest) : `${formatChartValue(latest)} latest · ${formatChartValue(peak)} peak`;
  const note = m.note ? `<div class="spark-note">${esc(m.note)}</div>` : '';
  return `<div class="${cls}"><div class="spark"><div class="spark-head"><span class="spark-title">${esc(m.label||'History')}</span><span class="spark-readout">${esc(readout)}</span></div><div class="spark-bars" aria-label="${esc(m.label||'History')}">${bars}</div>${note}</div></div>`;
}
function formatChartValue(point){
  if(point?.valueLabel) return String(point.valueLabel);
  return fmtTok(Math.round(Number(point?.value)||0));
}
function chartColor(c){
  if(typeof c === 'string' && /^#[0-9a-f]{3,8}$/i.test(c.trim())) return c.trim();
  return {'green':'#3fb950','red':'#f85149','blue':'#58a6ff','yellow':'#e3b341','orange':'#f0883e','teal':'#39c5cf'}[c] || '#58a6ff';
}
function fmtNum(n){return n>=10000?n.toLocaleString():String(+(n).toFixed(n%1?1:0))}
function fmtTok(n){
  if(!Number.isFinite(n)) return '—';
  const magnitude=Math.abs(n);
  // Promote when rounding the smaller unit would display 1000.0.
  if(magnitude>=999950000) return (n/1e9).toFixed(2)+'B';
  if(magnitude>=999950) return (n/1e6).toFixed(1)+'M';
  if(magnitude>=1e3) return (n/1e3).toFixed(1)+'K';
  return String(n);
}
function fmtReset(iso){
  if(!iso) return '';
  const ms=new Date(iso)-Date.now();
  if(ms<=0) return 'resetting…';
  const h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000);
  if(h>48) return `resets in ${Math.floor(h/24)}d`;
  return h>0?`resets in ${h}h ${m}m`:`resets in ${m}m`;
}
function fmtEta(secs,stage){
  if(secs==null||stage==='well_under') return '∞';
  if(secs<60) return '<1m';
  const h=Math.floor(secs/3600),m=Math.floor((secs%3600)/60);
  return h>0?`${h}h ${m}m`:`${m}m`;
}
function fmtDelta(d){
  if(d==null) return '—';
  const a=Math.abs(d).toFixed(1);
  return d>0.5?`+${a}% ahead`:d<-0.5?`${-a}% behind`:'on schedule';
}
function fmtAgo(iso){
  if(!iso) return '';
  const s=Math.round((Date.now()-new Date(iso))/1000);
  return s<60?`${s}s ago`:`${Math.round(s/60)}m ago`;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function arcSvg(p,color){
  const r=18,c=+(2*Math.PI*r).toFixed(3),off=+(c*(1-Math.min(p,100)/100)).toFixed(3);
  return `<div class="arc"><svg width="48" height="48" viewBox="0 0 52 52"><circle class="arc-bg" cx="26" cy="26" r="${r}"/><circle class="arc-fill" cx="26" cy="26" r="${r}" stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${off}"/></svg><div class="arc-num">${Math.round(p)}%</div></div>`;
}

function aggregateModels(daily){
  const m={};
  for(const d of daily){
    const breakdown = d.modelBreakdowns || d.model_breakdowns || [];
    for(const mb of breakdown){
      const name = mb.modelName || mb.model_name || mb.model || 'unknown';
      if(!m[name]) m[name]={cost:0,tokens:0};
      m[name].cost+=rowCost(mb);
      m[name].tokens+=rowTotalTokens(mb);
    }
    if(d.models && typeof d.models === 'object' && !Array.isArray(d.models)){
      for(const [name,mb] of Object.entries(d.models)){
        if(!m[name]) m[name]={cost:0,tokens:0};
        m[name].cost+=rowCost(mb);
        m[name].tokens+=rowTotalTokens(mb);
      }
    }
  }
  return Object.entries(m).sort((a,b)=>b[1].cost-a[1].cost);
}

function animateBarsAndArcs(root){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    root.querySelectorAll('.bar[data-w],.dm-bar[data-w]').forEach(el=>{el.style.width=el.dataset.w});
    root.querySelectorAll('.arc-fill[data-off]').forEach(el=>{
      el.style.transition='stroke-dashoffset .9s cubic-bezier(.4,0,.2,1)';
      el.style.strokeDashoffset=el.dataset.off;
    });
  }));
}
function animateCompareBars(root){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    root.querySelectorAll('.compare-fill[data-w]').forEach(el=>{
      el.style.transition='width .9s cubic-bezier(.4,0,.2,1)';
      el.style.width=el.dataset.w;
    });
  }));
}

load();
