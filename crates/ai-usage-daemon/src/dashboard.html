<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Usage</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#23283d; --s0:#1e2233; --s1:#191f2e; --s2:#101320; --s3:#32364a;
  --bd:#e4e4e410; --bd2:#23283d60; --bd3:#10132060;
  --tx:#dadada; --hi:#ffffff; --mu:#b9bbbe; --su:#8e9297;
  --blue:#7289da; --green:#43b581; --ltgreen:#1ed760;
  --teal:#6e84d1; --yellow:#eaca8b; --orange:#ce8670; --red:#d25050;
  --purple:#b48ead; --magenta:#da97cd; --deep:#4f5d92; --bright:#859bee;
  --mono:ui-monospace,'Cascadia Code','Source Code Pro',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --r:8px;
}

html{background:#101320}
body{min-height:100vh;color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.5}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 45% at 50% -8%,rgba(114,137,218,.12),transparent 62%),
    linear-gradient(180deg,#23283d 0%,#1e2233 42%,#101320 100%);
}
:focus-visible{outline:2px solid var(--bright);outline-offset:2px}
.tab:focus-visible{outline-offset:-3px;border-radius:6px}

/* ── layout ── */
.shell{max-width:1480px;margin:0 auto;padding:16px 20px 60px}

/* ── header ── */
header{
  display:flex;align-items:center;gap:0;
  background:var(--s0);border:1px solid var(--bd);
  border-radius:var(--r);
  margin-bottom:0;position:sticky;top:10px;z-index:50;
  overflow:hidden;
}
.hstart{display:flex;align-items:center;gap:10px;padding:11px 16px;flex-shrink:0}
.mark{
  width:28px;height:28px;border-radius:5px;border:1px solid color-mix(in srgb,var(--blue) 70%,transparent);
  display:flex;align-items:center;justify-content:center;
  font:700 10px/1 var(--mono);color:var(--bright);letter-spacing:-.5px;flex-shrink:0;
  background:color-mix(in srgb,var(--deep) 22%,transparent);
}
.appname{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--tx);white-space:nowrap}

/* ── tab bar (inside header) ── */
.tab-bar{
  display:flex;align-items:stretch;flex:1;
  overflow-x:auto;scrollbar-width:none;border-left:1px solid var(--bd);
}
.tab-bar::-webkit-scrollbar{display:none}
.tab{
  display:flex;align-items:center;gap:7px;padding:0 16px;
  background:transparent;border:none;cursor:pointer;
  font:13px var(--sans);color:var(--mu);white-space:nowrap;
  position:relative;transition:color .15s;min-height:50px;flex-shrink:0;
}
.tab:hover{color:var(--tx)}
.tab[hidden]{display:none}
.tab.active{color:var(--tx)}
.tab.active::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:var(--blue);border-radius:2px 2px 0 0;
}
.tab-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;opacity:.8}

.hend{display:flex;align-items:center;gap:10px;padding:11px 14px;flex-shrink:0;border-left:1px solid var(--bd)}
.conn{
  display:flex;align-items:center;gap:5px;padding:3px 9px;
  border:1px solid var(--bd);border-radius:100px;
  font:11px var(--mono);color:var(--mu);transition:border-color .3s,color .3s;
}
.conn.online{border-color:rgba(63,185,80,.4);color:var(--green)}
.conn.offline{border-color:rgba(248,81,73,.4);color:var(--red)}
.cdot{width:5px;height:5px;border-radius:50%;background:var(--su);flex-shrink:0;transition:background .3s,box-shadow .3s}
.conn.online .cdot{background:var(--green);box-shadow:0 0 5px var(--green)}
.conn.offline .cdot{background:var(--red);box-shadow:0 0 5px var(--red)}
.ago{font:11px var(--mono);color:var(--mu)}
.rbtn{
  position:relative;width:32px;height:32px;border-radius:50%;
  background:var(--s1);border:1px solid var(--bd2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .2s,background .2s;flex-shrink:0;
}
.rbtn:hover{border-color:var(--blue);background:var(--s3)}
.rbtn svg{position:relative;z-index:1;width:13px;height:13px;stroke:var(--mu);transition:stroke .2s}
.rbtn:hover svg{stroke:var(--bright)}
.rbtn.spin svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ring-svg{position:absolute;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px)}
.ring-t{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;opacity:.38;
  transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 1s linear}
@media(max-width:640px){
  .shell{padding:16px 20px 44px}
  header{flex-wrap:wrap}
  .hstart{flex:1}
  .hend{border-left:1px solid var(--bd);margin-left:auto}
  .tab-bar{order:3;flex-basis:100%;border-left:0;border-top:1px solid var(--bd)}
  .tab{min-height:42px;padding:0 14px}
}
@media(max-width:440px){
  .ago{display:none}
  .hend{gap:8px}
}

/* ── panels ── */
.panels{margin-top:16px}
.panel{display:none}
.panel.active{display:block}

/* ── offline banner ── */
.offline-wrap{display:none;text-align:center;padding:64px 24px;
  background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:16px}
.offline-wrap.show{display:block}
.oicon{font-size:32px;margin-bottom:12px}
.otitle{font-size:16px;font-weight:600;margin-bottom:6px}
.osub{color:var(--mu);font-size:13px;margin-bottom:12px}
.ocmd{display:inline-block;padding:4px 12px;background:var(--s1);border:1px solid var(--bd2);
  border-radius:5px;font:12px var(--mono);color:var(--bright)}

/* ── overview grid ── */
.overview-summary{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr) minmax(0,.92fr);gap:16px;margin-bottom:16px;align-items:stretch}
@media(max-width:1180px) and (min-width:761px){.overview-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.overview-summary>:last-child{grid-column:1/-1}.overview-summary>:last-child .rollup-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:760px){.overview-summary{grid-template-columns:minmax(0,1fr)}}
.overview-panel{
  background:linear-gradient(180deg,color-mix(in srgb,var(--s0) 92%,var(--blue) 8%),var(--s0));
  border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;min-width:0;
}
.overview-title{font-size:18px;font-weight:700;color:var(--hi);margin-bottom:4px}
.overview-sub{font:12px var(--mono);color:var(--mu);margin-bottom:14px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:760px){.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:color-mix(in srgb,var(--s1) 76%,transparent);border:1px solid var(--bd);border-radius:7px;padding:11px 12px}
.kpi-value{font:700 21px/1 var(--mono);color:var(--hi);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-label{font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.alert-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.alert-row{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;background:color-mix(in srgb,var(--s1) 78%,transparent);border:1px solid var(--bd);border-left:3px solid var(--alert,var(--blue));border-radius:7px}
.alert-mark{font:700 10px/1 var(--mono);color:var(--alert,var(--blue));text-transform:uppercase;min-width:42px;padding-top:2px}
.alert-text{font:12px/1.35 var(--sans);color:var(--tx);min-width:0}
.alert-sub{display:block;font:11px var(--mono);color:var(--mu);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pressure-list{display:flex;flex-direction:column;gap:9px}
.pressure-row{display:grid;grid-template-columns:minmax(90px,1fr) 70px 1.8fr;gap:10px;align-items:center}
.pressure-name{font:12px var(--mono);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pressure-value{font:12px var(--mono);color:var(--mu);text-align:right}
.pressure-track{height:5px;background:var(--s2);border-radius:999px;overflow:hidden}
.pressure-fill{height:100%;border-radius:999px;background:var(--blue)}
.overview-controls{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);
  padding:10px 12px;margin-bottom:16px;
}
.ctrl-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctrl-group:first-child{flex:1 1 520px;min-width:0}
.ctrl-group:first-child .ctrl-input{flex:1 1 180px;max-width:280px}
.ctrl-input,.ctrl-select{
  height:32px;border:1px solid var(--bd2);border-radius:6px;background:var(--s1);
  color:var(--tx);font:12px var(--mono);outline:none;
}
.ctrl-input{width:min(280px,100%);padding:0 10px}
.ctrl-sep{width:1px;height:20px;background:var(--bd);margin:0 2px}
.prefs-notice{font:11px var(--mono);color:var(--mu);margin:-8px 2px 12px}
.prefs-notice:empty{display:none}
.ctrl-select{padding:0 30px 0 9px}
.ctrl-input:focus,.ctrl-select:focus{border-color:var(--blue);box-shadow:0 0 0 2px color-mix(in srgb,var(--blue) 18%,transparent)}
.action-btn{
  height:32px;display:inline-flex;align-items:center;gap:7px;padding:0 10px;
  border:1px solid var(--bd2);border-radius:6px;background:var(--s1);
  color:var(--mu);font:11px var(--mono);cursor:pointer;transition:border-color .2s,color .2s,background .2s;
}
.action-btn:hover{border-color:var(--blue);color:var(--hi);background:var(--s3)}
.action-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.result-count{font:11px var(--mono);color:var(--mu)}
.rollup-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.rollup-card{background:color-mix(in srgb,var(--s1) 76%,transparent);border:1px solid var(--bd);border-radius:7px;padding:11px 12px;min-width:0}
.rollup-value{font:700 19px/1.1 var(--mono);color:var(--hi);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rollup-label{font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.delta{font:10px var(--mono);margin-left:4px;color:var(--mu)}
.delta.up{color:var(--orange)}.delta.down{color:var(--green)}.delta.flat{color:var(--mu)}
@media(max-width:440px){
  .rollup-card{padding:10px}
  .rollup-value{font-size:17px;white-space:normal;overflow:visible;text-overflow:clip;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
  .delta{margin-left:0;font-size:9px}
}
.overview-trend{margin-top:12px}
.trend-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}
.trend-title{font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.trend-readout{font:11px var(--mono);color:var(--tx);text-align:right}
.trend-bars{display:flex;align-items:flex-end;gap:3px;height:48px;padding:6px 0 3px;border-bottom:1px solid var(--bd)}
.trend-bar{flex:1;min-width:4px;border-radius:3px 3px 0 0;background:var(--blue);opacity:.82}
.contrib-list{display:flex;flex-direction:column;gap:8px;margin-top:11px}
.contrib-row{display:grid;grid-template-columns:minmax(84px,1fr) 82px 1.4fr;gap:9px;align-items:center}
.contrib-name{font:12px var(--mono);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contrib-value{font:12px var(--mono);color:var(--mu);text-align:right}
.empty-state{padding:36px 16px;text-align:center;background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);color:var(--mu);font:13px var(--mono)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px}
.sk-card{height:240px;background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);
  position:relative;overflow:hidden}
.sk-card::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);
  animation:shim 1.5s infinite}
@keyframes shim{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* ── overview card ── */
.card{
  background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column;position:relative;
  transition:border-color .2s,box-shadow .2s;
}
.card:hover{
  border-color:color-mix(in srgb,var(--accent,var(--su)) 40%,var(--bd));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--accent,var(--su)) 12%,transparent);
}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--accent,var(--su));transition:background .4s}
.card.is-error{border-color:rgba(248,81,73,.25)}
.card.is-error::before{background:var(--red)}

.card-head{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 14px 10px 17px;gap:10px}
.card-meta{flex:1;min-width:0}
.card-name{font-size:14px;font-weight:600;color:var(--tx);margin-bottom:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-tags{display:flex;align-items:center;flex-wrap:wrap;gap:4px}

/* badges */
.badge{font:600 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:100px;border:1px solid;white-space:nowrap}
.b-oauth{color:var(--purple);border-color:color-mix(in srgb,var(--purple) 45%,transparent);background:color-mix(in srgb,var(--purple) 10%,transparent)}
.b-web  {color:var(--bright); border-color:color-mix(in srgb,var(--bright) 45%,transparent);background:color-mix(in srgb,var(--bright) 10%,transparent)}
.b-api  {color:var(--teal); border-color:color-mix(in srgb,var(--teal) 45%,transparent);background:color-mix(in srgb,var(--teal) 10%,transparent)}
.b-cli  {color:var(--yellow);border-color:color-mix(in srgb,var(--yellow) 45%,transparent);background:color-mix(in srgb,var(--yellow) 10%,transparent)}
.b-local{color:var(--mu);   border-color:color-mix(in srgb,var(--mu) 30%,transparent);background:transparent}
.b-error{color:var(--red);  border-color:rgba(248,81,73,.4); background:rgba(248,81,73,.08)}
.plan-tag{font:11px var(--mono);color:var(--mu);padding:2px 6px;border:1px solid var(--bd);border-radius:4px}

/* arc */
.arc{position:relative;width:48px;height:48px;flex-shrink:0}
.arc svg{width:48px;height:48px}
.arc-bg{fill:none;stroke:var(--s2);stroke-width:5}
.arc-fill{fill:none;stroke-width:5;stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:center}
.arc-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font:700 11px/1 var(--mono);color:var(--tx)}

/* card body */
.card-body{padding:0 14px 4px 17px;flex:1}
.metric{margin-bottom:12px}
.mlabel{font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin-bottom:3px}
.prog-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.prog-val{font:12px var(--mono);color:var(--tx)}
.metric-detail{font:11px var(--mono);color:var(--mu);margin:0 0 5px;word-break:break-word}
.track{height:3px;background:var(--s2);border-radius:2px;overflow:hidden}
.bar{height:100%;border-radius:2px;width:0;transition:width .85s cubic-bezier(.4,0,.2,1)}
.resets{font:11px var(--mono);color:var(--mu);margin-top:3px}
.kv{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kv>.mlabel{flex-shrink:0}
.kv .pill{white-space:normal;text-align:right;border-radius:8px;min-width:0;overflow-wrap:anywhere}
.kv-val{font:12px var(--mono);color:var(--tx);text-align:right}
.pill{font:11px var(--mono);padding:2px 7px;border-radius:100px;border:1px solid var(--bd2);color:var(--tx)}
.pill-green{border-color:rgba(63,185,80,.5);color:var(--green);background:rgba(63,185,80,.08)}
.pill-red  {border-color:rgba(248,81,73,.5);color:var(--red);  background:rgba(248,81,73,.08)}
.pill-blue {border-color:rgba(88,166,255,.5);color:var(--blue); background:rgba(88,166,255,.08)}
.pill-yellow{border-color:rgba(227,179,65,.5);color:var(--yellow);background:rgba(227,179,65,.08)}
.pill-orange{border-color:rgba(240,136,62,.5);color:var(--orange);background:rgba(240,136,62,.08)}
.spark{margin-top:4px}
.spark-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.spark-title{font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.spark-readout{font:11px var(--mono);color:var(--tx);text-align:right}
.spark-bars{display:flex;align-items:flex-end;gap:2px;height:42px;padding:6px 0 3px;border-bottom:1px solid var(--bd)}
.spark-bar{flex:1;min-width:2px;max-width:12px;border-radius:2px 2px 0 0;background:var(--spark,var(--blue));opacity:.78}
.spark-note{font:10px var(--mono);color:var(--mu);margin-top:4px}

/* card pace */
.card-pace{margin:10px 0 4px;padding:9px 11px;background:var(--s1);border:1px solid var(--bd);border-radius:7px}
.pace-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.pace-lbl{font:10px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--mu)}
.pace-stage{font:700 10px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;
  padding:2px 8px;border-radius:100px;border:1px solid currentColor}
.pace-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.ps-lbl{font:10px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--mu);margin-bottom:1px}
.ps-val{font:12px var(--mono);color:var(--tx)}
.ps-val.pos{color:var(--green)}.ps-val.neg{color:var(--orange)}.ps-val.ok{color:var(--green)}.ps-val.no{color:var(--red)}

/* card footer */
.card-foot{display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px 10px 17px;border-top:1px solid var(--bd);margin-top:auto}
.foot-ts{font:11px var(--mono);color:var(--su)}
.slink{display:flex;align-items:center;gap:4px;font:11px var(--mono);color:var(--mu);text-decoration:none;transition:color .15s}
.slink:hover{color:var(--teal)}
.slink svg{width:10px;height:10px}

/* ── PROVIDER DETAIL ── */
.detail{max-width:none}

.detail-header{
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:20px 22px;background:var(--s0);border:1px solid var(--bd);
  border-radius:var(--r);margin-bottom:16px;
}
.dh-left{flex:1;min-width:0}
.dh-name{font-size:22px;font-weight:700;color:var(--tx);margin-bottom:8px}
.dh-tags{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.dh-right{text-align:right;flex-shrink:0;margin-left:20px}
.dh-pct{font:700 40px/1 var(--mono);color:var(--tx)}
.dh-pct-lbl{font:11px var(--mono);color:var(--mu);margin-top:4px;text-transform:uppercase;letter-spacing:.08em}

/* two-col split */
.detail-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:16px;align-items:start}
@media(max-width:700px){.detail-cols{grid-template-columns:1fr}}
.detail-cols.solo{grid-template-columns:minmax(0,1fr)}
.detail-cols.solo .dm-list{column-count:2;column-gap:44px}
.dm-list>*{break-inside:avoid}
@media(max-width:900px){.detail-cols.solo .dm-list{column-count:1}}

.detail-box{background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);padding:18px 20px}
.box-title{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;
  color:var(--mu);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.box-title::after{content:'';flex:1;height:1px;background:var(--bd)}

/* detail metrics */
.dmetric{margin-bottom:16px}
.dmetric:last-child{margin-bottom:0}
.dm-label{font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin-bottom:5px}
.dm-val{font:13px var(--mono);color:var(--tx);margin-bottom:6px}
.dm-detail{font:12px var(--mono);color:var(--mu);margin:0 0 6px;word-break:break-word}
.dm-track{height:5px;background:var(--s2);border-radius:3px;overflow:hidden;margin-bottom:4px}
.dm-bar{height:100%;border-radius:3px;width:0;transition:width .9s cubic-bezier(.4,0,.2,1)}
.dm-row{display:flex;align-items:center;justify-content:space-between}
.dm-pct{font:11px var(--mono);color:var(--mu)}
.dm-reset{font:11px var(--mono);color:var(--mu)}

/* pace detail */
.compare-bars{margin-bottom:14px}
.compare-row{display:grid;grid-template-columns:70px 1fr 44px;align-items:center;gap:8px;margin-bottom:6px}
.compare-lbl{font:11px var(--mono);color:var(--mu);text-align:right}
.compare-track{height:6px;background:var(--s2);border-radius:3px;overflow:hidden}
.compare-fill{height:100%;border-radius:3px;transition:width .9s cubic-bezier(.4,0,.2,1)}
.compare-pct{font:11px var(--mono);color:var(--tx)}

.pace-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--bd)}
.pstat{background:var(--s1);border-radius:7px;padding:10px 12px}
.pstat-label{font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin-bottom:4px}
.pstat-value{font:14px var(--mono);color:var(--tx)}
.pstat-value.pos{color:var(--green)}.pstat-value.neg{color:var(--orange)}
.pstat-value.ok{color:var(--green)}.pstat-value.no{color:var(--red)}
.pstat-value.big{font-size:20px}
.pace-stage-big{
  font:700 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;
  padding:4px 12px;border-radius:100px;border:1px solid currentColor;
  display:inline-block;margin-bottom:14px;
}

/* ── cost section ── */
.cost-box{background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);padding:20px;margin-bottom:16px}
.cost-stats{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--bd)}
.cstat{flex:1;min-width:120px}
.cstat-val{font:700 22px/1 var(--mono);color:var(--tx);margin-bottom:4px}
.cstat-lbl{font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}

/* chart */
.chart-wrap{position:relative;margin-bottom:20px}
.chart-svg{display:block;width:100%;overflow:visible}
.chart-loading{padding:32px;text-align:center;font:13px var(--mono);color:var(--mu)}
.chart-legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 10px 52px}
.legend-item{display:flex;align-items:center;gap:6px;font:11px var(--mono);color:var(--mu)}
.legend-dot{width:8px;height:8px;border-radius:3px;box-shadow:0 0 0 1px #ffffff12 inset}
.legend-val{font-weight:500;color:var(--tx);margin-left:2px}
.tl-chart,.cost-chart{font-family:var(--sans);font-variant-numeric:tabular-nums}
.tl-chart{cursor:crosshair}
.cost-col.hover rect:not(:first-child){filter:brightness(1.18)}
.tt-row i{font-style:normal;color:var(--su);margin-left:4px}

/* tooltip */
#tip{
  position:fixed;display:none;z-index:200;pointer-events:none;
  background:var(--s2);border:1px solid var(--bd);border-radius:7px;
  padding:8px 12px;min-width:140px;
  box-shadow:0 4px 16px rgba(0,0,0,.4);
}
.tt-date{font:600 12px var(--mono);color:var(--tx);margin-bottom:4px}
.tt-cost{font:700 16px/1 var(--mono);color:var(--bright);margin-bottom:4px}
.tt-meta{font:11px var(--mono);color:var(--mu)}

/* model table */
.model-table{width:100%;border-collapse:collapse;margin-top:4px}
.model-table th{font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu);
  padding:0 8px 8px;text-align:left;border-bottom:1px solid var(--bd)}
.model-table th:not(:first-child){text-align:right}
.model-table td{padding:8px;border-bottom:1px solid var(--bd);vertical-align:middle}
.model-table tr:last-child td{border-bottom:none}
.model-name{font:13px var(--mono);color:var(--tx)}
.model-cost{font:13px var(--mono);color:var(--tx);text-align:right}
.model-toks{font:12px var(--mono);color:var(--mu);text-align:right}
.share-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.share-bar{width:70px;height:4px;background:var(--s2);border-radius:2px;overflow:hidden;flex-shrink:0}
.share-bar div{height:100%;border-radius:2px;background:var(--blue)}
.share-pct{font:11px var(--mono);color:var(--mu);width:36px;text-align:right;flex-shrink:0}

.cost-models{margin-top:22px}
.cost-unavail{padding:40px;text-align:center;color:var(--mu);font:13px var(--mono)}
.cost-unavail strong{display:block;color:var(--tx);margin-bottom:6px;font-size:14px}

/* history */
.history-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-bottom:16px}
@media(max-width:900px){.history-grid{grid-template-columns:1fr}}
.history-box{background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);padding:20px;margin-bottom:16px}
.history-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.history-controls{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.history-controls .history-tabs{margin-bottom:0}
.history-tab{
  border:1px solid var(--bd2);background:var(--s1);color:var(--mu);
  border-radius:6px;padding:5px 9px;font:11px var(--mono);cursor:pointer
}
.history-tab.active{color:var(--hi);border-color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,transparent)}
.history-chart{min-height:230px}
.cost-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cost-head .box-title{margin-bottom:0;flex:1;min-width:180px}
.cost-range{display:flex;gap:6px;flex-wrap:wrap}
.cost-tab{border:1px solid var(--bd2);background:var(--s1);color:var(--mu);border-radius:6px;padding:5px 9px;font:11px var(--mono);cursor:pointer}
.cost-tab.active{color:var(--hi);border-color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,transparent)}
.series-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.series-row:last-child{border-bottom:none}
.series-left{display:flex;align-items:center;gap:8px;min-width:0}
.series-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.series-name{font:12px var(--mono);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.series-value{font:12px var(--mono);color:var(--mu);text-align:right}
.insight-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.insight{background:var(--s1);border:1px solid var(--bd);border-radius:7px;padding:11px 12px;min-width:0}
.insight-value{font:700 18px/1.1 var(--mono);color:var(--tx);margin-bottom:5px;overflow:hidden;text-overflow:ellipsis}
.insight-label{font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.stats-box{background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);padding:20px;margin-bottom:16px;overflow-x:auto}
.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media(max-width:1000px){.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.stats-grid{grid-template-columns:1fr}}
.stat-card{background:var(--s1);border:1px solid var(--bd);border-radius:7px;padding:11px 12px;min-width:0}
.stat-value{font:700 17px/1.1 var(--mono);color:var(--tx);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-label{font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.metric-table{width:100%;border-collapse:collapse}
.metric-table th{font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu);
  padding:0 8px 8px;text-align:left;border-bottom:1px solid var(--bd)}
.metric-table th:not(:first-child){text-align:right}
.metric-table td{padding:8px;border-bottom:1px solid var(--bd);font:12px var(--mono);color:var(--tx)}
.metric-table td:not(:first-child){text-align:right;color:var(--mu)}
.metric-table tr:last-child td{border-bottom:none}
.usage-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 14px}
.usage-tab{border:1px solid var(--bd2);background:var(--s1);color:var(--mu);border-radius:6px;padding:5px 9px;font:11px var(--mono);cursor:pointer}
.usage-tab.active{color:var(--hi);border-color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,transparent)}
.usage-panel{display:none}
.usage-panel.active{display:block}
.usage-split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px}
@media(max-width:900px){.usage-split{grid-template-columns:minmax(0,1fr)}}
.usage-table{width:100%;border-collapse:collapse;min-width:760px}
.usage-table th{font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mu);padding:0 8px 8px;text-align:left;border-bottom:1px solid var(--bd)}
.usage-table th:not(:first-child){text-align:right}
.usage-table td{padding:8px;border-bottom:1px solid var(--bd);font:12px var(--mono);color:var(--tx);vertical-align:middle}
.usage-table td:not(:first-child){text-align:right;color:var(--mu)}
.usage-table tr:last-child td{border-bottom:none}
.cal{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;row-gap:4px;font:10.5px var(--sans);color:var(--su)}
.cal-scroll{overflow-x:auto;scrollbar-width:thin}
.cal-scroll>.cal{display:inline-grid}
.cal{justify-content:start}
.cal-months{grid-column:2;display:grid;grid-template-columns:repeat(var(--weeks),14px);gap:4px;white-space:nowrap}
.cal-days{grid-column:1;grid-row:2;display:grid;grid-template-rows:repeat(7,14px);gap:4px;line-height:14px}
.cal-grid{grid-column:2;grid-row:2;display:grid;grid-template-columns:repeat(var(--weeks),14px);grid-template-rows:repeat(7,14px);gap:4px}
.cal-cell{display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--s2);box-shadow:inset 0 0 0 1px #ffffff08}
.cal-cell.l1{background:color-mix(in srgb,var(--blue) 30%,var(--s2))}
.cal-cell.l2{background:color-mix(in srgb,var(--blue) 55%,var(--s2))}
.cal-cell.l3{background:color-mix(in srgb,var(--blue) 80%,var(--s2))}
.cal-cell.l4{background:var(--bright)}
.cal-legend{display:flex;align-items:center;gap:4px;margin-top:8px;font:10.5px var(--sans);color:var(--su)}
.cal-legend .cal-cell{width:11px;height:11px}
.model-mix{display:flex;flex-direction:column;gap:9px}
.model-row{display:grid;grid-template-columns:minmax(130px,1fr) 78px 1.6fr 86px;gap:10px;align-items:center}
@media(max-width:640px){.model-row{grid-template-columns:minmax(0,1fr) 48px 64px;gap:8px}.model-row .model-bar{display:none}}
.model-label{font:12px var(--mono);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.model-bar{height:5px;background:var(--s2);border-radius:999px;overflow:hidden}
.model-bar div{height:100%;border-radius:999px;background:var(--blue)}
.small-note{font:11px var(--mono);color:var(--su);margin-top:10px}
.trends-controls{display:flex;gap:14px;flex-wrap:wrap;align-items:end;margin:18px 0}
.trends-controls label{display:flex;flex-direction:column;gap:6px;font:12px var(--sans);color:var(--mu)}
.trends-controls select,.trends-controls input,.trends-export{background:var(--s1);color:var(--tx);border:1px solid var(--bd2);border-radius:6px;padding:9px;font:12px var(--sans);min-height:36px;color-scheme:dark}
.trends-export{cursor:pointer;margin-left:auto}
.trends-export:disabled{opacity:.5;cursor:default}
.trends-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
.trends-kpis .insight-value{margin-bottom:8px}
.trends-change{font:11px var(--mono);color:var(--mu);margin-top:9px;line-height:1.5}
.trends-sub{color:var(--mu);font:12px/1.7 var(--sans)}
.trends-table-wrap{overflow-x:auto}
.trends-chart{margin-top:16px}
.trends-chart svg{display:block;width:100%;min-height:180px;max-height:320px}
.trends-chart rect:hover{opacity:.7}
.trends-empty{padding:36px 16px;text-align:center;color:var(--mu);line-height:1.8}
@media(max-width:720px){.trends-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.trends-controls label{flex:1;min-width:120px}.trends-export{margin-left:0}.trends-chart{overflow-x:auto}.trends-chart svg{min-width:560px}}
/* ── usage (history) page ── */
.u-page{background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);padding:20px 26px 26px;font-variant-numeric:tabular-nums}
.u-toolbar{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.u-field{display:flex;flex-direction:column;gap:5px;font:11px var(--sans);color:var(--su)}
.u-field select,.u-field input{height:34px;background:var(--s1);color:var(--tx);border:1px solid var(--bd2);border-radius:7px;padding:0 9px;font:12px var(--sans);color-scheme:dark;cursor:pointer}
.u-field select:hover,.u-field input:hover{border-color:var(--blue)}
.u-seg{display:inline-flex;gap:2px;padding:3px;background:var(--s2);border:1px solid var(--bd);border-radius:9px}
.u-seg-btn{border:0;background:transparent;color:var(--mu);font:500 12px var(--sans);padding:5px 11px;border-radius:6px;cursor:pointer;transition:background .15s,color .15s}
.u-seg-btn:hover{color:var(--tx)}
.u-seg-btn.active{background:var(--s3);color:var(--hi);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.u-export{margin-left:auto}
.u-export:disabled{opacity:.45;cursor:default}
.u-range{font:12px var(--sans);color:var(--su);margin:14px 0 6px}
.u-hero{display:grid;grid-template-columns:minmax(260px,.62fr) minmax(0,1.38fr);gap:36px;margin:22px 0 10px;align-items:start}
@media(max-width:980px){.u-hero{grid-template-columns:minmax(0,1fr);gap:22px}}
.u-big{font:650 46px/1.05 var(--sans);letter-spacing:-.02em;color:var(--hi)}
.u-bigsub{font:13px var(--sans);color:var(--mu);margin-top:6px}
.u-plist{display:flex;flex-direction:column;gap:16px;margin-top:26px}
.u-prow{display:grid;grid-template-columns:auto auto minmax(0,auto) 1fr auto;align-items:center;column-gap:8px}
.u-prow .provider-icon{width:18px;height:18px;margin:0}
.u-dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.u-pname{font:500 15px var(--sans);color:var(--hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-pdays{font:12px var(--sans);color:var(--su);white-space:nowrap}
.u-pval{font:500 15px var(--sans);color:var(--hi);text-align:right;white-space:nowrap}
.u-psub{grid-column:1/-1;font:12.5px var(--sans);color:var(--mu);margin-top:3px}
.u-chartcard{min-width:0}
.u-charthead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.u-h{font:600 15px var(--sans);color:var(--hi)}
.u-chart svg{display:block;width:100%;height:auto;overflow:visible;font-family:var(--sans);cursor:crosshair}
.u-section{margin-top:30px}
.u-sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.u-totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:14px 22px;margin-top:14px}
.u-tlabel{font:12.5px var(--sans);color:var(--mu)}
.u-tvalue{font:500 20px/1.3 var(--sans);color:var(--hi);margin-top:3px}
.u-tnote{font:11.5px var(--sans);color:var(--su);margin-top:1px}
.u-table{width:100%;border-collapse:collapse;font:13.5px var(--sans)}
.u-table th{font:500 12px var(--sans);color:var(--su);text-align:right;padding:0 10px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
.u-table th:first-child,.u-table td:first-child{text-align:left;padding-left:0}
.u-table th:last-child,.u-table td:last-child{padding-right:0}
.u-table td{padding:11px 10px;border-bottom:1px solid var(--bd);color:var(--tx);text-align:right;white-space:nowrap}
.u-table tbody tr{transition:background .12s}
.u-table tbody tr:hover{background:color-mix(in srgb,var(--s3) 40%,transparent)}
.u-table tr:last-child td{border-bottom:none}
.u-cell-name{display:inline-flex;align-items:center;gap:8px;color:var(--hi)}
.u-cell-name .provider-icon{width:16px;height:16px;margin:0}
.u-strong{color:var(--hi)!important;font-weight:500}
.u-muted,.u-norecord td{color:var(--su)!important}
.u-more{margin-top:12px}
.u-sel{color:var(--bright);font-size:9px;vertical-align:1px}
.u-asof{font-size:11px;color:var(--su)}
.u-table.u-sources td:nth-child(2),.u-table.u-sources th:nth-child(2){text-align:left}
.tt-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:7px;font:12px var(--sans);color:var(--mu);margin:3px 0}
.tt-row b{font-weight:500;color:var(--tx);font-variant-numeric:tabular-nums}
@media(max-width:640px){.u-page{padding:16px}.u-big{font-size:36px}.u-export{margin-left:0}.u-seg{flex-wrap:wrap}.u-chart{overflow-x:auto;margin:0 -16px;padding:0 16px}.u-chart svg{min-width:620px}.u-totals{grid-template-columns:repeat(2,minmax(0,1fr))}.u-tvalue{font-size:18px}}
/* provider detail: same type scale as the History page */
.detail .box-title{font:600 15px var(--sans);text-transform:none;letter-spacing:0;color:var(--hi)}
.detail .box-title::after{background:transparent}
.cstat-val,.insight-value,.stat-value{font:500 22px/1.25 var(--sans);font-variant-numeric:tabular-nums;color:var(--hi)}
.cstat-lbl,.insight-label,.stat-label{font:12.5px var(--sans);text-transform:none;letter-spacing:0;color:var(--mu)}
.insight,.stat-card{background:transparent;border:0;border-top:1px solid var(--bd);border-radius:0;padding:10px 0 4px}
.insight-grid{column-gap:22px}
.series-name,.series-value{font:13px var(--sans);font-variant-numeric:tabular-nums}
.detail .trends-sub{font-size:12.5px;color:var(--su)}
.provider-icon{width:22px;height:22px;object-fit:contain;flex:none;vertical-align:middle;margin-right:8px}
.tab .provider-icon{width:18px;height:18px;margin-right:0}
.card-name,.dh-name{display:flex;align-items:center;min-width:0;overflow-wrap:anywhere}
.quota-display{height:32px;max-width:130px;padding:0 8px;background:var(--s1);color:var(--tx);border:1px solid var(--bd2);border-radius:6px;font:12px var(--mono);cursor:pointer;color-scheme:dark}
.quota-display:hover{border-color:var(--blue)}
</style>
</head>
<body>
<div id="tip"></div>
<div class="shell">

  <header>
    <div class="hstart">
      <div class="mark">AI</div>
      <span class="appname">Usage</span>
    </div>
    <nav id="tabs" class="tab-bar">
      <button class="tab active" data-tab="overview" onclick="switchTab('overview')">Overview</button>
      <button class="tab" data-tab="history" onclick="switchTab('history')">History</button>
    </nav>
    <div class="hend">
      <select id="quota-display" class="quota-display" aria-label="Quota display"><option value="used">Used</option><option value="remaining">Remaining</option></select>
      <div id="conn" class="conn"><span class="cdot"></span><span id="connTxt">connecting</span></div>
      <span id="ago" class="ago"></span>
      <button id="rbtn" class="rbtn" title="Refresh" onclick="doRefresh()">
        <svg class="ring-svg" viewBox="0 0 28 28">
          <circle id="ring" class="ring-t" cx="14" cy="14" r="11"/>
        </svg>
        <svg viewBox="0 0 16 16" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13.5 6A6 6 0 1 0 14 10"/><polyline points="14,2 14,6 10,6"/>
        </svg>
      </button>
    </div>
  </header>

  <div id="offline" class="offline-wrap">
    <div class="oicon">⚡</div>
    <div class="otitle">Daemon offline</div>
    <div class="osub">Start the AI usage daemon to see live data.</div>
    <code class="ocmd">ai-usage-daemon</code>
  </div>

  <div class="panels">
    <div id="panel-overview" class="panel active">
      <div id="overviewSummary" class="overview-summary"></div>
      <div id="overviewControls" class="overview-controls"></div>
      <div id="prefs-notice" class="prefs-notice" role="status"></div>
      <input hidden type="file" id="prefs-file" accept="application/json,.json">
      <div id="grid" class="grid">
        <div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div>
      </div>
    </div>
    <div id="panel-history" class="panel"></div>
  </div>

</div>
<script src="/dashboard/trends.js"></script>
<script>
// ── state ─────────────────────────────────────────────────────────────────────
const S = {
  snapshots:[],
  providers:[],
  dailyRows:[],
  dailyError:false,
  costs:{},
  histories:{},
  active:'overview',
  loadedAt:null,
  online:false,
  prefs:loadPrefs()
};
const quotaDisplay = document.getElementById('quota-display');
quotaDisplay.value = S.prefs.quotaDisplay === 'remaining' ? 'remaining' : 'used';
quotaDisplay.onchange = () => { S.prefs.quotaDisplay = quotaDisplay.value; savePrefs(); renderOverview(); if(!['overview','history'].includes(S.active)) renderProvider(S.active); };
function displayPct(used){return S.prefs.quotaDisplay === 'remaining' ? Math.max(0,100-used) : used;}
function providerIcon(id){
  return S.providers.find(p=>p.id===id)?.icon ? `<img class="provider-icon" alt="" src="/v1/icons/${encodeURIComponent(id)}" onerror="this.remove()">` : '';
}

// ── countdown ring ────────────────────────────────────────────────────────────
const INTERVAL = 30;
const Rr = 11, Rc = +(2*Math.PI*Rr).toFixed(3);
const ringEl = document.getElementById('ring');
ringEl.style.strokeDasharray = Rc;
let tick = INTERVAL, tickTimer = null, busy = false;
function setRing(s){ ringEl.style.strokeDashoffset = (Rc*(1-s/INTERVAL)).toFixed(3); }
function startTick(){ clearInterval(tickTimer); tick=INTERVAL; setRing(INTERVAL);
  tickTimer = setInterval(()=>{ tick--; setRing(tick); if(tick<=0) load(); },1000); }
function updAgo(){ const el=document.getElementById('ago');
  if(!S.loadedAt){el.textContent='';return;}
  const s=Math.round((Date.now()-S.loadedAt)/1000);
  el.textContent=s<5?'updated now':s<60?`${s}s ago`:`${Math.round(s/60)}m ago`; }
setInterval(updAgo,5000);

// ── network ───────────────────────────────────────────────────────────────────
async function load(){
  clearInterval(tickTimer);
  try {
    const [usage,providers,daily] = await Promise.all([
      fetch('/v1/usage').then(r=>r.json()),
      fetch('/v1/providers').then(r=>r.json()),
      fetch('/v1/history/daily').then(r=>r.ok?r.json():null).catch(()=>null),
    ]);
    S.snapshots = usage;
    S.providers = providers.filter(p=>p.enabled);
    S.dailyRows = normalizeDailyRows(daily);
    S.dailyError = !daily || !!daily.error || !(Array.isArray(daily) || Array.isArray(daily.daily));
    S.histories = {};
    S.costs = {};
    S.online = true; S.loadedAt = Date.now(); updAgo();
    setOnline(true);
    buildTabs();
    applyTabVisibility();
    renderActive();
  } catch {
    S.online = false; setOnline(false); renderActive();
  }
  startTick();
}

async function doRefresh(){
  if(busy) return; busy=true;
  document.getElementById('rbtn').classList.add('spin');
  try{
    await fetch('/v1/refresh',{method:'POST'}).catch(()=>{});
    await new Promise(r=>setTimeout(r,600));
    await load();
  }finally{ busy=false; document.getElementById('rbtn').classList.remove('spin'); }
}

async function fetchCost(id){
  if(id in S.costs) return S.costs[id];
  try{ S.costs[id]=await fetch(`/v1/cost/${id}`).then(r=>r.json()); }
  catch{ S.costs[id]=null; }
  return S.costs[id];
}

async function fetchHistory(id){
  if(id in S.histories) return S.histories[id];
  const since = dateKey(new Date(todayUtcDate().getTime()-29*86400000));
  try{ S.histories[id]=await fetch(`/v1/history/${encodeURIComponent(id)}?since=${since}&group=hour&view=chart`).then(r=>r.ok?r.json():[]); }
  catch{ S.histories[id]=[]; }
  return S.histories[id];
}

async function fetchCcusageReports(id){
  const reports = ['daily','weekly','monthly'];
  const out = {};
  await Promise.all(reports.map(async report=>{
    try{ out[report]=await fetch(`/v1/local-usage/${id}/${report}`).then(r=>r.json()); }
    catch{ out[report]={ error:{ code:'FETCH_FAILED' } }; }
  }));
  return out;
}

// ── ui state ──────────────────────────────────────────────────────────────────
function setOnline(on){
  const el=document.getElementById('conn');
  el.className='conn '+(on?'online':'offline');
  document.getElementById('connTxt').textContent=on?'live':'offline';
  document.getElementById('offline').classList.toggle('show',!on);
}

function switchTab(id){
  S.active=id;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===id));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===`panel-${id}`));
  applyTabVisibility();
  renderActive();
}

function renderActive(){
  if(S.active==='overview') renderOverview();
  else if(S.active==='history') renderTrends();
  else renderProvider(S.active);
}

function orderedSnapshots(){
  const byId = new Map(S.snapshots.map(s=>[s.providerId,s]));
  const ordered = [];
  for(const p of S.providers){
    const snap = byId.get(p.id);
    if(snap) ordered.push(snap);
  }
  const seen = new Set(ordered.map(s=>s.providerId));
  for(const snap of S.snapshots){
    if(!seen.has(snap.providerId)) ordered.push(snap);
  }
  return ordered;
}

// ── tabs ──────────────────────────────────────────────────────────────────────
function buildTabs(){
  const bar = document.getElementById('tabs');
  const existing = new Set([...bar.querySelectorAll('.tab')].map(t=>t.dataset.tab));

  // overview
  if(!existing.has('overview')){
    const b=document.createElement('button');
    b.className='tab'+(S.active==='overview'?' active':'');
    b.dataset.tab='overview'; b.onclick=()=>switchTab('overview');
    b.textContent='Overview'; bar.prepend(b);
  }

  // per-provider tabs
  for(const p of S.providers){
    if(existing.has(p.id)) continue;
    const snap = S.snapshots.find(s=>s.providerId===p.id);
    const accent = snap?.pace ? paceColor(snap.pace.stage) : '#484f58';
    const b=document.createElement('button');
    b.className='tab'+(S.active===p.id?' active':'');
    b.dataset.tab=p.id; b.onclick=()=>switchTab(p.id);
    b.innerHTML=`${providerIcon(p.id)}<span class="tab-dot" style="background:${accent}"></span>${esc(p.name)}`;
    bar.appendChild(b);

    // ensure panel exists
    if(!document.getElementById(`panel-${p.id}`)){
      const div=document.createElement('div');
      div.id=`panel-${p.id}`; div.className='panel';
      document.querySelector('.panels').appendChild(div);
    }
  }
}

// ── overview ─────────────────────────────────────────────────────────────────
function renderOverview(){
  const grid=document.getElementById('grid');
  renderOverviewSummary();
  renderOverviewControls();
  if(!S.snapshots.length){grid.innerHTML='';return;}
  const overview = overviewSnapshots();
  if(!overview.length){
    grid.innerHTML=`<div class="empty-state" style="grid-column:1/-1">No providers match the current view</div>`;
    return;
  }
  let html='';
  overview.forEach((s,i)=>{
    const isErr=snapshotHasError(s);
    const pace=s.pace;
    const primM=s.metrics?.find(m=>m.type==='progress'&&m.format?.kind==='percent'&&m.limit>0);
    const primP=primM?pct(primM):null;
    const accent=pace?paceColor(pace.stage):primP!=null?barCol(primP):'#484f58';
    const roll = providerWindowTotals(s.providerId, 30);
    html+=`<div class="card${isErr?' is-error':''}" style="--accent:${accent}">`;
    html+=`<div class="card-head"><div class="card-meta">`;
    html+=`<div class="card-name">${providerIcon(s.providerId)}${esc(s.displayName||s.providerId)}</div>`;
    html+=`<div class="card-tags">`;
    if(s.source) html+=`<span class="badge b-${s.source||'local'}">${esc(s.source)}</span>`;
    if(s.plan)   html+=`<span class="plan-tag">${esc(s.plan)}</span>`;
    html+=`</div></div>`;
    if(primP!=null) html+=arcSvg(displayPct(primP),barCol(primP));
    html+=`</div><div class="card-body">`;
    for(const m of (s.metrics||[])){
      if(m.type==='progress'){
        const p=pct(m),col=barCol(p);
        html+=`<div class="metric"><div class="mlabel">${esc(m.label)}</div>`;
        html+=`<div class="prog-row"><span class="prog-val">${fmtMetric(m)}</span></div>`;
        if(m.detail) html+=`<div class="metric-detail">${esc(m.detail)}</div>`;
        html+=`<div class="track"><div class="bar" style="background:${col}" data-w="${displayPct(p).toFixed(2)}%"></div></div>`;
        if(m.resetsAt) html+=`<div class="resets">${fmtReset(m.resetsAt)}</div>`;
        html+=`</div>`;
      } else if(m.type==='text'){
        html+=`<div class="metric"><div class="kv"><span class="mlabel" style="margin:0">${esc(m.label)}</span><span class="kv-val">${esc(m.value||'')}</span></div></div>`;
      } else if(m.type==='badge'){
        html+=`<div class="metric"><div class="kv"><span class="mlabel" style="margin:0">${esc(m.label)}</span><span class="${pillCls(m.color)}">${esc(m.text||'')}</span></div></div>`;
      } else if(m.type==='barChart'){
        html+=barChartMetricHtml(m,true);
      }
    }
    if(roll.totalTokens>0 || roll.cost>0){
      html+=`<div class="metric"><div class="kv"><span class="mlabel" style="margin:0">30d tracked</span><span class="kv-val">${recordedCost(roll)} · ${recordedTokens(roll)} tokens</span></div></div>`;
    }
    if(pace){
      const pc=paceColor(pace.stage);
      const dCls=pace.deltaPercent>0.5?'pos':pace.deltaPercent<-0.5?'neg':'';
      html+=`<div class="card-pace">`;
      html+=`<div class="pace-top"><span class="pace-lbl">Pace</span>`;
      html+=`<span class="pace-stage" style="color:${pc};border-color:${pc}55">${stageLbl(pace.stage)}</span></div>`;
      html+=`<div class="pace-grid">`;
      html+=`<div><div class="ps-lbl">vs schedule</div><div class="ps-val ${dCls}">${fmtDelta(pace.deltaPercent)}</div></div>`;
      html+=`<div><div class="ps-lbl">ETA</div><div class="ps-val">${fmtEta(pace.etaSeconds,pace.stage)}</div></div>`;
      html+=`<div><div class="ps-lbl">expected</div><div class="ps-val">${pace.expectedUsedPercent.toFixed(1)}%</div></div>`;
      html+=`<div><div class="ps-lbl">lasts</div><div class="ps-val ${pace.willLastToReset?'ok':'no'}">${pace.willLastToReset?'Yes':'No'}</div></div>`;
      html+=`</div></div>`;
    }
    html+=`</div>`;
    html+=`<div class="card-foot"><span class="foot-ts">${fmtAgo(s.fetchedAt)}</span>`;
    if(s.statusPageUrl) html+=`<a class="slink" href="${esc(s.statusPageUrl)}" target="_blank" rel="noreferrer"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="5" cy="5" r="3.5"/><circle cx="5" cy="5" r="1.2"/></svg>status</a>`;
    html+=`</div></div>`;
  });
  grid.innerHTML=html;
  animateBarsAndArcs(grid);
}

function renderOverviewControls(){
  const el = document.getElementById('overviewControls');
  if(!el) return;
  const all = visibleSnapshots();
  const shown = overviewSnapshots();
  const inactive = orderedSnapshots().filter(isInactiveProvider);
  el.innerHTML = `<div class="ctrl-group">
    <input id="overviewSearch" class="ctrl-input" type="search" value="${esc(S.prefs.search||'')}" placeholder="Search providers">
    <select id="overviewStatus" class="ctrl-select" aria-label="Status filter">
      ${selectOption('all','All providers',S.prefs.status)}
      ${selectOption('live','Live only',S.prefs.status)}
      ${selectOption('attention','Needs attention',S.prefs.status)}
      ${selectOption('near','Near limit',S.prefs.status)}
      ${selectOption('tracked','Tracked usage',S.prefs.status)}
    </select>
    <select id="overviewSort" class="ctrl-select" aria-label="Sort providers">
      ${selectOption('order','Configured order',S.prefs.sort)}
      ${selectOption('pressure','Quota pressure',S.prefs.sort)}
      ${selectOption('cost30','30d cost',S.prefs.sort)}
      ${selectOption('tokens30','30d tokens',S.prefs.sort)}
      ${selectOption('recent','Last updated',S.prefs.sort)}
      ${selectOption('name','Name',S.prefs.sort)}
    </select>
    <span class="result-count">${shown.length}/${all.length}</span>
    ${inactive.length?`<button class="action-btn" type="button" id="toggleInactive" aria-pressed="${showInactive()}" title="${esc(inactive.map(s=>s.displayName||s.providerId).join(', '))}">${showInactive()?'Hide':'Show'} inactive (${inactive.length})</button>`:''}
  </div>
  <div class="ctrl-group">
    <button class="action-btn" type="button" id="exportDaily">
      <svg viewBox="0 0 16 16"><path d="M8 2v7"/><path d="M5 6l3 3 3-3"/><path d="M3 13h10"/></svg>Daily CSV
    </button>
    <button class="action-btn" type="button" id="exportQuota">
      <svg viewBox="0 0 16 16"><path d="M8 2v7"/><path d="M5 6l3 3 3-3"/><path d="M3 13h10"/></svg>Quota CSV
    </button>
    <button class="action-btn" type="button" id="exportJson">
      <svg viewBox="0 0 16 16"><path d="M8 2v7"/><path d="M5 6l3 3 3-3"/><path d="M3 13h10"/></svg>JSON
    </button>
    <span class="ctrl-sep" aria-hidden="true"></span>
    <button class="action-btn" type="button" id="exportPrefs" title="Export dashboard preferences">
      <svg viewBox="0 0 16 16"><path d="M8 2v7"/><path d="M5 6l3 3 3-3"/><path d="M3 13h10"/></svg>Prefs
    </button>
    <button class="action-btn" type="button" id="importPrefs" title="Import dashboard preferences">
      <svg viewBox="0 0 16 16"><path d="M8 10V3"/><path d="M5 6l3-3 3 3"/><path d="M3 13h10"/></svg>Import
    </button>
  </div>`;

  const update = ()=>{
    const activeId = document.activeElement?.id || '';
    const searchEl = document.getElementById('overviewSearch');
    const searchPos = searchEl?.selectionStart ?? null;
    S.prefs.search = searchEl?.value || '';
    S.prefs.status = document.getElementById('overviewStatus')?.value || 'all';
    S.prefs.sort = document.getElementById('overviewSort')?.value || 'order';
    savePrefs();
    renderOverview();
    if(activeId === 'overviewSearch'){
      const next = document.getElementById('overviewSearch');
      next?.focus();
      if(searchPos != null) next?.setSelectionRange(searchPos, searchPos);
    }
  };
  el.querySelector('#overviewSearch')?.addEventListener('input', debounce(update, 120));
  el.querySelector('#overviewStatus')?.addEventListener('change', update);
  el.querySelector('#overviewSort')?.addEventListener('change', update);
  el.querySelector('#toggleInactive')?.addEventListener('click', ()=>{ S.prefs.inactive = showInactive() ? 'hide' : 'show'; savePrefs(); applyTabVisibility(); renderOverview(); });
  el.querySelector('#exportDaily')?.addEventListener('click', exportDailyCsv);
  el.querySelector('#exportQuota')?.addEventListener('click', exportQuotaCsv);
  el.querySelector('#exportJson')?.addEventListener('click', exportDashboardJson);
  el.querySelector('#exportPrefs')?.addEventListener('click', exportPreferences);
  el.querySelector('#importPrefs')?.addEventListener('click', ()=>document.getElementById('prefs-file').click());
}

function selectOption(value,label,current){
  return `<option value="${esc(value)}"${(current||'all')===value?' selected':''}>${esc(label)}</option>`;
}

function overviewSnapshots(){
  const ordered = visibleSnapshots();
  const query = String(S.prefs.search||'').trim().toLowerCase();
  const status = S.prefs.status || 'all';
  const filtered = ordered.filter(s=>{
    if(query){
      const hay = [s.providerId, s.displayName, s.plan, s.source, ...(s.metrics||[]).map(m=>m.label)].join(' ').toLowerCase();
      if(!hay.includes(query)) return false;
    }
    const prim = primaryPercentOf(s);
    const roll = providerWindowTotals(s.providerId, 30);
    if(status==='live' && snapshotHasError(s)) return false;
    if(status==='attention' && !snapshotHasError(s)) return false;
    if(status==='near' && !(prim!=null && prim>=80)) return false;
    if(status==='tracked' && !(roll.totalTokens>0 || roll.cost>0)) return false;
    return true;
  });
  const index = new Map(ordered.map((s,i)=>[s.providerId,i]));
  const sorted = filtered.slice();
  const sort = S.prefs.sort || 'order';
  sorted.sort((a,b)=>{
    if(sort==='name') return String(a.displayName||a.providerId).localeCompare(String(b.displayName||b.providerId));
    if(sort==='recent') return (+new Date(b.fetchedAt||0)) - (+new Date(a.fetchedAt||0));
    if(sort==='pressure') return (primaryPercentOf(b)||0) - (primaryPercentOf(a)||0);
    if(sort==='cost30') return providerWindowTotals(b.providerId,30).cost - providerWindowTotals(a.providerId,30).cost;
    if(sort==='tokens30') return providerWindowTotals(b.providerId,30).totalTokens - providerWindowTotals(a.providerId,30).totalTokens;
    return (index.get(a.providerId)||0) - (index.get(b.providerId)||0);
  });
  return sorted;
}

// A provider is inactive when it is failing and has nothing to show: no quota
// lines and no tracked usage in the last 30 days (e.g. an expired login).
// Inactive providers are hidden unless the user chooses to show them.
function isInactiveProvider(s){
  if(!snapshotHasError(s)) return false;
  if((s.metrics||[]).some(m=>m.type==='progress')) return false;
  const roll = providerWindowTotals(s.providerId, 30);
  return !(roll.totalTokens>0 || roll.cost>0);
}
function showInactive(){ return S.prefs.inactive==='show'; }
function visibleSnapshots(){ return orderedSnapshots().filter(s=>showInactive() || !isInactiveProvider(s)); }
function hiddenInactive(){ return showInactive() ? [] : orderedSnapshots().filter(isInactiveProvider); }
function applyTabVisibility(){
  const hidden = new Set(hiddenInactive().map(s=>s.providerId));
  document.querySelectorAll?.('#tabs .tab').forEach(t=>{ t.hidden = hidden.has(t.dataset.tab) && S.active!==t.dataset.tab; });
}

// Plugins report failures either as source 'error' or as an "Error" badge.
function snapshotHasError(s){
  return s.source==='error' || (s.metrics||[]).some(m=>m.type==='badge' && /^error$/i.test(String(m.label||'').trim()));
}

function primaryPercentOf(s){
  const m = (s.metrics||[]).find(row=>row.type==='progress' && row.format?.kind==='percent' && row.limit>0);
  return m ? pct(m) : null;
}

function renderOverviewSummary(){
  const el = document.getElementById('overviewSummary');
  if(!el) return;
  const snaps = visibleSnapshots(), hidden = hiddenInactive();
  if(!snaps.length){ el.innerHTML=''; return; }

  const progressRows = snaps.flatMap(s=>(s.metrics||[])
    .filter(m=>m.type==='progress' && m.format?.kind==='percent' && m.limit>0)
    .map(m=>({ snap:s, metric:m, percent:pct(m) })));
  const primaryRows = snaps.map(s=>{
    const m = (s.metrics||[]).find(row=>row.type==='progress' && row.format?.kind==='percent' && row.limit>0);
    return m ? { snap:s, metric:m, percent:pct(m) } : null;
  }).filter(Boolean);
  const pressure = primaryRows.slice().sort((a,b)=>b.percent-a.percent);
  const highest = pressure[0];
  const avg = primaryRows.length ? primaryRows.reduce((acc,row)=>acc+row.percent,0)/primaryRows.length : null;
  const nearLimit = progressRows.filter(row=>row.percent>=80).length;
  const live = snaps.filter(s=>!snapshotHasError(s)).length;
  const errorCount = snaps.length - live;
  const withPace = snaps.filter(s=>s.pace).length;
  const resets = progressRows
    .filter(row=>row.metric.resetsAt)
    .sort((a,b)=>new Date(a.metric.resetsAt)-new Date(b.metric.resetsAt));
  const nextReset = resets[0];
  const updated = snaps.map(s=>+new Date(s.fetchedAt||0)).filter(Boolean).sort((a,b)=>b-a)[0];
  const riskyPace = snaps
    .filter(s=>s.pace && (!s.pace.willLastToReset || /over$/.test(String(s.pace.stage||''))))
    .sort((a,b)=>(b.pace?.deltaPercent||0)-(a.pace?.deltaPercent||0));
  const alerts = [];
  if(riskyPace.length){
    const s = riskyPace[0], p = s.pace;
    alerts.push({
      level:'pace',
      color:paceColor(p.stage),
      text:`${s.displayName||s.providerId} is ${stageLbl(p.stage)}`,
      sub:`${fmtDelta(p.deltaPercent)} - ETA ${fmtEta(p.etaSeconds,p.stage)}`
    });
  }
  if(highest && highest.percent >= 80){
    alerts.push({
      level:highest.percent >= 95 ? 'limit' : 'watch',
      color:barCol(highest.percent),
      text:`${highest.snap.displayName||highest.snap.providerId} has the tightest quota`,
      sub:`${highest.metric.label}: ${highest.percent.toFixed(1)}% used`
    });
  }
  if(nextReset){
    alerts.push({
      level:'reset',
      color:'#7289da',
      text:`Next reset: ${nextReset.snap.displayName||nextReset.snap.providerId}`,
      sub:`${nextReset.metric.label} ${fmtReset(nextReset.metric.resetsAt)}`
    });
  }
  if(errorCount > 0){
    alerts.push({
      level:'auth',
      color:'#d25050',
      text:`${errorCount} provider${errorCount===1?' needs':'s need'} attention`,
      sub:'Open the provider tab for setup or login details'
    });
  }
  if(hidden.length){
    alerts.push({
      level:'hidden',
      color:'#8e9297',
      text:`${hidden.length} inactive provider${hidden.length===1?'':'s'} hidden`,
      sub:`${hidden.map(s=>s.displayName||s.providerId).join(', ')} · use Show inactive to display`
    });
  }

  let html = `<div class="overview-panel">`;
  html+=`<div class="overview-title">Provider Health</div>`;
  html+=`<div class="overview-sub">${esc(snaps.length)} providers · ${esc(progressRows.length)} quota lines · ${esc(withPace)} paced</div>`;
  html+=`<div class="kpi-grid">`;
  html+=overviewKpi(`${live}/${snaps.length}`, 'live');
  html+=overviewKpi(highest ? `${highest.percent.toFixed(0)}%` : '-', 'highest');
  html+=overviewKpi(avg == null ? '-' : `${avg.toFixed(1)}%`, 'avg usage');
  html+=overviewKpi(String(nearLimit), 'near limit');
  html+=`</div>`;
  if(alerts.length){
    html+=`<div class="alert-list">`;
    for(const row of alerts.slice(0,4)) html+=overviewAlert(row);
    html+=`</div>`;
  }
  html+=`</div>`;

  html+=`<div class="overview-panel">`;
  html+=`<div class="overview-title">Quota Pressure</div>`;
  html+=`<div class="overview-sub">${nextReset ? esc(fmtReset(nextReset.metric.resetsAt)) : 'no reset window'} · ${updated ? esc(fmtAgo(new Date(updated).toISOString())) : 'not updated'}</div>`;
  html+=`<div class="pressure-list">`;
  for(const row of pressure.slice(0,5)){
    const name = row.snap.displayName || row.snap.providerId;
    const col = row.snap.pace ? paceColor(row.snap.pace.stage) : barCol(row.percent);
    html+=`<div class="pressure-row">`;
    html+=`<div class="pressure-name">${esc(name)}</div>`;
    html+=`<div class="pressure-value">${row.percent.toFixed(1)}%</div>`;
    html+=`<div class="pressure-track"><div class="pressure-fill" style="width:${row.percent.toFixed(2)}%;background:${col}"></div></div>`;
    html+=`</div>`;
  }
  if(!pressure.length) html+=`<div class="cost-unavail" style="padding:18px">No quota data reported</div>`;
  html+=`</div></div>`;

  const r7 = dailyWindowTotals(S.dailyRows, 7);
  const p7 = dailyWindowTotals(S.dailyRows, 7, 7);
  const r30 = dailyWindowTotals(S.dailyRows, 30);
  const p30 = dailyWindowTotals(S.dailyRows, 30, 30);
  const trend = aggregateDailyTrend(S.dailyRows, 14);
  const top = topDailyContributors(S.dailyRows, 30, 5);
  html+=`<div class="overview-panel">`;
  html+=`<div class="overview-title">Spend & Tokens</div>`;
  html+=`<div class="overview-sub">${S.dailyRows.length ? `${esc(S.dailyRows.length)} saved daily rows` : 'no saved daily history'}</div>`;
  html+=`<div class="rollup-grid">`;
  html+=rollupCard(r7.rows?recordedCost(r7):'—','7d spend',r7.costKnown&&p7.costKnown?deltaBadge(deltaPercent(r7.cost,p7.cost)):'');
  html+=rollupCard(fmtTok(r7.totalTokens),'7d tokens',deltaBadge(deltaPercent(r7.totalTokens,p7.totalTokens)));
  html+=rollupCard(r30.rows?recordedCost(r30):'—','30d spend',r30.costKnown&&p30.costKnown?deltaBadge(deltaPercent(r30.cost,p30.cost)):'');
  html+=rollupCard(fmtTok(r30.totalTokens),'30d tokens',deltaBadge(deltaPercent(r30.totalTokens,p30.totalTokens)));
  html+=`</div>`;
  html+=overviewTrendHtml(trend);
  html+=topContributorsHtml(top, r30);
  html+=`</div>`;

  el.innerHTML = html;
}

function overviewKpi(value,label){
  return `<div class="kpi"><div class="kpi-value">${esc(value)}</div><div class="kpi-label">${esc(label)}</div></div>`;
}
function rollupCard(value,label,delta){
  return `<div class="rollup-card"><div class="rollup-value">${esc(value)}${delta||''}</div><div class="rollup-label">${esc(label)}</div></div>`;
}
function overviewAlert(row){
  return `<div class="alert-row" style="--alert:${esc(row.color||'#7289da')}"><div class="alert-mark">${esc(row.level||'info')}</div><div class="alert-text">${esc(row.text||'')}<span class="alert-sub">${esc(row.sub||'')}</span></div></div>`;
}

function normalizeDailyRows(payload){
  const rows = Array.isArray(payload) ? payload : Array.isArray(payload?.daily) ? payload.daily : [];
  return rows.map(r=>({
    providerId:String(readAny(r,['providerId','provider_id','instanceId','instance_id'],'')).trim(),
    displayName:String(readAny(r,['displayName','display_name','provider','name'],'')).trim(),
    date:rowDate(r),
    source:String(readAny(r,['source'],'')).trim(),
    inputTokens:rowInput(r),
    outputTokens:rowOutput(r),
    cacheReadTokens:rowCacheRead(r),
    cacheCreationTokens:rowCacheCreate(r),
    reasoningOutputTokens:rowReasoning(r),
    totalTokens:rowTotalTokens(r),
    cost:rowCost(r),
    costKnown:r.costKnown !== false,
    tokensKnown:r.tokensKnown !== false,
    inputCostUsd:Number.isFinite(r.inputCostUsd) && r.inputCostUsd>=0 ? r.inputCostUsd : null,
    cacheReadCostUsd:Number.isFinite(r.cacheReadCostUsd) && r.cacheReadCostUsd>=0 ? r.cacheReadCostUsd : null,
    cacheWriteCostUsd:Number.isFinite(r.cacheWriteCostUsd) && r.cacheWriteCostUsd>=0 ? r.cacheWriteCostUsd : null,
    outputCostUsd:Number.isFinite(r.outputCostUsd) && r.outputCostUsd>=0 ? r.outputCostUsd : null,
    sessions:Number.isSafeInteger(r.sessions) ? r.sessions : null,
    cacheSavingsUsd:Number.isFinite(r.cacheSavingsUsd) ? r.cacheSavingsUsd : null,
    costSource:r.costSource || r.source || '',
    pricingAsOf:r.pricingAsOf || '',
    models:r.models && typeof r.models === 'object' ? r.models : {},
    ingestedAt:readAny(r,['ingestedAt','ingested_at'],null),
  })).filter(r=>r.providerId && /^\d{4}-\d{2}-\d{2}$/.test(r.date));
}

function providerWindowTotals(providerId, days){
  return dailyWindowTotals(S.dailyRows.filter(r=>r.providerId.toLowerCase()===String(providerId).toLowerCase()), days);
}

function dailyWindowTotals(rows, days, offsetDays){
  return dailyRowsInWindow(rows, days, offsetDays).reduce((acc,r)=>{
    acc.inputTokens += rowInput(r);
    acc.outputTokens += rowOutput(r);
    acc.cacheReadTokens += rowCacheRead(r);
    acc.cacheCreationTokens += rowCacheCreate(r);
    acc.reasoningTokens += rowReasoning(r);
    acc.totalTokens += rowTotalTokens(r);
    acc.cost += rowCost(r);
    acc.costKnown &&= r.costKnown !== false;
    acc.tokensKnown &&= r.tokensKnown !== false;
    acc.rows++;
    return acc;
  }, {inputTokens:0,outputTokens:0,cacheReadTokens:0,cacheCreationTokens:0,reasoningTokens:0,totalTokens:0,cost:0,costKnown:true,tokensKnown:true,rows:0});
}

function dailyRowsInWindow(rows, days, offsetDays){
  const end = addDays(todayUtcDate(), -(offsetDays||0));
  const start = addDays(end, -(days - 1));
  const a = dateKey(start), b = dateKey(end);
  return rows.filter(r=>{
    const d = rowDate(r);
    return d >= a && d <= b;
  });
}

function aggregateDailyTrend(rows, days){
  const windowRows = dailyRowsInWindow(rows, days, 0);
  const byDay = new Map();
  for(const r of windowRows){
    const d = rowDate(r);
    const cur = byDay.get(d) || { date:d, totalTokens:0, cost:0, costKnown:true, tokensKnown:true };
    cur.totalTokens += rowTotalTokens(r);
    cur.cost += rowCost(r);
    cur.costKnown &&= r.costKnown !== false;
    cur.tokensKnown &&= r.tokensKnown !== false;
    byDay.set(d, cur);
  }
  const end = todayUtcDate();
  const start = addDays(end, -(days - 1));
  const out = [];
  for(let d = new Date(start); d <= end; d = addDays(d, 1)){
    const key = dateKey(d);
    out.push(byDay.get(key) || { date:key, totalTokens:0, cost:0 });
  }
  return out;
}

function topDailyContributors(rows, days, limit){
  const map = new Map();
  for(const r of dailyRowsInWindow(rows, days, 0)){
    const id = r.providerId;
    const cur = map.get(id) || { providerId:id, displayName:r.displayName || id, totalTokens:0, cost:0, costKnown:true,tokensKnown:true };
    cur.totalTokens += rowTotalTokens(r);
    cur.cost += rowCost(r);
    cur.costKnown &&= r.costKnown !== false;
    cur.tokensKnown &&= r.tokensKnown !== false;
    map.set(id, cur);
  }
  return Array.from(map.values()).sort((a,b)=>b.cost-a.cost || b.totalTokens-a.totalTokens).slice(0, limit || 5);
}

function overviewTrendHtml(rows){
  if(!rows.length || !rows.some(r=>r.totalTokens>0 || r.cost>0)){
    return `<div class="cost-unavail" style="padding:16px 0"><strong style="font-size:13px">No tracked trend yet</strong></div>`;
  }
  const max = Math.max(1, ...rows.map(r=>Math.max(r.cost, r.totalTokens/1000000)));
  const latest = rows[rows.length-1];
  const bars = rows.map(r=>{
    const basis = Math.max(r.cost, r.totalTokens/1000000);
    const h = Math.max(3, Math.round(basis/max*100));
    const color = r.cost>0 ? '#43b581' : '#7289da';
    return `<div class="trend-bar" style="height:${h}%;background:${color}" title="${esc(r.date)}: ${recordedCost(r)} · ${esc(recordedTokens(r))} tokens"></div>`;
  }).join('');
  return `<div class="overview-trend"><div class="trend-head"><span class="trend-title">Last 14 days</span><span class="trend-readout">${recordedCost(latest)} · ${esc(recordedTokens(latest))} tokens today</span></div><div class="trend-bars">${bars}</div></div>`;
}

function topContributorsHtml(rows, totals){
  if(!rows.length) return '';
  let html = `<div class="contrib-list">`;
  for(const r of rows){
    const basis = totals.cost>0 ? r.cost : r.totalTokens;
    const max = totals.cost>0 ? totals.cost : totals.totalTokens;
    const p = max>0 ? Math.min(100, basis/max*100) : 0;
    const label = r.cost>0 || r.costKnown===false ? recordedCost(r) : recordedTokens(r);
    html+=`<div class="contrib-row"><div class="contrib-name">${esc(providerDisplayName(r.providerId, r.displayName))}</div><div class="contrib-value">${esc(label)}</div><div class="pressure-track"><div class="pressure-fill" style="width:${p.toFixed(1)}%;background:#43b581"></div></div></div>`;
  }
  html+=`</div>`;
  return html;
}

function deltaPercent(current, prior){
  current = Number(current)||0; prior = Number(prior)||0;
  if(prior <= 0) return current > 0 ? 100 : null;
  return Math.round((current - prior) / prior * 100);
}

function deltaBadge(value){
  if(value == null || !Number.isFinite(value)) return '';
  if(value === 0) return `<span class="delta flat">0%</span>`;
  const cls = value > 0 ? 'up' : 'down';
  const sign = value > 0 ? '+' : '';
  return `<span class="delta ${cls}">${sign}${value}%</span>`;
}

// ── saved daily history and trends ────────────────────────────────────────────
function trendsOptions(){
  const prefs = S.prefs.trends || {};
  return {
    provider: typeof prefs.provider==='string' ? prefs.provider : '',
    range: ['7','30','90','365','month','all','custom'].includes(prefs.range) ? prefs.range : '30',
    group: ['day','week','month'].includes(prefs.group) ? prefs.group : 'day',
    metric: ['cost','totalTokens','cacheReadTokens','outputTokens'].includes(prefs.metric) ? prefs.metric : 'cost',
    breakdown: ['provider','day','model','sources'].includes(prefs.breakdown) ? prefs.breakdown : 'provider',
    start: prefs.start || dateKey(addDays(todayUtcDate(),-29)),
    end: prefs.end || dateKey(todayUtcDate()),
  };
}

function trendChange(current, previous, field){
  const known = field === 'cost' ? 'costKnown' : 'tokensKnown';
  if(current[field] == null) return 'Comparison unavailable';
  if(current[known] === false || previous[known] === false) return 'Partial data';
  const delta = UsageTrends.change(current[field], previous[field], current.rows, previous.rows);
  if(delta.kind==='unavailable') return 'Comparison unavailable';
  if(delta.kind==='fromZero') return 'Up from a recorded zero';
  // Huge percentages from a near-empty prior period read better as a multiple.
  if(delta.percent >= 1000) return `${Math.round(current[field]/previous[field]).toLocaleString('en-US')}× previous period`;
  return `${delta.percent>0?'+':''}${delta.percent.toFixed(1)}% vs previous period`;
}

function trendKpi(value, label, note){
  return `<div class="insight"><div class="insight-value">${esc(value)}</div><div class="insight-label">${esc(label)}</div><div class="trends-change">${esc(note)}</div></div>`;
}

function recordedCost(row){ const cost=rowCost(row); return row.costKnown === false ? (cost > 0 ? fmtUsd(cost)+'+' : 'Unpriced') : fmtUsd(cost); }
function recordedTokens(row){ const tokens=rowTotalTokens(row); return row.tokensKnown === false && !tokens ? 'Unknown' : fmtTok(tokens)+(row.tokensKnown === false ? '+' : ''); }

const USAGE_METRICS = {
  cost:{ label:'Cost', title:'Daily cost', field:'cost' },
  totalTokens:{ label:'Tokens', title:'Daily processed tokens', field:'totalTokens' },
  cacheReadTokens:{ label:'Cache', title:'Daily cached input', field:'cacheReadTokens' },
  outputTokens:{ label:'Output', title:'Daily output tokens', field:'outputTokens' },
};
const PROVIDER_COLORS = { codex:'#e4e4e7', claude:'#d97757', antigravity:'#9b87f5', copilot:'#5fb4e8', gemini:'#4f8ff7', cursor:'#a1a1aa' };
const SERIES_PALETTE = ['#7289da','#43b581','#eaca8b','#da97cd','#6ec3d8','#ce8670','#b48ead'];
function seriesColor(id, index){ return PROVIDER_COLORS[String(id).toLowerCase()] || SERIES_PALETTE[index % SERIES_PALETTE.length]; }
function fmtUsd(v){ return '$'+(Number(v)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
// known=false: a partial sum shows '+', an unknown zero shows Unpriced/Unknown.
function fmtMetricValue(metric, v, known){
  if(known===false) return metric==='cost' ? (v>0 ? fmtUsd(v)+'+' : 'Unpriced') : (v>0 ? fmtTok(v)+'+' : 'Unknown');
  return metric==='cost' ? fmtUsd(v) : fmtTok(v);
}
function knownFlag(metric){ return metric==='cost' ? 'costKnown' : 'tokensKnown'; }
function metricOf(row, metric){ return metric==='cost' ? rowCost(row) : Number(row[metric])||0; }
function recordedMetric(row, metric){ return metric==='cost' ? recordedCost(row) : metric==='totalTokens' ? recordedTokens(row) : fmtMetricValue(metric, Number(row[metric])||0, row.tokensKnown); }
function shareText(part, whole){ if(!(whole>0)) return '—'; const p=part/whole*100; return p>0&&p<0.1 ? '<0.1%' : p<100&&p>=99.95 ? '>99.9%' : p.toFixed(1)+'%'; }
// With partial pricing, shares are only meaningful over the priced portion.
function pricedShare(part, whole){ return whole.cost>0 && part.cost>0 ? shareText(part.cost, whole.cost) : null; }
function providerDisplayName(id, fallback){
  const p = S.providers.find(x=>String(x.id).toLowerCase()===String(id).toLowerCase());
  return p?.name || fallback || id;
}
function metricShare(part, whole, metric){
  const known=metric==='cost'?'costKnown':'tokensKnown';
  return part[known]!==false&&whole[known]!==false ? shareText(metricOf(part,metric),metricOf(whole,metric)) : '—';
}
function segmented(set, current, items){
  return `<div class="u-seg" role="group">${items.map(([v,l])=>`<button type="button" class="u-seg-btn${String(current)===v?' active':''}" data-set="${esc(set)}" data-value="${esc(v)}" aria-pressed="${String(current)===v}">${esc(l)}</button>`).join('')}</div>`;
}

function renderTrends(){
  const panel = document.getElementById('panel-history');
  const options = trendsOptions();
  const model = UsageTrends.summarize(S.dailyRows, options);
  // Include saved providers even after they have been disabled or removed.
  const providers = new Map(S.providers.map(p=>[p.id.toLowerCase(),p.name||p.id]));
  for(const r of S.dailyRows) providers.set(r.providerId.toLowerCase(), r.displayName||r.providerId);
  if(options.provider && !providers.has(options.provider.toLowerCase())) providers.set(options.provider, options.provider);
  const metric = options.metric, info = USAGE_METRICS[metric];
  // Local-log rows may carry raw ids ("codex"); prefer the registry's names.
  for(const p of model.providers || []) p.displayName = providerDisplayName(p.id, p.displayName);

  let html = `<div class="u-page">`;
  html+=`<div class="u-toolbar">`;
  html+=`<label class="u-field"><span class="sr-only">Provider</span><select id="trends-provider"><option value=""${!options.provider?' selected':''}>All providers</option>${[...providers].sort((a,b)=>a[1].localeCompare(b[1])).map(([id,name])=>selectOption(id,name,options.provider.toLowerCase())).join('')}</select></label>`;
  html+=segmented('range', options.range, [['7','7D'],['30','30D'],['month','MTD'],['90','90D'],['365','1Y'],['all','All'],['custom','Custom']]);
  if(options.range==='custom'){
    const max = dateKey(todayUtcDate());
    html+=`<label class="u-field"><span>From</span><input id="trends-start" type="date" value="${esc(options.start)}" max="${max}"></label><label class="u-field"><span>Through</span><input id="trends-end" type="date" value="${esc(options.end)}" max="${max}"></label>`;
  }
  html+=`<label class="u-field"><span class="sr-only">Group by</span><select id="trends-group">${[['day','Day'],['week','Week'],['month','Month']].map(([v,l])=>selectOption(v,l,options.group)).join('')}</select></label>`;
  html+=`<button class="action-btn u-export" id="trends-export" ${!model.rows?.length||S.dailyError?'disabled':''}><svg viewBox="0 0 16 16"><path d="M8 2v7"/><path d="M5 6l3 3 3-3"/><path d="M3 13h10"/></svg>Export CSV</button>`;
  html+=`</div>`;

  if(model.error){
    html+=`<div class="trends-empty" role="alert">${esc(model.error)}</div>`;
  } else if(S.dailyError){
    html+=`<div class="trends-empty" role="alert">Could not load saved daily history. Try Refresh to load it again.</div>`;
  } else {
    const { range, current, previous } = model;
    html+=`<div class="u-range">${range.start} → ${range.end} · ${range.days} calendar days · UTC${range.end===dateKey(todayUtcDate())?' · Today is partial':''} · compared with ${range.previousStart} → ${range.previousEnd}</div>`;
    // The headline mixes one source per provider-day; say which.
    const sourceDays = new Map();
    for(const r of current.rows ? model.rows : []){ const k = costSourceLabel(r); sourceDays.set(k, (sourceDays.get(k)||0)+1); }
    if(sourceDays.size>1 || [...sourceDays.keys()].some(k=>k==='local estimate')) html+=`<div class="u-range" style="margin-top:-2px">Cost sources: ${[...sourceDays].sort((a,b)=>b[1]-a[1]).map(([k,n])=>`${esc(k)} ${n} provider-day${n===1?'':'s'}`).join(' · ')}</div>`;
    if(!current.rows){
      html+=`<div class="trends-empty"><strong>No saved daily usage in this range</strong><br>Try another period or provider. Daily totals are saved when a supported provider reads local usage logs.<br>Run <code>usagestat usage</code> or keep the daemon running to collect available reports.<br>Providers that report only quotas have snapshot charts in their provider tab.</div>`;
    } else {
      // Dense daily curves read as noise; the chart coarsens itself while the
      // breakdown keeps the chosen grouping.
      const chartGroup = chartGrouping(range.days, options.group);
      const chartModel = chartGroup===options.group ? model : UsageTrends.summarize(S.dailyRows, { ...options, group:chartGroup });
      const layers = usageLayers(chartModel, metric);
      html+=`<div class="u-hero"><div class="u-summary">`;
      html+=`<div class="u-big">${esc(recordedMetric(current, metric))}</div>`;
      html+=`<div class="u-bigsub">${current.recordedDays}/${range.days} days recorded · ${esc(trendChange(current,previous,metric==='cost'?'cost':metric))}</div>`;
      html+=`<div class="u-plist">`;
      for(const layer of layers.slice().reverse()){
        const p = layer.provider;
        const other = metric==='cost' ? `${recordedTokens(p.current)} tokens` : recordedCost(p.current);
        html+=`<div class="u-prow"><span class="u-dot" style="background:${layer.color}"></span>${providerIcon(p.id)}<span class="u-pname">${esc(p.displayName)}</span><span class="u-pdays">${p.current.activeDays} active day${p.current.activeDays===1?'':'s'}</span><span class="u-pval">${esc(recordedMetric(p.current, metric))}</span>`;
        const share = metricShare(p.current,current,metric), priced = share==='—' && metric==='cost' ? pricedShare(p.current,current) : null;
        html+=`<div class="u-psub">${priced ? `≈${priced} of priced cost` : `${share} of ${esc(info.label.toLowerCase())}`} · ${esc(other)}</div></div>`;
      }
      html+=`</div></div>`;
      html+=`<div class="u-chartcard"><div class="u-charthead"><span class="u-h">${esc(chartGroup==='day'?info.title:info.title.replace('Daily', chartGroup==='week'?'Weekly':'Monthly'))}</span>${segmented('metric', metric, Object.entries(USAGE_METRICS).map(([k,v])=>[k,v.label]))}</div>`;
